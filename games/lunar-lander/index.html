<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05070a">
<meta name="description" content="Lunar Lander - land soft and level on the pad with limited fuel. A free retro game from RameshVerse.">
<title>LUNAR LANDER // RAMESHVERSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070a;
    --panel: #0a0d12;
    --red: #ff2b2b;
    --red-dim: #7a1616;
    --text: #d7dde3;
    --text-dim: #5c6672;
    --green: #2bff8f;
    --amber: #ffb62b;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    height:100%;
    height:100dvh;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Mono', 'Courier New', monospace;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
  }

  #wrap {
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(255,43,43,0.05), transparent 60%),
      var(--bg);
  }

  #wrap::after {
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:overlay;
    z-index:5;
  }

  #stage {
    position:relative;
    width:100%;
    height:100%;
    max-width:1100px;
    max-height:800px;
  }

  canvas {
    display:block;
    width:100%;
    height:100%;
    background:transparent;
  }

  .corner {
    position:absolute;
    width:22px; height:22px;
    border-color:var(--red);
    opacity:0.85;
    z-index:6;
    pointer-events:none;
  }
  .corner.tl { top:8px; left:8px; border-top:2px solid; border-left:2px solid; }
  .corner.tr { top:8px; right:8px; border-top:2px solid; border-right:2px solid; }
  .corner.bl { bottom:8px; left:8px; border-bottom:2px solid; border-left:2px solid; }
  .corner.br { bottom:8px; right:8px; border-bottom:2px solid; border-right:2px solid; }

  #hud {
    position:absolute;
    top:16px; left:16px; right:16px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    z-index:6;
    font-size:12px;
    letter-spacing:1px;
    pointer-events:none;
  }

  .hud-block { display:flex; flex-direction:column; gap:4px; }
  .hud-label { color:var(--text-dim); font-size:10px; }
  .hud-value { color:var(--red); font-size:17px; font-weight:700; }
  .hud-value.ok { color:var(--green); }
  .hud-value.warn { color:var(--amber); }
  .hud-sub { color:var(--text); }

  #telemetry {
    position:absolute;
    top:16px; left:50%;
    transform:translateX(-50%);
    z-index:6;
    display:flex;
    gap:20px;
    font-size:11px;
    letter-spacing:1px;
    color:var(--text-dim);
    pointer-events:none;
    text-align:center;
  }
  #telemetry .t-item span { display:block; }
  #telemetry .t-val { color:var(--text); font-size:14px; margin-top:2px; min-width:34px; }
  #telemetry .t-val.warn { color:var(--amber); }
  #telemetry .t-val.danger { color:var(--red); }

  #fuel-bar-wrap {
    position:absolute;
    top:88px; left:16px;
    width:120px;
    z-index:6;
    pointer-events:none;
  }
  #fuel-bar-wrap .hud-label { margin-bottom:4px; }
  #fuel-bar-outer {
    width:100%; height:8px;
    border:1px solid rgba(255,43,43,0.4);
    background:rgba(255,43,43,0.06);
  }
  #fuel-bar-inner {
    height:100%;
    width:100%;
    background:var(--red);
    transition:width .1s linear;
  }

  #center-msg {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:7;
    display:none;
    max-width:92%;
    padding:24px 32px;
    background:rgba(5,7,10,0.74);
    border:1px solid rgba(255,43,43,0.28);
  }
  #center-msg h1 {
    color:var(--red);
    font-size:clamp(22px,5.5vw,44px);
    letter-spacing:5px;
    text-shadow:0 0 18px rgba(255,43,43,0.6);
  }
  #center-msg h1.success { color:var(--green); text-shadow:0 0 18px rgba(43,255,143,0.5); }
  #center-msg p {
    color:var(--text-dim);
    margin-top:14px;
    font-size:12px;
    letter-spacing:1.5px;
    line-height:1.7;
    white-space:pre-line;
  }
  #center-msg .btn {
    margin-top:22px;
    display:inline-block;
    padding:10px 26px;
    border:1px solid var(--red);
    color:var(--red);
    background:rgba(255,43,43,0.06);
    letter-spacing:2px;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  #center-msg .btn:hover { background:rgba(255,43,43,0.14); }
  #center-msg .btn:active { background:rgba(255,43,43,0.2); }

  #controls-hint {
    position:absolute;
    bottom:16px; left:50%;
    transform:translateX(-50%);
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:1px;
    z-index:6;
    text-align:center;
    pointer-events:none;
    white-space:nowrap;
  }

  #pause-btn {
    position:absolute; top:104px; right:16px;
    z-index:6; background:transparent; border:1px solid var(--red);
    color:var(--red); font-family:inherit; font-size:11px; letter-spacing:1px;
    width:32px; height:28px; pointer-events:auto; display:none;
  }

  #mute-btn {
    position:absolute; top:64px; right:16px;
    z-index:6; background:transparent; border:1px solid rgba(215,221,227,0.3);
    color:var(--text-dim); font-family:inherit; font-size:13px;
    width:32px; height:28px; pointer-events:auto; cursor:pointer;
  }
  #mute-btn.on { color:var(--red); border-color:var(--red); }

  #assist-btn {
    position:absolute; top:104px; right:16px;
    z-index:6; background:transparent; border:1px solid rgba(215,221,227,0.3);
    color:var(--text-dim); font-family:inherit; font-size:9px; letter-spacing:1px;
    height:28px; padding:0 8px; pointer-events:auto; cursor:pointer;
  }
  #assist-btn.on { color:var(--green); border-color:var(--green); }

  #touch-controls {
    position:absolute;
    bottom:0; left:0; right:0;
    z-index:6;
    display:none;
    justify-content:space-between;
    align-items:flex-end;
    padding:18px;
    pointer-events:none;
  }
  #touch-controls button {
    pointer-events:auto;
    width:58px; height:58px;
    border-radius:50%;
    border:1px solid var(--red);
    background:rgba(10,13,18,0.7);
    color:var(--red);
    font-size:20px;
    font-family:inherit;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  #touch-controls button.down { background:rgba(255,43,43,0.28); }
  #touch-controls .thrust-btn { width:74px; height:74px; font-size:24px; }
  #touch-controls .small-btn { width:48px; height:48px; font-size:11px; letter-spacing:1px; }
  .touch-left, .touch-right { display:flex; align-items:flex-end; gap:12px; }

  @media (max-width: 720px) {
    #touch-controls { display:flex; }
    #controls-hint { display:none; }
    #pause-btn { display:block; }
    #assist-btn { top:144px; }
  }

  @media (max-width: 480px) {
    #telemetry { gap:12px; font-size:10px; top:14px; }
    #telemetry .t-val { font-size:12px; min-width:28px; }
    #touch-controls { padding:12px; }
    #touch-controls button { width:52px; height:52px; }
    #touch-controls .thrust-btn { width:66px; height:66px; }
    #touch-controls .small-btn { width:44px; height:44px; }
    .touch-left, .touch-right { gap:8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #wrap::after { display:none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div id="hud">
      <div class="hud-block">
        <span class="hud-label">SCORE</span>
        <span class="hud-value" id="score">0000</span>
        <span class="hud-label">BEST <span class="hud-sub" id="hi">0000</span></span>
      </div>
      <div class="hud-block" style="align-items:flex-end;">
        <span class="hud-label">ATTEMPT</span>
        <span class="hud-value" id="attempt">1 / 3</span>
      </div>
    </div>

    <div id="telemetry">
      <div class="t-item">
        <span class="hud-label">ALT</span>
        <span class="t-val" id="tele-alt">000</span>
      </div>
      <div class="t-item">
        <span class="hud-label">V-SPD</span>
        <span class="t-val" id="tele-vspd">0.0</span>
      </div>
      <div class="t-item">
        <span class="hud-label">H-SPD</span>
        <span class="t-val" id="tele-hspd">0.0</span>
      </div>
      <div class="t-item">
        <span class="hud-label">TILT</span>
        <span class="t-val" id="tele-ang">0&deg;</span>
      </div>
    </div>

    <div id="fuel-bar-wrap">
      <span class="hud-label">FUEL</span>
      <div id="fuel-bar-outer"><div id="fuel-bar-inner"></div></div>
    </div>

    <button id="pause-btn" aria-label="Pause">II</button>
    <button id="mute-btn" aria-label="Toggle sound">&#9834;</button>
    <button id="assist-btn" aria-label="Toggle auto-level assist">ASSIST ON</button>

    <div id="center-msg">
      <h1 id="msg-title">LUNAR LANDER</h1>
      <p id="msg-sub"></p>
      <div class="btn" id="start-btn">START</div>
    </div>

    <div id="controls-hint">&larr; &rarr; ROTATE &nbsp;&middot;&nbsp; &uarr; THRUST &nbsp;&middot;&nbsp; &darr; AUTO-LEVEL &nbsp;&middot;&nbsp; T ASSIST &nbsp;&middot;&nbsp; P PAUSE &nbsp;&middot;&nbsp; M MUTE</div>

    <div id="touch-controls">
      <div class="touch-left">
        <button id="btn-left">&#8630;</button>
        <button id="btn-right">&#8631;</button>
      </div>
      <div class="touch-right">
        <button id="btn-level" class="small-btn">LVL</button>
        <button id="btn-thrust" class="thrust-btn">&#9650;</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const scoreEl = document.getElementById('score');
  const hiEl = document.getElementById('hi');
  const attemptEl = document.getElementById('attempt');
  const teleAlt = document.getElementById('tele-alt');
  const teleVspd = document.getElementById('tele-vspd');
  const teleHspd = document.getElementById('tele-hspd');
  const teleAng = document.getElementById('tele-ang');
  const fuelInner = document.getElementById('fuel-bar-inner');
  const centerMsg = document.getElementById('center-msg');
  const msgTitle = document.getElementById('msg-title');
  const msgSub = document.getElementById('msg-sub');
  const startBtn = document.getElementById('start-btn');

  const RED = '#ff2b2b';
  const GREEN = '#2bff8f';
  const AMBER = '#ffb62b';
  const TEXT = '#d7dde3';
  const DUST = '#6b747e';
  const FONT = '"Space Mono", "Courier New", monospace';

  const HI_KEY = 'rv_lunar_lander_hi';
  const MUTE_KEY = 'rv_lunar_lander_muted';
  const ASSIST_KEY = 'rv_lunar_lander_assist';

  let REDUCED_MOTION = false;
  try { REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}

  function store(key, val){ try { localStorage.setItem(key, String(val)); } catch(e){} }
  function load(key){ try { return localStorage.getItem(key); } catch(e){ return null; } }
  function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }
  function rand(a,b){ return a + Math.random()*(b-a); }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function pad4(n){ return String(n).padStart(4,'0'); }
  function setText(el, txt){ if (el._t !== txt){ el._t = txt; el.textContent = txt; } }
  function setCls(el, c){ if (el._c !== c){ el._c = c; el.className = c; } }

  // ---------- Tuning ----------
  const GRAVITY = 0.012;
  const THRUST_POWER = 0.030;        // gentler engine: thrust is about 2.5x gravity, not 3x
  const MAX_FUEL = 200;
  const FUEL_BURN = 0.20;
  const SAFE_VSPD = 1.4;
  const SAFE_HSPD = 0.8;
  const SAFE_ANGLE = 0.30;           // radians from upright (about 17 degrees)
  const MAX_ROT = 0.034;             // top turning speed, radians per frame
  const MAX_ATTEMPTS = 3;
  // Each attempt is harder: narrower pad, rougher ground, faster sideways start
  const PAD_FACTOR = [1.15, 1.0, 0.85];
  const ROUGHNESS  = [28, 36, 44];
  const START_VX   = [0.2, 0.3, 0.4];

  // ---------- Canvas sizing ----------
  let W = 0, H = 0, DPR = 1;
  function resize(){
    const oldW = W, oldH = H;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const rect = stage.getBoundingClientRect();
    W = rect.width || W || 800;
    H = rect.height || H || 600;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    if (oldW && oldH && (oldW !== W || oldH !== H)) rescaleWorld(W/oldW, H/oldH);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // ---------- Input ----------
  const keys = {};
  const BLOCK_KEYS = ['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (BLOCK_KEYS.indexOf(e.code) !== -1) e.preventDefault();
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat && centerMsg.style.display === 'block'){
      handleStartBtn(e);
    }
    if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) togglePause();
    if (e.code === 'KeyM' && !e.repeat) toggleMute();
    if (e.code === 'KeyT' && !e.repeat) toggleAssist();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => {
    for (const k in keys) keys[k] = false;
    if (state === 'playing' && !paused) togglePause();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing' && !paused) togglePause();
  });

  function bindHold(id, code){
    const el = document.getElementById(id);
    const on = e => { e.preventDefault(); keys[code] = true; el.classList.add('down'); try { el.setPointerCapture(e.pointerId); } catch(_){} };
    const off = e => { e.preventDefault(); keys[code] = false; el.classList.remove('down'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('lostpointercapture', off);
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  bindHold('btn-left', 'ArrowLeft');
  bindHold('btn-right', 'ArrowRight');
  bindHold('btn-thrust', 'ArrowUp');
  bindHold('btn-level', 'ArrowDown');

  // ---------- State ----------
  let lander = null;
  let particles = [];
  let debris = [];
  let terrain = [];
  let pad = { x:0, w:0, y:0 };
  let score = 0;
  let attempt = 1;
  let landings = 0;
  let hi = parseInt(load(HI_KEY), 10) || 0;
  let newHi = false;
  let state = 'menu';        // menu | playing | success | crashed | over
  let paused = false;
  let pending = null;        // result overlay waiting to appear
  let resultTimer = 0;
  let lockUntil = 0;
  let shake = 0;
  let pulseT = 0;
  let nowTs = 0;
  let lowFuelTimer = 0;
  let lastFuelPct = -1;
  let assistOn = load(ASSIST_KEY) !== '0';   // auto-level assist, on by default

  // ---------- Terrain ----------
  function generateTerrain(){
    const n = 22;                                            // regular segments
    const padW = clamp(W/12, 70, 100) * PAD_FACTOR[attempt-1];
    const rw = (W - padW) / n;
    const rough = ROUGHNESS[attempt-1];
    const padAt = 3 + Math.floor(rand(0, n - 6));            // pad sits after this many segments
    const pts = [];
    let h = H * rand(0.62, 0.72);
    let padIdx = 0;
    for (let i=0;i<=n;i++){
      if (i > 0){
        h += rand(-rough, rough);
        h = clamp(h, H*0.45, H*0.85);
      }
      const x = i*rw + (i > padAt ? padW : 0);
      pts.push({x, y:h});
      if (i === padAt){
        padIdx = pts.length - 1;
        pts.push({x: x + padW, y: h});
      }
    }
    terrain = [];
    for (let i=0;i<pts.length-1;i++){
      terrain.push({
        x1: pts[i].x, y1: pts[i].y,
        x2: pts[i+1].x, y2: pts[i+1].y,
        isPad: i === padIdx
      });
    }
    const ps = terrain[padIdx];
    pad = { x: ps.x1, w: ps.x2 - ps.x1, y: ps.y1 };
  }

  function groundAt(x){
    const n = terrain.length;
    if (!n) return H;
    if (x <= terrain[0].x1) return terrain[0].y1;
    for (let i=0;i<n;i++){
      const s = terrain[i];
      if (x <= s.x2){
        const t = (x - s.x1) / ((s.x2 - s.x1) || 1);
        return s.y1 + (s.y2 - s.y1) * t;
      }
    }
    return terrain[n-1].y2;
  }

  function rescaleWorld(sx, sy){
    for (const s of terrain){ s.x1*=sx; s.x2*=sx; s.y1*=sy; s.y2*=sy; }
    pad.x*=sx; pad.w*=sx; pad.y*=sy;
    if (lander){ lander.x*=sx; lander.y*=sy; }
    for (const d of debris){ d.x*=sx; d.y*=sy; }
    for (const p of particles){ p.x*=sx; p.y*=sy; }
  }

  // ---------- Lander ----------
  // Collision points in the lander's own frame (legs, base, sides, nose)
  const HULL = [[-12,14],[12,14],[-3,10],[3,10],[-7,4],[7,4],[0,-10]];

  function newLander(){
    return {
      x: W/2 + rand(-W*0.15, W*0.15), y: 60,
      vx: rand(-START_VX[attempt-1], START_VX[attempt-1]), vy: 0.2,
      angle: 0, av: 0, throttle: 0, fuel: MAX_FUEL,
      thrusting:false, landed:false, crashed:false, safe:true,
      clearance: 999
    };
  }

  function worldPoint(L, p){
    const c = Math.cos(L.angle), s = Math.sin(L.angle);
    return { x: L.x + p[0]*c - p[1]*s, y: L.y + p[0]*s + p[1]*c };
  }

  function addParticles(x,y,count,color,spread){
    for (let i=0;i<count;i++){
      if (particles.length > 300) return;
      const a = rand(0,Math.PI*2);
      const s = rand(0.3, spread||2.5);
      particles.push({
        x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 0.3,
        life: rand(18,36), maxLife: 36, color
      });
    }
  }

  function spawnDust(x, y, dir){
    if (particles.length > 300) return;
    particles.push({
      x, y: y - 1, vx: dir*rand(0.4, 1.6) + rand(-0.2,0.2), vy: rand(-0.35, -0.05),
      life: rand(20,34), maxLife: 34, color: DUST
    });
  }

  function spawnDebris(){
    for (let i=0;i<7;i++){
      debris.push({
        x: lander.x, y: lander.y,
        vx: rand(-1.4,1.4) + lander.vx*0.5, vy: rand(-2.2,-0.3),
        rot: rand(0, 6.28), vr: rand(-0.2,0.2), len: rand(5,12)
      });
    }
  }

  function addShake(n){ if (!REDUCED_MOTION) shake = Math.max(shake, n); }

  // ---------- Run flow ----------
  function resetRun(){
    score = 0;
    attempt = 1;
    landings = 0;
    newHi = false;
    startAttempt();
  }

  function startAttempt(){
    generateTerrain();
    lander = newLander();
    particles = [];
    debris = [];
    pending = null;
    lowFuelTimer = 0;
    state = 'playing';
    paused = false;
    updateHUD();
    hideMessage();
  }

  function advance(){
    attempt++;
    startAttempt();
  }

  function updateHUD(){
    setText(scoreEl, pad4(score));
    setText(hiEl, pad4(Math.max(hi, score)));
    setText(attemptEl, attempt + ' / ' + MAX_ATTEMPTS);
    const pct = lander ? Math.max(0, Math.round(lander.fuel / MAX_FUEL * 100)) : 0;
    if (pct !== lastFuelPct){
      lastFuelPct = pct;
      fuelInner.style.width = pct + '%';
      fuelInner.style.background = pct < 20 ? AMBER : RED;
    }
  }

  function showMessage(title, sub, btnText, success){
    centerMsg.style.display = 'block';
    msgTitle.textContent = title;
    msgTitle.className = success ? 'success' : '';
    msgSub.textContent = sub;
    startBtn.textContent = btnText;
  }
  function hideMessage(){ centerMsg.style.display = 'none'; }

  function menuText(){
    return '← → ROTATE · ↑ THRUST · ↓ AUTO-LEVEL · T ASSIST\nLAND SOFT & LEVEL ON THE GREEN PAD\nTHREE ATTEMPTS · EACH PAD IS HARDER' +
      (hi > 0 ? '\nBEST SCORE ' + hi : '');
  }

  function endAttempt(success, reasons, ctxInfo){
    setThrustSound(false);
    const last = attempt >= MAX_ATTEMPTS;
    let title, sub, btn, good = success;
    let line;

    if (success){
      const pct = Math.round(lander.fuel / MAX_FUEL * 100);
      const fuelBonus = Math.round(lander.fuel / MAX_FUEL * 400);
      const softness = clamp(1 - Math.max(ctxInfo.vy / SAFE_VSPD, Math.abs(ctxInfo.vx) / SAFE_HSPD), 0, 1);
      const softBonus = Math.round(softness * 300);
      const centerBonus = Math.round((1 - Math.min(1, Math.abs(ctxInfo.offset) / (pad.w/2))) * 100);
      const mult = 1 + 0.25 * (attempt - 1);
      const gained = Math.round((500 + fuelBonus + softBonus + centerBonus) * mult);
      score += gained;
      landings++;
      lander.landed = true;
      lander.vx = 0; lander.vy = 0;
      lander.angle = clamp(lander.angle, -SAFE_ANGLE, SAFE_ANGLE);
      addParticles(lander.x, lander.y + 14, 14, GREEN, 1.5);
      for (let i=0;i<10;i++) spawnDust(lander.x + rand(-14,14), lander.y + 14, Math.random()<0.5 ? -1 : 1);
      playLandingChime();
      line = 'LANDED CLEAN · +' + gained + ' PTS' + (mult > 1 ? ' (x' + mult.toFixed(2) + ')' : '') +
        '\nFUEL REMAINING ' + pct + '%' +
        (softness > 0.7 ? '\nFEATHER-SOFT TOUCHDOWN' : '');
    } else {
      lander.crashed = true;
      addParticles(lander.x, lander.y, 26, RED, 3.2);
      spawnDebris();
      addShake(10);
      buzz(160);
      playCrashSound();
      line = reasons.join('\n');
    }

    if (!last){
      state = success ? 'success' : 'crashed';
      title = success ? 'TOUCHDOWN' : 'IMPACT';
      btn = success ? 'NEXT PAD' : 'RETRY';
      sub = line + '\n\nATTEMPTS LEFT ' + (MAX_ATTEMPTS - attempt);
    } else {
      state = 'over';
      if (score > hi){ hi = score; newHi = true; store(HI_KEY, hi); }
      good = landings > 0;
      title = landings === MAX_ATTEMPTS ? 'PERFECT MISSION' : landings > 0 ? 'MISSION COMPLETE' : 'MISSION FAILED';
      btn = 'FLY AGAIN';
      sub = line + '\n\nLANDINGS ' + landings + '/' + MAX_ATTEMPTS + ' · SCORE ' + score +
        (newHi ? '\nNEW HIGH SCORE' : '\nBEST ' + hi);
    }
    pending = { title, sub, btn, good, isFinal: last };
    resultTimer = success ? 45 : 70;
    updateHUD();
  }

  // ---------- Audio (fully synthesized, no external files) ----------
  let audioCtx = null;
  let masterGain, musicGain, sfxGain;
  let thrustOsc, thrustGain;
  let thrustOn = false;
  let musicStep = 0;
  let muted = load(MUTE_KEY) === '1';

  const MUSIC_NOTES = [110, 130.81, 146.83, 164.81, 196, 164.81, 146.83, 130.81];

  function playTone(freq, duration, type, dest, vol, delaySec){
    if (!audioCtx || muted) return;
    const start = audioCtx.currentTime + (delaySec || 0);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0, start);
    osc.connect(g);
    g.connect(dest);
    g.gain.linearRampToValueAtTime(vol, start + 0.03);
    g.gain.linearRampToValueAtTime(0, start + duration);
    osc.start(start);
    osc.stop(start + duration + 0.05);
  }

  function scheduleMusicStep(){
    const stepTime = 0.42;
    if (audioCtx && !muted && !paused){
      const freq = MUSIC_NOTES[musicStep % MUSIC_NOTES.length];
      playTone(freq, stepTime*0.9, 'triangle', musicGain, 0.55);
      if (musicStep % 4 === 0) playTone(freq/2, stepTime*3.5, 'sine', musicGain, 0.22);
      musicStep++;
    }
    setTimeout(scheduleMusicStep, stepTime*1000);
  }

  function initAudio(){
    if (audioCtx){
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = muted ? 0 : 0.5;
    masterGain.connect(audioCtx.destination);

    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.16;
    musicGain.connect(masterGain);

    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = 0.4;
    sfxGain.connect(masterGain);

    thrustOsc = audioCtx.createOscillator();
    thrustOsc.type = 'sawtooth';
    thrustOsc.frequency.value = 65;
    thrustGain = audioCtx.createGain();
    thrustGain.gain.value = 0;
    thrustOsc.connect(thrustGain);
    thrustGain.connect(sfxGain);
    thrustOsc.start();

    scheduleMusicStep();
  }

  function setThrustSound(on){
    if (!audioCtx || on === thrustOn) return;
    thrustOn = on;
    thrustGain.gain.setTargetAtTime(on ? 0.15 : 0, audioCtx.currentTime, on ? 0.05 : 0.08);
  }

  function playLandingChime(){
    [523.25, 659.25, 783.99].forEach((f,i) => playTone(f, 0.35, 'triangle', sfxGain, 0.5, i*0.08));
  }

  function playLowFuelBeep(){
    playTone(880, 0.09, 'square', sfxGain, 0.18);
  }

  function playCrashSound(){
    if (!audioCtx || muted) return;
    const size = Math.floor(audioCtx.sampleRate * 0.4);
    const buffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i=0;i<size;i++) data[i] = (Math.random()*2-1) * (1 - i/size);
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 700;
    const g = audioCtx.createGain();
    g.gain.value = 0.6;
    noise.connect(filter);
    filter.connect(g);
    g.connect(sfxGain);
    noise.start();
  }

  const muteBtn = document.getElementById('mute-btn');
  function renderMuteBtn(){
    muteBtn.classList.toggle('on', !muted);
    muteBtn.innerHTML = muted ? '&#9711;' : '&#9834;';
  }
  function toggleMute(e){
    if (e) e.preventDefault();
    initAudio();
    muted = !muted;
    store(MUTE_KEY, muted ? '1' : '0');
    if (masterGain) masterGain.gain.setTargetAtTime(muted ? 0 : 0.5, audioCtx.currentTime, 0.05);
    renderMuteBtn();
  }
  muteBtn.addEventListener('click', toggleMute);
  renderMuteBtn();

  const assistBtn = document.getElementById('assist-btn');
  function renderAssistBtn(){
    assistBtn.classList.toggle('on', assistOn);
    assistBtn.textContent = assistOn ? 'ASSIST ON' : 'ASSIST OFF';
  }
  function toggleAssist(e){
    if (e) e.preventDefault();
    assistOn = !assistOn;
    store(ASSIST_KEY, assistOn ? '1' : '0');
    renderAssistBtn();
  }
  assistBtn.addEventListener('click', toggleAssist);
  renderAssistBtn();

  // ---------- Simulation ----------
  function updateLander(dt){
    const L = lander;

    // Rotation has momentum: it eases in and eases out, so taps give small precise turns
    // and holding gives a smooth, steady rotation.
    const turnL = !!(keys['ArrowLeft'] || keys['KeyA']);
    const turnR = !!(keys['ArrowRight'] || keys['KeyD']);
    const levelKey = !!(keys['ArrowDown'] || keys['KeyS']);
    let targetAv = 0, ease = 0.30;                       // releasing the key settles quickly
    if (turnL !== turnR){
      targetAv = turnR ? MAX_ROT : -MAX_ROT;
      ease = 0.12;                                       // pressing the key builds up gently
    } else if (levelKey){
      targetAv = clamp(-L.angle * 0.12, -0.04, 0.04);    // hold to level out quickly
      ease = 0.2;
    } else if (assistOn){
      targetAv = clamp(-L.angle * 0.05, -0.022, 0.022);  // assist: drift back towards upright
      ease = 0.15;
    }
    L.av += (targetAv - L.av) * Math.min(1, ease * dt);
    if (Math.abs(L.av) < 0.0002 && targetAv === 0) L.av = 0;
    L.angle += L.av * dt;
    if (L.angle > 1.3){ L.angle = 1.3; L.av = 0; }
    if (L.angle < -1.3){ L.angle = -1.3; L.av = 0; }

    // Thrust ramps up and down instead of switching on and off, so short taps give small nudges
    const wantThrust = !!(keys['ArrowUp'] || keys['KeyW']) && L.fuel > 0;
    L.throttle += ((wantThrust ? 1 : 0) - L.throttle) * Math.min(1, (wantThrust ? 0.22 : 0.4) * dt);
    if (!wantThrust && L.throttle < 0.03) L.throttle = 0;
    L.thrusting = L.throttle > 0.05;
    setThrustSound(L.thrusting);
    if (L.throttle > 0){
      L.vx += Math.sin(L.angle) * THRUST_POWER * L.throttle * dt;
      L.vy -= Math.cos(L.angle) * THRUST_POWER * L.throttle * dt;
      L.fuel = Math.max(0, L.fuel - FUEL_BURN * L.throttle * dt);
      if (L.thrusting && Math.random() < 0.7 * L.throttle + 0.1){
        addParticles(
          L.x - Math.sin(L.angle)*14,
          L.y + Math.cos(L.angle)*14,
          1, AMBER, 1.2
        );
      }
    }

    // Low-fuel warning beeps
    if (L.fuel > 0 && L.fuel < MAX_FUEL * 0.2){
      lowFuelTimer -= dt;
      if (lowFuelTimer <= 0){ playLowFuelBeep(); lowFuelTimer = 32; }
    }

    // Motion
    L.vy += GRAVITY * dt;
    L.x += L.vx * dt;
    L.y += L.vy * dt;

    if (L.x < 12){ L.x = 12; if (L.vx < 0) L.vx = 0; }
    if (L.x > W - 12){ L.x = W - 12; if (L.vx > 0) L.vx = 0; }
    if (L.y < 8){ L.y = 8; if (L.vy < 0) L.vy = 0; }

    // Clearance of the lowest hull point (for altitude read-out and dust)
    let maxPen = -Infinity;
    let minClear = Infinity;
    for (const p of HULL){
      const w = worldPoint(L, p);
      const g = groundAt(w.x);
      maxPen = Math.max(maxPen, w.y - g);
      minClear = Math.min(minClear, g - w.y);
    }
    L.clearance = minClear;
    L.safe = L.vy < SAFE_VSPD && Math.abs(L.vx) < SAFE_HSPD && Math.abs(L.angle) < SAFE_ANGLE;

    // Engine dust close to the ground
    if (L.thrusting && minClear < 70 && Math.random() < 0.6){
      const gx = L.x + rand(-6,6);
      spawnDust(gx, groundAt(gx), Math.random() < 0.5 ? -1 : 1);
    }

    // Touch down / crash
    if (maxPen >= 0){
      L.y -= maxPen;
      const fl = worldPoint(L, HULL[0]);
      const fr = worldPoint(L, HULL[1]);
      const left = Math.min(fl.x, fr.x), right = Math.max(fl.x, fr.x);
      const onPad = left >= pad.x - 6 && right <= pad.x + pad.w + 6;
      const angleOk = Math.abs(L.angle) < SAFE_ANGLE;
      const vOk = L.vy < SAFE_VSPD;
      const hOk = Math.abs(L.vx) < SAFE_HSPD;

      if (onPad && angleOk && vOk && hOk){
        endAttempt(true, null, { vx: L.vx, vy: L.vy, offset: L.x - (pad.x + pad.w/2) });
      } else {
        const reasons = [];
        if (!onPad) reasons.push('MISSED THE PAD');
        if (!vOk) reasons.push('DESCENT TOO FAST (' + L.vy.toFixed(1) + ' / ' + SAFE_VSPD.toFixed(1) + ')');
        if (!hOk) reasons.push('SIDEWAYS DRIFT (' + Math.abs(L.vx).toFixed(1) + ' / ' + SAFE_HSPD.toFixed(1) + ')');
        if (!angleOk) reasons.push('NOT LEVEL (' + Math.round(Math.abs(L.angle)*180/Math.PI) + '° / ' + Math.round(SAFE_ANGLE*180/Math.PI) + '°)');
        if (!reasons.length) reasons.push('ROUGH LANDING');
        endAttempt(false, reasons);
      }
    }
  }

  function updateTelemetry(){
    const L = lander;
    if (!L) return;
    updateHUD();
    setText(teleAlt, String(Math.max(0, Math.round(L.clearance))));
    setText(teleVspd, L.vy.toFixed(1));
    setText(teleHspd, L.vx.toFixed(1));
    const deg = Math.round(L.angle * 180 / Math.PI);
    setText(teleAng, deg + '°');
    const vCls = L.vy > SAFE_VSPD ? 'danger' : L.vy > SAFE_VSPD*0.6 ? 'warn' : '';
    const hCls = Math.abs(L.vx) > SAFE_HSPD ? 'danger' : Math.abs(L.vx) > SAFE_HSPD*0.6 ? 'warn' : '';
    const aCls = Math.abs(L.angle) > SAFE_ANGLE ? 'danger' : Math.abs(L.angle) > SAFE_ANGLE*0.6 ? 'warn' : '';
    setCls(teleVspd, 't-val ' + vCls);
    setCls(teleHspd, 't-val ' + hCls);
    setCls(teleAng, 't-val ' + aCls);
  }

  function update(dt, t){
    nowTs = t;
    pulseT += dt;

    if (state === 'playing' && lander && !lander.landed && !lander.crashed){
      updateLander(dt);
      updateTelemetry();
    } else {
      setThrustSound(false);
    }

    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vy += 0.01*dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i,1);
    }

    for (const d of debris){
      if (d.settled) continue;
      d.vy += 0.02*dt;
      d.x += d.vx*dt; d.y += d.vy*dt;
      d.rot += d.vr*dt;
      const g = groundAt(d.x);
      if (d.y >= g){ d.y = g; d.vx = 0; d.vy = 0; d.vr = 0; d.settled = true; }
    }

    if (shake > 0) shake = Math.max(0, shake * Math.pow(0.9, dt) - 0.02*dt);

    // Show the result overlay once the crash / touchdown has played out
    if (pending){
      resultTimer -= dt;
      if (resultTimer <= 0){
        showMessage(pending.title, pending.sub, pending.btn, pending.good);
        lockUntil = performance.now() + (pending.isFinal ? 700 : 350);
        pending = null;
      }
    }
  }

  // ---------- Rendering ----------
  let starPositions = [];
  function makeStars(){
    starPositions = [];
    for (let i=0;i<70;i++){
      starPositions.push({x:Math.random(), y:Math.random()*0.7, r:Math.random()*1.4+0.4, a:Math.random()*0.6+0.2, ph:Math.random()*6.28});
    }
  }
  makeStars();

  function drawEarth(){
    const r = clamp(W*0.03, 12, 26);
    const x = W*0.72, y = H*0.2;
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = 'rgba(77,210,255,0.08)';
    ctx.strokeStyle = 'rgba(120,170,200,0.7)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, r, -0.9, 0.6);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x, y, r, r*0.35, 0.3, 0.4, 2.8);
    ctx.stroke();
    ctx.restore();
  }

  function drawTerrain(){
    ctx.strokeStyle = TEXT;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    terrain.forEach((seg,i) => {
      if (i===0) ctx.moveTo(seg.x1, seg.y1);
      ctx.lineTo(seg.x2, seg.y2);
    });
    ctx.stroke();

    ctx.fillStyle = 'rgba(215,221,227,0.03)';
    ctx.beginPath();
    ctx.moveTo(0, H);
    terrain.forEach(seg => { ctx.lineTo(seg.x1, seg.y1); ctx.lineTo(seg.x2, seg.y2); });
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    const padCenterX = pad.x + pad.w/2;
    const pulse = (Math.sin(pulseT * 0.06) + 1) / 2;

    // pad surface
    ctx.save();
    ctx.shadowColor = GREEN;
    ctx.shadowBlur = 8 + pulse * 10;
    ctx.strokeStyle = GREEN;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(pad.x, pad.y);
    ctx.lineTo(pad.x + pad.w, pad.y);
    ctx.stroke();
    ctx.restore();

    // end beacons
    ctx.save();
    ctx.strokeStyle = GREEN;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(pad.x, pad.y); ctx.lineTo(pad.x, pad.y - 9);
    ctx.moveTo(pad.x + pad.w, pad.y); ctx.lineTo(pad.x + pad.w, pad.y - 9);
    ctx.stroke();
    ctx.fillStyle = pulse > 0.5 ? GREEN : 'rgba(43,255,143,0.25)';
    ctx.fillRect(pad.x - 1.5, pad.y - 12, 3, 3);
    ctx.fillRect(pad.x + pad.w - 1.5, pad.y - 12, 3, 3);
    ctx.restore();

    // blinking chevrons
    ctx.save();
    ctx.globalAlpha = pulse > 0.5 ? 1 : 0.15;
    ctx.strokeStyle = GREEN;
    ctx.lineWidth = 2;
    [0, 14].forEach(offset => {
      const cy = pad.y - 40 - offset;
      ctx.beginPath();
      ctx.moveTo(padCenterX - 7, cy);
      ctx.lineTo(padCenterX, cy + 7);
      ctx.lineTo(padCenterX + 7, cy);
      ctx.stroke();
    });
    ctx.restore();

    ctx.fillStyle = GREEN;
    ctx.font = '9px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('PAD', padCenterX, pad.y - 18);
  }

  function drawLander(){
    const L = lander;
    ctx.save();
    ctx.translate(L.x, L.y);
    ctx.rotate(L.angle);
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = TEXT;
    // body
    ctx.beginPath();
    ctx.moveTo(0,-10);
    ctx.lineTo(7,4);
    ctx.lineTo(3,10);
    ctx.lineTo(-3,10);
    ctx.lineTo(-7,4);
    ctx.closePath();
    ctx.stroke();
    // legs glow green when the current descent would be survivable
    ctx.strokeStyle = (L.safe && !L.landed) ? GREEN : TEXT;
    ctx.beginPath();
    ctx.moveTo(-6,7); ctx.lineTo(-12,14);
    ctx.moveTo(6,7); ctx.lineTo(12,14);
    ctx.moveTo(-15,14); ctx.lineTo(-9,14);
    ctx.moveTo(9,14); ctx.lineTo(15,14);
    ctx.stroke();

    if (L.thrusting){
      ctx.save();
      ctx.beginPath();
      ctx.strokeStyle = AMBER;
      ctx.shadowColor = AMBER;
      ctx.shadowBlur = 8;
      ctx.moveTo(-4,10);
      ctx.lineTo(0, 12 + (6 + Math.random()*6) * L.throttle);
      ctx.lineTo(4,10);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    // velocity vector: green while the speed is survivable, red when it is not
    if (!L.landed){
      const speedOk = L.vy < SAFE_VSPD && Math.abs(L.vx) < SAFE_HSPD;
      ctx.save();
      ctx.globalAlpha = 0.6;
      ctx.strokeStyle = speedOk ? GREEN : RED;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(L.x, L.y);
      ctx.lineTo(L.x + L.vx*24, L.y + L.vy*24);
      ctx.stroke();
      ctx.restore();
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if (shake > 0.1) ctx.translate(rand(-shake,shake), rand(-shake,shake));

    ctx.fillStyle = '#ffffff';
    for (let i=0;i<starPositions.length;i++){
      const s = starPositions[i];
      ctx.globalAlpha = s.a * (0.75 + 0.25*Math.sin(nowTs*0.002 + s.ph));
      ctx.fillRect(s.x*W, s.y*H, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    drawEarth();
    if (terrain.length) drawTerrain();

    for (const p of particles){
      ctx.globalAlpha = Math.max(p.life/p.maxLife, 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-1.5,p.y-1.5,3,3);
    }
    ctx.globalAlpha = 1;

    ctx.strokeStyle = RED;
    ctx.lineWidth = 1.5;
    for (const d of debris){
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.rotate(d.rot);
      ctx.beginPath();
      ctx.moveTo(-d.len/2, 0);
      ctx.lineTo(d.len/2, 0);
      ctx.stroke();
      ctx.restore();
    }

    if (lander && !lander.crashed && state !== 'menu') drawLander();

    // out-of-fuel warning
    if (state === 'playing' && lander && lander.fuel <= 0 && !lander.landed && !lander.crashed){
      if (Math.floor(pulseT / 18) % 2 === 0){
        ctx.fillStyle = AMBER;
        ctx.font = '700 13px ' + FONT;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('OUT OF FUEL', W/2, H*0.16);
      }
    }

    ctx.restore();
  }

  let lastTime = null;
  function loop(ts){
    if (lastTime === null) lastTime = ts;
    const dt = Math.min((ts - lastTime)/16.67, 2.5);
    lastTime = ts;
    if (!paused) update(dt, ts); else nowTs = ts;
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Buttons ----------
  function handleStartBtn(e){
    if (e) e.preventDefault();
    initAudio();
    if (state === 'playing' && paused){
      paused = false;
      hideMessage();
      return;
    }
    if (performance.now() < lockUntil) return;
    if (state === 'menu' || state === 'over'){
      resize();
      resetRun();
    } else if (state === 'success' || state === 'crashed'){
      advance();
    }
  }
  startBtn.addEventListener('click', handleStartBtn);

  const pauseBtn = document.getElementById('pause-btn');
  function togglePause(e){
    if (e) e.preventDefault();
    if (state !== 'playing' || pending) return;
    if (!paused){
      paused = true;
      setThrustSound(false);
      showMessage('PAUSED', 'PRESS RESUME TO CONTINUE', 'RESUME');
    } else {
      paused = false;
      hideMessage();
    }
  }
  pauseBtn.addEventListener('click', togglePause);

  // ---------- Boot ----------
  resize();
  generateTerrain();   // so the menu has some scenery behind it
  updateHUD();
  showMessage('LUNAR LANDER', menuText(), 'START');
  requestAnimationFrame(loop);
})();
