<style>
  :root {
    --bg: #050608;
    --panel: rgba(10,12,16,0.82);
    --panel-2: #0a0a0c;
    --line: rgba(255,43,43,0.2);
    --line-bright: rgba(255,43,43,0.4);
    --red: #ff2b2b;
    --red-dim: #ff2b2b55;
    --text: #d8dde3;
    --muted: #5a6270;
    --danger: #ff5c4d;
    --go: #2fe37a;
    --font: 'Space Mono', monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* HUD scanline + vignette overlays */
  #scanlines{position:fixed;inset:0;pointer-events:none;z-index:80;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:79;box-shadow: inset 0 0 180px rgba(0,0,0,0.85);}
  .corner{position:fixed;width:26px;height:26px;border:2px solid var(--red);z-index:81;pointer-events:none;opacity:.85;}
  .corner.tl{top:14px;left:14px;border-right:none;border-bottom:none;}
  .corner.tr{top:14px;right:14px;border-left:none;border-bottom:none;}
  .corner.bl{bottom:14px;left:14px;border-right:none;border-top:none;}
  .corner.br{bottom:14px;right:14px;border-left:none;border-top:none;}

  .container {
    max-width: 480px;
    margin: auto;
    position: relative;
    z-index: 2;
  }

  h1 {
    text-align: center;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin: 0 0 6px;
    text-shadow: 0 0 18px rgba(255,43,43,0.3);
  }

  .intro {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.4px;
    color: var(--muted);
    margin: 0 0 22px;
    line-height: 1.6;
  }

  .add-task {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }

  input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border-radius: 0;
    border: 1px solid var(--line-bright);
    background: var(--panel-2);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
  }

  input:focus {
    outline: none;
    border-color: var(--red);
    box-shadow: 0 0 0 1px var(--red-dim);
  }

  input::placeholder { color: var(--muted); }

  button {
    padding: 12px 16px;
    border-radius: 0;
    border: 1px solid var(--line-bright);
    cursor: pointer;
    font-size: 0.8rem;
    font-family: var(--font);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: transparent;
    color: var(--text);
    transition: all 0.15s ease;
  }

  .add-btn {
    background: rgba(255,43,43,0.1);
    color: var(--red);
    border-color: var(--red);
    text-shadow: 0 0 6px rgba(255,43,43,0.4);
  }

  .add-btn:hover {
    background: rgba(255,43,43,0.2);
    box-shadow: 0 0 14px var(--red-dim);
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 16px;
    border-radius: 0;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: border-color 0.15s ease;
  }

  li:hover { border-color: var(--line-bright); }

  li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: var(--red);
    flex: none;
    padding: 0;
  }

  li.completed {
    border-color: rgba(47,227,122,0.3);
    background: rgba(47,227,122,0.04);
  }

  li.completed input[type="text"] {
    text-decoration: line-through;
    opacity: 0.5;
  }

  li input[type="text"] {
    background: transparent;
    color: var(--text);
    border: none;
    outline: none;
    box-shadow: none;
    padding: 0;
    flex: 1;
    min-width: 0;
    font-family: var(--font);
    font-size: 16px;
  }

  .delete {
    background: rgba(255,43,43,0.08);
    color: var(--danger);
    border-color: rgba(255,43,43,0.4);
    padding: 8px 12px;
    font-size: 0.85rem;
  }

  .delete:hover {
    background: var(--red);
    color: #0a0a0c;
    border-color: var(--red);
  }

  .clear {
    margin-top: 18px;
    width: 100%;
    background: transparent;
    color: var(--muted);
    border-color: var(--line-bright);
    padding: 13px;
  }

  .clear:hover {
    border-color: var(--danger);
    color: var(--danger);
  }

  h1 .ico { width: 1.05em; height: 1.05em; vertical-align: -0.12em; margin-right: 10px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .delete .ico { width: 14px; height: 14px; display: block; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  .progress { text-align: center; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; min-height: 1.2em; }
  .progress.all { color: var(--go); }
  .foot a { color: var(--muted); text-decoration: underline; }
  .foot a:hover { color: var(--red); }
  .foot { text-align: center; font-size: 10px; letter-spacing: 0.3px; color: var(--muted); margin: 14px 0 0; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 30px 10px;
    border: 1px dashed var(--line);
    letter-spacing: 0.3px;
  }
</style>

<body>

<div id="scanlines"></div>
<div id="vignette"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

<div class="container">
  <h1><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><polyline points="12 9 12 13 15 15"/><path d="M5 3 2 6M19 3l3 3"/></svg>Daily Routine</h1>
  <p class="intro">Recurring checklist — tasks stay saved and uncheck themselves fresh each new day.</p>

  <div class="add-task">
    <input id="taskInput" placeholder="Add a daily task…" maxlength="120" aria-label="New daily task" autocomplete="off" />
    <button class="add-btn" onclick="addTask()">Add</button>
  </div>

  <p class="progress" id="progress" aria-live="polite"></p>

  <ul id="taskList"></ul>

  <button class="clear" onclick="clearAll()">Clear All &amp; Reset</button>
  <p class="foot">Saved only in this browser. Nothing is uploaded. · <a href="/privacy/index.html">Privacy Policy</a></p>
</div>

<script>
const STORAGE_KEY = "daily_routine_tasks";
const DATE_KEY = "daily_routine_date";

function today() {
  return new Date().toDateString();
}

/* Safe read: corrupted or missing data never breaks the page */
function readTasks() {
  try {
    const t = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!Array.isArray(t)) return [];
    return t.filter(x => x && typeof x.text === "string").map(x => ({ text: x.text, done: !!x.done }));
  } catch (e) { return []; }
}

function saveTasks(tasks) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) {}
}

/* New day -> uncheck everything. Returns true if a reset happened. */
function checkNewDay() {
  let saved = null;
  try { saved = localStorage.getItem(DATE_KEY); } catch (e) {}
  if (saved === today()) return false;
  saveTasks(readTasks().map(t => ({ ...t, done: false })));
  try { localStorage.setItem(DATE_KEY, today()); } catch (e) {}
  return true;
}

function addTask() {
  const input = document.getElementById("taskInput");
  const text = input.value.trim();
  if (!text) return;
  const tasks = readTasks();
  tasks.push({ text, done: false });
  saveTasks(tasks);
  input.value = "";
  render(tasks);
  input.focus();
}

function toggleTask(index) {
  const tasks = readTasks();
  if (!tasks[index]) return;
  tasks[index].done = !tasks[index].done;
  saveTasks(tasks);
  render(tasks);
}

function editTask(index, value) {
  const tasks = readTasks();
  if (!tasks[index]) return;
  tasks[index].text = value;
  saveTasks(tasks);
}

function deleteTask(index) {
  const tasks = readTasks();
  tasks.splice(index, 1);
  saveTasks(tasks);
  render(tasks);
}

function clearAll() {
  if (!confirm("Delete all tasks and clear storage?")) return;
  try {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(DATE_KEY);
  } catch (e) {}
  render([]);
}

function render(tasks) {
  const list = document.getElementById("taskList");
  const prog = document.getElementById("progress");
  list.textContent = "";

  if (tasks.length === 0) {
    prog.textContent = "";
    prog.classList.remove("all");
    const empty = document.createElement("li");
    empty.className = "empty-state";
    empty.textContent = "No tasks yet — add your first daily routine item above.";
    list.appendChild(empty);
    return;
  }

  const done = tasks.filter(t => t.done).length;
  prog.textContent = done === tasks.length ? "All done for today" : done + " / " + tasks.length + " done today";
  prog.classList.toggle("all", done === tasks.length);

  tasks.forEach((task, index) => {
    const li = document.createElement("li");
    if (task.done) li.classList.add("completed");

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = task.done;
    cb.setAttribute("aria-label", "Mark done: " + task.text);
    cb.addEventListener("change", () => toggleTask(index));

    /* built with DOM APIs, so quotes or <tags> in a task can never break the page */
    const txt = document.createElement("input");
    txt.type = "text";
    txt.value = task.text;
    txt.maxLength = 120;
    txt.setAttribute("aria-label", "Task text");
    txt.addEventListener("input", () => editTask(index, txt.value));

    const del = document.createElement("button");
    del.className = "delete";
    del.setAttribute("aria-label", "Delete task");
    del.innerHTML = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>';
    del.addEventListener("click", () => deleteTask(index));

    li.append(cb, txt, del);
    list.appendChild(li);
  });
}

document.getElementById("taskInput").addEventListener("keydown", e => {
  if (e.key === "Enter") addTask();
});

/* Tab left open past midnight? Reset when you come back to it. */
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && checkNewDay()) render(readTasks());
});
setInterval(() => {
  const a = document.activeElement;
  if (a && a.tagName === "INPUT" && a.type === "text") return;   // don't interrupt typing
  if (checkNewDay()) render(readTasks());
}, 60000);

checkNewDay();
render(readTasks());
</script>
