<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Google tag (gtag.js) -->

  <meta charset="UTF-8">
  <title>Percentage of Total Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;

      /* Safari-safe viewport handling */
      min-height: 100vh;
      min-height: 100svh;

      margin: 0;
      padding: 16px;
    }

    .calculator {
      background: #020617;
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h2 {
      text-align: center;
      margin-bottom: 6px;
      font-size: 22px;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    label {
      font-size: 14px;
      color: #cbd5f5;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      height: 54px;
      font-size: 18px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: #6366f1;
      color: white;
      margin-top: 6px;
    }

    button:active {
      transform: scale(0.98);
    }

    .result {
      margin-top: 18px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      word-break: break-word;
    }

    .error {
      color: #f87171;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="calculator">
    <h2>🧮 Percentage of Total</h2>
    <div class="subtitle">
      Find what percent one value is of another
    </div>

    <div class="field">
      <label for="part">Part (obtained / used / completed)</label>
      <input
        type="number"
        id="part"
        inputmode="decimal"
        placeholder="e.g. 200"
      >
    </div>

    <div class="field">
      <label for="total">Total (maximum / available)</label>
      <input
        type="number"
        id="total"
        inputmode="decimal"
        placeholder="e.g. 500"
      >
    </div>

    <button onclick="calculatePercentage()">Calculate</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function calculatePercentage() {
      const part = Number(document.getElementById("part").value);
      const total = Number(document.getElementById("total").value);
      const resultDiv = document.getElementById("result");

      if (Number.isNaN(part) || Number.isNaN(total)) {
        resultDiv.innerHTML =
          "<span class='error'>Please enter both values</span>";
        return;
      }

      if (total === 0) {
        resultDiv.innerHTML =
          "<span class='error'>Total cannot be zero</span>";
        return;
      }

      const raw = (part / total) * 100;

      let display;
      if (Number.isInteger(raw)) {
        display = raw.toString();
      } else if (raw !== 0 && Math.abs(raw) < 0.001) {
        display = raw.toFixed(6);
      } else {
        display = raw.toFixed(3);
      }

      display = display.replace(/\.?0+$/, "");

      resultDiv.textContent = `${part} out of ${total} = ${display}%`;
    }
  </script>

  <script src="/libraries/config.js"></script>
  <script src="/libraries/view-counter.js"></script>

</body>
</html>
