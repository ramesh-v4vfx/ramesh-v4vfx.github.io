<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Quick capture and task triage tool. Dump every task instantly, then sort each one into Do, Delegate, Defer, or Delete.">

<title>Quick Capture & Task Triage Tool | rameshverse</title>

<link rel="canonical" href="https://rameshverse.com/task-triage">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">


<style>
  :root{
    --bg: #0a0a0c;
    --bg-panel: #111114;
    --line: #232327;
    --red: #ff2b2b;
    --red-dim: #7a1414;
    --green: #23e07a;
    --text: #e8e8ea;
    --text-dim: #7a7a82;
    --amber: #ffb020;
    --blue: #3ea6ff;
    
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Mono', 'Courier New', monospace;
    min-height:100vh;
    background-image:
      linear-gradient(rgba(255,43,43,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,43,43,0.02) 1px, transparent 1px);
    background-size: 24px 24px;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.012) 0px,
      rgba(255,255,255,0.012) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
    z-index:999;
  }

  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 80px;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;
    margin-bottom:8px;
    flex-wrap:wrap;
    gap:12px;
  }
  h1{font-size:24px; letter-spacing:2px; margin:0; font-weight:700;}
  h1 span{color:var(--red);}
  .subtitle{color:var(--text-dim); font-size:13px; margin-top:4px; letter-spacing:1px;}
  .back-link{
    font-size:13px; color:var(--text-dim); text-decoration:none;
    border:1px solid var(--line); padding:6px 10px;
    transition:border-color .15s, color .15s;
  }
  .back-link:hover{color:var(--red); border-color:var(--red);}
  .tagline{color:var(--text-dim); font-size:13px; margin:10px 0 22px; letter-spacing:0.5px;}

  /* telemetry */
  .telemetry{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:22px;
  }
  .tele-cell{background:var(--bg-panel); padding:14px 16px;}
  .tele-label{font-size:11px; color:var(--text-dim); letter-spacing:1.5px; margin-bottom:6px;}
  .tele-value{font-size:22px; font-weight:700; color:var(--text);}
  .tele-value.ok{color:var(--green);}
  .tele-value.warn{color:var(--red);}

  /* capture bar */
  .capture-row{
    display:flex;
    gap:8px;
    margin-bottom:22px;
  }
  input[type="text"]{
    background:var(--bg-panel);
    border:1px solid var(--line);
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    padding:14px 14px;
    letter-spacing:0.3px;
    outline:none;
    flex:1;
  }
  input[type="text"]::placeholder{
    color:var(--text-dim);
    opacity:1;
  }
  input[type="text"]:focus{border-color:var(--red);}

  #captureInput{
    border:1px solid #3a3a42;
    font-size:16px;
    box-shadow:0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  #captureInput::placeholder{
    color:#8a8a92;
  }
  #captureInput:focus{
    border-color:var(--red);
    box-shadow:0 0 0 3px rgba(255,43,43,0.12);
  }
  button.primary{
    background:var(--red);
    border:1px solid var(--red);
    color:#0a0a0c;
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    letter-spacing:1px;
    padding:0 22px;
    cursor:pointer;
    transition:opacity .15s;
  }
  button.primary:hover{opacity:0.85;}

  /* triage card */
  .triage-panel{
    border:1px solid var(--red);
    background:var(--bg-panel);
    padding:28px 24px;
    text-align:center;
    margin-bottom:24px;
  }
  .triage-label{
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:2px;
    margin-bottom:14px;
  }
  .triage-label b{color:var(--red);}
  .triage-item{
    font-size:20px;
    font-weight:700;
    letter-spacing:0.3px;
    margin-bottom:24px;
    word-break:break-word;
    line-height:1.4;
  }
  .triage-buttons{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:8px;
  }
  .triage-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--text);
    font-family:inherit;
    font-weight:700;
    font-size:13px;
    letter-spacing:1px;
    padding:14px 8px;
    cursor:pointer;
    transition:all .15s;
  }
  .triage-btn.do{border-color:var(--green);}
  .triage-btn.do:hover{background:rgba(35,224,122,0.1); color:var(--green);}
  .triage-btn.delegate{border-color:var(--blue);}
  .triage-btn.delegate:hover{background:rgba(62,166,255,0.1); color:var(--blue);}
  .triage-btn.defer{border-color:var(--amber);}
  .triage-btn.defer:hover{background:rgba(255,176,32,0.1); color:var(--amber);}
  .triage-btn.delete{border-color:var(--red);}
  .triage-btn.delete:hover{background:rgba(255,43,43,0.1); color:var(--red);}

  .inline-input{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .inline-input input[type="text"]{
    font-size:14px;
    padding:10px 12px;
  }
  .inline-input button{
    padding:0 16px;
    font-size:13px;
  }
  .cancel-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    font-family:inherit;
    font-size:13px;
    padding:0 16px;
    cursor:pointer;
  }
  .cancel-btn:hover{color:var(--text);}

  .zero-state{
    border:1px solid var(--green);
    background:rgba(35,224,122,0.05);
    padding:32px 24px;
    text-align:center;
    margin-bottom:24px;
  }
  .zero-state .big{
    font-size:18px;
    font-weight:700;
    color:var(--green);
    letter-spacing:1px;
    margin-bottom:6px;
  }
  .zero-state .small{
    font-size:13px;
    color:var(--text-dim);
  }

  /* result lists */
  .lists-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media (max-width:600px){
    .lists-grid{grid-template-columns:1fr;}
  }
  .list-panel{border:1px solid var(--line); background:var(--bg-panel); padding:16px;}
  .list-title{
    font-size:13px;
    letter-spacing:1.5px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .list-title.do{color:var(--green);}
  .list-title.delegate{color:var(--blue);}
  .list-title.defer{color:var(--amber);}
  .list-count{
    font-size:12px;
    color:var(--text-dim);
    border:1px solid var(--line);
    padding:2px 6px;
  }
  .list-item{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .list-item:last-child{border-bottom:none;}
  .list-item-text{flex:1; word-break:break-word;}
  .list-item-meta{color:var(--text-dim); font-size:11px; margin-top:3px;}
  .list-item .del-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:13px;
    cursor:pointer;
    flex-shrink:0;
  }
  .list-item .del-btn:hover{color:var(--red);}
  .list-empty{color:var(--text-dim); font-size:12px; padding:6px 0;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>RV<span>·</span>TASKTRIAGE</h1>
      <div class="subtitle">QUICK CAPTURE + FORCED TRIAGE</div>
    </div>
    </header>
  <div class="tagline">DUMP IT. DECIDE ON IT. DON'T LET IT PILE UP.</div>

  <div class="capture-row">
    <input type="text" id="captureInput" placeholder="WHAT'S ON YOUR MIND? TYPE AND HIT ENTER..." maxlength="200" autofocus>
    <button class="primary" id="captureBtn">CAPTURE</button>
  </div>

  <div class="telemetry" id="telemetry"></div>

  <div id="triageContainer"></div>

  <div class="lists-grid">
    <div class="list-panel">
      <div class="list-title do">DO NOW <span class="list-count" id="doCount">0</span></div>
      <div id="doList"></div>
    </div>
    <div class="list-panel">
      <div class="list-title delegate">DELEGATED <span class="list-count" id="delegateCount">0</span></div>
      <div id="delegateList"></div>
    </div>
    <div class="list-panel">
      <div class="list-title defer">DEFERRED <span class="list-count" id="deferCount">0</span></div>
      <div id="deferList"></div>
    </div>
    <div class="list-panel">
      <div class="list-title" style="color:var(--text-dim);">DELETED <span class="list-count" id="deleteCount">0</span></div>
      <div id="deleteList"></div>
    </div>
  </div>

</div>

<script>
(function(){
  const STORAGE_KEY = 'rv_tasktriage_data_v1';

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : { items: [] };
    }catch(e){
      return { items: [] };
    }
  }
  function saveData(data){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(e){ console.error('RV·TASKTRIAGE: storage write failed', e); }
  }

  let data = loadData();
  let triageMode = null; // null | 'delegate' | 'defer' (which inline form is open)

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function genId(){
    return 'i_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  }

  function relTime(ts){
    const diffMs = Date.now() - ts;
    const mins = Math.floor(diffMs/60000);
    if(mins < 1) return 'JUST NOW';
    if(mins < 60) return mins + 'M AGO';
    const hrs = Math.floor(mins/60);
    if(hrs < 24) return hrs + 'H AGO';
    const days = Math.floor(hrs/24);
    return days + 'D AGO';
  }

  // ---- capture ----
  function captureItem(){
    const input = document.getElementById('captureInput');
    const text = input.value.trim();
    if(!text) return;
    data.items.push({
      id: genId(),
      text: text,
      status: 'unsorted',
      createdAt: Date.now(),
      note: ''
    });
    saveData(data);
    input.value = '';
    input.focus();
    renderAll();
  }
  document.getElementById('captureBtn').addEventListener('click', captureItem);
  document.getElementById('captureInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') captureItem();
  });

  // ---- triage ----
  function getNextUnsorted(){
    return data.items.find(function(i){ return i.status === 'unsorted'; });
  }

  function setStatus(id, status, note){
    const item = data.items.find(function(i){ return i.id === id; });
    if(!item) return;
    item.status = status;
    item.note = note || '';
    saveData(data);
    triageMode = null;
    renderAll();
  }

  function renderTriage(){
    const container = document.getElementById('triageContainer');
    const next = getNextUnsorted();
    const unsortedCount = data.items.filter(function(i){ return i.status === 'unsorted'; }).length;

    if(!next){
      const totalSorted = data.items.filter(function(i){ return i.status !== 'unsorted'; }).length;
      if(totalSorted === 0){
        container.innerHTML = '';
      } else {
        container.innerHTML =
          '<div class="zero-state">' +
            '<div class="big">TRIAGE COMPLETE</div>' +
            '<div class="small">EVERYTHING CAPTURED HAS BEEN TRIAGED. CAPTURE SOMETHING NEW ABOVE.</div>' +
          '</div>';
      }
      return;
    }

    let extraHtml = '';
    if(triageMode === 'delegate'){
      extraHtml =
        '<div class="inline-input">' +
          '<input type="text" id="delegateWho" placeholder="WHO ARE YOU DELEGATING TO?" maxlength="60">' +
          '<button class="primary" id="confirmDelegate">CONFIRM</button>' +
          '<button class="cancel-btn" id="cancelInline">CANCEL</button>' +
        '</div>';
    } else if(triageMode === 'defer'){
      extraHtml =
        '<div class="inline-input">' +
          '<input type="text" id="deferNote" placeholder="DEFER UNTIL / NOTE (OPTIONAL)" maxlength="60">' +
          '<button class="primary" id="confirmDefer">CONFIRM</button>' +
          '<button class="cancel-btn" id="cancelInline">CANCEL</button>' +
        '</div>';
    }

    container.innerHTML =
      '<div class="triage-panel">' +
        '<div class="triage-label">TRIAGE — <b>' + unsortedCount + '</b> ITEM' + (unsortedCount === 1 ? '' : 'S') + ' WAITING</div>' +
        '<div class="triage-item">' + escapeHtml(next.text) + '</div>' +
        '<div class="triage-buttons" id="triageButtons">' +
          '<button class="triage-btn do" data-action="do">DO</button>' +
          '<button class="triage-btn delegate" data-action="delegate">DELEGATE</button>' +
          '<button class="triage-btn defer" data-action="defer">DEFER</button>' +
          '<button class="triage-btn delete" data-action="delete">DELETE</button>' +
        '</div>' +
        extraHtml +
      '</div>';

    document.querySelectorAll('.triage-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        const action = btn.getAttribute('data-action');
        if(action === 'do'){
          setStatus(next.id, 'do');
        } else if(action === 'delete'){
          setStatus(next.id, 'delete');
        } else if(action === 'delegate'){
          triageMode = 'delegate';
          renderTriage();
          setTimeout(function(){
            const el = document.getElementById('delegateWho');
            if(el) el.focus();
          }, 0);
        } else if(action === 'defer'){
          triageMode = 'defer';
          renderTriage();
          setTimeout(function(){
            const el = document.getElementById('deferNote');
            if(el) el.focus();
          }, 0);
        }
      });
    });

    const confirmDelegate = document.getElementById('confirmDelegate');
    if(confirmDelegate){
      confirmDelegate.addEventListener('click', function(){
        const who = document.getElementById('delegateWho').value.trim();
        setStatus(next.id, 'delegate', who);
      });
      document.getElementById('delegateWho').addEventListener('keydown', function(e){
        if(e.key === 'Enter') confirmDelegate.click();
      });
    }
    const confirmDefer = document.getElementById('confirmDefer');
    if(confirmDefer){
      confirmDefer.addEventListener('click', function(){
        const note = document.getElementById('deferNote').value.trim();
        setStatus(next.id, 'defer', note);
      });
      document.getElementById('deferNote').addEventListener('keydown', function(e){
        if(e.key === 'Enter') confirmDefer.click();
      });
    }
    const cancelInline = document.getElementById('cancelInline');
    if(cancelInline){
      cancelInline.addEventListener('click', function(){
        triageMode = null;
        renderTriage();
      });
    }
  }

  // ---- lists ----
  function removeItem(id){
    data.items = data.items.filter(function(i){ return i.id !== id; });
    saveData(data);
    renderAll();
  }

  function renderList(status, containerId, countId, showMeta){
    const items = data.items.filter(function(i){ return i.status === status; })
      .sort(function(a,b){ return b.createdAt - a.createdAt; });
    document.getElementById(countId).textContent = items.length;

    const el = document.getElementById(containerId);
    if(items.length === 0){
      el.innerHTML = '<div class="list-empty">NOTHING HERE.</div>';
      return;
    }
    let html = '';
    items.forEach(function(item){
      let meta = relTime(item.createdAt);
      if(showMeta && item.note) meta = escapeHtml(item.note) + ' · ' + meta;
      html += '<div class="list-item">' +
        '<div>' +
          '<div class="list-item-text">' + escapeHtml(item.text) + '</div>' +
          '<div class="list-item-meta">' + meta + '</div>' +
        '</div>' +
        '<button class="del-btn" data-remove="' + item.id + '">✕</button>' +
      '</div>';
    });
    el.innerHTML = html;
    el.querySelectorAll('[data-remove]').forEach(function(btn){
      btn.addEventListener('click', function(){
        removeItem(btn.getAttribute('data-remove'));
      });
    });
  }

  // ---- telemetry ----
  function renderTelemetry(){
    const el = document.getElementById('telemetry');
    const total = data.items.length;
    const unsorted = data.items.filter(function(i){ return i.status === 'unsorted'; }).length;
    const sorted = total - unsorted;
    const triagedPct = total > 0 ? Math.round((sorted/total)*100) : 100;

    el.innerHTML =
      '<div class="tele-cell"><div class="tele-label">CAPTURED TOTAL</div>' +
        '<div class="tele-value">' + total + '</div></div>' +
      '<div class="tele-cell"><div class="tele-label">WAITING TRIAGE</div>' +
        '<div class="tele-value ' + (unsorted > 0 ? 'warn' : 'ok') + '">' + unsorted + '</div></div>' +
      '<div class="tele-cell"><div class="tele-label">TRIAGED</div>' +
        '<div class="tele-value ok">' + triagedPct + '%</div></div>';
  }

  function renderAll(){
    renderTelemetry();
    renderTriage();
    renderList('do', 'doList', 'doCount', false);
    renderList('delegate', 'delegateList', 'delegateCount', true);
    renderList('defer', 'deferList', 'deferCount', true);
    renderList('delete', 'deleteList', 'deleteCount', false);
  }

 renderAll();
  document.getElementById('captureInput').focus();
})();
</script>

<script src="/libraries/config.js"></script>
<script src="/libraries/view-counter.js"></script>
<script src="/libraries/hud-home-button.js"></script>

</body>
</html>
