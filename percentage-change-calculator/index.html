<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <title>Percentage Change Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      margin: 0;
      padding: 16px;
    }

    .calculator {
      background: #020617;
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h2 {
      text-align: center;
      margin-bottom: 6px;
      font-size: 22px;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    label {
      font-size: 14px;
      color: #cbd5f5;
    }

    input {
      height: 52px;
      padding: 0 14px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 16px;
      box-sizing: border-box;
      width: 100%;
    }

    button {
      width: 100%;
      height: 54px;
      font-size: 18px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: #6366f1;
      color: white;
      margin-top: 6px;
    }

    button:active {
      transform: scale(0.98);
    }

    .result {
      margin-top: 18px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      word-break: break-word;
    }

    .positive {
      color: #22c55e;
    }

    .negative {
      color: #ef4444;
    }

    .error {
      color: #f87171;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="calculator">
    <h2>📈 Percentage Change Calculator</h2>
    <div class="subtitle">Increase / Decrease (Stock Market)</div>

    <div class="field">
      <label for="oldValue">Old Value (Buy / Previous)</label>
      <input
        type="number"
        id="oldValue"
        inputmode="decimal"
        placeholder="e.g. 100"
      >
    </div>

    <div class="field">
      <label for="newValue">New Value (Current)</label>
      <input
        type="number"
        id="newValue"
        inputmode="decimal"
        placeholder="e.g. 150"
      >
    </div>

    <button onclick="calculateChange()">Calculate</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function calculateChange() {
      const oldVal = Number(document.getElementById("oldValue").value);
      const newVal = Number(document.getElementById("newValue").value);
      const resultDiv = document.getElementById("result");

      if (Number.isNaN(oldVal) || Number.isNaN(newVal)) {
        resultDiv.innerHTML =
          "<span class='error'>Please enter both values</span>";
        return;
      }

      if (oldVal === 0) {
        resultDiv.innerHTML =
          "<span class='error'>Old value cannot be zero</span>";
        return;
      }

      const rawChange = ((newVal - oldVal) / oldVal) * 100;

      const rounded = Number(rawChange.toFixed(3));
      const isInteger = Number.isInteger(rounded);

      const sign = rounded > 0 ? "+" : rounded < 0 ? "−" : "";
      const value = isInteger
        ? Math.abs(rounded).toString()
        : Math.abs(rounded).toFixed(3);

      const prefix = isInteger ? "" : "≈ ";

      if (rounded > 0) {
        resultDiv.innerHTML =
          `<span class="positive">${prefix}${sign}${value}% Change</span>`;
      } else if (rounded < 0) {
        resultDiv.innerHTML =
          `<span class="negative">${prefix}${sign}${value}% Change</span>`;
      } else {
        resultDiv.innerHTML = `0% Change`;
      }
    }
  </script>

  <script src="/libraries/config.js"></script>
  <script src="/libraries/view-counter.js"></script>

</body>


</html>
