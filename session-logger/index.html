<body>

<canvas id="fireworks"></canvas>

<script>
/* =====================
   UTILITIES
===================== */

// Fixed: display now shows HH:MM:SS instead of MM:SS:centiseconds.
// Centisecond precision is irrelevant for a work-session tracker, and the
// original 10ms update interval (100 refreshes/sec) burned CPU/battery
// for no practical benefit. Also, sessions can legitimately run for
// hours, so hours need their own field instead of overflowing into a
// 3+ digit "minutes" column.
// Note: true microsecond precision isn't something JS timers or the
// browser's repaint rate can meaningfully deliver — Date.now() itself is
// millisecond-resolution. This shows milliseconds instead, which is the
// finest precision that's actually real and gives that fast, energetic
// readout feel.
function formatTime(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  const millis = Math.floor(ms % 1000);
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(millis).padStart(3,"0")}`;
}

function formatDurationHM(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  const parts = [];
  if (hours > 0) parts.push(`${hours} hr`);
  if (hours > 0 || minutes > 0) parts.push(`${minutes} min`);
  parts.push(`${seconds} sec`);
  return parts.join(" ");
}

// Fixed: the original day-grouping used date.toISOString().slice(0,10),
// which is always UTC. For timezones ahead of UTC (like IST, UTC+5:30),
// a session done late at night local time can fall on the *previous*
// calendar day in UTC — so it could silently vanish from "Today" or get
// filed under the wrong date in history. This uses the browser's local
// date instead.
function localDateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

/* =====================
   STOPWATCH
===================== */

let startTime = 0;
let elapsed = 0;
let timer = null;
let sessionStartISO = null;

const display = document.getElementById("display");
const timerRing = document.getElementById("timerRing");
const statusLabel = document.getElementById("statusLabel");

// Badge API — lets the home screen icon show a dot while a session is running
if ('setAppBadge' in navigator && 'Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}

function updateDisplay() {
  display.textContent = formatTime(elapsed);
}

function setState(state) {
  timerRing.classList.remove("running", "paused");
  if (state === "running") {
    timerRing.classList.add("running");
    statusLabel.textContent = "Running";
  } else if (state === "paused") {
    timerRing.classList.add("paused");
    statusLabel.textContent = "Paused";
  } else {
    statusLabel.textContent = "Idle";
  }
}

/* =====================
   STORAGE
===================== */

let sessions = [];
try {
  sessions = JSON.parse(localStorage.getItem("sessions")) || [];
} catch (e) {
  sessions = [];
}

function saveSessions() {
  try {
    localStorage.setItem("sessions", JSON.stringify(sessions));
  } catch (e) {
    // storage unavailable/full — session still works for this page view
  }
}

/* =====================
   VISIBILITY FIX (Chrome background)
===================== */

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && timer) {
    elapsed = Date.now() - startTime;
    updateDisplay();
  }
});

/* =====================
   BUTTONS
===================== */

// `timer` holds the requestAnimationFrame id while running (non-null),
// or null when stopped — same on/off semantics as before, just driven by
// the display's actual refresh rate instead of a fixed setInterval, which
// gives smooth millisecond updates without polling faster than anything
// can actually be seen.
function tick() {
  elapsed = Date.now() - startTime;
  updateDisplay();
  timer = requestAnimationFrame(tick);
}

start.onclick = () => {
  if (timer) return;
  if (!sessionStartISO) sessionStartISO = new Date().toISOString();

  startTime = Date.now() - elapsed;
  timer = requestAnimationFrame(tick);

  setState("running");
  if ('setAppBadge' in navigator) navigator.setAppBadge(1);
};

pause.onclick = () => {
  if (!timer) return;
  cancelAnimationFrame(timer);
  timer = null;
  setState("paused");
  if ('clearAppBadge' in navigator) navigator.clearAppBadge();
};

reset.onclick = () => {
  if (!elapsed) return;

  // Fixed: this used to unconditionally recompute
  // `elapsed = Date.now() - startTime`, even when the timer was already
  // paused. Since startTime is only updated when the timer (re)starts,
  // doing that math while paused silently added however long you'd been
  // sitting paused into the saved session length. Now it only
  // recalculates elapsed if the timer is actually running.
  if (timer) {
    elapsed = Date.now() - startTime;
    cancelAnimationFrame(timer);
  }

  timer = null;
  updateDisplay();

  document.getElementById("popupDuration").textContent = `Duration: ${formatDurationHM(elapsed)}`;
  popup.classList.remove("hidden");
  commentInput.focus();
};

/* =====================
   SAVE SESSION
===================== */

saveSession.onclick = () => {
  const end = new Date();

  sessions.unshift({
    ms: elapsed,
    time: formatTime(elapsed),
    comment: commentInput.value || "No comment",
    startISO: sessionStartISO,
    endISO: end.toISOString(),
    day: localDateKey(end)
  });

  saveSessions();
  popup.classList.add("hidden");
  commentInput.value = "";

  runFireworks();

  elapsed = 0;
  sessionStartISO = null;
  if (timer) cancelAnimationFrame(timer);
  timer = null;
  updateDisplay();
  setState("idle");
  if ('clearAppBadge' in navigator) navigator.clearAppBadge();
};

cancelSession.onclick = () => {
  popup.classList.add("hidden");
  // Session stays paused at its frozen elapsed time — Start resumes it.
  setState("paused");
  if ('clearAppBadge' in navigator) navigator.clearAppBadge();
};

/* =====================
   HISTORY
===================== */

historyBtn.onclick = () => {
  const isHidden = historyPanel.classList.toggle("hidden");
  historyBtn.textContent = isHidden ? "Show History" : "Hide History";
  if (!isHidden) renderHistory();
};

function renderHistory() {
  if (!sessions.length) {
    historyList.innerHTML = `<li class="empty-state" style="border:none;">No sessions logged yet.</li>`;
    return;
  }

  historyList.innerHTML = "";
  sessions.forEach(s => {
    const from = new Date(s.startISO).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    const to = new Date(s.endISO).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

    historyList.innerHTML += `
      <li>
        <strong>${from} → ${to}</strong><br>
        ${escapeHtml(s.comment)}<br>
        <small>Duration: ${formatDurationHM(s.ms)}</small>
      </li>`;
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

clearHistory.onclick = () => {
  confirmPopup.classList.remove("hidden");
};

confirmYes.onclick = () => {
  sessions = [];
  saveSessions();
  renderHistory();
  confirmPopup.classList.add("hidden");
};

confirmNo.onclick = () => {
  confirmPopup.classList.add("hidden");
};

/* =====================
   TODAY PRODUCTIVITY
===================== */

todayBtn.onclick = () => {
  const today = localDateKey(new Date());
  const todaySessions = sessions.filter(s => s.day === today);

  const content = document.getElementById("todayContent");

  if (!todaySessions.length) {
    content.innerHTML = `<p class="empty-state">No sessions logged today yet.</p>`;
  } else {
    let total = 0;
    let rows = "";

    todaySessions.forEach(s => {
      total += s.ms;
      rows += `
        <div class="today-row">
          <span class="t-comment">${escapeHtml(s.comment)}</span>
          <span class="t-dur">${formatDurationHM(s.ms)}</span>
        </div>`;
    });

    content.innerHTML = `
      <div class="today-summary-list">${rows}</div>
      <div class="today-total"><span>Total focused time</span><b>${formatDurationHM(total)}</b></div>
    `;
  }

  todayPopup.classList.remove("hidden");
};

closeToday.onclick = () => todayPopup.classList.add("hidden");

/* =====================
   FIREWORKS 🎆
===================== */

const fwCanvas = document.getElementById("fireworks");
const fwCtx = fwCanvas.getContext("2d");

function resizeFW() {
  fwCanvas.width = innerWidth;
  fwCanvas.height = innerHeight;
}
resizeFW();
addEventListener("resize", resizeFW);

let fireworks = [];
const burstColors = ["#22d3ee", "#8b5cf6", "#ec4899", "#f0eefc"];

function runFireworks(duration = 2500) {
  const start = Date.now();

  function loop() {
    fwCtx.clearRect(0,0,fwCanvas.width,fwCanvas.height);

    if (Math.random() < 0.2) {
      const x = Math.random() * fwCanvas.width;
      const y = Math.random() * fwCanvas.height;
      for (let i = 0; i < 40; i++) {
        fireworks.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 60,
          color: burstColors[Math.floor(Math.random() * burstColors.length)]
        });
      }
    }

    fireworks.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.life--;
      fwCtx.fillStyle = p.color;
      fwCtx.globalAlpha = p.life / 60;
      fwCtx.beginPath();
      fwCtx.arc(p.x, p.y, 2, 0, Math.PI * 2);
      fwCtx.fill();
    });

    fireworks = fireworks.filter(p => p.life > 0);
    fwCtx.globalAlpha = 1;

    if (Date.now() - start < duration) requestAnimationFrame(loop);
    else fwCtx.clearRect(0,0,fwCanvas.width,fwCanvas.height);
  }

  loop();
}

updateDisplay();
