  /* ---------- Convert: immersive primary ---------- */

    position: relative;

  @media (prefers-reduced-motion: reduce) {

  .convert {
    width: 100%;
    height: 100%;
    min-height: 42px;

    color: var(--violet);
    text-shadow: 0 0 8px rgba(168,85,247,0.6);

    position: absolute;
    top: 0; left: -60%;

  #errorMsg {
    display: none;
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,90,90,0.35);
    background: rgba(255,90,90,0.08);
    color: #ff8080;

    .row input { width: 100%; }
    button { width: 100%; }
    .copy-btn { width: 100%; }

<body>

<div class="page">

  <div class="notation-mark">
    <span class="base">10</span><span class="exp" id="expCycle">0</span>
  </div>

  <h2>Scientific ⇄ Decimal Converter</h2>

  <div class="brand-badge"><span class="dot"></span> Rameshverse Systems · MK·02</div>

  <div class="app">

    <label>Enter Value</label>
    <input id="inputValue" placeholder="Example: 1.2e5, -0.00042, or 120000" inputmode="decimal">

    <div class="row">
      <button class="blue-btn" onclick="pasteValue()">Paste Value</button>
      <div class="convert-wrap"><button class="convert" onclick="convert()">Convert</button></div>
    </div>

    <div id="errorMsg"></div>

    <label>Decimal</label>
    <div class="row">
      <input id="decimalResult" readonly>
      <button id="copyDecimalBtn" class="copy-btn" onclick="copyDecimal()">Copy</button>
    </div>

    <label>Scientific</label>
    <div class="row">
      <input id="scientificResult" readonly>
      <button id="copyScientificBtn" class="copy-btn" onclick="copyScientific()">Copy</button>
    </div>

    <div class="row">
      <button class="red-btn" onclick="resetApp()" style="flex:1;">Reset</button>
    </div>

  </div>
</div>

<script>
/* ---------- Signature mark: cycling exponent ---------- */
(function cycleExponent() {
  const seq = ["0", "1", "2", "3", "-1", "-2", "-3", "6", "-6", "9", "-9"];
  let i = 0;
  const el = document.getElementById("expCycle");
  setInterval(() => {
    el.style.opacity = "0";
    setTimeout(() => {
      i = (i + 1) % seq.length;
      el.textContent = seq[i];
      el.style.opacity = "1";
    }, 250);
  }, 1600);
})();

/* ---------- Formatting helpers ---------- */

function formatWithCommas(numStr) {
  return numStr.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

// Adds thousands separators to the integer portion only, regardless of
// whether the value has a fractional part (previously, any number with
// a decimal point skipped comma formatting entirely — so "1234567.89"
// rendered with no separators at all).
function formatDecimalDisplay(decimalStr) {
  const negative = decimalStr.startsWith("-");
  const unsigned = negative ? decimalStr.slice(1) : decimalStr;
  let [intPart, fracPart] = unsigned.split(".");
  intPart = formatWithCommas(intPart);
  return (negative ? "-" : "") + intPart + (fracPart !== undefined ? "." + fracPart : "");
}

/* ---------- Conversion core ----------
   Both functions were rewritten. The original decimalToScientific only
   worked for positive whole numbers with no leading zero — any input
   containing a decimal point produced a mantissa with two decimal
   points (e.g. "123.456" -> "1.23.456e+6"), and negative numbers were
   silently mangled too, since the sign character was being counted as
   a digit position. scientificToDecimal was missing negative-sign
   support entirely ("-1.2e5" failed to parse). */

function scientificToDecimal(str) {
  const match = str.trim().toLowerCase().match(/^([+-]?)(\d+(?:\.\d+)?)e([+-]?\d+)$/);
  if (!match) return null;

  const sign = match[1] === "-" ? "-" : "";
  const mantissa = match[2];
  const exponent = parseInt(match[3], 10);

  const [intPart, decPart = ""] = mantissa.split(".");
  const digits = intPart + decPart;
  const decimalPos = intPart.length + exponent;

  let result;
  if (decimalPos <= 0) {
    result = "0." + "0".repeat(Math.abs(decimalPos)) + digits;
  } else if (decimalPos >= digits.length) {
    result = digits + "0".repeat(decimalPos - digits.length);
  } else {
    result = digits.slice(0, decimalPos) + "." + digits.slice(decimalPos);
  }

  return sign + result;
}

function decimalToScientific(str) {
  let sign = "";
  if (str.startsWith("-")) { sign = "-"; str = str.slice(1); }
  else if (str.startsWith("+")) { str = str.slice(1); }

  let [intPart, fracPart = ""] = str.split(".");
  intPart = intPart.replace(/^0+(?=\d)/, "");

  let digits, exponent;

  if (intPart !== "" && intPart !== "0") {
    digits = intPart + fracPart;
    exponent = intPart.length - 1;
  } else {
    const firstNonZero = fracPart.search(/[1-9]/);
    if (firstNonZero === -1) return "0e+0";
    digits = fracPart.slice(firstNonZero);
    exponent = -(firstNonZero + 1);
  }

  digits = digits.replace(/0+$/, "") || "0";
  const mantissa = digits[0] + (digits.length > 1 ? "." + digits.slice(1) : "");
  const expSign = exponent < 0 ? "-" : "+";

  return sign + mantissa + "e" + expSign + Math.abs(exponent);
}

/* ---------- UI wiring ---------- */

function showError(msg) {
  const el = document.getElementById("errorMsg");
  el.textContent = msg;
  el.style.display = "block";
}

function hideError() {
  document.getElementById("errorMsg").style.display = "none";
}

function convert() {
  const raw = document.getElementById("inputValue").value.trim();

  if (!raw) {
    showError("Enter a value to convert.");
    return;
  }

  let decimal, scientific;

  if (raw.toLowerCase().includes("e")) {
    decimal = scientificToDecimal(raw);
    if (decimal === null) {
      showError("That doesn't look like valid scientific notation — try something like 1.2e5 or -4.2e-3.");
      return;
    }
    scientific = decimalToScientific(decimal); // normalize casing/formatting on round-trip
  } else {
    const cleaned = raw.replace(/,/g, "");
    if (!/^[+-]?\d+(\.\d+)?$/.test(cleaned)) {
      showError("Enter a valid number, e.g. 120000, -0.00042, or 1.2e5.");
      return;
    }
    decimal = cleaned.startsWith("+") ? cleaned.slice(1) : cleaned;
    scientific = decimalToScientific(decimal);
  }

  hideError();
  document.getElementById("decimalResult").value = formatDecimalDisplay(decimal);
  document.getElementById("scientificResult").value = scientific;
}

async function pasteValue() {
  try {
    const text = await navigator.clipboard.readText();
    if (!text) return;
    document.getElementById("inputValue").value = text.trim();
  } catch (err) {
    showError("Clipboard access blocked — paste manually with Ctrl+V instead.");
  }
}

function flashButton(btn) {
  const original = btn.textContent;
  btn.textContent = "Copied!";
  btn.disabled = true;

  setTimeout(() => {
    btn.textContent = original;
    btn.disabled = false;
  }, 1000);
}

function copyDecimal() {
  const value = document.getElementById("decimalResult").value;
  if (!value) return;
  navigator.clipboard.writeText(value);
  flashButton(document.getElementById("copyDecimalBtn"));
}

function copyScientific() {
  const value = document.getElementById("scientificResult").value;
  if (!value) return;
  navigator.clipboard.writeText(value);
  flashButton(document.getElementById("copyScientificBtn"));
}

function resetApp() {
  document.getElementById("inputValue").value = "";
  document.getElementById("decimalResult").value = "";
  document.getElementById("scientificResult").value = "";
  hideError();
}

document.getElementById("inputValue").addEventListener("keydown", (e) => {
  if (e.key === "Enter") convert();
});
</script>
