<title>Surface Gravity and Escape Velocity Calculator · Rameshverse MK·02</title>

<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #04050a;
    --panel: #0a0e1c;
    --panel-2: #0d1326;
    --line: rgba(94,200,255,0.18);
    --line-soft: rgba(94,200,255,0.09);
    --electron: #5ec8ff;
    --electron-dim: rgba(94,200,255,0.14);
    --proton: #ff5d5d;
    --proton-dim: rgba(255,93,93,0.14);
    --photon: #ffcf5c;
    --photon-dim: rgba(255,207,92,0.14);
    --text: #ecf1fb;
    --text-dim: #7d879e;
    --sans: 'Sora', system-ui, -apple-system, sans-serif;
    --mono: 'Space Mono', 'SFMono-Regular', Menlo, monospace;
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 34px 16px;
    background:
      repeating-radial-gradient(circle at 50% -6%, rgba(94,200,255,0.07) 0, rgba(94,200,255,0.07) 1px, transparent 1px, transparent 42px),
      radial-gradient(ellipse 800px 550px at 50% -8%, rgba(94,200,255,0.12), transparent 62%),
      var(--bg);
    font-family: var(--sans);
    color: var(--text);
    overflow-x: hidden;
  }

  .app { width: 100%; display: flex; justify-content: center; }

  /* ---------- Header / gravity mark (Rameshverse Systems identity) ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 20px;
  }

  .grav-mark {
    position: relative;
    width: 46px;
    height: 46px;
    perspective: 320px;
    flex-shrink: 0;
  }

  /* gravity field ticks pointing toward the planet */
  .field-line { position: absolute; inset: 0; }
  .field-line::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    width: 1px; height: 6px;
    margin-left: -0.5px;
    background: linear-gradient(to bottom, rgba(94,200,255,0.55), transparent);
  }
  .fl-1 { transform: rotate(0deg); }
  .fl-2 { transform: rotate(90deg); }
  .fl-3 { transform: rotate(180deg); }
  .fl-4 { transform: rotate(270deg); }

  /* dashed orbit path */
  .orbit-path {
    position: absolute;
    inset: 6px;
    border: 1px dashed rgba(94,200,255,0.32);
    border-radius: 50%;
    transform: rotateX(70deg);
  }

  /* rotating arm carrying the moon around the orbit */
  .moon-arm {
    position: absolute;
    inset: 6px;
    animation: spinMoon 4.6s linear infinite;
  }

  @keyframes spinMoon {
    from { transform: rotateX(70deg) rotateZ(0deg); }
    to   { transform: rotateX(70deg) rotateZ(360deg); }
  }

  .moon-arm::before {
    /* trailing streak, suggests escape velocity */
    content: '';
    position: absolute;
    top: -7px; left: 50%;
    width: 2px; height: 7px;
    margin-left: -1px;
    background: linear-gradient(to top, var(--photon), transparent);
    opacity: 0.65;
    border-radius: 2px;
  }

  .moon-arm::after {
    content: '';
    position: absolute;
    top: -2px; left: 50%;
    width: 4px; height: 4px;
    margin-left: -2px;
    background: var(--photon);
    border-radius: 50%;
    box-shadow: 0 0 7px 2px var(--photon);
  }

  /* planet core */
  .planet {
    position: absolute;
    top: 50%; left: 50%;
    width: 19px; height: 19px;
    margin: -9.5px 0 0 -9.5px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #b9e7ff 0%, #5ec8ff 38%, #1c4f73 76%, #071824 100%);
    box-shadow: 0 0 12px 3px rgba(94,200,255,0.4), inset -3px -3px 6px rgba(0,0,0,0.45);
    z-index: 2;
    animation: planetPulse 3.4s ease-in-out infinite;
  }

  @keyframes planetPulse {
    0%, 100% { box-shadow: 0 0 12px 3px rgba(94,200,255,0.32), inset -5px -5px 8px rgba(0,0,0,0.45); }
    50%      { box-shadow: 0 0 20px 6px rgba(94,200,255,0.55), inset -5px -5px 8px rgba(0,0,0,0.45); }
  }

  @media (prefers-reduced-motion: reduce) {
    .moon-arm, .card::before, .planet { animation: none !important; }
  }

  h1 {
    font-family: var(--sans);
    font-weight: 800;
    font-size: 1.28rem;
    line-height: 1.35;
    letter-spacing: 0.01em;
    margin: 0;
    text-align: left;
    max-width: 300px;
  }

  /* ---------- Card ---------- */
  .card {
    position: relative;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    padding: 26px 22px 22px;
    width: 480px;
    max-width: 100%;
    border-radius: 18px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.6), 0 0 0 1px rgba(94,200,255,0.03) inset;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: -40%;
    width: 40%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--electron), transparent);
    animation: scan 5s linear infinite;
    opacity: 0.8;
  }

  @keyframes scan {
    0% { left: -40%; }
    100% { left: 100%; }
  }

  .corner-tl, .corner-tr, .corner-bl, .corner-br {
    position: absolute;
    width: 14px; height: 14px;
    border-color: var(--electron);
    opacity: 0.55;
    pointer-events: none;
  }
  .corner-tl { top: 12px; left: 12px; border-top: 2px solid var(--electron); border-left: 2px solid var(--electron); }
  .corner-tr { top: 12px; right: 12px; border-top: 2px solid var(--electron); border-right: 2px solid var(--electron); }
  .corner-bl { bottom: 12px; left: 12px; border-bottom: 2px solid var(--electron); border-left: 2px solid var(--electron); }
  .corner-br { bottom: 12px; right: 12px; border-bottom: 2px solid var(--electron); border-right: 2px solid var(--electron); }

  /* ---------- Fields ---------- */
  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 7px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field input, .paste-btn { width: 100%; box-sizing: border-box; }

  .field input {
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid var(--line-soft);
    font-size: 1.02rem;
    font-family: var(--mono);
    background: #060913;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  .field input:focus {
    outline: none;
    border-color: var(--electron);
    box-shadow: 0 0 0 3px var(--electron-dim);
  }

  .field input::placeholder { color: #4b5568; }

  /* ---------- Buttons: shared sci-fi module style ---------- */
  button { min-height: 44px; -webkit-appearance: none; appearance: none; cursor: pointer; }
  input { -webkit-appearance: none; appearance: none; }

  .paste-btn,
  .history-toggle,
  .clear-history-btn {
    border: 1px solid rgba(94,200,255,0.3);
    background: linear-gradient(180deg, rgba(94,200,255,0.06), rgba(94,200,255,0.015));
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-radius: 10px;
    padding: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    transition: transform 0.12s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }

  .paste-btn::before,
  .history-toggle::before {
    content: '\25C6';
    font-size: 0.5rem;
    color: var(--electron);
    opacity: 0.8;
  }

  .paste-btn:hover, .history-toggle:hover {
    color: var(--electron);
    border-color: var(--electron);
    background: linear-gradient(180deg, rgba(94,200,255,0.14), rgba(94,200,255,0.04));
    box-shadow: 0 0 16px rgba(94,200,255,0.3);
  }

  .paste-btn:active, .history-toggle:active, .clear-history-btn:active { transform: scale(0.96); }

  .clear-history-btn {
    border-color: rgba(255,93,93,0.35);
    color: var(--proton);
    background: linear-gradient(180deg, rgba(255,93,93,0.1), rgba(255,93,93,0.02));
    padding: 8px 12px;
    font-size: 0.74rem;
  }

  .clear-history-btn:hover {
    border-color: var(--proton);
    box-shadow: 0 0 14px rgba(255,93,93,0.3);
  }

  .history-toggle { width: 100%; margin-top: 14px; }

  /* ---------- Calculate button: immersive primary action ---------- */
  .calculate-wrap {
    position: relative;
    padding: 3px;
    border-radius: 13px;
    background: linear-gradient(135deg, var(--electron), var(--proton), var(--photon));
    background-size: 220% 220%;
    animation: borderflow 6s ease infinite;
    margin: 4px 0 10px;
    box-shadow: 0 12px 30px rgba(255,93,93,0.22), 0 0 40px rgba(94,200,255,0.1);
  }

  @keyframes borderflow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .calculate-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 100%;
    font-size: 1.02rem;
    padding: 16px;
    margin: 0;
    background: linear-gradient(180deg, #0d1326, #0a0e1c);
    color: var(--text);
    font-weight: 700;
    font-family: var(--sans);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border: none;
    border-radius: 10px;
    overflow: hidden;
  }

  .calculate-btn .btn-icon {
    color: var(--photon);
    text-shadow: 0 0 10px rgba(255,207,92,0.7);
    font-size: 1.05rem;
  }

  .calculate-btn::after {
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
    transform: skewX(-20deg);
    transition: left 0.5s ease;
  }

  .calculate-wrap:hover .calculate-btn::after { left: 130%; }
  .calculate-btn:active { transform: scale(0.98); }

  /* ---------- Reset button: secondary / danger accent ---------- */
  .reset-btn {
    width: 100%;
    padding: 13px;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    font-family: var(--mono);
    border-radius: 10px;
    border: 1px solid rgba(255,93,93,0.35);
    background: linear-gradient(180deg, rgba(255,93,93,0.1), rgba(255,93,93,0.02));
    color: var(--proton);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    transition: transform 0.12s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    margin-bottom: 6px;
  }

  .reset-btn:hover {
    border-color: var(--proton);
    box-shadow: 0 0 18px rgba(255,93,93,0.3);
  }

  .reset-btn:active { transform: scale(0.97); }

  /* ---------- Result panels ---------- */
  .result-box {
    margin-top: 18px;
    padding: 16px;
    border-radius: 12px;
    background: #060913;
    display: none;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  #resultBox { border: 1px solid rgba(94,200,255,0.35); box-shadow: 0 0 0 1px rgba(94,200,255,0.05) inset; }
  #escapeBox { border: 1px solid rgba(255,207,92,0.35); box-shadow: 0 0 0 1px rgba(255,207,92,0.05) inset; }

  .result-text {
    font-family: var(--mono);
    font-size: 0.98rem;
    line-height: 1.7;
    max-height: 130px;
    overflow-y: auto;
    overflow-x: hidden;
    word-break: break-all;
    flex: 1;
  }

  .result-text::-webkit-scrollbar { width: 6px; }
  .result-text::-webkit-scrollbar-track { background: transparent; }
  .result-text::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
  .result-text { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

  .result-text strong {
    display: block;
    font-family: var(--mono);
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 400;
    margin-bottom: 4px;
  }

  #resultText { color: var(--electron); text-shadow: 0 0 12px rgba(94,200,255,0.3); }
  #escapeText { color: var(--photon); text-shadow: 0 0 12px rgba(255,207,92,0.3); }

  .copy-btn {
    flex-shrink: 0;
    padding: 9px 11px;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-family: var(--mono);
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(94,200,255,0.06);
    color: var(--electron);
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    transition: transform 0.12s ease, box-shadow 0.15s ease;
  }

  .copy-btn:hover { box-shadow: 0 0 14px rgba(94,200,255,0.3); }
  .copy-btn:active { transform: scale(0.94); }

  /* ---------- Decimal precision toggle ---------- */
  .dec-toggle {
    margin-top: 16px;
    display: flex;
    gap: 8px;
  }

  .dec-toggle button {
    flex: 1;
    padding: 10px;
    font-family: var(--mono);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-radius: 9px;
    border: 1px solid rgba(94,200,255,0.3);
    background: linear-gradient(180deg, rgba(94,200,255,0.07), rgba(94,200,255,0.02));
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
    transition: transform 0.12s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }

  .dec-toggle button::before {
    content: '\25C6';
    font-size: 0.48rem;
    color: var(--electron);
    opacity: 0.75;
  }

  .dec-toggle button:hover {
    border-color: var(--electron);
    color: var(--electron);
    box-shadow: 0 0 12px rgba(94,200,255,0.28);
  }

  .dec-toggle button.active {
    border-color: var(--photon);
    color: var(--photon);
    background: linear-gradient(180deg, rgba(255,207,92,0.14), rgba(255,207,92,0.03));
    box-shadow: 0 0 14px rgba(255,207,92,0.3), 0 0 10px rgba(255,207,92,0.2) inset;
  }

  .dec-toggle button.active::before { color: var(--photon); }
  .dec-toggle button:active { transform: scale(0.96); }

  /* ---------- History panel ---------- */
  .history-panel {
    margin-top: 12px;
    border: 1px dashed var(--line-soft);
    border-radius: 12px;
    padding: 14px;
    background: #060913;
  }

  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .history-header strong {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 400;
  }

  #historyList { list-style: none; padding: 0; margin: 0; max-height: 160px; overflow-y: auto; }

  #historyList::-webkit-scrollbar { width: 6px; }
  #historyList::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }

  #historyList li {
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--text-dim);
    padding: 6px 0;
    border-bottom: 1px solid rgba(94,200,255,0.06);
  }

  #historyList li:last-child { border-bottom: none; }

  /* ---------- Footer formula note ---------- */
  .note {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px dashed var(--line-soft);
    font-family: var(--mono);
    font-size: 0.72rem;
    line-height: 1.7;
    text-align: center;
    color: var(--text-dim);
  }

  @media (max-width: 480px) {
    .card { padding: 22px 16px 18px; }
    h1 { font-size: 1.25rem; }
    .field input { font-size: 1rem; padding: 13px; }
    .calculate-btn { padding: 16px; font-size: 1rem; }
    .reset-btn { padding: 14px; }
    .result-box { flex-direction: column; align-items: stretch; gap: 10px; }
    .copy-btn { width: 100%; }
    .history-header { flex-direction: column; gap: 8px; align-items: flex-start; }
    .clear-history-btn { width: 100%; }
  }
</style>

<div class="app">
  <div>
    <div class="header">
      <div class="grav-mark">
        <div class="field-line fl-1"></div>
        <div class="field-line fl-2"></div>
        <div class="field-line fl-3"></div>
        <div class="field-line fl-4"></div>
        <div class="orbit-path"></div>
        <div class="moon-arm"></div>
        <div class="planet"></div>
      </div>

      <h1>Surface Gravity and Escape Velocity Calculator</h1>
    </div>

    <div class="card">
      <div class="corner-tl"></div>
      <div class="corner-tr"></div>
      <div class="corner-bl"></div>
      <div class="corner-br"></div>

      <!-- Mass -->
      <div class="field">
        <label>Mass (kg)</label>
        <div class="input-group">
          <input
            id="mass"
            type="text"
            inputmode="decimal"
            placeholder="e.g. 5.9722e24 or 5,972,200,..."
            onblur="prettyFormat(this)">
          <button class="paste-btn" onclick="pasteValue('mass')">Paste mass</button>
        </div>
      </div>

      <!-- Radius -->
      <div class="field">
        <label>Radius (m)</label>
        <div class="input-group">
          <input
            id="radius"
            type="text"
            inputmode="decimal"
            placeholder="e.g. 6.371e6 or 6,371,..."
            onblur="prettyFormat(this)">
          <button class="paste-btn" onclick="pasteValue('radius')">Paste radius</button>
        </div>
      </div>

      <div class="calculate-wrap">
        <button class="calculate-btn" onclick="calculateAll()">
          <span class="btn-icon">☉</span> Calculate g &amp; V<sub>esc</sub>
        </button>
      </div>

      <button class="reset-btn" onclick="resetCalculator()">↺ Reset</button>

      <!-- Surface Gravity Result -->
      <div class="result-box" id="resultBox">
        <div class="result-text" id="resultText"></div>
        <button class="copy-btn" onclick="copyResult()">⧉ Copy</button>
      </div>

      <!-- Escape Velocity Result -->
      <div class="result-box" id="escapeBox" style="display:none;">
        <div class="result-text" id="escapeText"></div>
        <button class="copy-btn" onclick="copyEscape()">⧉ Copy</button>
      </div>

      <div class="dec-toggle">
        <button data-mode="raw" onclick="setMode('raw')">Raw</button>
        <button data-mode="5" onclick="setMode(5)">5 dec</button>
        <button data-mode="3" onclick="setMode(3)">3 dec</button>
      </div>

      <!-- History Toggle -->
      <button class="history-toggle" onclick="toggleHistory()">Show History (Last five)</button>

      <!-- History Panel -->
      <div class="history-panel" id="historyPanel" style="display:none;">
        <div class="history-header">
          <strong>Last 5 Calculations</strong>
          <button class="clear-history-btn" onclick="clearHistory()">Clear</button>
        </div>
        <ul id="historyList"></ul>
      </div>

      <div class="note">
        g = GM / R²<br>
        v<sub>e</sub> = √(2GM / R) = √(2gR)<br>
        Earth: g ≈ 9.81 m/s², v<sub>e</sub> ≈ 11.186 km/s
      </div>
    </div>
  </div>
</div>

<script>
  const G = 6.674e-11;
  const EARTH_G = 9.80665;
  let lastResult = "";
  let lastEscape = "";

  let history = [];
  let historyOpen = false;

  let rawG = null;
  let rawEarthG = null;
  let currentMode = 5; // "raw" | 5 | 3

  let rawEscapeV = null;
  let rawEscapeEarth = null;

  const EARTH_ESCAPE = 11186; // m/s

  function parseFlexibleNumber(value) {
    if (!value) return NaN;
    return Number(value.replace(/,/g, ""));
  }

  // Tidy floating-point noise before display (e.g. 9.80999999999998 -> 9.81)
  function cleanFloat(num) {
    if (!isFinite(num)) return num;
    return Number(num.toPrecision(15));
  }

  function toDecimal(num, decimals = null) {
    if (decimals === null) {
      return num.toLocaleString("en-US", {
        useGrouping: true,
        maximumFractionDigits: 20
      });
    }

    return num.toLocaleString("en-US", {
      useGrouping: true,
      minimumFractionDigits: decimals,
      maximumFractionDigits: decimals
    });
  }

  // Formats the field with thousands separators once the user leaves it,
  // instead of reformatting on every keystroke (which used to jump the
  // cursor to the end while editing digits in the middle of a number).
  function prettyFormat(input) {
    let value = input.value.trim();

    if (value === "" || /e/i.test(value)) return; // leave scientific notation untouched

    value = value.replace(/,/g, "");
    if (isNaN(value)) return;

    input.value = Number(value).toLocaleString("en-US", { maximumFractionDigits: 20 });
  }

  function calculateAll() {
    const mass = parseFlexibleNumber(document.getElementById("mass").value);
    const radius = parseFlexibleNumber(document.getElementById("radius").value);

    if (!isFinite(mass) || !isFinite(radius) || mass <= 0 || radius <= 0) {
      alert("Please enter valid mass and radius values.");
      return;
    }

    // Surface gravity
    rawG = cleanFloat((G * mass) / (radius * radius));
    rawEarthG = cleanFloat(rawG / EARTH_G);

    // Escape velocity
    rawEscapeV = cleanFloat(Math.sqrt(2 * rawG * radius));
    rawEscapeEarth = cleanFloat(rawEscapeV / EARTH_ESCAPE);

    renderResult();
    renderEscape();

    document.getElementById("resultBox").style.display = "flex";
    document.getElementById("escapeBox").style.display = "flex";

    addToHistory(rawG, rawEarthG);
  }

  function renderResult() {
    if (rawG === null) return;

    const gText = currentMode === "raw" ? toDecimal(rawG) : toDecimal(rawG, currentMode);
    const earthText = currentMode === "raw" ? toDecimal(rawEarthG) : toDecimal(rawEarthG, currentMode);

    lastResult = `${gText} m/s² (${earthText} g)`;

    document.getElementById("resultText").innerHTML = `
      <strong>Surface Gravity</strong>
      ${gText} m/s²<br>
      ${earthText} g (Earth)
    `;
  }

  function renderEscape() {
    if (rawEscapeV === null) return;

    const vText = currentMode === "raw" ? toDecimal(rawEscapeV) : toDecimal(rawEscapeV, currentMode);
    const earthText = currentMode === "raw" ? toDecimal(rawEscapeEarth) : toDecimal(rawEscapeEarth, currentMode);

    lastEscape = `${vText} m/s (${earthText} x Earth's escape velocity)`;

    document.getElementById("escapeText").innerHTML = `
      <strong>Escape Velocity</strong>
      ${vText} m/s<br>
      ${earthText} x Earth's escape velocity
    `;
  }

  function copyEscape() {
    if (!lastEscape) return;
    navigator.clipboard.writeText(lastEscape);
  }

  async function pasteValue(id) {
    try {
      const text = await navigator.clipboard.readText();
      const input = document.getElementById(id);
      const num = parseFlexibleNumber(text);

      if (!isFinite(num)) {
        alert("Invalid number in clipboard.");
        return;
      }

      if (Math.abs(num) >= 1e15) {
        input.value = num.toExponential(5);
      } else {
        input.value = num.toLocaleString("en-US");
      }
    } catch {
      alert("Clipboard access not allowed.");
    }
  }

  function copyResult() {
    if (!lastResult) return;
    navigator.clipboard.writeText(lastResult);
  }

  function addToHistory(g, earthG) {
    const gText = currentMode === "raw" ? toDecimal(g) : toDecimal(g, currentMode);
    const earthText = currentMode === "raw" ? toDecimal(earthG) : toDecimal(earthG, currentMode);

    history.unshift(`${gText} m/s² (${earthText} g)`);

    if (history.length > 5) history.pop();
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById("historyList");
    list.innerHTML = "";

    history.forEach(item => {
      const li = document.createElement("li");
      li.textContent = item;
      list.appendChild(li);
    });
  }

  function toggleHistory() {
    historyOpen = !historyOpen;

    const panel = document.getElementById("historyPanel");
    const btn = document.querySelector(".history-toggle");

    panel.style.display = historyOpen ? "block" : "none";
    btn.textContent = historyOpen ? "Hide History" : "Show History (Last five)";
  }

  function clearHistory() {
    history = [];
    renderHistory();

    historyOpen = false;
    document.getElementById("historyPanel").style.display = "none";
    document.querySelector(".history-toggle").textContent = "Show History (Last five)";
  }

  function resetCalculator() {
    document.getElementById("mass").value = "";
    document.getElementById("radius").value = "";

    document.getElementById("resultBox").style.display = "none";
    document.getElementById("escapeBox").style.display = "none";

    lastResult = "";
    lastEscape = "";

    rawG = null;
    rawEarthG = null;
    rawEscapeV = null;
    rawEscapeEarth = null;

    historyOpen = false;
    document.getElementById("historyPanel").style.display = "none";
    document.querySelector(".history-toggle").textContent = "Show History (Last five)";
  }

  function setMode(mode) {
    currentMode = mode;

    document.querySelectorAll(".dec-toggle button").forEach(b => b.classList.remove("active"));
    document.querySelector(`.dec-toggle button[data-mode="${mode}"]`).classList.add("active");

    if (rawG !== null) renderResult();
    if (rawEscapeV !== null) renderEscape();
  }

  setMode(5);
</script>

<script src="/libraries/config.js"></script>
<script src="/libraries/view-counter.js"></script>
