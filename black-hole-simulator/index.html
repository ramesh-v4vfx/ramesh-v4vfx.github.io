<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

// ---------------- PHYSICAL CONSTANTS ----------------
const G = 6.674e-11;        // m^3 kg^-1 s^-2
const C = 2.998e8;          // m/s
const MSUN = 1.989e30;      // kg
const KB = 1.381e-23;       // J/K
const HBAR = 1.0546e-34;    // J s
const RS_PER_MSUN_KM = (2*G*MSUN/(C*C))/1000; // ~2.9536 km per solar mass

// ---------------- PHYSICS ----------------
function computeStats(massSolar, spin){
  const rsKm = massSolar * RS_PER_MSUN_KM;
  const rgKm = rsKm/2; // gravitational radius GM/c^2 in km
  const photonSphereKm = 1.5 * rsKm; // Schwarzschild approximation

  // ISCO via Bardeen-Press-Teukolsky (prograde, equatorial)
  const a = spin;
  const Z1 = 1 + Math.cbrt(1-a*a) * (Math.cbrt(1+a) + Math.cbrt(1-a));
  const Z2 = Math.sqrt(3*a*a + Z1*Z1);
  const riscoOverM = 3 + Z2 - Math.sqrt((3-Z1)*(3+Z1+2*Z2));
  const iscoKm = riscoOverM * rgKm;

  const massKg = massSolar * MSUN;
  const hawkingT = (HBAR*Math.pow(C,3)) / (8*Math.PI*G*massKg*KB); // Kelvin

  let tidalNote;
  if(massSolar < 1000) tidalNote = "Stellar-mass regime: tidal forces at the horizon are lethal — any infalling object is stretched into spaghetti well before crossing it.";
  else if(massSolar < 1e6) tidalNote = "Intermediate-mass regime: tidal shredding still occurs, but closer to (or just past) the horizon than for a stellar-mass hole.";
  else tidalNote = "Supermassive regime: tidal forces at the horizon are gentle — an object could cross the event horizon intact, with spaghettification only happening much deeper inside.";

  return {massSolar, spin, rsKm, photonSphereKm, iscoKm, hawkingT, tidalNote};
}

function fmtKm(km){
  if(km >= 1e9) return (km/1e9).toFixed(2)+' billion km';
  if(km >= 1e6) return (km/1e6).toFixed(2)+' million km';
  if(km >= 1) return km.toFixed(km>=100?0:2)+' km';
  return (km*1000).toFixed(1)+' m';
}
const SOLAR_RADIUS_KM = 695700;
function fmtRsun(km){
  const r = km / SOLAR_RADIUS_KM;
  if(r >= 1e6) return (r/1e6).toFixed(2)+'M R☉';
  if(r >= 1e3) return (r/1e3).toFixed(2)+'K R☉';
  if(r >= 0.001) return r.toFixed(4)+' R☉';
  return r.toExponential(2)+' R☉';
}
let radiusUnit = 'km'; // 'km' | 'rsun'
function fmtRadius(km){
  return radiusUnit === 'km' ? fmtKm(km) : fmtRsun(km);
}
function fmtMass(massSolar){
  if(massSolar >= 1e9) return (massSolar/1e9).toFixed(2)+'B M☉';
  if(massSolar >= 1e6) return (massSolar/1e6).toFixed(2)+'M M☉';
  if(massSolar >= 1e3) return (massSolar/1e3).toFixed(2)+'K M☉';
  return massSolar.toFixed(massSolar<10?1:0)+' M☉';
}

function renderStats(r){
  const body = document.getElementById('results-body');
  body.innerHTML = `
    <div id="unit-toggle-row">
      <button class="chip unit-chip ${radiusUnit==='km'?'active':''}" data-unit="km">KM</button>
      <button class="chip unit-chip ${radiusUnit==='rsun'?'active':''}" data-unit="rsun">R☉ SOLAR RADII</button>
    </div>
    <div class="stat-row" data-copy="${fmtMass(r.massSolar)}"><div class="k">MASS<span class="u">solar masses</span></div><div class="v">${fmtMass(r.massSolar)}</div></div>
    <div class="stat-row" data-copy="${fmtRadius(r.rsKm)}"><div class="k">SCHWARZSCHILD RADIUS<span class="u">event horizon</span></div><div class="v">${fmtRadius(r.rsKm)}</div></div>
    <div class="stat-row" data-copy="${fmtRadius(r.photonSphereKm)}"><div class="k">PHOTON SPHERE<span class="u">≈1.5× horizon</span></div><div class="v">${fmtRadius(r.photonSphereKm)}</div></div>
    <div class="stat-row" data-copy="${fmtRadius(r.iscoKm)}"><div class="k">ISCO<span class="u">spin a=${r.spin.toFixed(3)}</span></div><div class="v">${fmtRadius(r.iscoKm)}</div></div>
    <div class="stat-row" data-copy="${r.hawkingT.toExponential(2)} K"><div class="k">HAWKING TEMP<span class="u">kelvin</span></div><div class="v">${r.hawkingT.toExponential(2)}</div></div>
    <div class="stat-row" data-copy="c (speed of light)"><div class="k">ESCAPE VELOCITY<span class="u">speed of light</span></div><div class="v">c</div></div>
    <div id="blurb"><b>Tidal outlook:</b> ${r.tidalNote}</div>
    <div id="disclaimer">VISUAL APPROXIMATION. The lensing effect is a stylized screen-space shader, not a full geodesic ray-tracer. ISCO uses the Bardeen–Press–Teukolsky prograde formula; the photon sphere is the non-spinning (Schwarzschild) value.</div>
  `;
  body.querySelectorAll('.unit-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      radiusUnit = chip.dataset.unit;
      renderStats(stats);
    });
  });
}

// click-to-copy any stat value (event delegation survives re-renders)
document.getElementById('results-body').addEventListener('click', e=>{
  const rowEl = e.target.closest('.stat-row');
  if(!rowEl) return;
  const text = rowEl.dataset.copy;
  if(!text) return;
  const kEl = rowEl.querySelector('.k');
  const original = kEl.innerHTML;
  const finish = ()=>{
    kEl.innerHTML = 'COPIED ✓';
    rowEl.classList.add('copied');
    setTimeout(()=>{ kEl.innerHTML = original; rowEl.classList.remove('copied'); }, 900);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(finish).catch(finish);
  } else {
    finish();
  }
});

// ---------------- SLIDER WIRING ----------------
const massSlider = document.getElementById('mass');
const massVal = document.getElementById('mass-val');
const massInput = document.getElementById('mass-input');
const massInputGo = document.getElementById('mass-input-go');
const spinSlider = document.getElementById('spin');
const spinVal = document.getElementById('spin-val');
const lensSlider = document.getElementById('lens');
const lensVal = document.getElementById('lens-val');

function currentMassSolar(){ return Math.pow(10, parseFloat(massSlider.value)); }
function currentSpin(){ return parseFloat(spinSlider.value); }
function currentLensStrength(){ return parseFloat(lensSlider.value); }

function massInputDisplay(massSolar){
  if(massSolar >= 1e7) return massSolar.toExponential(3);
  return massSolar.toLocaleString('en-US',{maximumFractionDigits:2});
}

let stats = computeStats(currentMassSolar(), currentSpin());

function refresh(){
  stats = computeStats(currentMassSolar(), currentSpin());
  massVal.textContent = fmtMass(stats.massSolar);
  spinVal.textContent = currentSpin().toFixed(3);
  lensVal.textContent = currentLensStrength().toFixed(2);
  if(document.activeElement !== massInput) massInput.value = massInputDisplay(stats.massSolar);
  renderStats(stats);
  updateBHVisualRadius();
}

massSlider.addEventListener('input', ()=>{
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  refresh();
});
spinSlider.addEventListener('input', refresh);
lensSlider.addEventListener('input', ()=>{ lensVal.textContent = currentLensStrength().toFixed(2); });

function applyMassInput(){
  const v = parseFloat(massInput.value.replace(/,/g,''));
  if(!isFinite(v) || v<=0){ massInput.value = massInputDisplay(currentMassSolar()); return; }
  const clamped = Math.max(1, Math.min(1e11, v));
  massSlider.value = Math.log10(clamped);
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  refresh();
}
massInput.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ applyMassInput(); massInput.blur(); }
});
massInput.addEventListener('blur', applyMassInput);
massInputGo.addEventListener('click', ()=>{ applyMassInput(); massInput.blur(); });

document.querySelectorAll('.chip[data-mass]').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    massSlider.value = chip.dataset.mass;
    refresh();
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
  });
});

let diskOn = true, ringOn = true;
document.getElementById('btn-disk').addEventListener('click', function(){
  diskOn = !diskOn;
  this.classList.toggle('on', diskOn);
  this.textContent = 'ACCRETION DISK: ' + (diskOn?'ON':'OFF');
  diskGroup.visible = diskOn;
});
document.getElementById('btn-ring').addEventListener('click', function(){
  ringOn = !ringOn;
  this.classList.toggle('on', ringOn);
  this.textContent = 'PHOTON SPHERE REF: ' + (ringOn?'ON':'OFF');
  photonRing.visible = ringOn;
});

// ---------------- THREE.JS SCENE ----------------
const wrap = document.getElementById('canvaswrap');
const canvas = document.getElementById('bh-canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 3000);

// starfield
function makeStars(){
  const geo = new THREE.BufferGeometry();
  const count = 4000;
  const pos = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r = 300 + Math.random()*900;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos((Math.random()*2)-1);
    pos[i*3] = r*Math.sin(phi)*Math.cos(theta);
    pos[i*3+1] = r*Math.sin(phi)*Math.sin(theta);
    pos[i*3+2] = r*Math.cos(phi);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({color:0xffffff, size:1.3, sizeAttenuation:true, opacity:0.85, transparent:true});
  scene.add(new THREE.Points(geo, mat));
}
makeStars();

// event horizon sphere (pure black occluder)
let bhRadius = 4.5;
const bhGeo = new THREE.SphereGeometry(bhRadius, 48, 48);
const bhMat = new THREE.MeshBasicMaterial({color:0x000000});
const bhMesh = new THREE.Mesh(bhGeo, bhMat);
scene.add(bhMesh);

function visualRadiusForMass(logMassSolar){
  // logMassSolar is log10(solar masses), i.e. the mass slider's own value (0..11).
  // Linear mapping across the full slider range so distinct masses stay visually
  // distinct all the way up to the most extreme supermassive presets.
  return 2.6 + logMassSolar * 0.85;
}
function updateBHVisualRadius(){
  const newR = visualRadiusForMass(parseFloat(massSlider.value));
  if(Math.abs(newR-bhRadius) < 0.001) return;
  bhRadius = newR;
  bhMesh.geometry.dispose();
  bhMesh.geometry = new THREE.SphereGeometry(bhRadius, 48, 48);
  rebuildDiskAndRing();
  // auto-frame the camera outward if the disk has grown past the current view
  const diskOuter = bhRadius * 5.8;
  const comfortableDist = diskOuter * 1.7;
  if(targetRadius < comfortableDist) targetRadius = comfortableDist;
}

// accretion disk: stacked additive-blended color bands, tilted, spinning
const diskGroup = new THREE.Group();
diskGroup.rotation.x = Math.PI/2 - 0.34;
scene.add(diskGroup);

function tempToColor(t){ // t: 1=hottest(inner) .. 0=coolest(outer)
  const stops = [
    {t:1.0, c:new THREE.Color(0xdff0ff)},
    {t:0.66,c:new THREE.Color(0xfff2c8)},
    {t:0.33,c:new THREE.Color(0xff9a3c)},
    {t:0.0, c:new THREE.Color(0xb5301c)},
  ];
  for(let i=0;i<stops.length-1;i++){
    const a=stops[i], b=stops[i+1];
    if(t<=a.t && t>=b.t){
      const localT = (a.t-t)/(a.t-b.t);
      return a.c.clone().lerp(b.c, localT);
    }
  }
  return stops[stops.length-1].c.clone();
}

function buildDisk(){
  // dispose & remove any existing bands (avoid relying on Object3D.clear which
  // may not exist on older three.js builds)
  while(diskGroup.children.length){
    const child = diskGroup.children[diskGroup.children.length-1];
    diskGroup.remove(child);
    child.geometry.dispose();
    child.material.dispose();
  }
  const diskInner = bhRadius * 1.7;
  const diskOuter = bhRadius * 5.8;
  const bands = 40;
  for(let i=0;i<bands;i++){
    const t = i/(bands-1);
    const rInner = diskInner + (diskOuter-diskInner)*t;
    const rOuter = rInner + (diskOuter-diskInner)/bands*1.5;
    const temp = 1-t;
    const color = tempToColor(temp);
    const opacity = 0.55*(0.28+0.72*temp)+0.04;
    const geo = new THREE.RingGeometry(rInner, rOuter, 96, 1);
    const mat = new THREE.MeshBasicMaterial({
      color, transparent:true, opacity, side:THREE.DoubleSide,
      blending:THREE.AdditiveBlending, depthWrite:false
    });
    diskGroup.add(new THREE.Mesh(geo, mat));
  }
}

// photon sphere reference ring (dashed, flat, HUD-style)
let photonRing;
function buildPhotonRing(){
  const segments = 128;
  const pts = [];
  const r = bhRadius * 1.5;
  for(let s=0;s<=segments;s++){
    const a=(s/segments)*Math.PI*2;
    pts.push(new THREE.Vector3(Math.cos(a)*r, 0, Math.sin(a)*r));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineDashedMaterial({color:0xff2b2b, transparent:true, opacity:0.5, dashSize:1.4, gapSize:1.0});
  if(photonRing){ scene.remove(photonRing); photonRing.geometry.dispose(); }
  photonRing = new THREE.Line(geo, mat);
  photonRing.computeLineDistances();
  photonRing.visible = ringOn;
  scene.add(photonRing);
}

function rebuildDiskAndRing(){
  buildDisk();
  buildPhotonRing();
}
rebuildDiskAndRing();
diskGroup.visible = diskOn;

// ---------------- CAMERA CONTROLS (orbit + pan + zoom) ----------------
let camTheta = 0.7, camPhi = 1.15, camRadius = 55;
let targetTheta = camTheta, targetPhi = camPhi, targetRadius = camRadius;
let camFocus = new THREE.Vector3(0,0,0);

function updateCamera(){
  camTheta += (targetTheta-camTheta)*0.08;
  camPhi += (targetPhi-camPhi)*0.08;
  camRadius += (targetRadius-camRadius)*0.08;
  camPhi = Math.max(0.15, Math.min(Math.PI-0.15, camPhi));
  const x = camFocus.x + camRadius*Math.sin(camPhi)*Math.cos(camTheta);
  const y = camFocus.y + camRadius*Math.cos(camPhi);
  const z = camFocus.z + camRadius*Math.sin(camPhi)*Math.sin(camTheta);
  camera.position.set(x,y,z);
  camera.lookAt(camFocus);
}

canvas.addEventListener('contextmenu', e=>e.preventDefault());
let dragging=false, lastX=0, lastY=0, panning=false, panLastX=0, panLastY=0;
function panCamera(dx,dy){
  const panSpeed = camRadius*0.0016;
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0);
  const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1);
  camFocus.addScaledVector(right, -dx*panSpeed);
  camFocus.addScaledVector(up, dy*panSpeed);
}
canvas.addEventListener('pointerdown', e=>{
  if(e.button===2){ panning=true; panLastX=e.clientX; panLastY=e.clientY; }
  else { dragging=true; lastX=e.clientX; lastY=e.clientY; }
});
window.addEventListener('pointerup', ()=>{dragging=false; panning=false;});
window.addEventListener('pointermove', e=>{
  if(panning){
    const dx=e.clientX-panLastX, dy=e.clientY-panLastY;
    panLastX=e.clientX; panLastY=e.clientY;
    panCamera(dx,dy);
    return;
  }
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  targetTheta -= dx*0.005;
  targetPhi -= dy*0.005;
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  targetRadius *= (1+e.deltaY*0.001);
  targetRadius = Math.max(bhRadius*2.2, Math.min(260, targetRadius));
},{passive:false});

let pinchStart=null, touchPanX=null, touchPanY=null;
canvas.addEventListener('touchmove', e=>{
  if(e.touches.length===2){
    const t0=e.touches[0], t1=e.touches[1];
    const dx=t0.clientX-t1.clientX, dy=t0.clientY-t1.clientY;
    const d=Math.hypot(dx,dy);
    const midX=(t0.clientX+t1.clientX)/2, midY=(t0.clientY+t1.clientY)/2;
    if(pinchStart!=null){
      targetRadius *= (pinchStart/d);
      targetRadius = Math.max(bhRadius*2.2, Math.min(260, targetRadius));
    }
    if(touchPanX!=null) panCamera(midX-touchPanX, midY-touchPanY);
    pinchStart=d; touchPanX=midX; touchPanY=midY;
  }
},{passive:true});
canvas.addEventListener('touchend', e=>{
  if(e.touches.length<2){ pinchStart=null; touchPanX=null; touchPanY=null; }
});

document.getElementById('reset-btn').addEventListener('click', ()=>{
  massSlider.value = 1; spinSlider.value = 0; lensSlider.value = 1.2;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  refresh();
  if(!diskOn){ diskOn=true; const b=document.getElementById('btn-disk'); b.classList.add('on'); b.textContent='ACCRETION DISK: ON'; diskGroup.visible=true; }
  if(!ringOn){ ringOn=true; const b=document.getElementById('btn-ring'); b.classList.add('on'); b.textContent='PHOTON SPHERE REF: ON'; photonRing.visible=true; }
  targetTheta=0.7; targetPhi=1.15; targetRadius=55; camFocus.set(0,0,0);
});

// ---------------- LENSING POST-PROCESS (render-to-texture + screen-space warp) ----------------
let rt = new THREE.WebGLRenderTarget(2,2);
const quadScene = new THREE.Scene();
const quadCamera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const lensUniforms = {
  uTex: {value: rt.texture},
  uBH: {value: new THREE.Vector2(0.5,0.5)},
  uAspect: {value: 1.0},
  uRs: {value: 0.08},
  uStrength: {value: 1.2},
};
const lensMat = new THREE.ShaderMaterial({
  uniforms: lensUniforms,
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform sampler2D uTex;
    uniform vec2 uBH;
    uniform float uAspect;
    uniform float uRs;
    uniform float uStrength;
    varying vec2 vUv;
    void main(){
      vec2 uv = vUv;
      vec2 d = uv - uBH;
      d.x *= uAspect;
      float dist = length(d);
      if(dist < uRs){
        gl_FragColor = vec4(0.0,0.0,0.0,1.0);
        return;
      }
      vec2 dir = d / max(dist, 0.0001);
      float bend = uStrength * (uRs*uRs) / (dist*dist);
      bend = min(bend, 0.4);
      vec2 offset = vec2(dir.x/uAspect, dir.y) * bend;
      vec2 sampleUV = clamp(uv - offset, vec2(0.001), vec2(0.999));
      vec4 col = texture2D(uTex, sampleUV);
      float ring = smoothstep(uRs*2.3, uRs*1.4, dist) * (1.0-smoothstep(uRs*1.0, uRs*1.35, dist));
      col.rgb += ring * vec3(1.0,0.82,0.55) * 0.9;
      gl_FragColor = col;
    }
  `
});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), lensMat);
quadScene.add(quad);

function getOffsetTop(el){
  let top = 0;
  while(el){ top += el.offsetTop || 0; el = el.offsetParent; }
  return top;
}
function resizeAll(){
  const w = wrap.clientWidth;
  const available = window.innerHeight - getOffsetTop(wrap) - 24; // fill down to bottom of window
  const h = Math.max(420, available);
  wrap.style.height = h+'px';
  renderer.setSize(w,h,false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  rt.setSize(w*Math.min(devicePixelRatio,2), h*Math.min(devicePixelRatio,2));
  lensUniforms.uAspect.value = w/h;
}
window.addEventListener('resize', resizeAll);

const tmpEdge = new THREE.Vector3();
const tmpCenter = new THREE.Vector3();
function updateLensUniforms(){
  tmpCenter.copy(bhMesh.position).project(camera);
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0);
  tmpEdge.copy(bhMesh.position).addScaledVector(right, bhRadius).project(camera);
  const cx = tmpCenter.x*0.5+0.5, cy = tmpCenter.y*0.5+0.5;
  const ex = tmpEdge.x*0.5+0.5, ey = tmpEdge.y*0.5+0.5;
  const aspect = lensUniforms.uAspect.value;
  const dx = (ex-cx)*aspect, dy = (ey-cy);
  const rUv = Math.sqrt(dx*dx+dy*dy);
  lensUniforms.uBH.value.set(cx,cy);
  lensUniforms.uRs.value = Math.max(0.005, rUv);
  lensUniforms.uStrength.value = currentLensStrength();
}

// ---------------- ANIMATE ----------------
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(diskOn) diskGroup.rotation.z += dt*0.18;

  updateCamera();
  camera.updateMatrixWorld();
  updateLensUniforms();

  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(quadScene, quadCamera);
}

resizeAll();
refresh();
updateCamera();
animate();

})();
</script>
