<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <title>Percentage Calculator</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .calculator {
      background: #020617;
      padding: 24px;
      border-radius: 16px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h2 {
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    label {
      font-size: 14px;
      color: #cbd5f5;
    }

    input {
      height: 52px;
      padding: 0 14px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      height: 54px;
      font-size: 18px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: #6366f1;
      color: white;
    }

    button:hover {
      background: #4f46e5;
    }

    .result {
      margin-top: 20px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
    }

    .error {
      color: #f87171;
      font-size: 14px;
    }

    #rawBtn {
  margin-top: 10px;
  background: #1e293b;
  font-size: 14px;
}

#rawBtn:hover {
  background: #334155;
}

  </style>
</head>
<body>

  <div class="calculator">
    <h2>％ Percent of a Number</h2>
    <div class="subtitle">Find X% of a number</div>

    <div class="field">
      <label for="percent">Percentage (%)</label>
      <input type="number" id="percent" placeholder="e.g. 10">
    </div>

    <div class="field">
      <label for="value">Value</label>
      <input type="number" id="value" placeholder="e.g. 500">
    </div>

    <button onclick="calculatePercent()">Calculate</button>
    <button type="button" id="rawBtn" onclick="toggleRaw()">
  Show raw value
</button>


    <div class="result" id="result"></div>
  </div>

  <script>
  let lastRawValue = null;
  let showRaw = false;

  function toggleRaw() {
    showRaw = !showRaw;
    document.getElementById("rawBtn").textContent =
      showRaw ? "Hide raw value" : "Show raw value";

    if (lastRawValue !== null) {
      displayResult(lastRawValue);
    }
  }

  function calculatePercent() {
    const percent = Number(document.getElementById("percent").value);
    const value = Number(document.getElementById("value").value);
    const resultDiv = document.getElementById("result");

    if (Number.isNaN(percent) || Number.isNaN(value)) {
      resultDiv.innerHTML = "<span class='error'>Please enter both values</span>";
      return;
    }

    // exact raw calculation
    lastRawValue = (percent * value) / 100;

    displayResult(lastRawValue);
  }

  function displayResult(raw) {
    const resultDiv = document.getElementById("result");

    if (showRaw) {
      // RAW MODE: no rounding, no formatting tricks
      resultDiv.textContent =
        `${document.getElementById("percent").value}% of ` +
        `${document.getElementById("value").value} = ${raw}`;
      return;
    }

    // NORMAL MODE (rounded / adaptive)
    let display;

    if (raw !== 0 && Math.abs(raw) < 0.001) {
      display = raw.toFixed(6);
    } else if (Number.isInteger(raw)) {
      display = raw.toString();
    } else {
      display = raw.toFixed(3);
    }

    resultDiv.textContent =
      `${document.getElementById("percent").value}% of ` +
      `${document.getElementById("value").value} = ${display}`;
  }
</script>

<script src="/libraries/config.js"></script>
<script src="/libraries/view-counter.js"></script>


</body>
</html>
