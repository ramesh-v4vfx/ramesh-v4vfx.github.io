.certificate {
  width: 720px;
  max-width: 95%;
  margin: 40px auto 20px;
  padding: 48px 44px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 40px 120px rgba(0,0,0,0.55);
  position: relative;
  animation: pop 0.6s ease;
  overflow: hidden;
}

.certificate.vertical {
  width: 420px;
  min-height: 560px;
  padding: 32px 36px 40px;

  display: flex;
  flex-direction: column;
}


.certificate.bronze {
  --cert-base: #f7e2c8; /* 👈 SOLID */
  background: linear-gradient(135deg, #f7e2c8, #fff6eb);
  border: 4px solid #cd7f32;
  color: #7c3e06;
}

.certificate.silver {
  --cert-base: #eef2f7;
  background: linear-gradient(135deg, #eef2f7, #ffffff);
  border: 4px solid #c0c0c0;
  color: #374151;
}

.certificate.gold {
  --cert-base: #f7c948;

  background:
    radial-gradient(
      circle at center,
      #ffef7a 0%,
      #f7d046 35%,
      #e0ad2f 60%,
      #c58a1a 82%,
      #a96a0f 100%
    );

  border: 4px solid #e0ad2f;
  color: #5a3306;
}

.certificate.gold::before {
  content: "";
  position: absolute;
  inset: -20%;
  background:
    radial-gradient(
      circle at center,
      rgba(255,255,255,0.25),
      transparent 60%
    );
  pointer-events: none;
}



.certificate.gold .cert-divider {
  background: linear-gradient(
    to right,
    transparent,
    #c58a1a,
    transparent
  );
  opacity: 0.45;
}




.certificate.gold::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    120deg,
    transparent 40%,
    rgba(255,255,255,0.35) 50%,
    transparent 60%
  );
  opacity: 0.25;
  pointer-events: none;
}






.certificate h1 {

}

.certificate {

}

/* 🚫 Disable overlays during certificate capture */
body.capturing::before {
  display: none !important;
}

body.capturing {
  background: transparent !important;
}

body.capturing * {
  filter: none !important;
  opacity: 1;
}

body.capturing h1,
body.capturing h2,

/* ================= SORTING ================= */

function sortBy(key) {
  if (sortKey === key) {
    // 🔒 Do NOT auto-toggle for name on initial load
    if (key !== "name") {
      sortDirection = sortDirection === "desc" ? "asc" : "desc";
    }
  } else {
    sortKey = key;
    sortDirection = key === "name" ? "asc" : "desc";
  }

  let list = scopedCountries();

if (key === "gdp" || key === "gdppc") {
  list = list.filter(c => c.gdp_nominal_usd !== null);
}

if (key === "gdpkm2") {
  list = list.filter(c =>
    c.gdp_nominal_usd !== null && c.area_km2 !== null
  );
}


if (key === "gdpppp" || key === "gdppppc" || key === "gdppppkm2") {
  list = list.filter(c => c.gdp_ppp_usd !== null);
}

if (key === "pppfactor" || key === "pppgap") {
  list = list.filter(c =>
    c.gdp_nominal_usd !== null && c.gdp_ppp_usd !== null
  );
}





  list.sort((a, b) => {
    let aVal, bVal;

    switch (key) {
      case "population":
        aVal = a.population ?? -1;
        bVal = b.population ?? -1;
        break;
      case "area":
        aVal = a.area_km2 ?? -1;
        bVal = b.area_km2 ?? -1;
        break;
      case "gdp":
        aVal = a.gdp_nominal_usd ?? -1;
        bVal = b.gdp_nominal_usd ?? -1;
        break;
      case "gdppc":
        aVal = gdpPerCapita(a) ?? -1;
        bVal = gdpPerCapita(b) ?? -1;
        break;

      case "gdpppp":
        aVal = a.gdp_ppp_usd ?? -1;
        bVal = b.gdp_ppp_usd ?? -1;
        break;

      case "gdppppc":
        aVal = gdpPPPPerCapita(a) ?? -1;
        bVal = gdpPPPPerCapita(b) ?? -1;
        break;

      case "gdpkm2":
        aVal = gdpPerKm2(a) ?? -Infinity;
        bVal = gdpPerKm2(b) ?? -Infinity;
        break;


      case "gdppppkm2":
        aVal = gdpPPPPerKm2(a) ?? -Infinity;
        bVal = gdpPPPPerKm2(b) ?? -Infinity;
        break;

      case "pppfactor":
        aVal = pppFactor(a) ?? -Infinity;
        bVal = pppFactor(b) ?? -Infinity;
        break;

      case "pppgap":
        aVal = pppGapPercent(a) ?? -Infinity;
        bVal = pppGapPercent(b) ?? -Infinity;
        break;


      case "density":
        aVal = populationDensity(a) ?? -1;
        bVal = populationDensity(b) ?? -1;
        break;

      default:
        aVal = a.name;
        bVal = b.name;
    }

    if (typeof aVal === "string") {
      return sortDirection === "asc"
        ? aVal.localeCompare(bVal)
        : bVal.localeCompare(aVal);
    }

    return sortDirection === "asc" ? aVal - bVal : bVal - aVal;

  });

if (key !== "name") {
  list.forEach((c, i) => {
    c._rank = sortDirection === "desc"
      ? i + 1
      : list.length - i;
  });
} else {
  // Clear ranks in default A–Z mode
  list.forEach(c => delete c._rank);
}


  current = list;
  render(current);
  updateSortButtons();

}

    case "pppfactor": return `PPP factor ${arrow}`;
    case "pppgap": return `Nominal–PPP gap ${arrow}`;



    default: return `A–Z`;

}

function playUserCard(code) {
  if (!gameMode) return;

  userCard = userHand.find(c => c.iso_alpha2 === code);
  userHand = userHand.filter(c => c !== userCard);
  // 🤖 CPU is active now
  setActivePlayer("cpu");


  resolveBattle();
}

function battleScore(a, b) {
  let score = 0;

  if (a.population > b.population) score++;
  if (a.area_km2 > b.area_km2) score++;
  if (a.gdp_nominal_usd > b.gdp_nominal_usd) score++;
  if (gdpPerCapita(a) > gdpPerCapita(b)) score++;
  if (a.gdp_ppp_usd > b.gdp_ppp_usd) score++;
  if (gdpPPPPerCapita(a) > gdpPPPPerCapita(b)) score++;
  if (populationDensity(a) > populationDensity(b)) score++; 
  
   // 🆕 NEW METRICS
  if (gdpPerKm2(a) > gdpPerKm2(b)) score++;
  if (gdpPPPPerKm2(a) > gdpPPPPerKm2(b)) score++;
  if (pppFactor(a) > pppFactor(b)) score++;
  if (pppGapPercent(a) > pppGapPercent(b)) score++;


  return score;
}


function resolveBattle() {
  const userScore = battleScore(userCard, cpuCard);
  const cpuScore  = battleScore(cpuCard, userCard);

  if (userScore > cpuScore) {
    userHand.push(userCard, cpuCard);
    userScoreTotal++;
  } 
  else if (cpuScore > userScore) {
    cpuHand.push(cpuCard, userCard);
    cpuScoreTotal++;
  } 
  else {
    userHand.push(userCard);
    cpuHand.push(cpuCard);
  }

  // ✅ SHOW RESULT ONCE
  showBattleResult("", userScore, cpuScore);

  // ❌ NO setTimeout
}



function showBattleResult(text, userScore, cpuScore) {
  overlayPurpose = "game";
  document.getElementById("compare-overlay").style.display = "flex";

  const userWon = userScore > cpuScore;
  const draw = userScore === cpuScore;

  // Render cards
  document.getElementById("compare-left").innerHTML =
    renderCompareCard(userCard, cpuCard, "user");

  document.getElementById("compare-right").innerHTML =
    renderCompareCard(cpuCard, userCard, "cpu");

  // Result text
  document.getElementById("battle-result").innerHTML = draw
    ? "🤝 DRAW"
    : userWon
      ? "🎉 YOU WIN THIS ROUND"
      : "🤖 COMPUTER WINS THIS ROUND";

  document.getElementById("battle-result").style.color =
    draw ? "#e5e7eb" : userWon ? "#22c55e" : "#ef4444";

  // ✅ 1. PRE-STATE (immediate, no animation yet)
  const cards = document.querySelectorAll(".compare-card");
  cards.forEach(card => card.classList.add("pre"));

  // ✅ 2. NEXT FRAME → animate to final state
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      cards.forEach(card => card.classList.remove("pre"));

      if (!draw) {
        const winnerSelector = userWon
          ? "#compare-left .compare-card"
          : "#compare-right .compare-card";

        const loserSelector = userWon
          ? "#compare-right .compare-card"
          : "#compare-left .compare-card";

        document.querySelector(winnerSelector)
          .classList.add(userWon ? "user-winner" : "cpu-winner");

        document.querySelector(loserSelector)
          .classList.add("loser");
      }
    });
  });
}

function nextRound() {

  userCard = null;

}

function setGameControlsDisabled(disabled) {
  document
    .querySelectorAll("header input, header select, header button")
    .forEach(el => {

    });

function gdpPPPPerCapita(c) {
  if (!c.gdp_ppp_usd || !c.population) return null;
  return Math.round(c.gdp_ppp_usd / c.population);
}

function gdpPPPLabel(c) {
  if (!c.gdp_ppp_usd || !c.gdp_ppp_year) return "Not available";
  return `≈$${format(c.gdp_ppp_usd)} (${c.gdp_ppp_year})`;
}


// GDP per km² (Nominal)
function gdpPerKm2(c) {
  if (!c.gdp_nominal_usd || !c.area_km2) return null;
  return Math.round(c.gdp_nominal_usd / c.area_km2);
}

// GDP (PPP) per km²
function gdpPPPPerKm2(c) {
  if (!c.gdp_ppp_usd || !c.area_km2) return null;
  return Math.round(c.gdp_ppp_usd / c.area_km2);
}

// PPP factor (price level ratio)
function pppFactor(c) {
  if (!c.gdp_ppp_usd || !c.gdp_nominal_usd) return null;
  return c.gdp_ppp_usd / c.gdp_nominal_usd;
}

// Nominal–PPP gap (%)
function pppGapPercent(c) {
  if (!c.gdp_ppp_usd || !c.gdp_nominal_usd) return null;
  return ((c.gdp_ppp_usd - c.gdp_nominal_usd) / c.gdp_nominal_usd) * 100;
}

function continentLabel(c) {
  if (c.continent_secondary) {
    return `${c.continent} · ${c.continent_secondary}`;
  }
  return c.continent;
}

function unique(arr) {
  return [...new Set(arr.filter(Boolean))];
}


function generateQuizQuestions() {
  quizQuestions = shuffle(countries)
    .map(c => {
      const type = QUIZ_TYPES[Math.floor(Math.random() * QUIZ_TYPES.length)];
      return buildQuestion(type, c);
    })
    .filter(Boolean)
    .slice(0, 10);
}



function buildQuestion(type, country) {
  let question = "";
  let correct = "";
  let options = [];

if (type === "capital") {
  question = `What is the capital of ${country.name}?`;
  correct = country.capital[0];

  const pool = shuffle(
    unique(
      countries.flatMap(c => c.capital || [])
    ).filter(c => c !== correct)
  );

  options = shuffle([correct, ...pool.slice(0, 3)]);
}



if (type === "continent") {
  question = `Which continent is ${country.name} in?`;
  correct = country.continent;

  const pool = shuffle(
    unique(countries.map(c => c.continent))
      .filter(c => c !== correct)
  );

  options = shuffle([correct, ...pool.slice(0, 3)]);
}



if (type === "currency") {
  if (!country.currency || country.currency.length === 0) return null;

  // 🎯 choose ONE currency for the question
  const correctCode = country.currency[0];

  question = `What is the currency of ${country.name}?`;

  // build unique pool of ALL currency codes
  const pool = unique(
    countries.flatMap(c => c.currency || [])
  ).filter(code => code !== correctCode);

  options = shuffle([
    currencyLabelFromCode(correctCode),
    ...pool.slice(0, 3).map(currencyLabelFromCode)
  ]);

  correct = currencyLabelFromCode(correctCode);
}




if (type === "language") {
  if (!country.official_language?.length) return null;

  question = `Which is an official language of ${country.name}?`;
  correct = country.official_language[0];

  const pool = unique(
    countries.flatMap(c => c.official_language || [])
  ).filter(l => l !== correct);

  options = shuffle([correct, ...pool.slice(0, 3)]);
}


if (type === "flag") {
  question = `Which country does this flag belong to?`;
  correct = country.name;

  options = shuffle([
    correct,
    ...shuffle(countries)
      .filter(c => c.name !== correct)
      .slice(0, 3)
      .map(c => c.name)
  ]);

  return {
    question,
    correct,
    options,
    flag: country.iso_alpha2
  };
}



  // 🔒 fallback
  if (!question || options.length < 4) {
    return null;
  }

  return { question, correct, options };
}

function answerQuiz(selected) {
   clearInterval(quizTimer);
  const q = quizQuestions[quizIndex];

  const buttons = document.querySelectorAll(".quiz-option");

  buttons.forEach(btn => {
    const answer = btn.dataset.answer;

    // 1️⃣ Disable all buttons
    btn.disabled = true;

    // 2️⃣ Correct answer
    if (answer === q.correct) {
      btn.classList.add("correct");
      btn.innerHTML += " ✔";
    }

    // 3️⃣ Wrong selected answer
    if (answer === selected && selected !== q.correct) {
      btn.classList.add("wrong");
      btn.innerHTML += " ✖";
    }

    // 4️⃣ Dim others
    if (answer !== q.correct && answer !== selected) {
      btn.classList.add("dim");
    }
  });

  // 5️⃣ Update score
  if (selected === q.correct) {
    quizScore++;
  }

  // 6️⃣ Tiny vibration (mobile only)
  if (navigator.vibrate) navigator.vibrate(40);

  // 7️⃣ Move to next question
  setTimeout(() => {
    quizIndex++;

    if (quizIndex >= quizQuestions.length) {
      endQuiz();
    } else {
      renderQuizQuestion();
    }
  }, 900);
}




function endQuiz() {
  clearInterval(quizTimer);

  if (quizScore < 10) {
    failQuiz();
    return;
  }

  // 👤 Ask name ONLY on success
  ensureUserName();

  if (quizRound === 1) {
    showRoundCertificate(1);
    return;
  }

  if (quizRound === 2) {
    showRoundCertificate(2);
    return;
  }

  showMasterReward();
}

document.addEventListener("keydown", e => {
  if (!e.ctrlKey) return;

  quizUserName = quizUserName || "Ramesh";

  if (e.key === "1") showRoundCertificate(1);
  if (e.key === "2") showRoundCertificate(2);
  if (e.key === "3") showMasterReward();
});


function startQuizTimer() {
  clearInterval(quizTimer);

  timeLeft = ROUND_TIME[quizRound];

  const timerEl = document.getElementById("quiz-timer");

  // Initial render
  timerEl.textContent = `⏱ ${timeLeft}s`;

  quizTimer = setInterval(() => {
    timeLeft--;

    if (timeLeft <= 0) {
      clearInterval(quizTimer);
      timerEl.textContent = "⏱ 0s";

      // ⛔ time ran out → auto fail question
      failQuiz();
      return;
    }

    timerEl.textContent = `⏱ ${timeLeft}s`;
  }, 1000);
}

function hardReset() {
  // 🔴 Exit quiz
  if (quizMode) {
    clearInterval(quizTimer);
    quizMode = false;
    quizQuestions = [];
    quizIndex = 0;
    quizScore = 0;
    quizUserName = "";
  }

  // 🔴 Exit game
  if (gameMode) {
    gameMode = false;
    userHand = [];
    cpuHand = [];
    userScoreTotal = 0;
    cpuScoreTotal = 0;
    document.getElementById("gameToggleBtn").textContent = "▶ Play Card Game";
  }

  // 🔴 Exit compare
  compareMode = false;
  compareSelection = [];
  overlayPurpose = null;

  document.body.classList.remove(
    "compare-active",
    "card-focus"
  );

  document.getElementById("compare-overlay").style.display = "none";
  document.getElementById("compare-status").style.display = "none";

  // 🔓 Re-enable controls
  setGameControlsDisabled(false);

  // 🔄 Reset filters + list
  resetView();
}
