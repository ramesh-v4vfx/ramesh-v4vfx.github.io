<style>
  :root {
    --bg: #070b0d;
    --panel: #0f172a;
    --panel-2: #070c14;
    --line: rgba(52,211,153,0.16);
    --line-soft: rgba(52,211,153,0.08);

    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;

  .page { width: 100%; max-width: 420px; }

  /* ---------- Header / balance scale mark ---------- */
  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 18px;
  }

  .scale-mark {
    position: relative;
    width: 110px;
    height: 92px;
    margin-bottom: 8px;
  }

  .scale-post {
    position: absolute;
    left: 50%; top: 28px; bottom: 6px;
    width: 3px; margin-left: -1.5px;
    background: linear-gradient(180deg, var(--brass), var(--brass-dark));
  }

  .scale-base {
    position: absolute;
    left: 50%; bottom: 0;
    width: 44px; height: 5px; margin-left: -22px;
    background: linear-gradient(180deg, var(--brass), var(--brass-dark));
    border-radius: 3px;
  }

  .scale-pivot {
    position: absolute;
    left: 50%; top: 24px;
    width: 9px; height: 9px; margin-left: -4.5px;
    border-radius: 50%;
    background: var(--brass);
    box-shadow: 0 0 8px rgba(232,196,119,0.6);
    z-index: 3;
  }

  .scale-beam {
    position: absolute;
    left: 50%; top: 27px;
    width: 88px; height: 3px; margin-left: -44px;
    background: linear-gradient(90deg, var(--brass-dark), var(--brass), var(--brass-dark));
    border-radius: 2px;
    transform-origin: 50% 50%;
    animation: scaleTip 4.6s ease-in-out infinite;
    z-index: 2;
  }

  @keyframes scaleTip {
    0%, 100% { transform: rotate(-3.5deg); }
    50%      { transform: rotate(3.5deg); }
  }

  .scale-beam .string {
    position: absolute;
    top: 3px;
    width: 1.5px; height: 13px;
    background: rgba(232,196,119,0.55);
  }

  .scale-beam .string.l { left: 5px; }
  .scale-beam .string.r { right: 5px; }

  .scale-beam .pan {
    position: absolute;
    top: 15px;
    width: 24px; height: 14px;
    border: 1.5px solid rgba(232,196,119,0.7);
    border-top: none;
    border-radius: 0 0 12px 12px;
    background: rgba(232,196,119,0.08);
  }

  .scale-beam .pan.l { left: -6px; }
  .scale-beam .pan.r { right: -6px; }

  @media (prefers-reduced-motion: reduce) {
    .scale-beam { animation: none; }
  }

  h1 {
    font-family: var(--sans);
    font-weight: 800;
    font-size: 1.35rem;

    background: var(--brass);
    box-shadow: 0 0 6px 1px rgba(232,196,119,0.7);

  /* ---------- Card ---------- */
  .app {
    position: relative;
    width: 100%;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line);

    background: linear-gradient(90deg, transparent, var(--emerald), transparent);
    animation: scan 6s linear infinite;
    opacity: 0.8;

  @keyframes scan {

    100% { left: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {

  .corner-tl, .corner-br {
    position: absolute;
    width: 14px; height: 14px;

  .corner-tl { top: 10px; left: 10px; border-top: 2px solid var(--emerald); border-left: 2px solid var(--emerald); }
  .corner-br { bottom: 10px; right: 10px; border-bottom: 2px solid var(--emerald); border-right: 2px solid var(--emerald); }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.13em;
    text-transform: uppercase;

  input, select {
    width: 100%;
    padding: 0 14px;
    height: 48px;
    border-radius: 9px;
    border: 1px solid var(--line-soft);
    background: #050a0d;
    color: var(--text);
    font-size: 1rem;

  }

  input::placeholder { color: #3f5850; }

  input:focus, select:focus {
    outline: none;
    border-color: var(--emerald);
    box-shadow: 0 0 0 3px var(--emerald-dim);
  }

  select option { color: #000; background: #fff; }

  .unit-row {
    display: flex;
    flex-direction: column;
    margin-top: 14px;
  }

  .swap-wrap {
    display: flex;
    justify-content: center;
    margin: 14px 0;
  }

  .swap-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(52,211,153,0.08);
    color: var(--emerald);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .swap-btn:hover { border-color: var(--emerald); box-shadow: 0 0 12px rgba(52,211,153,0.3); }
  .swap-btn:active { transform: scale(0.92) rotate(180deg); }
  .swap-btn.spin { animation: swapSpin 0.4s ease; }

  @keyframes swapSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(180deg); }
  }

  .result {
    margin-top: 18px;
    background: #050a0d;
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    padding: 16px 14px;
    text-align: center;
    cursor: pointer;
  }

  .result:hover { border-color: var(--line); }

  #resultValue {
    font-family: var(--mono);
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--emerald);
    text-shadow: 0 0 12px rgba(52,211,153,0.3);
    word-break: break-all;
  }

  #resultUnit {
    display: block;
    margin-top: 4px;
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .result-hint {
    margin-top: 6px;
    font-size: 0.7rem;
    color: var(--text-dim);
  }

  button.copy {
    width: 100%;
    margin-top: 12px;
    height: 46px;
    border-radius: 9px;
    border: 1px solid rgba(52,211,153,0.35);
    background: linear-gradient(180deg, rgba(52,211,153,0.1), rgba(52,211,153,0.02));
    color: var(--emerald);
    font-family: var(--mono);
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 700;
    cursor: pointer;
    transition: box-shadow 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }

  button.copy:hover { box-shadow: 0 0 16px rgba(52,211,153,0.25); }
  button.copy:active { transform: scale(0.98); }

  button.copy.copied {
    border-color: #34d399;
    background: #16a34a;
    color: #fff;
  }

  .note {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px dashed var(--line-soft);

    text-align: center;
    color: var(--text-dim);
  }

  .note b { color: var(--brass); }

  @media (max-width: 480px) {

<body>

<div class="page">

  <div class="header">
    <div class="scale-mark">
      <div class="scale-post"></div>
      <div class="scale-base"></div>
      <div class="scale-pivot"></div>
      <div class="scale-beam">
        <div class="string l"></div>
        <div class="string r"></div>
        <div class="pan l"></div>
        <div class="pan r"></div>
      </div>
    </div>
    <h1>Universal Weight Converter</h1>
    <div class="brand-badge"><span class="dot"></span> Rameshverse Systems · MK·02</div>
  </div>

  <div class="app">
    <div class="corner-tl"></div>
    <div class="corner-br"></div>

    <label for="value">Value</label>
    <input type="number" id="value" placeholder="Enter value" inputmode="decimal">

    <div class="unit-row">
      <label class="field-label" for="fromUnit">From</label>
      <select id="fromUnit" aria-label="Convert from unit"></select>

      <div class="swap-wrap">
        <button class="swap-btn" id="swapBtn" type="button" aria-label="Swap units" title="Swap units">⇅</button>
      </div>

      <label class="field-label" for="toUnit">To</label>
      <select id="toUnit" aria-label="Convert to unit"></select>
    </div>

    <div class="result" id="resultBox">
      <span id="resultValue" aria-live="polite">0</span>
      <span id="resultUnit"></span>
      <div class="result-hint">Tap to copy</div>
    </div>

    <button id="copyBtn" class="copy" type="button">Copy Result</button>

    <div class="note">
      Precious metals use <b>troy units</b> — 1 troy oz = 31.1034768 g
    </div>
  </div>
</div>

<script>
  // Base unit = gram
  const units = {
    "Microgram (µg)": 0.000001,
    "Milligram (mg)": 0.001,
    "Gram (g)": 1,
    "Kilogram (kg)": 1000,
    "Metric tonne (t)": 1_000_000,

    "Carat (ct)": 0.2,
    "Grain (gr)": 0.06479891,

    "Ounce (oz)": 28.349523125,
    "Pound (lb)": 453.59237,
    "Stone (st)": 6350.29318,
    "US ton (short)": 907_184.74,
    "UK ton (long)": 1_016_046.9088,

    "Troy ounce (ozt)": 31.1034768,
    "Troy pound (tlb)": 373.2417216
  };

  const fromSelect = document.getElementById("fromUnit");
  const toSelect = document.getElementById("toUnit");
  const valueInput = document.getElementById("value");
  const resultValueEl = document.getElementById("resultValue");
  const resultUnitEl = document.getElementById("resultUnit");
  const swapBtn = document.getElementById("swapBtn");

  Object.keys(units).forEach(unit => {
    fromSelect.add(new Option(unit, unit));
    toSelect.add(new Option(unit, unit));
  });

  fromSelect.value = "Gram (g)";
  toSelect.value = "Kilogram (kg)";

  // Extracts the short abbreviation from a label like "Kilogram (kg)" -> "kg"
  function unitAbbrev(label) {
    const match = label.match(/\(([^)]+)\)/);
    return match ? match[1] : label;
  }

  /* Fixed (round 2): the multiply/round/divide approach itself becomes
     unsafe for large converted values — multiplying by 10^8 can push the
     intermediate value past Number.MAX_SAFE_INTEGER (2^53), which is
     exactly what produced "453,592,370.00000006" instead of an exact
     453,592,370 when converting 1 lb to micrograms. The actual noise
     already exists in the raw division (0.000001 isn't exactly
     representable in binary floating point), so instead of trying to
     round to a fixed decimal count, we clean the float to ~15 significant
     digits (removing binary-division noise) and let toLocaleString's
     maximumFractionDigits handle final display rounding safely. */
  function cleanFloat(value) {
    if (!isFinite(value) || value === 0) return value;
    return Number(value.toPrecision(15));
  }

  function convert() {
    const raw = valueInput.value;
    const value = parseFloat(raw);

    if (raw.trim() === "" || isNaN(value)) {
      resultValueEl.textContent = "0";
      resultUnitEl.textContent = unitAbbrev(toSelect.value);
      return;
    }

    if (value < 0) {
      resultValueEl.textContent = "Weight can't be negative.";
      resultUnitEl.textContent = "";
      return;
    }

    const grams = value * units[fromSelect.value];
    const converted = grams / units[toSelect.value];
    const cleaned = cleanFloat(converted);

    resultValueEl.textContent = cleaned.toLocaleString("en-US", {
      maximumFractionDigits: 8
    });
    resultUnitEl.textContent = unitAbbrev(toSelect.value);
  }

  function swapUnits() {
    const from = fromSelect.value;
    fromSelect.value = toSelect.value;
    toSelect.value = from;

    swapBtn.classList.remove("spin");
    swapBtn.offsetHeight; // force reflow so the animation can replay
    swapBtn.classList.add("spin");

    convert();
  }

  valueInput.addEventListener("input", convert);
  fromSelect.addEventListener("change", convert);
  toSelect.addEventListener("change", convert);
  swapBtn.addEventListener("click", swapUnits);

  const copyBtn = document.getElementById("copyBtn");
  const resultBox = document.getElementById("resultBox");

  function copyResult() {
    const text = resultValueEl.textContent;
    if (!text || text.includes("negative")) return;

    navigator.clipboard.writeText(text);

    copyBtn.textContent = "Copied ✓";
    copyBtn.classList.add("copied");

    setTimeout(() => {
      copyBtn.textContent = "Copy Result";
      copyBtn.classList.remove("copied");
    }, 1200);
  }

  copyBtn.addEventListener("click", copyResult);
  resultBox.addEventListener("click", copyResult);

  convert();
</script>
