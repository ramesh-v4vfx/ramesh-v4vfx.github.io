<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Universal Weight Converter</title>

<meta name="description"
content="Free universal weight converter. Convert gram, kilogram, ounce, pound, troy ounce, carat, grain, stone and metric tonne instantly online.">

<meta name="keywords"
content="weight converter, gram to kg, kg to pound, ounce to gram, troy ounce converter, carat converter, unit converter">

<style>
  body {
  font-family: system-ui, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  margin: 0;
  padding: 16px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
}

.app {
  width: 100%;
  max-width: 420px;
  background: #020617;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 20px 40px rgba(0,0,0,.6);
}

h2 {
  text-align: center;
  margin-bottom: 18px;
  font-size: 20px;
}

input, select {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  margin-bottom: 12px;
}

.result {
  background: #020617;
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 14px;
  font-weight: 600;
  text-align: left;
  font-size: 18px;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #1e293b;
  color: white;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

button.copied {
  background: #16a34a;
}

.note {
  margin-top: 14px;
  font-size: 12px;
  opacity: 0.8;
  text-align: center;
  line-height: 1.4;
}

input, select, button, .result {
  box-sizing: border-box;
}


</style>
</head>

<body>

<div class="app">
  <h2>⚖️ Universal Weight Converter</h2>

  <input type="number" id="value" placeholder="Enter value">

  <select id="fromUnit"></select>
  <select id="toUnit"></select>

  <div class="result" id="result">0</div>
  <button id="copyBtn">Copy</button>

  <div class="note">
    💡 Precious metals use <b>troy units</b><br>
    (1 troy oz = 31.1035 g)
  </div>
</div>


<script>
  // Base unit = gram
  const units = {
    "Microgram (µg)": 0.000001,
    "Milligram (mg)": 0.001,
    "Gram (g)": 1,
    "Kilogram (kg)": 1000,
    "Metric tonne (t)": 1_000_000,

    "Carat (ct)": 0.2,
    "Grain (gr)": 0.06479891,

    "Ounce (oz)": 28.349523125,
    "Pound (lb)": 453.59237,
    "Stone (st)": 6350.29318,
    "US ton (short)": 907_184.74,
    "UK ton (long)": 1_016_046.9088,

    "Troy ounce (ozt)": 31.1034768,
    "Troy pound (tlb)": 373.2417216
  };

  const fromSelect = document.getElementById("fromUnit");
  const toSelect = document.getElementById("toUnit");
  const valueInput = document.getElementById("value");
  const resultDiv = document.getElementById("result");

  Object.keys(units).forEach(unit => {
    fromSelect.add(new Option(unit, unit));
    toSelect.add(new Option(unit, unit));
  });

  fromSelect.value = "Gram (g)";
  toSelect.value = "Kilogram (kg)";

function round(value, decimals = 8) {
  return Number(Math.round(value + "e" + decimals) + "e-" + decimals);
}

function convert() {
  const value = parseFloat(valueInput.value);
  if (isNaN(value)) {
    resultDiv.textContent = "0";
    return;
  }

  const grams = value * units[fromSelect.value];
  const converted = grams / units[toSelect.value];
  const rounded = round(converted, 8);

  resultDiv.textContent =
    rounded.toLocaleString("en-US", {
      maximumFractionDigits: 8
    });
}




  valueInput.addEventListener("input", convert);
  fromSelect.addEventListener("change", convert);
  toSelect.addEventListener("change", convert);
  const copyBtn = document.getElementById("copyBtn");

  copyBtn.addEventListener("click", () => {
  navigator.clipboard.writeText(resultDiv.textContent);

  copyBtn.textContent = "Copied ✓";
  copyBtn.classList.add("copied");

  setTimeout(() => {
    copyBtn.textContent = "Copy";
    copyBtn.classList.remove("copied");
  }, 1200);
});




</script>

<script src="/libraries/config.js"></script>
<script src="/libraries/view-counter.js"></script>

</body>
</html>
