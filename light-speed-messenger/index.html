<meta charset="UTF-8">

<meta name="description" content="Send a message at the speed of light to the Moon, planets, or distant stars, and see the real light-delay time for it to arrive and a reply to return.">

<title>LIGHT-SPEED MESSENGER // RV·LIGHTSPEED</title>

<link rel="canonical" href="https://rameshverse.com/light-speed-messenger">

<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.js"></script>
<style>
  :root{
    --bg:#050505; --panel:#0b0b0b; --line:#241414;
    --red:#ff2b2b; --red-dim:#7a1414;
    --text:#e8e2e2; --text-dim:#8a7a7a;
    --go:#2bff88;
    --font:'Space Mono', monospace;
  }
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--text); font-family:var(--font);}
  body{min-height:100vh; padding:20px 16px 50px; position:relative;}
  body::before{
    content:""; position:fixed; inset:0;
    background:repeating-linear-gradient(to bottom, rgba(255,43,43,0.02) 0px, rgba(255,43,43,0.02) 1px, transparent 1px, transparent 3px);
    pointer-events:none; z-index:50;
  }
  .wrap{max-width:700px; margin:0 auto; position:relative;}
  header{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:16px;}
  .back-link{display:inline-block; font-size:10px; letter-spacing:2px; color:var(--text-dim); text-decoration:none; margin-bottom:8px; transition:color .15s;}
  .back-link:hover{color:var(--red);}
  .brand{font-size:11px; letter-spacing:3px; color:var(--red-dim);}
  h1{font-size:20px; letter-spacing:4px; font-weight:700;}
  h1 span{color:var(--red);}
  .clock{font-size:11px; color:var(--text-dim); text-align:right; letter-spacing:1px;}

  .panel{position:relative; background:var(--panel); border:1px solid var(--line); padding:18px; margin-bottom:14px;}
  .panel .tl,.panel .tr,.panel .bl,.panel .br{content:""; position:absolute; width:10px; height:10px; border-color:var(--red-dim); border-style:solid;}
  .panel .tl{top:-1px; left:-1px; border-width:1px 0 0 1px;}
  .panel .tr{top:-1px; right:-1px; border-width:1px 1px 0 0;}
  .panel .bl{bottom:-1px; left:-1px; border-width:0 0 1px 1px;}
  .panel .br{bottom:-1px; right:-1px; border-width:0 1px 1px 0;}
  .label{font-size:10px; letter-spacing:2px; color:var(--text-dim); margin-bottom:8px;}

  select, textarea{width:100%; background:#0f0a0a; border:1px solid var(--line); color:var(--text); font-family:var(--font); font-size:13px; padding:10px; resize:vertical;}
  select:focus, textarea:focus{outline:1px solid var(--red-dim);}
  textarea{min-height:70px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:9px; letter-spacing:1.5px; color:var(--text-dim); margin-bottom:6px;}

  .dist-preview{font-size:11px; color:var(--text-dim); margin-top:8px; letter-spacing:.5px;}
  .dist-preview b{color:var(--red);}

  button{background:transparent; border:1px solid var(--red-dim); color:var(--red); font-family:var(--font); font-size:12px; letter-spacing:1.5px; padding:11px 18px; cursor:pointer; transition:all .15s; width:100%;}
  button:hover{background:var(--red-dim); color:var(--text);}
  button:disabled{opacity:.4; cursor:default;}

  .transmit-panel{text-align:center;}
  .transmit-status{font-size:11px; color:var(--text-dim); letter-spacing:2px; margin-bottom:14px;}
  .real-delay{font-size:26px; font-weight:700; color:var(--text); letter-spacing:1px; margin-bottom:4px;}
  .real-delay-sub{font-size:10px; color:var(--text-dim); letter-spacing:1px; margin-bottom:18px;}
  .progress-track{height:8px; background:#1a0d0d; margin-bottom:10px; position:relative; overflow:hidden;}
  .progress-fill{position:absolute; top:0; left:0; height:100%; width:0%; background:linear-gradient(90deg, var(--red-dim), var(--red)); transition:width .15s linear;}
  .progress-fill.reverse{left:auto; right:0; background:linear-gradient(270deg, var(--red-dim), var(--red));}
  .progress-label{font-size:11px; color:var(--text-dim); letter-spacing:1px;}

  .reply-panel{display:none;}
  .reply-panel.show{display:block;}
  .reply-header{font-size:11px; letter-spacing:2px; color:var(--go); margin-bottom:10px;}
  .reply-text{font-size:13px; line-height:1.7; color:var(--text); border-left:2px solid var(--red-dim); padding-left:14px; margin-bottom:14px;}
  .reply-meta{font-size:10px; color:var(--text-dim); letter-spacing:1px;}

  .hidden{display:none;}
  footer{text-align:center; font-size:10px; color:var(--text-dim); letter-spacing:1.5px; margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <a class="back-link" href="https://rameshverse.com">← RAMESHVERSE</a>
      <div class="brand">RAMESHVERSE // RV·LIGHTSPEED</div>
      <h1>LIGHT-SPEED <span>MESSENGER</span></h1>
    </div>
    <div class="clock" id="clockDisplay">--:--:--</div>
    
  </header>

  <div class="panel" id="composePanel">
    <div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div>
    <div class="field">
      <label>SEND TO</label>
      <select id="destSelect"></select>
      <div class="dist-preview" id="distPreview"></div>
    </div>
    <div class="field">
      <label>MESSAGE</label>
      <textarea id="msgInput" placeholder="Type your message..." maxlength="200"></textarea>
    </div>
    <button id="sendBtn">TRANSMIT AT LIGHT SPEED</button>
  </div>

  <div class="panel transmit-panel hidden" id="transmitPanel">
    <div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div>
    <div class="transmit-status" id="transmitStatus">SIGNAL EN ROUTE</div>
    <div class="real-delay" id="realDelayText">—</div>
    <div class="real-delay-sub" id="realDelaySub">real one-way light delay</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">—</div>

    <div class="reply-panel" id="replyPanel">
      <div class="reply-header">✓ SIGNAL RECEIVED — REPLY INCOMING</div>
      <div class="reply-text" id="replyText">—</div>
      <div class="reply-meta" id="replyMeta">—</div>
      <button id="resetBtn" style="margin-top:16px;">SEND ANOTHER MESSAGE</button>
    </div>
  </div>

  <footer>DISTANCES: LIVE ORBITAL POSITIONS + CATALOG STAR DATA &nbsp;|&nbsp; RAMESHVERSE.COM</footer>
</div>

<script>
setInterval(()=>{
  document.getElementById('clockDisplay').textContent = new Date().toLocaleTimeString('en-US',{hour12:false});
},1000);

const C_KM_S = 299792.458;
const AU_KM = 149597870.7;
const LY_KM = 9.4607e12;

// circular-orbit model (same as other RV tools), for live current Earth-planet distances
const planetOrbits = [
  {name:'MERCURY', a:0.387, T:87.969,   L0:252.25},
  {name:'VENUS',   a:0.723, T:224.701,  L0:181.98},
  {name:'EARTH',   a:1.000, T:365.256,  L0:100.47},
  {name:'MARS',    a:1.524, T:686.980,  L0:355.45},
  {name:'JUPITER', a:5.203, T:4332.589, L0:34.40},
  {name:'SATURN',  a:9.537, T:10759.22, L0:50.08},
  {name:'URANUS',  a:19.191,T:30688.5,  L0:314.20},
  {name:'NEPTUNE', a:30.069,T:60182.0,  L0:304.22},
  {name:'PLUTO',   a:39.482,T:90560.0,  L0:238.93},
];

function deg2rad(d){return d*Math.PI/180;}
function norm360(d){ d=d%360; return d<0?d+360:d; }
function planetHelio(p, days){
  const ang = deg2rad(norm360(p.L0 + (360/p.T)*days));
  return {x:p.a*Math.cos(ang), y:p.a*Math.sin(ang)};
}
function currentDistanceAU(name){
  const days = (Date.now()/86400000) + 2440587.5 - 2451545.0;
  const earth = planetHelio(planetOrbits.find(p=>p.name==='EARTH'), days);
  const target = planetOrbits.find(p=>p.name===name);
  const pos = planetHelio(target, days);
  return Math.hypot(pos.x-earth.x, pos.y-earth.y);
}
function currentSunDistanceAU(){
  const days = (Date.now()/86400000) + 2440587.5 - 2451545.0;
  const n = days;
  const g = deg2rad(norm360(357.528 + 0.9856003*n));
  return 1.00014 - 0.01671*Math.cos(g) - 0.00014*Math.cos(2*g);
}

const destinations = [
  {group:'THE MOON', items:[
    {id:'moon', name:'The Moon', live:true, getKm: ()=>{
      const p = SunCalc.getMoonPosition(new Date(), 0, 0);
      return p.distance;
    }}
  ]},
  {group:'THE SUN', items:[
    {id:'sun', name:'The Sun', live:true, getKm: ()=> currentSunDistanceAU()*AU_KM }
  ]},
  {group:'PLANETS (LIVE DISTANCE)', items:[
    {id:'mercury', name:'Mercury', live:true, getKm: ()=> currentDistanceAU('MERCURY')*AU_KM},
    {id:'venus', name:'Venus', live:true, getKm: ()=> currentDistanceAU('VENUS')*AU_KM},
    {id:'mars', name:'Mars', live:true, getKm: ()=> currentDistanceAU('MARS')*AU_KM},
    {id:'jupiter', name:'Jupiter', live:true, getKm: ()=> currentDistanceAU('JUPITER')*AU_KM},
    {id:'saturn', name:'Saturn', live:true, getKm: ()=> currentDistanceAU('SATURN')*AU_KM},
    {id:'uranus', name:'Uranus', live:true, getKm: ()=> currentDistanceAU('URANUS')*AU_KM},
    {id:'neptune', name:'Neptune', live:true, getKm: ()=> currentDistanceAU('NEPTUNE')*AU_KM},
    {id:'pluto', name:'Pluto', live:true, getKm: ()=> currentDistanceAU('PLUTO')*AU_KM},
  ]},
  {group:'STARS & DEEP SPACE', items:[
    {id:'proxima', name:'Proxima Centauri', live:false, ly:4.246},
    {id:'alphacent', name:'Alpha Centauri', live:false, ly:4.37},
    {id:'sirius', name:'Sirius', live:false, ly:8.6},
    {id:'vega', name:'Vega', live:false, ly:25},
    {id:'betelgeuse', name:'Betelgeuse', live:false, ly:548},
    {id:'galcenter', name:'Center of the Milky Way', live:false, ly:26000},
    {id:'andromeda', name:'Andromeda Galaxy', live:false, ly:2500000},
  ]},
];

const destSelect = document.getElementById('destSelect');
destinations.forEach(g=>{
  const og = document.createElement('optgroup');
  og.label = g.group;
  g.items.forEach(item=>{
    const opt = document.createElement('option');
    opt.value = item.id;
    opt.textContent = item.name;
    og.appendChild(opt);
  });
  destSelect.appendChild(og);
});

function findDest(id){
  for(const g of destinations) for(const it of g.items) if(it.id===id) return it;
}

function getDistanceKm(dest){
  if(dest.live) return dest.getKm();
  return dest.ly * LY_KM;
}

function formatDuration(sec){
  if(sec < 60) return sec.toFixed(2)+' sec';
  if(sec < 3600) return (sec/60).toFixed(2)+' min';
  if(sec < 86400) return (sec/3600).toFixed(2)+' hr';
  if(sec < 365.25*86400) return (sec/86400).toFixed(2)+' days';
  return (sec/(365.25*86400)).toFixed(2)+' years';
}

function updatePreview(){
  const dest = findDest(destSelect.value);
  const km = getDistanceKm(dest);
  const sec = km / C_KM_S;
  document.getElementById('distPreview').innerHTML =
    `Distance: <b>${km < 1e7 ? Math.round(km).toLocaleString()+' km' : (km/AU_KM).toFixed(2)+' AU'}</b> &nbsp;·&nbsp; One-way light delay: <b>${formatDuration(sec)}</b>`;
}
destSelect.addEventListener('change', updatePreview);
updatePreview();

function simulatedWaitSeconds(real){
  if(real <= 45) return real;
  const v = 4.2*Math.log10(real);
  return Math.max(10, Math.min(55, v));
}

const replyTemplates = {
  moon: ["Tranquility Base copies. Signal clear.", "Message received on the lunar surface. Over."],
  sun: ["Your words survived the corona. Barely.", "Received, somewhere inside 5,500°C of plasma."],
  mercury: ["Signal received on the scorched side of Mercury.", "Message logged. Daytime here is brutal."],
  venus: ["Received through 96% carbon dioxide. Loud and clear.", "Message logged beneath the sulfuric clouds."],
  mars: ["Message received, Olympus Mons standing by.", "Signal confirmed. Dust storm season here, but we got it."],
  jupiter: ["Received somewhere above the Great Red Spot.", "Signal logged amid the radiation belts. Noted."],
  saturn: ["Message received, drifting past the rings.", "Signal confirmed near Titan's orbit."],
  uranus: ["Received on our side, tilted 98° to the sun.", "Message logged in the ice-giant dark."],
  neptune: ["Signal received in the fastest winds in the solar system.", "Message confirmed, far side of the Kuiper belt beckons."],
  pluto: ["Message received at the edge of the classical solar system.", "Signal logged. It's cold and quiet out here."],
  proxima: ["Received at the nearest star to your Sun.", "Signal confirmed, 4.2 years well spent."],
  alphacent: ["Message received in the Alpha Centauri system.", "Signal logged, three suns and counting."],
  sirius: ["Received at the brightest star in your sky.", "Signal confirmed from the Dog Star."],
  vega: ["Message received, 25 years after you hit send.", "Signal logged near Vega."],
  betelgeuse: ["Received on a star that could go supernova any millennium now.", "Signal confirmed, 548 years in transit."],
  galcenter: ["Message received near the supermassive black hole at galactic center.", "Signal confirmed, 26,000 years after transmission."],
  andromeda: ["Received in the Andromeda Galaxy — this message left before humans existed.", "Signal confirmed, 2.5 million years in transit."],
};

let timerHandle = null;

document.getElementById('sendBtn').addEventListener('click', ()=>{
  const msg = document.getElementById('msgInput').value.trim();
  if(!msg) return;
  const dest = findDest(destSelect.value);
  const km = getDistanceKm(dest);
  const realSec = km / C_KM_S;
  const simSec = simulatedWaitSeconds(realSec);

  document.getElementById('composePanel').classList.add('hidden');
  document.getElementById('transmitPanel').classList.remove('hidden');
  document.getElementById('replyPanel').classList.remove('show');
  document.getElementById('realDelayText').textContent = formatDuration(realSec);
  document.getElementById('transmitStatus').textContent = `SIGNAL EN ROUTE TO ${dest.name.toUpperCase()}`;

  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  fill.classList.remove('reverse');
  fill.style.width = '0%';

  function runLeg(startTime, onDone){
    const elapsed = (Date.now() - startTime)/1000;
    const pct = Math.min(100, (elapsed/simSec)*100);
    fill.style.width = pct+'%';
    const remainingReal = Math.max(0, realSec * (1 - elapsed/simSec));
    label.textContent = realSec > 45
      ? `SIMULATED (COMPRESSED) — REAL DELAY REMAINING: ${formatDuration(remainingReal)}`
      : `${remainingReal.toFixed(2)} sec remaining (real time)`;

    if(elapsed < simSec){
      timerHandle = setTimeout(()=>runLeg(startTime, onDone), 100);
    } else {
      fill.style.width = '100%';
      onDone();
    }
  }

  // leg 1: outbound
  runLeg(Date.now(), ()=>{
    document.getElementById('transmitStatus').textContent = `REACHED ${dest.name.toUpperCase()} — REPLY EN ROUTE BACK`;
    label.textContent = 'PREPARING RETURN SIGNAL...';
    setTimeout(()=>{
      fill.style.width = '0%';
      fill.classList.add('reverse');
      // leg 2: return
      runLeg(Date.now(), ()=>{
        label.textContent = 'DELIVERED';
        showReply(dest, realSec);
      });
    }, 400);
  });
});

function showReply(dest, realSec){
  const options = replyTemplates[dest.id] || ["Signal received."];
  const reply = options[Math.floor(Math.random()*options.length)];
  document.getElementById('replyText').textContent = reply;
  document.getElementById('replyMeta').textContent =
    `Round trip (real): ${formatDuration(realSec*2)} · One-way: ${formatDuration(realSec)}`;
  document.getElementById('replyPanel').classList.add('show');
}

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(timerHandle) clearTimeout(timerHandle);
  document.getElementById('transmitPanel').classList.add('hidden');
  document.getElementById('composePanel').classList.remove('hidden');
  document.getElementById('msgInput').value = '';
  updatePreview();
});
</script>

<script src="/libraries/config.js"></script>
<script src="/libraries/view-counter.js"></script>
<script src="/libraries/hud-home-button.js"></script>

<script src="/tools-data.js"></script>

</body>
