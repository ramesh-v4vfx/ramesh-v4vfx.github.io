<style>
  :root{
    --red:#ff2b2b;
    --red-dim:#ff2b2b55;
    --bg:#050608;
    --panel:#0a0c10;
    --text:#d8dde3;
    --dim:#5a6270;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Mono',monospace;
    overflow:hidden;
    height:100%;
    width:100%;
  }
  #canvas-wrap{position:fixed;inset:0;touch-action:none;cursor:grab;}
  #canvas-wrap.dragging{cursor:grabbing;}
  canvas{display:block;touch-action:none;}

  /* scanlines */
  #scanlines{
    position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:overlay;
  }
  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:49;
    box-shadow: inset 0 0 180px rgba(0,0,0,0.85);
  }

  /* corner brackets */
  .corner{
    position:fixed;width:26px;height:26px;border:2px solid var(--red);
    z-index:60;pointer-events:none;opacity:.85;
  }
  .corner.tl{top:14px;left:14px;border-right:none;border-bottom:none;}
  .corner.tr{top:14px;right:14px;border-left:none;border-bottom:none;}
  .corner.bl{bottom:14px;left:14px;border-right:none;border-top:none;}
  .corner.br{bottom:14px;right:14px;border-left:none;border-top:none;}

  /* top hud bar */
  #topbar{
    position:fixed;top:0;left:0;right:0;z-index:55;
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 40px;
    pointer-events:none;
  }
  #logo{
    font-weight:700;font-size:13px;letter-spacing:2px;color:var(--red);
    text-shadow:0 0 8px var(--red-dim);
    text-decoration:none;pointer-events:auto;cursor:pointer;
    transition:.15s;
  }
  #logo:hover{text-shadow:0 0 14px var(--red-dim);}
  #clock{
    font-size:12px;color:var(--dim);letter-spacing:2px;
  }

  /* top HUD body-select bar — no panel background, just floating buttons */
  #top-controls{
    position:fixed;top:52px;left:0;right:0;z-index:56;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    pointer-events:none;
    padding:0 14px;
  }
  #bodies-row{
    display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;
    max-width:100%;
    pointer-events:auto;
    padding-bottom:2px;
    scrollbar-width:thin;
  }
  #bodies-row::-webkit-scrollbar{height:3px;}
  #bodies-row::-webkit-scrollbar-thumb{background:var(--red-dim);}
  #bodies-row .btn{padding:6px 9px;font-size:9px;}
  #planet-buttons{display:contents;}
  #sim-row{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;
    pointer-events:auto;
    max-width:100%;
  }
  .btn{
    background:transparent;
    border:1px solid var(--dim);
    color:var(--text);
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:1px;
    padding:7px 11px;
    cursor:pointer;
    transition:.15s;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--red);color:var(--red);box-shadow:0 0 8px var(--red-dim);}
  .btn.active{border-color:var(--red);color:var(--red);background:rgba(255,43,43,0.08);}
  .btn.dwarf{border-style:dashed;color:var(--dim);opacity:.85;}
  .btn.dwarf:hover{color:var(--red);}
  .btn.dwarf.active{color:var(--red);}
  #btn-reset{border-color:var(--red);color:var(--red);}
  #btn-reset:hover{box-shadow:0 0 10px var(--red-dim);}

  #speedwrap{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--dim);letter-spacing:1px;}
  #speed{-webkit-appearance:none;width:110px;height:2px;background:var(--dim);outline:none;}
  #speed::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;background:var(--red);cursor:pointer;box-shadow:0 0 6px var(--red);}

  /* info panel */
  #panel{
    position:fixed;top:70px;right:20px;width:280px;
    background:rgba(8,9,12,0.88);
    border:1px solid var(--red-dim);
    padding:0;
    z-index:58;
    opacity:0;
    transform:translateX(20px);
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    backdrop-filter:blur(8px);
  }
  #panel.show{opacity:1;transform:translateX(0);pointer-events:auto;}
  #panel-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 14px;border-bottom:1px solid var(--red-dim);
  }
  #panel-name{color:var(--red);font-weight:700;font-size:14px;letter-spacing:2px;}
  #panel-close{cursor:pointer;color:var(--dim);font-size:14px;}
  #panel-close:hover{color:var(--red);}
  #panel-body{padding:12px 14px;font-size:11px;line-height:1.9;}
  .row{display:flex;justify-content:space-between;border-bottom:1px dashed #ffffff12;padding:3px 0;}
  .row .k{color:var(--dim);letter-spacing:1px;}
  .row .v{color:var(--text);text-align:right;}
  #panel-desc{margin-top:10px;font-size:10.5px;color:var(--dim);line-height:1.7;}

  /* target reticle for locked planet - drawn via canvas overlay div */
  #reticle{
    position:fixed;width:52px;height:52px;z-index:57;pointer-events:none;
    display:none;
  }
  #reticle::before,#reticle::after{
    content:'';position:absolute;border:1px solid var(--red);
  }
  #reticle::before{inset:0;border-radius:50%;opacity:.6;}
  #reticle::after{inset:12px;border-radius:50%;opacity:.9;}
  #reticle .tick{position:absolute;background:var(--red);}
  #reticle .tick.top{top:-10px;left:50%;width:1px;height:8px;transform:translateX(-50%);}
  #reticle .tick.bot{bottom:-10px;left:50%;width:1px;height:8px;transform:translateX(-50%);}
  #reticle .tick.l{left:-10px;top:50%;height:1px;width:8px;transform:translateY(-50%);}
  #reticle .tick.r{right:-10px;top:50%;height:1px;width:8px;transform:translateY(-50%);}

  #hint{
    position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
    font-size:10px;color:var(--dim);letter-spacing:1px;z-index:56;
    text-align:center;
  }
  #scale-note{
    position:fixed;bottom:20px;left:20px;
    font-size:9px;color:var(--dim);letter-spacing:1px;z-index:56;
    opacity:.7;pointer-events:none;max-width:220px;
  }
  #watermark{
    position:fixed;bottom:8px;left:50%;transform:translateX(-50%);
    font-size:9px;color:var(--dim);letter-spacing:2px;z-index:56;
    opacity:.5;pointer-events:none;
  }
  #loading{
    position:fixed;inset:0;z-index:100;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;
  }
  #loading .bar{width:220px;height:2px;background:#222;position:relative;overflow:hidden;}
  #loading .fill{position:absolute;left:0;top:0;height:100%;width:30%;background:var(--red);
    animation:load 1.1s ease-in-out infinite;}
  @keyframes load{
    0%{left:-30%;}
    100%{left:100%;}
  }
  #loading .txt{font-size:11px;letter-spacing:3px;color:var(--dim);}

  @media(max-width:640px){
    #panel{width:calc(100vw - 40px);right:20px;top:64px;}
    #topbar{padding:14px 18px;}
    #logo{font-size:10px;letter-spacing:1px;}
    #clock{display:none;}
    #hint{display:none;}
    #scale-note{bottom:16px;left:18px;}
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

// ---------- DATA (astronomically referenced, visually scaled for legibility) ----------
// distance: AU (semi-major axis), radius: km, period: Earth days, ecc: orbital eccentricity, massKg: real mass
const PLANETS = [
  {name:"MERCURY", color:0x9c9c9c, distAU:0.39, radiusKm:2440, periodDays:88,   dayLenH:1408,  moons:0, ecc:0.2056, massKg:3.301e23, desc:"Smallest planet. No atmosphere to speak of. Surface temps swing over 600°C between day and night."},
  {name:"VENUS",   color:0xe8c27a, distAU:0.72, radiusKm:6052, periodDays:225,  dayLenH:5832,  moons:0, ecc:0.0068, massKg:4.867e24, desc:"Hottest planet in the solar system due to a runaway greenhouse atmosphere of CO2. Rotates backwards."},
  {name:"EARTH",   color:0x2b6fff, distAU:1.00, radiusKm:6371, periodDays:365,  dayLenH:24,    moons:1, ecc:0.0167, massKg:5.972e24, desc:"Only known planet with liquid water oceans covering most of its surface and confirmed life."},
  {name:"MARS",    color:0xc1440e, distAU:1.52, radiusKm:3390, periodDays:687,  dayLenH:24.6,  moons:2, ecc:0.0934, massKg:6.417e23, desc:"The Red Planet. Home to Olympus Mons, the largest volcano in the solar system, and vast dust storms."},
  {name:"JUPITER", color:0xd9b38c, distAU:5.20, radiusKm:69911,periodDays:4333, dayLenH:9.9,   moons:95, ecc:0.0489, massKg:1.898e27, desc:"Largest planet. A gas giant with the Great Red Spot, a storm larger than Earth raging for centuries."},
  {name:"SATURN",  color:0xead6a6, distAU:9.58, radiusKm:58232,periodDays:10759,dayLenH:10.7,  moons:146,ecc:0.0565, massKg:5.683e26, desc:"Famous for its extensive ring system made of ice and rock. Less dense than water.", ring:true},
  {name:"URANUS",  color:0x9fd8d8, distAU:19.2, radiusKm:25362,periodDays:30687,dayLenH:17.2,  moons:28, ecc:0.0457, massKg:8.681e25, desc:"Ice giant that rotates on its side, likely due to an ancient massive impact. Faint ring system.", ring:true, ringThin:true},
  {name:"NEPTUNE", color:0x3b5fd9, distAU:30.05,radiusKm:24622,periodDays:60190,dayLenH:16.1,  moons:16, ecc:0.0113, massKg:1.024e26, desc:"Windiest planet, with supersonic storms. Farthest known planet from the Sun."},
  {name:"CERES",   color:0x9a8f80, distAU:2.77, radiusKm:473,  periodDays:1682,  dayLenH:9.1,   moons:0, ecc:0.0758, massKg:9.38e20, dwarf:true, desc:"Largest object in the asteroid belt and the only IAU-recognized dwarf planet in the inner solar system. Likely holds a subsurface ocean."},
  {name:"PLUTO",   color:0xc9b8a0, distAU:39.5, radiusKm:1188, periodDays:90560, dayLenH:153.3, moons:5, ecc:0.2488, massKg:1.303e22, dwarf:true, desc:"Best-known dwarf planet, reclassified from planet status in 2006. Shares a mutual orbit with its large moon Charon."},
  {name:"HAUMEA",  color:0xdfe6ea, distAU:43.13,radiusKm:780,  periodDays:103410,dayLenH:3.915, moons:2, ecc:0.191,  massKg:4.006e21, dwarf:true, desc:"An extremely elongated, fast-spinning dwarf planet — a full day is under 4 hours, the fastest rotation of any known large solar system body. Wears a thin ring."},
  {name:"MAKEMAKE",color:0xc9a37a, distAU:45.79,radiusKm:715,  periodDays:111845,dayLenH:22.48, moons:1, ecc:0.161,  massKg:3.1e21,  dwarf:true, desc:"A bright, reddish dwarf planet in the Kuiper Belt, discovered in 2005 shortly before Eris. Its single known moon is nicknamed MK 2."},
  {name:"ERIS",    color:0xd8d4cc, distAU:68,   radiusKm:1163, periodDays:203830,dayLenH:25.9,  moons:1, ecc:0.4407, massKg:1.66e22, dwarf:true, desc:"A frozen, distant dwarf planet whose 2005 discovery triggered the debate that redefined what counts as a planet."},
];

const SUN = {name:"SUN", radiusKm:696340, massKg:1.989e30, desc:"G-type main-sequence star. Contains 99.8% of the solar system's mass. Core temperature ~15 million °C."};

// ---------- SCALING ----------
// Distance: spread out logarithmically-ish so inner planets aren't crushed against the sun
// Size: compress hugely (real scale would make the sun a football field vs planets as grains of sand)
const NEPTUNE_AU = 30.05, NEPTUNE_DIST = 26 + NEPTUNE_AU * 34;
function distScale(au){
  if(au <= NEPTUNE_AU) return 26 + au * 34; // true-ish spacing out to Neptune
  // beyond Neptune, compress log-wise so Pluto/Eris/Sedna are reachable & orderly
  return NEPTUNE_DIST + Math.log((au - NEPTUNE_AU) + 1) * 150;
}
function radiusScaleVisible(km){ return Math.max(Math.pow(km, 0.27) * 0.16, 1.15); } // flatter curve + higher floor so small/dwarf bodies are easy to see & click
// TRUE: sizes proportional to the Sun's real radius (9.5 scene units = 696,340 km) — no artificial compression.
// This makes the gas giants look properly small next to the Sun and the terrestrial/dwarf worlds shrink to near-dots,
// which is the actual, honest scale of the solar system.
function radiusScaleTrue(km){ return Math.max((km/696340) * 9.5, 0.012); }

// ---------- KEPLER ORBITAL MECHANICS ----------
// Static ellipse shape for orbit rings, parametrized directly by true anomaly:
// r(nu) = a(1-e^2) / (1 + e*cos(nu))
function ellipseRadiusAt(a, e, nu){
  return a*(1-e*e) / (1 + e*Math.cos(nu));
}
// True motion: mean anomaly (advances linearly with time) -> eccentric anomaly (Newton's method)
// -> true anomaly + radius. This makes bodies genuinely sweep faster near perihelion (Kepler's 2nd law)
// instead of moving at a uniform angular rate.
function solveKepler(meanAnomaly, e){
  let E = meanAnomaly;
  for(let i=0;i<6;i++){
    E = E - (E - e*Math.sin(E) - meanAnomaly)/(1 - e*Math.cos(E));
  }
  const rOverA = 1 - e*Math.cos(E);
  const trueAnom = 2*Math.atan2(Math.sqrt(1+e)*Math.sin(E/2), Math.sqrt(1-e)*Math.cos(E/2));
  return {rOverA, trueAnom};
}
function fmtMass(kg){
  const exp = Math.floor(Math.log10(kg));
  const mant = (kg/Math.pow(10,exp)).toFixed(2);
  const supMap = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  const supExp = String(exp).split('').map(c=>supMap[c]||c).join('');
  return mant + ' × 10' + supExp + ' kg';
}

// ---------- THREE SETUP ----------
const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 8000);
camera.position.set(0, 180, 340);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
wrap.appendChild(renderer.domElement);

// starfield
function makeStars(){
  const geo = new THREE.BufferGeometry();
  const count = 3000;
  const pos = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r = 2200 + Math.random()*1800;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos((Math.random()*2)-1);
    pos[i*3] = r*Math.sin(phi)*Math.cos(theta);
    pos[i*3+1] = r*Math.sin(phi)*Math.sin(theta);
    pos[i*3+2] = r*Math.cos(phi);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({color:0xffffff, size:1.1, sizeAttenuation:true, opacity:0.75, transparent:true});
  scene.add(new THREE.Points(geo, mat));
}
makeStars();

// lights
const ambient = new THREE.AmbientLight(0x404050, 0.5);
scene.add(ambient);
const sunLight = new THREE.PointLight(0xfff2d0, 2.4, 3000, 1.4);
scene.add(sunLight);

// SUN mesh
const sunRadius = 9.5;
const sunGeo = new THREE.SphereGeometry(sunRadius, 48, 48);
const sunMat = new THREE.MeshBasicMaterial({color:0xffb020});
const sunMesh = new THREE.Mesh(sunGeo, sunMat);
sunMesh.userData = {type:'sun'};
scene.add(sunMesh);

// sun glow sprite
(function(){
  const c = document.createElement('canvas'); c.width=256;c.height=256;
  const ctx=c.getContext('2d');
  const g = ctx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,'rgba(255,180,60,0.9)');
  g.addColorStop(0.4,'rgba(255,120,30,0.35)');
  g.addColorStop(1,'rgba(255,80,20,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,256,256);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false});
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(70,70,1);
  scene.add(sprite);
})();

// orbit rings + planets
const planetMeshes = [];
const orbitLines = [];
let orbitsVisible = true;

PLANETS.forEach((p, i)=>{
  const dist = distScale(p.distAU);
  const rad = radiusScaleVisible(p.radiusKm);

  // orbit ring (true ellipse shape, using real eccentricity)
  const segments = 128;
  const ringPts = [];
  const e = p.ecc || 0;
  for(let s=0;s<=segments;s++){
    const nu = (s/segments)*Math.PI*2;
    const r = ellipseRadiusAt(dist, e, nu);
    ringPts.push(new THREE.Vector3(Math.cos(nu)*r, 0, Math.sin(nu)*r));
  }
  const ringGeo = new THREE.BufferGeometry().setFromPoints(ringPts);
  let ringLine;
  if(p.dwarf){
    const ringMat = new THREE.LineDashedMaterial({color:0xff2b2b, transparent:true, opacity:0.28, dashSize:2.2, gapSize:1.6});
    ringLine = new THREE.Line(ringGeo, ringMat);
    ringLine.computeLineDistances();
  } else {
    const ringMat = new THREE.LineBasicMaterial({color:0xff2b2b, transparent:true, opacity:0.22});
    ringLine = new THREE.Line(ringGeo, ringMat);
  }
  scene.add(ringLine);
  orbitLines.push(ringLine);

  // planet
  const geo = new THREE.SphereGeometry(rad, 32, 32);
  const mat = new THREE.MeshStandardMaterial({color:p.color, roughness:0.85, metalness:0.05});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData = {type:'planet', index:i};
  scene.add(mesh);

  // saturn/uranus rings
  let ringMesh = null;
  if(p.ring){
    const inner = rad * (p.ringThin? 1.3 : 1.4);
    const outer = rad * (p.ringThin? 1.55 : 2.1);
    const rGeo = new THREE.RingGeometry(inner, outer, 64);
    // fix UV for radial gradient look
    const rMat = new THREE.MeshBasicMaterial({color:0xcbb98a, side:THREE.DoubleSide, transparent:true, opacity:p.ringThin?0.35:0.6});
    ringMesh = new THREE.Mesh(rGeo, rMat);
    ringMesh.rotation.x = Math.PI/2 * 0.92;
    scene.add(ringMesh);
  }

  // label sprite (small dot handled via reticle in screen space instead)
  planetMeshes.push({
    mesh, ringMesh, data:p, dist,
    angle: Math.random()*Math.PI*2, // mean anomaly, advances linearly with real time
    meanMotion: (Math.PI*2) / p.periodDays, // radians per simulated day — tied directly to real orbital period
    rotSpeed: 0.01 + Math.random()*0.02
  });
});

// ---------- CAMERA CONTROLS (lightweight orbit control, no extra lib needed) ----------
let camTheta = 0.9, camPhi = 1.48, camRadius = 60;
let targetTheta = camTheta, targetPhi = camPhi, targetRadius = camRadius;
let camFocus = new THREE.Vector3(0,0,0);

function updateCamera(){
  camTheta += (targetTheta-camTheta)*0.08;
  camPhi += (targetPhi-camPhi)*0.08;
  camRadius += (targetRadius-camRadius)*0.08;
  camPhi = Math.max(0.15, Math.min(Math.PI-0.15, camPhi));
  const x = camFocus.x + camRadius*Math.sin(camPhi)*Math.cos(camTheta);
  const y = camFocus.y + camRadius*Math.cos(camPhi);
  const z = camFocus.z + camRadius*Math.sin(camPhi)*Math.sin(camTheta);
  camera.position.set(x,y,z);
  camera.lookAt(camFocus);
}

renderer.domElement.addEventListener('contextmenu', e=>e.preventDefault());

let dragging = false, lastX=0, lastY=0;
let panning = false, panLastX=0, panLastY=0;

function panCamera(dx, dy){
  const panSpeed = camRadius * 0.0016;
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
  const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
  camFocus.addScaledVector(right, -dx*panSpeed);
  camFocus.addScaledVector(up, dy*panSpeed);
}

renderer.domElement.addEventListener('pointerdown', e=>{
  if(e.button===2){
    panning=true; panLastX=e.clientX; panLastY=e.clientY;
    if(lockedIndex!==null) deselect();
  } else {
    dragging=true; lastX=e.clientX; lastY=e.clientY;
  }
  wrap.classList.add('dragging');
});
window.addEventListener('pointerup', ()=>{dragging=false; panning=false; wrap.classList.remove('dragging');});
window.addEventListener('pointermove', e=>{
  if(panning){
    const dx = e.clientX-panLastX, dy = e.clientY-panLastY;
    panLastX=e.clientX; panLastY=e.clientY;
    panCamera(dx, dy);
    return;
  }
  if(!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  targetTheta -= dx*0.005;
  targetPhi -= dy*0.005;
});
renderer.domElement.addEventListener('wheel', e=>{
  e.preventDefault();
  targetRadius *= (1 + e.deltaY*0.001);
  targetRadius = Math.max(0.6, Math.min(2600, targetRadius));
},{passive:false});

// touch: 1-finger rotate (handled by pointer events above), 2-finger pinch-zoom + pan
let pinchStart=null, touchPanX=null, touchPanY=null;
renderer.domElement.addEventListener('touchmove', e=>{
  if(e.touches.length===2){
    const t0=e.touches[0], t1=e.touches[1];
    const dx=t0.clientX-t1.clientX, dy=t0.clientY-t1.clientY;
    const d=Math.hypot(dx,dy);
    const midX=(t0.clientX+t1.clientX)/2, midY=(t0.clientY+t1.clientY)/2;
    if(pinchStart!=null){
      targetRadius *= (pinchStart/d);
      targetRadius = Math.max(0.6, Math.min(2600, targetRadius));
    }
    if(touchPanX!=null){
      if(lockedIndex!==null) deselect();
      panCamera(midX-touchPanX, midY-touchPanY);
    }
    pinchStart=d; touchPanX=midX; touchPanY=midY;
  }
},{passive:true});
renderer.domElement.addEventListener('touchend', e=>{
  if(e.touches.length<2){ pinchStart=null; touchPanX=null; touchPanY=null; }
});

// ---------- RAYCAST CLICK ----------
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let lockedIndex = null; // null = free, 'sun', or planet index

function onClick(e){
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse, camera);
  raycaster.params.Points.threshold = 0.5;
  const targets = [sunMesh, ...planetMeshes.map(p=>p.mesh)];
  const hits = raycaster.intersectObjects(targets);
  if(hits.length){
    const obj = hits[0].object;
    if(obj.userData.type==='sun') selectSun();
    else selectPlanet(obj.userData.index);
  }
}
renderer.domElement.addEventListener('click', e=>{
  // only treat as click if not a drag
  if(Math.abs(e.clientX-clickStartX)<4 && Math.abs(e.clientY-clickStartY)<4) onClick(e);
});
let clickStartX=0, clickStartY=0;
renderer.domElement.addEventListener('pointerdown', e=>{clickStartX=e.clientX;clickStartY=e.clientY;});

// ---------- PANEL / SELECTION ----------
const panel = document.getElementById('panel');
const panelName = document.getElementById('panel-name');
const panelBody = document.getElementById('panel-body');
const panelClose = document.getElementById('panel-close');
const reticle = document.getElementById('reticle');

function fmt(n){ return n.toLocaleString(); }

function selectSun(){
  lockedIndex = 'sun';
  targetRadius = Math.max(targetRadius, 60);
  camFocus.set(0,0,0);
  panelName.textContent = 'SUN';
  panelBody.innerHTML = `
    <div class="row"><span class="k">TYPE</span><span class="v">G-TYPE STAR</span></div>
    <div class="row"><span class="k">RADIUS</span><span class="v">${fmt(SUN.radiusKm)} km</span></div>
    <div class="row"><span class="k">MASS</span><span class="v">${fmtMass(SUN.massKg)}</span></div>
    <div class="row"><span class="k">MASS SHARE</span><span class="v">99.8%</span></div>
    <div id="panel-desc">${SUN.desc}</div>
  `;
  panel.classList.add('show');
  highlightButtons('SUN');
}

function selectPlanet(i){
  lockedIndex = i;
  const p = PLANETS[i];
  panelName.textContent = p.name;
  panelBody.innerHTML = `
    <div class="row"><span class="k">TYPE</span><span class="v">${p.dwarf ? 'DWARF PLANET' : 'PLANET'}</span></div>
    <div class="row"><span class="k">DIST FROM SUN</span><span class="v">${p.distAU} AU</span></div>
    <div class="row"><span class="k">ECCENTRICITY</span><span class="v">${p.ecc.toFixed(4)}</span></div>
    <div class="row"><span class="k">RADIUS</span><span class="v">${fmt(p.radiusKm)} km</span></div>
    <div class="row"><span class="k">MASS</span><span class="v">${fmtMass(p.massKg)}</span></div>
    <div class="row"><span class="k">ORBITAL PERIOD</span><span class="v">${fmt(p.periodDays)} days</span></div>
    <div class="row"><span class="k">DAY LENGTH</span><span class="v">${fmt(Math.round(p.dayLenH))} hrs</span></div>
    <div class="row"><span class="k">MOONS</span><span class="v">${p.moons}</span></div>
    <div id="panel-desc">${p.desc}</div>
  `;
  panel.classList.add('show');
  highlightButtons(p.name);
}

function deselect(){
  lockedIndex = null;
  panel.classList.remove('show');
  reticle.style.display = 'none';
  highlightButtons(null);
}
panelClose.addEventListener('click', deselect);

function highlightButtons(name){
  document.querySelectorAll('#planet-buttons .btn, #btn-sun').forEach(b=>{
    b.classList.toggle('active', b.dataset.name===name);
  });
}

// buttons
document.getElementById('btn-sun').dataset.name = 'SUN';
document.getElementById('btn-sun').addEventListener('click', selectSun);
const pbWrap = document.getElementById('planet-buttons');
PLANETS.forEach((p,i)=>{
  const b = document.createElement('button');
  b.className = p.dwarf ? 'btn dwarf' : 'btn';
  b.textContent=p.name; b.dataset.name=p.name;
  b.addEventListener('click', ()=>selectPlanet(i));
  pbWrap.appendChild(b);
});

// ---------- SIM CONTROLS ----------
let simSpeed = 40;
let paused = false;
document.getElementById('speed').addEventListener('input', e=>{ simSpeed = +e.target.value; });
document.getElementById('btn-pause').addEventListener('click', function(){
  paused = !paused;
  this.textContent = paused ? 'RESUME' : 'PAUSE';
  this.classList.toggle('active', paused);
});
document.getElementById('btn-orbits').addEventListener('click', function(){
  orbitsVisible = !orbitsVisible;
  orbitLines.forEach(l=>l.visible=orbitsVisible);
  this.textContent = 'ORBITS: ' + (orbitsVisible?'ON':'OFF');
});
document.getElementById('btn-reset').addEventListener('click', function(){
  // camera back to default view
  targetTheta = 0.9; targetPhi = 1.48; targetRadius = 60;
  camFocus.set(0,0,0);
  deselect();

  // sim back to default speed & running
  simSpeed = 40;
  document.getElementById('speed').value = 40;
  paused = false;
  document.getElementById('btn-pause').textContent = 'PAUSE';
  document.getElementById('btn-pause').classList.remove('active');

  // orbits back on
  orbitsVisible = true;
  orbitLines.forEach(l=>l.visible=true);
  document.getElementById('btn-orbits').textContent = 'ORBITS: ON';

  // scale back to true (the default)
  if(scaleMode !== 'true'){
    scaleMode = 'true';
    applyRadiusScale(radiusScaleTrue);
    document.getElementById('btn-scale').textContent = '⇄ SCALE PLANETS: ' + (scaleMode === 'true' ? 'TRUE' : 'ENHANCED');
    document.getElementById('btn-scale').classList.add('active');
    document.getElementById('scale-note').textContent = 'TRUE PLANET SCALE — DISTANCES ARE STYLIZED';
  }
});

let scaleMode = 'true'; // 'visible' | 'true' — TRUE is the default
function applyRadiusScale(fn){
  planetMeshes.forEach(pm=>{
    const newRad = fn(pm.data.radiusKm);
    pm.mesh.geometry.dispose();
    pm.mesh.geometry = new THREE.SphereGeometry(newRad, 32, 32);
    if(pm.ringMesh){
      const inner = newRad * (pm.data.ringThin ? 1.3 : 1.4);
      const outer = newRad * (pm.data.ringThin ? 1.55 : 2.1);
      pm.ringMesh.geometry.dispose();
      pm.ringMesh.geometry = new THREE.RingGeometry(inner, outer, 64);
    }
  });
}
applyRadiusScale(radiusScaleTrue); // TRUE scale is now the default on load

document.getElementById('btn-scale').addEventListener('click', function(){
  scaleMode = scaleMode === 'true' ? 'visible' : 'true';
  applyRadiusScale(scaleMode === 'true' ? radiusScaleTrue : radiusScaleVisible);
  this.textContent = '⇄ SCALE PLANETS: ' + (scaleMode === 'true' ? 'TRUE' : 'ENHANCED');
  this.classList.toggle('active', scaleMode === 'true');
  document.getElementById('scale-note').textContent = scaleMode === 'true'
    ? 'TRUE PLANET SCALE — DISTANCES ARE STYLIZED'
    : 'NOT TO SCALE — DISTANCES & SIZES ARE STYLIZED';
});

// ---------- ANIMATE ----------
const clock = new THREE.Clock();
const tmpVec = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(!paused){
    // simSpeed = simulated Earth-days advanced per real second, so relative
    // planet speeds match Kepler's third law exactly (using real periodDays)
    const simDaysThisFrame = dt * simSpeed;
    planetMeshes.forEach(pm=>{
      pm.angle += simDaysThisFrame * pm.meanMotion;
      const {rOverA, trueAnom} = solveKepler(pm.angle % (Math.PI*2), pm.data.ecc||0);
      const r = pm.dist * rOverA;
      const x = Math.cos(trueAnom)*r;
      const z = Math.sin(trueAnom)*r;
      pm.mesh.position.set(x,0,z);
      pm.mesh.rotation.y += dt*pm.rotSpeed*10;
      if(pm.ringMesh) pm.ringMesh.position.set(x,0,z);
    });
  }

  // camera focus follow if locked
  if(lockedIndex==='sun'){
    camFocus.lerp(new THREE.Vector3(0,0,0), 0.1);
  } else if(typeof lockedIndex === 'number'){
    const pm = planetMeshes[lockedIndex];
    camFocus.lerp(pm.mesh.position, 0.15);
  }

  updateCamera();

  // reticle screen-space position
  if(typeof lockedIndex === 'number' || lockedIndex==='sun'){
    const targetPos = lockedIndex==='sun' ? new THREE.Vector3(0,0,0) : planetMeshes[lockedIndex].mesh.position;
    tmpVec.copy(targetPos);
    tmpVec.project(camera);
    const sx = (tmpVec.x*0.5+0.5) * window.innerWidth;
    const sy = (-tmpVec.y*0.5+0.5) * window.innerHeight;
    if(tmpVec.z < 1){
      reticle.style.display = 'block';
      reticle.style.left = (sx-26)+'px';
      reticle.style.top = (sy-26)+'px';
    } else {
      reticle.style.display = 'none';
    }
  }

  renderer.render(scene, camera);
}

// ---------- RESIZE ----------
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- CLOCK HUD ----------
function tickClock(){
  const el = document.getElementById('clock');
  const now = new Date();
  el.textContent = 'T+ ' + now.toISOString().replace('T',' ').slice(0,19) + ' UTC';
}
setInterval(tickClock, 1000);
tickClock();

// ---------- LOADING ----------
setTimeout(()=>{
  document.getElementById('loading').style.opacity='0';
  document.getElementById('loading').style.transition='opacity .4s';
  setTimeout(()=>document.getElementById('loading').remove(), 450);
}, 500);

updateCamera();
animate();

})();
</script>
