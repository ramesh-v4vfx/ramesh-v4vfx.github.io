<!DOCTYPE html>
<html lang="en">
<head>

<!-- Analytics consent: loads the Google tag only after the visitor accepts -->
<script src="/libraries/rv-analytics.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Explore an interactive 3D solar system model drawn fully to scale — real distances and sizes, today's planet positions, Kepler orbits, moons, and data on every planet and dwarf planet.">

<title>Solar System Simulator | rameshverse</title>

<link rel="canonical" href="https://rameshverse.com/solar-system-simulator">

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --red:#ff2b2b;
    --red-dim:#ff2b2b55;
    --bg:#050608;
    --panel:#0a0c10;
    --text:#d8dde3;
    --dim:#7a8494;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Mono',monospace;
    overflow:hidden;
    height:100%;
    width:100%;
  }
  #canvas-wrap{position:fixed;inset:0;touch-action:none;cursor:grab;}
  #canvas-wrap.dragging{cursor:grabbing;}
  canvas{display:block;touch-action:none;}

  /* scanlines */
  #scanlines{
    position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:overlay;
  }
  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:49;
    box-shadow: inset 0 0 180px rgba(0,0,0,0.85);
  }

  /* corner brackets */
  .corner{
    position:fixed;width:26px;height:26px;border:2px solid var(--red);
    z-index:60;pointer-events:none;opacity:.85;
  }
  .corner.tl{top:14px;left:14px;border-right:none;border-bottom:none;}
  .corner.tr{top:14px;right:14px;border-left:none;border-bottom:none;}
  .corner.bl{bottom:14px;left:14px;border-right:none;border-top:none;}
  .corner.br{bottom:14px;right:14px;border-left:none;border-top:none;}

  /* top hud bar */
  #topbar{
    position:fixed;top:0;left:0;right:0;z-index:55;
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 40px;
    pointer-events:none;
  }
  #logo{
    font-weight:400;font-size:10px;letter-spacing:2px;color:var(--dim);opacity:.7;
    text-decoration:none;pointer-events:auto;cursor:pointer;
    transition:.15s;
  }
  #logo:hover{color:var(--text);opacity:1;}
  #clock{
    font-size:12px;color:var(--dim);letter-spacing:2px;
  }
  /* paused: the date readout turns red and says so */
  #clock.paused{color:var(--red);text-shadow:0 0 8px var(--red-dim);}

  /* top HUD: one row of the Sun + planets, a search drawer for everything else, and a moons row that only appears when it is relevant */
  body.has-panel #top-controls{padding-right:410px;}
  #top-controls{
  transition:padding .25s ease;
    position:fixed;top:52px;left:0;right:0;z-index:56;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    pointer-events:none;
    padding:0 14px;
  }
  .body-row{
    display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;align-items:center;
    max-width:100%;
    pointer-events:auto;
    padding-bottom:2px;
    scrollbar-width:thin;
  }
  .body-row::-webkit-scrollbar{height:3px;}
  .body-row::-webkit-scrollbar-thumb{background:var(--red-dim);}
  .body-row .btn{padding:8px 11px;font-size:10.5px;}
  .body-row .row-tag{font-size:9px;letter-spacing:2px;color:var(--dim);opacity:.85;padding-right:2px;white-space:nowrap;flex:none;}
  #moons-row{display:none;}
  #moons-row.show{display:flex;}
  #moons-row .btn{font-size:10px;padding:6px 9px;}
  #moons-row .btn.k-moon{border-color:var(--c);}
  #moons-row .row-tag{color:#82FFE0;opacity:.9;}
  .btn.moon{border-color:rgba(255,255,255,.18);}
  #planet-buttons{display:contents;}
  .btn{
    background:rgba(5,6,8,.55);
    border:1px solid var(--dim);
    color:var(--text);
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:1px;
    padding:8px 12px;
    cursor:pointer;
    transition:.15s;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--red);color:var(--red);box-shadow:0 0 8px var(--red-dim);}
  .btn.active{border-color:var(--red);color:var(--red);background:rgba(255,43,43,0.08);}
  #btn-reset{border-color:var(--red);color:var(--red);}
  #btn-reset:hover{box-shadow:0 0 10px var(--red-dim);}

  /* every body on screen at once (about three rows), colour-coded by kind */
  #bodies-row{flex-wrap:wrap;justify-content:center;overflow:visible;max-width:min(940px,100%);row-gap:6px;}
  .btn.k-star{--c:#ffb347;}
  .btn.k-planet{--c:#6fd3ff;}
  .btn.k-dwarf{--c:#b69cff;}
  .btn.k-distant{--c:#C8F542;}
  .btn.k-craft{--c:#ff8fcf;}
  .btn.k-moon{--c:#82FFE0;}
  .body-btn[class*="k-"]{color:var(--c);border-color:color-mix(in srgb, var(--c) 55%, transparent);}
  .body-btn[class*="k-"]:hover{border-color:var(--c);color:#fff;box-shadow:0 0 8px color-mix(in srgb, var(--c) 50%, transparent);}
  .body-btn[class*="k-"].active{background:var(--c);border-color:var(--c);color:#050608;box-shadow:0 0 10px color-mix(in srgb, var(--c) 60%, transparent);}
  #cat-row{flex-wrap:wrap;justify-content:center;overflow:visible;}
  #cat-open-row{display:none;flex-wrap:wrap;justify-content:center;overflow:visible;row-gap:6px;max-width:min(940px,100%);}
  #cat-open-row.show{display:flex;}
  .cat-btn{color:var(--c);border-color:color-mix(in srgb, var(--c) 55%, transparent);border-style:dashed;}
  .cat-btn .n{opacity:.6;}
  .cat-btn .car{display:inline-block;transition:transform .15s;}
  .cat-btn:hover{border-color:var(--c);color:#fff;}
  .cat-btn.active{color:var(--c);border-style:solid;border-color:var(--c);background:color-mix(in srgb, var(--c) 18%, transparent);}
  .cat-btn.active .car{transform:rotate(180deg);}

  /* bottom dock: time controls + view controls */
  #dock{
    position:fixed;left:50%;bottom:52px;transform:translateX(-50%);z-index:57;
    display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:center;align-items:center;
    width:max-content;max-width:calc(100vw - 24px);
    transition:opacity .5s;
  }
  .dock-group{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(8,9,12,.62);border:1px solid #ffffff14;padding:6px 8px;
    backdrop-filter:blur(6px);
  }
  #dock-toggle{display:none;}
  #speedwrap{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--dim);letter-spacing:1px;}
  #speed{-webkit-appearance:none;width:110px;height:2px;background:var(--dim);outline:none;}
  #speed::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:var(--red);cursor:pointer;box-shadow:0 0 6px var(--red);}
  /* Firefox: same red square thumb and thin track as the other browsers */
  #speed::-moz-range-thumb{width:12px;height:12px;background:var(--red);border:none;border-radius:0;cursor:pointer;box-shadow:0 0 6px var(--red);}
  #speed::-moz-range-track{height:2px;background:var(--dim);}
  #speed-val{min-width:64px;color:var(--text);letter-spacing:1px;}
  #date-input{
    background:transparent;border:1px solid var(--dim);color:var(--text);
    font-family:inherit;font-size:11px;padding:7px 8px;letter-spacing:1px;color-scheme:dark;
  }
  #date-input:hover,#date-input:focus{border-color:var(--red);outline:none;}

  /* info panel: Terminator-style target readout */
  #panel{
    --c:#6fd3ff;
    position:fixed;top:52px;right:20px;width:366px;max-height:calc(100vh - 168px);
    display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,rgba(20,6,8,.92),rgba(7,8,11,.93) 38%);
    border:1px solid var(--red-dim);
    box-shadow:0 0 24px rgba(255,43,43,.10), inset 0 0 40px rgba(255,43,43,.05);
    z-index:58;
    opacity:0;
    transform:translateX(20px);
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    backdrop-filter:blur(8px);
  }
  #panel.show{opacity:1;transform:translateX(0);pointer-events:auto;}
  /* corner brackets + faint scan lines + a slow sweep */
  #panel::before{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:3;
    background:
      linear-gradient(var(--red),var(--red)) top left/14px 2px no-repeat,
      linear-gradient(var(--red),var(--red)) top left/2px 14px no-repeat,
      linear-gradient(var(--red),var(--red)) top right/14px 2px no-repeat,
      linear-gradient(var(--red),var(--red)) top right/2px 14px no-repeat,
      linear-gradient(var(--red),var(--red)) bottom left/14px 2px no-repeat,
      linear-gradient(var(--red),var(--red)) bottom left/2px 14px no-repeat,
      linear-gradient(var(--red),var(--red)) bottom right/14px 2px no-repeat,
      linear-gradient(var(--red),var(--red)) bottom right/2px 14px no-repeat;
  }
  #panel::after{
    content:'';position:absolute;left:0;right:0;top:0;height:90px;pointer-events:none;z-index:2;
    background:linear-gradient(180deg,transparent,rgba(255,43,43,.07),transparent);
    animation:panelSweep 5s linear infinite;
  }
  @keyframes panelSweep{0%{transform:translateY(-100px);}100%{transform:translateY(520px);}}
  #panel-head{
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex:none;
    padding:14px 16px 12px;border-bottom:1px solid var(--red-dim);
    background:linear-gradient(90deg,rgba(255,43,43,.14),transparent 75%);
  }
  #panel-acq{display:flex;align-items:center;gap:7px;font-size:9px;letter-spacing:3px;color:var(--red);opacity:.9;}
  #panel-acq i{width:6px;height:6px;background:var(--red);box-shadow:0 0 8px var(--red);animation:acqBlink 1.1s steps(2,end) infinite;}
  @keyframes acqBlink{50%{opacity:.15;}}
  #panel-title{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:6px;}
  #panel-name{color:#fff;font-weight:700;font-size:21px;letter-spacing:3px;text-shadow:0 0 12px rgba(255,43,43,.45);line-height:1.15;}
  #panel-tag{
    display:inline-block;padding:2px 8px;font-size:9.5px;letter-spacing:2px;
    color:var(--c);border:1px solid var(--c);background:color-mix(in srgb, var(--c) 12%, transparent);
  }
  #panel-close{cursor:pointer;color:var(--dim);font-size:15px;padding:2px 6px;flex:none;}
  #panel-close:hover{color:var(--red);}
  #panel-body{padding:4px 16px 16px;font-size:12px;line-height:1.5;overflow-y:auto;flex:1;position:relative;z-index:1;scrollbar-width:thin;scrollbar-color:var(--red-dim) transparent;}
  #panel-body::-webkit-scrollbar{width:4px;}
  #panel-body::-webkit-scrollbar-thumb{background:var(--red-dim);}
  .sec{display:flex;align-items:center;gap:10px;margin:16px 0 4px;font-size:9.5px;letter-spacing:3px;color:var(--red);}
  .sec::before{content:'▸';font-size:9px;}
  .sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--red-dim),transparent);}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;border-bottom:1px solid #ffffff0d;padding:6px 0;}
  .row .k{color:var(--dim);letter-spacing:1.2px;font-size:10px;white-space:nowrap;}
  .row .v{color:#f1f4f9;text-align:right;font-size:12px;letter-spacing:.2px;}
  .row.live .v{color:#ffd9d9;text-shadow:0 0 8px rgba(255,43,43,.4);}
  #panel-brief .sec{margin-top:14px;}
  #panel-desc{
    position:relative;margin-top:8px;padding:11px 12px 11px 16px;font-size:12px;color:#ffc9c9;line-height:1.75;
    min-height:64px;letter-spacing:.3px;
    border:1px solid var(--red-dim);border-left:3px solid var(--red);
    background:linear-gradient(90deg,rgba(255,43,43,.12),rgba(255,43,43,.03));
    text-shadow:0 0 6px rgba(255,43,43,.35);
  }
  #panel-desc::before{content:'> ';position:absolute;left:5px;top:11px;color:var(--red);}
  #panel-desc .cur{display:inline-block;width:7px;height:12px;margin-left:2px;vertical-align:-1px;background:var(--red);box-shadow:0 0 8px var(--red);animation:acqBlink .8s steps(2,end) infinite;}
  #panel-actions{position:sticky;bottom:0;z-index:2;margin-top:16px;padding-top:8px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,transparent,rgba(7,8,11,.95) 14px);}
  #btn-fly,#btn-surf{
    width:100%;padding:9px 10px;border-color:var(--red);color:var(--red);
    letter-spacing:2px;font-size:11px;background:#1a090c;
  }
  #btn-fly span,#btn-surf span{font-size:9px;margin-right:6px;}
  #btn-surf:hover{box-shadow:0 0 14px var(--red-dim);background:rgba(255,43,43,.16);color:#fff;}
  #btn-fly:hover{box-shadow:0 0 14px var(--red-dim);background:rgba(255,43,43,.16);color:#fff;}

  /* target reticle for locked planet - drawn via canvas overlay div */
  #reticle{
    position:fixed;width:52px;height:52px;z-index:57;pointer-events:none;
    display:none;
  }
  #reticle::before,#reticle::after{
    content:'';position:absolute;border:1px solid var(--red);
  }
  #reticle::before{inset:0;border-radius:50%;opacity:.6;}
  #reticle::after{inset:12px;border-radius:50%;opacity:.9;}
  #reticle .tick{position:absolute;background:var(--red);}
  #reticle .tick.top{top:-10px;left:50%;width:1px;height:8px;transform:translateX(-50%);}
  #reticle .tick.bot{bottom:-10px;left:50%;width:1px;height:8px;transform:translateX(-50%);}
  #reticle .tick.l{left:-10px;top:50%;height:1px;width:8px;transform:translateY(-50%);}
  #reticle .tick.r{right:-10px;top:50%;height:1px;width:8px;transform:translateY(-50%);}

  #hint{
    position:fixed;bottom:156px;left:50%;transform:translateX(-50%);
    font-size:10px;color:var(--dim);letter-spacing:1px;z-index:56;
    text-align:center;width:max-content;max-width:calc(100vw - 30px);
    pointer-events:none;transition:opacity .8s;
  }
  #hint.fade{opacity:0;}
  #hint .keys{display:block;margin-top:5px;opacity:.9;}
  #hint kbd{font-family:inherit;font-size:9.5px;color:var(--text);border:1px solid var(--dim);padding:0 4px;margin-right:3px;}
  #scale-note{
    position:fixed;bottom:20px;left:20px;
    font-size:9.5px;color:var(--dim);letter-spacing:1px;z-index:56;
    opacity:.85;pointer-events:none;max-width:300px;transition:opacity .5s;
  }
  #watermark{
    position:fixed;bottom:8px;left:50%;transform:translateX(-50%);
    font-size:9px;color:var(--dim);letter-spacing:2px;z-index:56;
    opacity:.5;pointer-events:none;
  }
  #loading{
    position:fixed;inset:0;z-index:100;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;
  }
  #loading .bar{width:220px;height:2px;background:#222;position:relative;overflow:hidden;}
  #loading .fill{position:absolute;left:0;top:0;height:100%;width:30%;background:var(--red);
    animation:load 1.1s ease-in-out infinite;}
  @keyframes load{
    0%{left:-30%;}
    100%{left:100%;}
  }
  #loading .txt{font-size:11px;letter-spacing:3px;color:var(--dim);}

  /* name labels (HTML overlay) */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:54;overflow:hidden;transition:opacity .6s;}
  .lbl{
    position:absolute;left:0;top:0;display:none;
    font-size:10px;letter-spacing:1.2px;color:var(--c,#cfd5dc);opacity:.95;
    padding:2px 3px;white-space:nowrap;cursor:pointer;pointer-events:auto;
    text-shadow:0 0 4px #000,0 0 2px #000,0 0 8px #000;will-change:transform;
  }
  .lbl:hover{color:#fff;}
  .lbl.moon{font-size:9px;letter-spacing:1px;opacity:1;}
  .lbl.craft{font-size:9.5px;}
  .lbl.sel{color:var(--red);}
  #scalebar{
    position:fixed;right:40px;bottom:22px;z-index:56;text-align:center;
    font-size:9.5px;letter-spacing:1px;color:var(--dim);pointer-events:none;transition:opacity .5s;
  }
  #scalebar .bar{height:6px;border:1px solid var(--dim);border-top:none;margin:4px auto 0;}

  /* cinematic intro */
  #caption{
    position:fixed;left:50%;bottom:20%;transform:translateX(-50%);z-index:70;
    text-align:center;pointer-events:none;opacity:0;transition:opacity .7s;
    max-width:92vw;
  }
  #caption.on{opacity:1;}
  #caption .c1{font-size:22px;letter-spacing:6px;color:#fff;text-shadow:0 0 18px #000,0 0 6px #000;}
  #caption .c2{margin-top:8px;font-size:11px;letter-spacing:3px;color:var(--red);text-shadow:0 0 10px #000;}
  #btn-skip-intro{display:none;position:fixed;right:24px;bottom:56px;z-index:80;}
  body.intro #top-controls, body.intro #legend, body.intro #dock, body.intro #hint, body.intro #scale-note,
  body.intro #scalebar, body.intro #clock{opacity:0;pointer-events:none;}
  body.intro #top-controls *, body.intro #dock *{pointer-events:none;}

  /* light-speed flight */
  #flight-hud{
    position:fixed;left:50%;bottom:52px;transform:translateX(-50%);z-index:60;
    min-width:min(460px,calc(100vw - 24px));text-align:center;
    background:rgba(8,9,12,.82);border:1px solid var(--red-dim);padding:12px 16px;
    backdrop-filter:blur(8px);display:none;
  }
  #flight-hud.show{display:block;}
  #fl-title{font-size:11px;letter-spacing:3px;color:var(--red);}
  #fl-time{font-size:26px;letter-spacing:2px;margin:6px 0 2px;color:#fff;}
  #fl-dist{font-size:11px;color:var(--dim);letter-spacing:1px;}
  .fl-row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px;}
  #fl-warp{font-size:10.5px;color:var(--dim);letter-spacing:1px;margin-right:4px;}
  #fl-real.active{border-color:var(--red);color:var(--red);}
  body.flying #dock, body.flying #hint, body.flying #legend{opacity:0;pointer-events:none;}

  /* first-visit tour */
  #tour-hl{
    position:fixed;z-index:89;display:none;pointer-events:none;
    border:2px solid var(--red);box-shadow:0 0 0 9999px rgba(0,0,0,.55),0 0 16px var(--red-dim);
    transition:left .25s,top .25s,width .25s,height .25s;
  }
  #tour{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:90;
    width:min(430px,calc(100vw - 28px));
    background:rgba(8,9,12,.96);border:1px solid var(--red);padding:16px 18px;
    display:none;box-shadow:0 0 30px rgba(255,43,43,.18);
  }
  #tour.show{display:block;}
  #tour .tn{font-size:10px;letter-spacing:2px;color:var(--dim);}
  #tour .tt{margin:6px 0 8px;font-size:14px;letter-spacing:2px;color:var(--red);font-weight:700;}
  #tour .tb{font-size:12px;line-height:1.75;color:var(--text);}
  #tour .tbtn{display:flex;justify-content:space-between;gap:10px;margin-top:14px;}

  /* view from a surface */
  #surfcap{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);z-index:60;width:min(560px,90vw);text-align:center;pointer-events:none;text-shadow:0 0 12px #000,0 0 4px #000;}
  #surfcap[hidden],#btn-exit-surf[hidden]{display:none;}
  #surfcap .tg{font-size:9.5px;letter-spacing:3px;color:var(--red);}
  #surfcap h3{margin:6px 0 8px;font-size:24px;letter-spacing:4px;color:#fff;font-weight:700;}
  #surfcap p{margin:3px 0;font-size:11px;letter-spacing:1.2px;color:#d6dcdf;}
  #surfcap small{display:block;margin-top:8px;font-size:8.5px;letter-spacing:2px;color:var(--dim);}
  #btn-exit-surf{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:80;padding:13px 26px;font-size:13px;font-weight:700;letter-spacing:3px;color:#fff;
    border:2px solid var(--red);background:rgba(255,43,43,.22);box-shadow:0 0 22px rgba(255,43,43,.45), inset 0 0 14px rgba(255,43,43,.18);}
  #btn-exit-surf:hover{background:var(--red);color:#050608;box-shadow:0 0 30px rgba(255,43,43,.7);}
  body.surf #top-controls, body.surf #dock, body.surf #hint, body.surf #scale-note, body.surf #scalebar, body.surf #panel,
  body.surf #btn-info, body.surf #dock-toggle, body.surf #reticle, body.surf #labels{opacity:0 !important;pointer-events:none !important;}
  #toast{
    position:fixed;left:50%;top:96px;transform:translateX(-50%);z-index:95;
    background:rgba(8,9,12,.92);border:1px solid var(--red-dim);color:var(--text);
    font-size:11px;letter-spacing:1.5px;padding:9px 14px;opacity:0;pointer-events:none;transition:opacity .3s;
    max-width:calc(100vw - 24px);text-align:center;
  }
  #toast.on{opacity:1;}

  /* H: hide the whole HUD for clean screen recordings */
  body.hud-hidden #topbar, body.hud-hidden #top-controls, body.hud-hidden #panel,

// ---------- ORBITAL MECHANICS ----------
function makeElements(o){
  const i=o.i*DEG, om=o.om*DEG, w=o.w*DEG;
  const cw=Math.cos(w), sw=Math.sin(w), co=Math.cos(om), so=Math.sin(om), ci=Math.cos(i), si=Math.sin(i);
  return {
    jd0:o.jd0, a:o.a, e:o.e, i, om, w, M0:o.M0*DEG,
    n: (o.n !== undefined) ? o.n : TWO_PI/(365.25636*Math.pow(o.a,1.5)),   // mean motion, rad/day
    P11: cw*co - sw*so*ci,  P12: -sw*co - cw*so*ci,
    P21: cw*so + sw*co*ci,  P22: -sw*so + cw*co*ci,
    P31: sw*si,             P32: cw*si
  };
}
// planets: elements and rates evaluated for the date the page was opened, then frozen
function standishElements(r, jd){
  const T=(jd-J2000)/36525;
  const a=r[0]+r[1]*T, e=r[2]+r[3]*T, I=r[4]+r[5]*T, L=r[6]+r[7]*T, vp=r[8]+r[9]*T, Om=r[10]+r[11]*T;
  return makeElements({jd0:jd, a, e, i:I, om:Om, w:vp-Om, M0:L-vp, n:(r[7]-r[9])/36525*DEG});
}
function solveE(M, e){
  M = ((M % TWO_PI) + TWO_PI) % TWO_PI;
  let E = e < 0.8 ? M : Math.PI;
  for(let k=0;k<10;k++){ E -= (E - e*Math.sin(E) - M)/(1 - e*Math.cos(E)); }
  return E;
}
// heliocentric position in scene units. Ecliptic (X,Y,Z) -> scene (X, Z, -Y): y is "north", motion is counter-clockwise from above.
function orbitPoint(el, E, out){
  const xp = el.a*(Math.cos(E)-el.e), yp = el.a*Math.sqrt(1-el.e*el.e)*Math.sin(E);
  const X = el.P11*xp + el.P12*yp, Y = el.P21*xp + el.P22*yp, Z = el.P31*xp + el.P32*yp;
  return out.set(X*AU_U, Z*AU_U, -Y*AU_U);
}
function orbitPos(el, jd, out){
  return orbitPoint(el, solveE(el.M0 + el.n*(jd-el.jd0), el.e), out);
}
function poleVec(ra, dec){
  ra*=DEG; dec*=DEG;
  const x=Math.cos(dec)*Math.cos(ra), y=Math.cos(dec)*Math.sin(ra), z=Math.sin(dec);
  const Xe=x, Ye=y*Math.cos(OBLIQ)+z*Math.sin(OBLIQ), Ze=-y*Math.sin(OBLIQ)+z*Math.cos(OBLIQ);
  return new THREE.Vector3(Xe, Ze, -Ye).normalize();
}
// two unit vectors spanning the plane perpendicular to a pole (u points roughly along the ecliptic x axis)
function planeBasis(p){
  let u = new THREE.Vector3(0,1,0).cross(p);
  if(u.lengthSq() < 1e-6) u.set(1,0,0);
  u.normalize();
  const v = new THREE.Vector3().crossVectors(p, u).normalize();
  return {u, v};
}

function fmt(n){ return n.toLocaleString(); }
function fmtMass(kg){
  const exp = Math.floor(Math.log10(kg));
  const mant = (kg/Math.pow(10,exp)).toFixed(2);
  const supMap = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
  const supExp = String(exp).split('').map(c=>supMap[c]||c).join('');
  return mant + ' × 10' + supExp + ' kg';
}
function fmtSpan(au){
  if(au >= 0.1) return (au<10 ? au.toFixed(2) : Math.round(au).toLocaleString()) + ' AU';
  const km = au*AU_KM;
  return (km >= 1000 ? Math.round(km).toLocaleString() : km.toFixed(1)) + ' km';
}
// a distance given in AU: millions of km for planets, plain km when it is small (the Moon)
function fmtDist(au){
  if(au >= 0.1) return au.toFixed(au<10?3:2)+' AU · '+fmt(Math.round(au*AU_KM/1e6))+' M km';
  return fmt(Math.round(au*AU_KM))+' km';
}
function fmtLight(s){
  if(s < 60) return s.toFixed(s < 10 ? 2 : 1) + ' s';
  if(s < 3600) return Math.floor(s/60) + ' min ' + Math.round(s%60) + ' s';
  if(s < 172800) return Math.floor(s/3600) + ' h ' + Math.round((s%3600)/60) + ' min';
  return (s/86400).toFixed(1) + ' days';
}
function fmtPeriod(d){
  d = Math.abs(d);
  if(d >= 365250) return fmt(Math.round(d/365.25)) + ' yr';
  return d >= 730 ? fmt(Math.round(d)) + ' d (' + (d/365.25).toFixed(d/365.25 < 10 ? 2 : 1) + ' yr)' : (d < 10 ? d.toFixed(2) : fmt(Math.round(d))) + ' days';
}
function nice125(x){
  const ex = Math.pow(10, Math.floor(Math.log10(x))), f = x/ex;
  return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * ex;
}

// J2000 equatorial coordinates (RA, Dec) -> this scene's frame (ecliptic plane = XZ, ecliptic north = +Y)
function eq2scene(raDeg, decDeg, out){
  const ra = raDeg*DEG, dec = decDeg*DEG, x = Math.cos(dec)*Math.cos(ra), y = Math.cos(dec)*Math.sin(ra), z = Math.sin(dec);
  return out.set(x, -y*Math.sin(OBLIQ)+z*Math.cos(OBLIQ), -(y*Math.cos(OBLIQ)+z*Math.sin(OBLIQ))).normalize();
}

function makeStars(){
  const grp = new THREE.Group();

    const ra = SKY_STARS[i*4]/100, dec = SKY_STARS[i*4+1]/100, mag = SKY_STARS[i*4+2]/10, bv = SKY_STARS[i*4+3]/100;
    eq2scene(ra, dec, v).multiplyScalar(SKY_R);
    pos[i*3] = v.x; pos[i*3+1] = v.y; pos[i*3+2] = v.z;
    let k = 0; while(k < ramp.length-2 && bv > ramp[k+1][0]) k++;
    const a = ramp[k], b = ramp[k+1], t = Math.max(0, Math.min(1, (bv-a[0])/(b[0]-a[0])));
    col[i*3] = a[1]+(b[1]-a[1])*t; col[i*3+1] = a[2]+(b[2]-a[2])*t; col[i*3+2] = a[3]+(b[3]-a[3])*t;
    siz[i] = 1.7 + Math.max(0, 5.7-mag)*0.95;
    alp[i] = Math.max(0.32, Math.min(1, 0.38+(5.7-mag)*0.17));

  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(siz,1));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(alp,1));
  const mat = new THREE.ShaderMaterial({
    uniforms:{ uPx:{value:Math.min(window.devicePixelRatio||1, 2)} },
    vertexShader:`attribute float aSize; attribute float aAlpha; varying vec3 vC; varying float vA; uniform float uPx;
      void main(){ vC=color; vA=aAlpha; gl_PointSize=aSize*uPx; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`varying vec3 vC; varying float vA;

    const cen = new THREE.Vector3(); let cnt = 0;
    c[2].forEach(pl=>{
      for(let i=0;i+3<pl.length;i+=2){
        eq2scene(pl[i]/10, pl[i+1]/10, v); lp.push(v.x*SKY_R, v.y*SKY_R, v.z*SKY_R);
        eq2scene(pl[i+2]/10, pl[i+3]/10, v); lp.push(v.x*SKY_R, v.y*SKY_R, v.z*SKY_R);
      }
      for(let i=0;i<pl.length;i+=2){ cen.add(eq2scene(pl[i]/10, pl[i+1]/10, v)); cnt++; }
    });

  const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(lp),3));

  conGroupLines.frustumCulled = false; grp.add(conGroupLines);
  // --- the Milky Way: a faint band along the galactic plane, with a brighter bulge towards the galactic centre and dark dust lanes
  const ngp = eq2scene(192.85948, 27.12825, new THREE.Vector3()), gc = eq2scene(266.40499, -28.93617, new THREE.Vector3());
  const gy = new THREE.Vector3().crossVectors(ngp, gc).normalize();
  const mw = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), new THREE.ShaderMaterial({
    uniforms:{ uN:{value:ngp}, uC:{value:gc}, uY:{value:gy} },
    vertexShader:`varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`varying vec3 vD; uniform vec3 uN,uC,uY;
      float h(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }

                   mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z); }
      float fb(vec3 p){ float s=0.0,a=0.5; for(int k=0;k<5;k++){ s+=a*vn(p); p*=2.1; a*=0.5; } return s; }

        float band=exp(-pow(sb/w,2.0));
        float bulge=exp(-(l*l)/0.55-(sb*sb)/0.045);
        float glow=exp(-pow(sb/0.3,2.0))*0.25;
        float dust=smoothstep(0.42,0.7,fb(d*9.0+7.0+vec3(0.0,sb*6.0,0.0)));   // dark lanes

        gl_FragColor=vec4(c*I*0.11,1.0);

    side:THREE.BackSide, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false

// ---------- the brightest stars: hover (or tap) one to read its real distance ----------
const namedStars = SKY_NAMED.map(a=>({ name:a[2], con:a[3], mag:a[4], sp:a[5], ly:a[6], bay:a[7], dir:eq2scene(a[0]/100, a[1]/100, new THREE.Vector3()) })).sort((a,b)=>a.ly-b.ly);   // nearest first
const AU_PER_LY = 63241.1;
function fmtLy(ly){ return (ly >= 100 ? Math.round(ly).toLocaleString() : ly) + ' ly'; }
function lightAgo(ly){
  const y = 2000 + (simJD-2451545)/365.25 - ly, yr = Math.round(y);
  return (ly >= 100 ? Math.round(ly).toLocaleString() : ly) + ' YEARS AGO · ≈ YEAR ' + (yr >= 1 ? yr : (1-yr) + ' BC');
}
function starBelowHorizon(dir){ return typeof surf !== 'undefined' && surf && surf.dip != null && dir.dot(sfU) < -Math.sin(surf.dip) + 0.01; }
const stV = new THREE.Vector3();
function starAtScreen(cx, cy, maxPx){
  let best = null, bd = maxPx*maxPx; const W = window.innerWidth, H = window.innerHeight;
  for(const st of namedStars){
    stV.copy(st.dir).multiplyScalar(SKY_R).add(camera.position).project(camera);
    if(stV.z >= 1 || stV.z <= -1) continue;
    const dx = (stV.x*0.5+0.5)*W - cx, dy = (-stV.y*0.5+0.5)*H - cy, d = dx*dx+dy*dy;
    if(d < bd && !starBelowHorizon(st.dir)){ bd = d; best = st; }
  }
  return best;
}
function starNear(dir, maxRad){
  let best = null, ba = maxRad;
  for(const st of namedStars){
    const a = Math.acos(Math.min(1, st.dir.dot(dir)));
    if(a < ba && !starBelowHorizon(st.dir)){ ba = a; best = st; }
  }
  return best;
}
let starTip = null, tipTimer = 0;
function showStarTip(st, x, y){
  if(!starTip){ starTip = document.createElement('div'); starTip.id = 'startip'; document.body.appendChild(starTip); }
  const mag = st.mag.toFixed(2).replace('-','−');
  starTip.innerHTML = '<b>' + st.name.toUpperCase() + '</b><i>STAR · ' + st.con.toUpperCase() + ' · ' + st.bay + '</i>' +
    '<p><span>DISTANCE</span>' + fmtLy(st.ly) + ' <em>≈ ' + (st.ly*AU_PER_LY).toExponential(1).replace('e+',' × 10^') + ' AU</em></p>' +
    '<p><span>LIGHT LEFT IT</span>' + lightAgo(st.ly) + '</p>' +
    '<p><span>BRIGHTNESS</span>MAGNITUDE ' + mag + ' · TYPE ' + st.sp + '</p>';
  starTip.style.display = 'block';
  const w = starTip.offsetWidth, h = starTip.offsetHeight;
  starTip.style.left = Math.max(8, Math.min(window.innerWidth-w-8, x+16)) + 'px';
  starTip.style.top = Math.max(8, Math.min(window.innerHeight-h-8, y+16)) + 'px';
}
function hideStarTip(){ if(starTip) starTip.style.display = 'none'; }
(function(){
  let pend = null;
  const inCanvas = e => e.target && e.target.closest && e.target.closest('#canvas-wrap');
  window.addEventListener('pointermove', e=>{
    if(e.pointerType === 'touch' || e.buttons || !inCanvas(e) || document.body.classList.contains('hud-hidden')){ if(!tipTimer) hideStarTip(); return; }
    pend = e; if(pend._q) return; e._q = true;
    requestAnimationFrame(()=>{ const ev = pend; const st = starAtScreen(ev.clientX, ev.clientY, 14); if(st) showStarTip(st, ev.clientX, ev.clientY); else hideStarTip(); });
  }, {passive:true});
  window.addEventListener('click', e=>{
    if(!inCanvas(e)) return;
    const st = starAtScreen(e.clientX, e.clientY, e.pointerType === 'touch' ? 26 : 14);
    clearTimeout(tipTimer); tipTimer = 0;
    if(st){ showStarTip(st, e.clientX, e.clientY); tipTimer = setTimeout(()=>{ tipTimer = 0; hideStarTip(); }, 4500); }
  });
})();

  OBERON:[550,1], MIRANDA:[400,1], CHARON:[350,0.8], ENCELADUS:[250,0.7], IO:[120,0.5], EUROPA:[60,0.5] };
const BIGTEX = { EARTH:2, JUPITER:2, VENUS:1, MARS:2, SATURN:2, MOON:1, MERCURY:1, NEPTUNE:1, URANUS:1 };
function genericFn(c, seed){
  const o = (seed%100)*0.37;
  return (x,y,z)=>{ const n=fb(x*3+o,y*3+o*0.7,z*3+o*0.3,5), k=0.72+0.56*n; setC(c[0]*k,c[1]*k,c[2]*k); };
}
// craters: soft dark bowls with a bright rim, stretched towards the poles so they look round on the sphere
function drawCraters(ctx,w,h,count,seed,str){
  let s=seed*9301+49297; const rnd=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  for(let i=0;i<count;i++){
    const lon=rnd(), lat=Math.asin(rnd()*2-1), r=(0.004+0.05*Math.pow(rnd(),3.2))*w;
    const x=lon*w, y=(0.5-lat/Math.PI)*h, k=1/Math.max(0.25,Math.cos(lat));
    for(const dx of [-w,0,w]){
      ctx.save(); ctx.translate(x+dx,y); ctx.scale(k,1);
      const g=ctx.createRadialGradient(0,0,0,0,0,r);
      g.addColorStop(0,'rgba(0,0,0,'+(0.28*str)+')'); g.addColorStop(0.7,'rgba(0,0,0,'+(0.12*str)+')');
      g.addColorStop(0.86,'rgba(255,255,255,'+(0.12*str)+')'); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,TWO_PI); ctx.fill(); ctx.restore();
    }
  }
}
function* texGen(b){
  const n=b.name, T=TEXFN[n], big=BIGTEX[n], w=big>1?1536:big?1024:512, h=big>1?768:big?512:256;
  const hex=b.data?b.data.color:b.md.color;
  const fn=T||genericFn([(hex>>16&255)/255,(hex>>8&255)/255,(hex&255)/255], nameHash(n));
  const cr=CRATERS[n]||(T?null:[300,1]);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d'), img=ctx.createImageData(w,h), d=img.data;
  for(let y=0;y<h;y++){
    const la=(0.5-(y+0.5)/h)*Math.PI, cl=Math.cos(la), sl=Math.sin(la);
    for(let x=0;x<w;x++){
      const lo=((x+0.5)/w)*TWO_PI-Math.PI;
      fn(cl*Math.cos(lo), sl, cl*Math.sin(lo), la, lo);
      const i=(y*w+x)*4; d[i]=TC[0]*255; d[i+1]=TC[1]*255; d[i+2]=TC[2]*255; d[i+3]=255;
    }
    if((y&1)===1) yield;
  }
  ctx.putImageData(img,0,0);
  if(cr) drawCraters(ctx,w,h,cr[0],nameHash(n)+1,cr[1]);
  yield;
  const tex=new THREE.CanvasTexture(cv);
  tex.anisotropy=Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const m=b.mesh.material; m.map=tex; m.color.set(0xffffff); m.needsUpdate=true; b.texDone=true;
}
const texJobs=[]; let texStarted=false;
function texUrgentNow(){ for(const b of bodies){ if(b.texUrgent && !b.texDone) return true; } return false; }
function queueTex(b,urgent){
  if(b.texDone) return;
  if(!b.texJob){ b.texJob={gen:texGen(b)}; b.texQueued=true; if(urgent) texJobs.unshift(b.texJob); else texJobs.push(b.texJob); }
  else if(urgent){ const i=texJobs.indexOf(b.texJob); if(i>0){ texJobs.splice(i,1); texJobs.unshift(b.texJob); } }
  if(urgent) b.texUrgent=true;
}
function startTextures(){
  if(texStarted) return; texStarted=true;
  bodies.forEach(b=>{ if(b.kind==='planet'||b.kind==='moon') queueTex(b,false); });
}
function runTex(budget){
  const t0=performance.now();
  while(texJobs.length && performance.now()-t0<budget){ if(texJobs[0].gen.next().done) texJobs.shift(); }
}

// Fine ground detail for the surface view: a high-frequency noise multiplies the colour of the sphere, so standing on a
// world shows grain and relief instead of one blurry texel. Switched on only while that world's surface is open.
function addDetail(mat){
  mat.onBeforeCompile = sh=>{
    sh.uniforms.uDetail={value:mat.userData.detail||0};
    sh.uniforms.uDetFreq={value:mat.userData.detFreq||300};
    mat.userData.sh=sh;
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nvarying vec3 vDP;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvDP=normalize(position);');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>',`#include <common>
varying vec3 vDP; uniform float uDetail; uniform float uDetFreq;
float dh(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float dn(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(dh(i),dh(i+vec3(1,0,0)),f.x),mix(dh(i+vec3(0,1,0)),dh(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(dh(i+vec3(0,0,1)),dh(i+vec3(1,0,1)),f.x),mix(dh(i+vec3(0,1,1)),dh(i+vec3(1,1,1)),f.x),f.y),f.z); }
float dfbm(vec3 p){ float s=0.0,a=0.5; for(int k=0;k<6;k++){ s+=a*dn(p); p*=2.03; a*=0.5; } return s; }`)
      .replace('#include <map_fragment>',`#include <map_fragment>
if(uDetail>0.5){ float q=dfbm(vDP*uDetFreq); float q2=dfbm(vDP*uDetFreq*0.07+3.1); diffuseColor.rgb*=0.74+0.5*q*(0.75+0.5*q2); }`);
  };
}
function setDetail(mat,on,freq){
  mat.userData.detail=on; if(freq) mat.userData.detFreq=freq;
  if(mat.userData.sh){ mat.userData.sh.uniforms.uDetail.value=on; if(freq) mat.userData.sh.uniforms.uDetFreq.value=freq; }
}

PLANETS.forEach((p, i)=>{
  const el = p.std ? standishElements(p.std, simJD) : makeElements(p.orb);
  const rad = p.radiusKm * KM_U;

  // orbit ring — the real, tilted ellipse with the Sun at one focus
  const ringMat = p.dwarf
    ? new THREE.LineDashedMaterial({color:0xff2b2b, transparent:true, opacity:0.28, dashSize:el.a*AU_U*0.012, gapSize:el.a*AU_U*0.009, depthWrite:false})
    : new THREE.LineBasicMaterial({color:0xff2b2b, transparent:true, opacity:0.22, depthWrite:false});
  const ringLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(ringPointsFor(el)), ringMat);
  if(p.dwarf) ringLine.computeLineDistances();
  scene.add(ringLine);
  orbitLines.push(ringLine);

  // planet
  const pMat = new THREE.MeshStandardMaterial({color:p.color, roughness:0.85, metalness:0.05}); addDetail(pMat);
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(rad, 128, 96), pMat);
  scene.add(mesh);

  const pole = p.pole ? poleVec(p.pole[0], p.pole[1]) : new THREE.Vector3(0,1,0);
  const qAlign = new THREE.Quaternion().setFromUnitVectors(Y_AXIS, pole);

  // rings (equatorial plane, true radii)
  let ringMesh = null;
  if(p.ring){
    const inner = p.ring.innerKm*KM_U, outer = p.ring.outerKm*KM_U;
    ringMesh = new THREE.Mesh(new THREE.RingGeometry(inner, outer, 192, 1), new THREE.ShaderMaterial({
      vertexShader: ringVert, fragmentShader: ringFrag, transparent:true, side:THREE.DoubleSide, depthWrite:false,
      uniforms:{ uSun:{value:new THREE.Vector3(0,0,1)}, uCam:{value:new THREE.Vector3(0,0,1)}, uR:{value:rad},
                 uIn:{value:inner}, uOut:{value:outer}, uColor:{value:new THREE.Color(p.ring.color)}, uMode:{value:p.ring.mode} }
    }));
    ringMesh.quaternion.setFromUnitVectors(Z_AXIS, pole);
    scene.add(ringMesh);
  }

  // group that rides on the planet and carries its moons
  const group = new THREE.Group();
  scene.add(group);

  const pm = {kind:'planet', name:p.name, data:p, el, mesh, ringMesh, group, rad, pole, qAlign, line:ringLine, spin:Math.random()*TWO_PI,
              wp:new THREE.Vector3(), prio:p.dwarf?2:1, moons:[], moonRange:0, inRange:false,
              worldPos(out){ return out.copy(this.mesh.position); }};
  mesh.userData.body = pm;
  planets.push(pm); bodies.push(pm);

  // moons
  (MOONS[p.name]||[]).forEach(md=>{
    const aU = md.a*KM_U, mrad = md.r*KM_U;
    let basis;
    if(md.moon){   // Earth's Moon orbits close to the ecliptic plane (5.1°)
      const t = 5.145*DEG;
      basis = planeBasis(new THREE.Vector3(0, Math.cos(t), Math.sin(t)));
    } else basis = planeBasis(pole);   // the others orbit in their planet's equatorial plane
    const mMat = new THREE.MeshStandardMaterial({color:md.color, roughness:0.95}); addDetail(mMat);
    const mmesh = new THREE.Mesh(new THREE.SphereGeometry(mrad, 96, 64), mMat);
    group.add(mmesh);
    const pts=[]; for(let k=0;k<=1024;k++){ const th=k/1024*TWO_PI; pts.push(basis.u.clone().multiplyScalar(Math.cos(th)*aU).addScaledVector(basis.v, Math.sin(th)*aU)); }
    const oline = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:0x8a93a1, transparent:true, opacity:0.28, depthWrite:false}));
    oline.visible = false;
    group.add(oline);
    // phase: the Moon uses its real mean longitude; other moons start at an arbitrary phase (their true phase is not modelled)
    let th0, rate;
    if(md.moon){ th0 = 218.316*DEG; rate = 13.176396*DEG; }
    else { let h=0; for(const ch of md.n) h = (h*31 + ch.charCodeAt(0)) % 360; th0 = h*DEG; rate = TWO_PI/md.P; }
    const mb = {kind:'moon', name:md.n, md, parent:pm, mesh:mmesh, orbitLine:oline, basis, aU, rad:mrad,
                th0, rate, wp:new THREE.Vector3(), prio:3,
                worldPos(out){ return out.copy(this.parent.mesh.position).add(this.mesh.position); }};
    mmesh.userData.body = mb;
    pm.moons.push(mb); moons.push(mb); bodies.push(mb);
    pm.moonRange = Math.max(pm.moonRange, aU*40);
  });
});

function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)/2*1.7; }

    const el = makeElements({jd0:J2000, a:aMin+Math.random()*(aMax-aMin), e:Math.random()*eMax, i:Math.abs(gauss())*incSigmaDeg,
                             om:Math.random()*360, w:Math.random()*360, M0:Math.random()*360});
    orbitPoint(el, solveE(el.M0, el.e), tmp);

// a small recognisable model (drawn enlarged — the panel says so): dish + bus + booms, or JWST's hex mirror over its sunshield. +Y is the "front".
function makeCraftModel(c, rad){
  const g = new THREE.Group();
  const lam = (col, em) => new THREE.MeshLambertMaterial({color:col, emissive:em, side:THREE.DoubleSide});
  const dark = lam(0x9aa0aa, 0x3a3e46);
  if(c.l2){
    const shield = new THREE.Mesh(new THREE.BoxGeometry(rad*1.3, rad*0.03, rad*0.8), lam(0x6f7587, 0x161820));
    shield.position.y = -rad*0.35; g.add(shield);
    const mirror = new THREE.Mesh(new THREE.CylinderGeometry(rad*0.42, rad*0.42, rad*0.06, 6), lam(0xf2c75c, 0x9a7410));
    mirror.position.y = rad*0.2; mirror.rotation.x = 0.45; mirror.scale.setScalar(1.15); g.add(mirror);
    const bus = new THREE.Mesh(new THREE.BoxGeometry(rad*0.5, rad*0.3, rad*0.5), dark);
    bus.position.y = -rad*0.6; g.add(bus);
  } else {
    const dish = new THREE.Mesh(new THREE.SphereGeometry(rad*0.85, 36, 12, 0, TWO_PI, 0, 1.05), lam(c.color, 0x6a5a28));
    dish.scale.y = 0.55; dish.rotation.x = Math.PI; dish.position.y = rad*0.28; g.add(dish);
    const bus = new THREE.Mesh(new THREE.CylinderGeometry(rad*0.3, rad*0.3, rad*0.26, 10), dark);
    bus.position.y = -rad*0.05; g.add(bus);
    const boom = (len, x) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(rad*0.022, rad*0.022, len, 6), dark); m.rotation.z = Math.PI/2; m.position.set(x, -rad*0.1, 0); g.add(m); };
    boom(rad*1.7, rad*0.95); boom(rad*1.2, -rad*0.7);
    const rtg = new THREE.Mesh(new THREE.CylinderGeometry(rad*0.08, rad*0.08, rad*0.5, 8), dark);
    rtg.rotation.z = Math.PI/2; rtg.position.set(rad*1.7, -rad*0.1, 0); g.add(rtg);
    const pod = new THREE.Mesh(new THREE.BoxGeometry(rad*0.22, rad*0.22, rad*0.22), dark);
    pod.position.set(-rad*1.3, -rad*0.1, 0); g.add(pod);
  }
  return g;
}

let camTheta = 0.9, camPhi = 1.309, camRadius = 250000;
let targetTheta = camTheta, targetPhi = camPhi, targetRadius = camRadius;
const camFocus = new THREE.Vector3(0,0,0);
let locked = null;                      // the selected body (info panel, reticle, highlighted button)
let follow = null;                      // the body the camera rides along with — stays set after deselecting, so the view never jumps

function clampRadius(r){
  let minR = 0.02;
  if(follow) minR = follow.kind==='sun' ? sunRadius*3 : Math.max(1e-5, follow.rad*1.4);
  else if(camFocus.length() < sunRadius*3) minR = sunRadius*3.2;    // free view centred on the Sun: stop before it fills the screen
  return Math.max(minR, Math.min(3e7, r));   // out to ~15,000 AU, enough for 2014 FE72's whole orbit
}
function updateCamera(){
  camTheta += (targetTheta-camTheta)*0.08;
  camPhi += (targetPhi-camPhi)*0.08;
  camRadius = Math.exp(Math.log(camRadius) + (Math.log(targetRadius)-Math.log(camRadius))*0.1);   // log-space easing: smooth across 10 orders of magnitude
  camPhi = Math.max(0.15, Math.min(Math.PI-0.15, camPhi));
  camera.position.set(
    camFocus.x + camRadius*Math.sin(camPhi)*Math.cos(camTheta),
    camFocus.y + camRadius*Math.cos(camPhi),
    camFocus.z + camRadius*Math.sin(camPhi)*Math.sin(camTheta));
  // never let the camera enter the Sun (everything would turn yellow)
  const minD = sunRadius*1.25, dd = camera.position.length();
  if(dd < minD){ if(dd < 1e-6) camera.position.set(0,0,minD); else camera.position.multiplyScalar(minD/dd); }
  camera.lookAt(camFocus);
  // clipping planes follow the zoom so a whole system and a single moon both stay sharp
  const nearP = Math.max(1e-7, camRadius*0.002), farP = 5e6 + camRadius*4;
  if(Math.abs(camera.near-nearP) > nearP*0.02 || camera.far !== farP){ camera.near = nearP; camera.far = farP; camera.updateProjectionMatrix(); }
  camera.updateMatrixWorld();
}

function panCamera(dx, dy){
  const panSpeed = camRadius * 0.0016;
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
  const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
  camFocus.addScaledVector(right, -dx*panSpeed);
  camFocus.addScaledVector(up, dy*panSpeed);
}

const touchIds = new Set();

  let au = null;
  if(k === 'planet' || k === 'craft') au = locked.mesh.position.length()/AU_U;
  else if(k === 'moon') au = locked.parent.mesh.position.length()/AU_U;
  else if(k === 'sun') au = planets[2].mesh.position.length()/AU_U;   // Earth

  if(lt && au!=null) lt.textContent = fmtLight(au*LIGHT_SEC_PER_AU);

  const ed = $('lv-edist'), el2 = $('lv-elight');
  if(ed || el2){
    const eAU = locked.worldPos(liveVec).distanceTo(planets[2].mesh.position)/AU_U;   // planets[2] = Earth
    if(ed) ed.textContent = fmtDist(eAU);
    if(el2) el2.textContent = fmtLight(eAU*LIGHT_SEC_PER_AU);
  }
  // speed along its orbit around the Sun at this moment (vis-viva): fastest at closest approach, slowest when farthest
  const sp = $('lv-speed');
  if(sp && k === 'planet'){
    const rKm = au*AU_KM, aKm = locked.el.a*AU_KM;
    const v = Math.sqrt(Math.max(0, GM_SUN*(2/rKm - 1/aKm)));
    sp.textContent = (v < 1 ? v.toFixed(3) : v.toFixed(2)) + ' km/s';
  }
  if(k === 'craft'){
    const mt = $('lv-mission');

function buildShareURL(){
  const p = new URLSearchParams();
  const tgt = locked || follow;
  if(tgt) p.set('t', tgt.name);
  p.set('d', dateOfJD(simJD).toISOString().slice(0,16));
  p.set('z', camRadius.toPrecision(5));
  p.set('th', camTheta.toFixed(3)); p.set('ph', camPhi.toFixed(3));
  if(!tgt){ p.set('fx', camFocus.x.toPrecision(6)); p.set('fy', camFocus.y.toPrecision(6)); p.set('fz', camFocus.z.toPrecision(6)); }
  p.set('s', speedEl.value);
  if(paused) p.set('p','1');
  if(timeDir < 0) p.set('rv','1');
  return location.origin + location.pathname + '#' + p.toString();
}
function copyText(s){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(s);
  return new Promise((res, rej)=>{
    const ta = document.createElement('textarea');
    ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy') ? res() : rej(); }catch(e){ rej(e); }
    ta.remove();
  });
}
$('btn-share').addEventListener('click', ()=>{
  const url = buildShareURL();
  copyText(url).then(
    ()=>showToast('LINK COPIED — THIS EXACT VIEW & DATE'),
    ()=>{ history.replaceState(null, '', url); showToast('COPY THE LINK FROM YOUR ADDRESS BAR'); });
});
function applyHash(){
  if(location.hash.length < 2) return false;
  let p; try{ p = new URLSearchParams(location.hash.slice(1)); }catch(e){ return false; }
  if(!p.has('t') && !p.has('d') && !p.has('z')) return false;
  const num = k => { const v = parseFloat(p.get(k)); return isFinite(v) ? v : null; };
  const d = p.get('d');
  if(d){ const ms = Date.parse(d+'Z'); if(isFinite(ms)){ setSimJD(ms/86400000 + 2440587.5); } }
  const s = num('s'); if(s!=null){ speedEl.value = Math.max(0, Math.min(100, s)); setSpeedFromSlider(+speedEl.value); }
  if(p.get('p')==='1') togglePause();
  if(p.get('rv')==='1') setReverse(true);
  updatePositions(0);
  const t = p.get('t');
  const b = t ? bodies.find(x=>x.name===t) : null;
  if(b){ selectBody(b); lockOffset.set(0,0,0); b.worldPos(camFocus); }
  else {
    const fx = num('fx'), fy = num('fy'), fz = num('fz');
    if(fx!=null && fy!=null && fz!=null) camFocus.set(fx, fy, fz);
  }
  const z = num('z'), th = num('th'), ph = num('ph');
  if(z!=null && z>0) camRadius = targetRadius = Math.min(3e7, Math.max(1e-5, z));
  if(th!=null) camTheta = targetTheta = th;
  if(ph!=null) camPhi = targetPhi = ph;
  return true;
}

const INTRO_KEYS = [
  {t:0,    r:0.34,   f:0, p:1.42},      // r = camera distance (scene units), f = 0 follow Earth … 1 follow the Sun, p = camera elevation
  {t:1.8,  r:0.34,   f:0, p:1.42},

  {t:12.8, r:60,     f:1, p:1.20},
  {t:14.2, r:60,     f:1, p:1.20},
  {t:17.8, r:250000, f:1, p:1.309}
];
const INTRO_CAPS = [
  {t:0.3,  a:'EARTH',            b:'12,742 KM ACROSS', d:2.4},
  {t:2.6,  a:'THE MOON',         b:'384,400 KM AWAY · 1.3 LIGHT-SECONDS', d:2.6},
  {t:8.4,  a:'THE SUN',          b:'150 MILLION KM AWAY · 8 LIGHT-MINUTES', d:2.8},
  {t:12.6, a:'109 EARTHS ACROSS', b:'THE SUN, UP CLOSE', d:2.0},
  {t:15.8, a:'THE SOLAR SYSTEM', b:'ALL OF IT · TO SCALE', d:2.6}
];
let capTimer = null;
function showCaption(a, b, secs){
  const el = $('caption');
  el.innerHTML = '<div class="c1"></div><div class="c2"></div>';
  el.children[0].textContent = a; el.children[1].textContent = b;

}
function hideCaption(){ clearTimeout(capTimer); $('caption').classList.remove('on'); }
function startIntro(){
  const ep = planets[2].mesh.position;
  let th0 = Math.atan2(-ep.z, -ep.x) + 0.7;       // start on Earth's sunlit side
  while(th0 > 0.9) th0 -= TWO_PI;
  while(th0 <= 0.9 - TWO_PI) th0 += TWO_PI;
  intro = {t:0, th0, ci:0, orb:false, lab:false};
  deselect(true);
  document.body.classList.add('intro');
  $('btn-skip-intro').style.display = 'block';
  orbitLines.forEach(l=>l.visible = false);        // orbit lines only appear once the view has pulled well back
  labelLayer.style.opacity = '0';
}
function stepIntro(dt){
  intro.t += dt;
  const T = INTRO_KEYS[INTRO_KEYS.length-1].t, t = Math.min(intro.t, T);
  let i = 0; while(i < INTRO_KEYS.length-2 && t >= INTRO_KEYS[i+1].t) i++;
  const a = INTRO_KEYS[i], b = INTRO_KEYS[i+1];
  const s = smooth((t-a.t)/(b.t-a.t));
  const r = Math.exp(Math.log(a.r) + (Math.log(b.r)-Math.log(a.r))*s);
  const f = a.f + (b.f-a.f)*s;
  camFocus.copy(planets[2].mesh.position).multiplyScalar(1-f);
  camRadius = targetRadius = r;
  camTheta = targetTheta = intro.th0 + (0.9-intro.th0)*smooth(t/T);
  camPhi = targetPhi = a.p + (b.p-a.p)*s;
  if(!intro.lab && intro.t > 2.4){ intro.lab = true; labelLayer.style.opacity = '1'; }     // names fade in at the Moon
  if(!intro.orb && intro.t > 7.6){ intro.orb = true; applyOrbitVisibility(); }
  while(intro.ci < INTRO_CAPS.length && intro.t >= INTRO_CAPS[intro.ci].t){ const c = INTRO_CAPS[intro.ci++]; showCaption(c.a, c.b, c.d); }

// ---------- LIGHT-SPEED FLIGHT: a photon leaves the Sun and races to the selected body ----------

  const D = Math.max(sunRadius*1.05, tp.length() - b.rad);           // from the Sun's centre to the target's surface
  const dir = tp.clone().normalize();

function stepFlight(dt){

// ---- camera: stand on the world and look wherever you like ----
function surfaceCamera(dt){
  const s = surf, b = s.b, isSun = b.kind === 'sun';
  let dist;
  if(isSun){
    // hovering: the reference direction is Earth, and the local "up" is tilted 55° from it so Earth stands 35° above the horizon
    sfP.set(0,0,0);
    sfS.copy(planets[2].mesh.position); dist = sfS.length(); sfS.divideScalar(dist);
    sfA.crossVectors(sfS, Y_AXIS); if(sfA.lengthSq() < 1e-8) sfA.set(1,0,0); sfA.normalize();
    sfU.copy(sfS).applyAxisAngle(sfA, 55*DEG);
    camera.position.copy(sfU).multiplyScalar(sunRadius + SUN_ALT);
    s.dip = Math.acos(sunRadius/(sunRadius + SUN_ALT));
  } else {
    b.worldPos(sfP);
    sfS.copy(sfP).multiplyScalar(-1); dist = sfS.length(); sfS.divideScalar(dist);        // towards the Sun
    // observer at a chosen latitude (measured from the world's real pole): the longitude is picked so the Sun stands ~12° up when it can
    const Pole = (b.kind === 'moon' ? b.parent : b).pole, dS = Math.max(-1, Math.min(1, Pole.dot(sfS))), cd = Math.sqrt(1 - dS*dS);
    sfA.copy(sfS).addScaledVector(Pole, -dS);
    if(sfA.lengthSq() < 1e-8) sfA.set(1,0,0).addScaledVector(Pole, -Pole.x);
    sfA.normalize(); sfB.crossVectors(Pole, sfA);
    s.lat += (s.tlat - s.lat)*Math.min(1, dt*6);
    const phi = s.lat*DEG, den = Math.cos(phi)*cd;
    let cH = den > 1e-4 ? (Math.sin(SUN_ALT_DEG*DEG) - Math.sin(phi)*dS)/den : 1;
    cH = Math.max(-1, Math.min(1, cH)); const sH = Math.sqrt(1 - cH*cH);
    sfU.copy(Pole).multiplyScalar(Math.sin(phi)).addScaledVector(sfA, Math.cos(phi)*cH).addScaledVector(sfB, -Math.cos(phi)*sH).normalize();
    camera.position.copy(sfP).addScaledVector(sfU, b.rad*1.02);
    s.dip = Math.acos(1/1.02);
  }
  // local frame: sfH0 = horizontal direction towards the Sun (or Earth), sfH1 = to its left
  s.pitch0 = Math.asin(Math.max(-1, Math.min(1, sfS.dot(sfU))));
  sfH0.copy(sfS).addScaledVector(sfU, -sfS.dot(sfU)).normalize();
  sfH1.crossVectors(sfU, sfH0);
  if(s.init){ s.init = false; s.yaw = s.tyaw = 0; s.pitch = s.tpitch = s.pitch0; }
  if(surfDrag) s.track = null;
  else if(s.track) lookAtBody(s.track, true);                                             // keep a turned-to body centred as the sky turns
  const k = Math.min(1, dt*7);
  s.yaw += (s.tyaw - s.yaw)*k; s.pitch += (s.tpitch - s.pitch)*k;
  s.fov += (s.tfov - s.fov)*Math.min(1, dt*8);
  camera.fov = s.fov;
  camera.near = isSun ? 0.004 : Math.max(1e-9, b.rad*0.004); camera.far = 1e7; camera.updateProjectionMatrix();
  const cp = Math.cos(s.pitch);
  s.dir.copy(sfH0).multiplyScalar(cp*Math.cos(s.yaw)).addScaledVector(sfH1, cp*Math.sin(s.yaw)).addScaledVector(sfU, Math.sin(s.pitch));
  camera.up.copy(sfU);
  sfT.copy(camera.position).add(s.dir);
  camera.lookAt(sfT);
  camera.updateMatrixWorld();
  const sd = camera.position.length(), sunDown = !isSun && s.pitch0 < -s.dip - 0.002;
  if(!isSun){
    sunCorona.visible = sunHalo.visible = !sunDown;
    sunGlare = Math.sqrt(Math.max(1, dist/AU_U));      // glow grows more slowly than the Sun shrinks, so it never fades out of sight
    const px = Math.min(40, Math.max(3.2, 26/Math.sqrt(sd/AU_U)));   // core width in pixels: smaller the farther the Sun is
    sunCore.visible = !sunDown; sunCore.scale.setScalar(sd*px/window.innerHeight*2*Math.tan(camera.fov/2*DEG)*2);
  } else { sunGlare = 1; sunCore.visible = false; }
  if(!isSun){
    const la = Math.round(s.lat), sa = Math.round(s.pitch0/DEG), lt = (Math.abs(la) === 0 ? '0° · EQUATOR' : Math.abs(la) + '° ' + (la > 0 ? 'N' : 'S') + (Math.abs(la) === 90 ? ' · POLE' : '')) + ' · SUN ' + (sa >= 0 ? '+' : '−') + Math.abs(sa) + '°' + (sunDown ? ' · BELOW HORIZON' : '');
    if(lt !== s.latTxt){ s.latTxt = lt; $('surf-lat-val').textContent = lt; }
  }
  const now = performance.now();
  if(now - surfTxtAt > 800){
    surfTxtAt = now;
    if(isSun){
      const au = dist/AU_U;
      $('sc-a').textContent = 'ABOUT ' + fmt(Math.round(SUN_ALT/KM_U)) + ' KM ABOVE A SURFACE AT ≈ 5,500 °C';
      $('sc-b').textContent = 'EARTH IS ' + fmtLight(au*LIGHT_SEC_PER_AU).toUpperCase() + ' OF LIGHT AWAY';
    } else {
      const au = (b.kind === 'moon' ? b.parent.mesh.position.length() : sfP.length())/AU_U;
      const ang = 2*Math.atan(sunRadius/(au*AU_U))/DEG, light = 1/(au*au);
      const lt = light >= 10 ? light.toFixed(0) : light >= 1 ? light.toFixed(1) : light.toPrecision(2);
      $('sc-a').textContent = 'THE SUN SPANS ' + (ang >= 1 ? ang.toFixed(2) : ang.toFixed(3)) + '° OF SKY · ' + (ang/0.533).toFixed(2) + '× ITS WIDTH SEEN FROM EARTH';
      $('sc-b').textContent = lt + '× THE SUNLIGHT EARTH GETS · ' + fmtLight(au*LIGHT_SEC_PER_AU).toUpperCase() + ' FROM THE SUN';
    }
  }
}

// planets as points of light, drawn relative to the camera so even far-away positions stay exact
function updateSkyDots(){
  const s = surf, loc = s.b.kind === 'moon' ? s.b.parent : s.b, pa = skyGeo.attributes.position, ca = skyGeo.attributes.color, cp = camera.position;
  let n = 0;
  skyPts.position.copy(cp);
  bodies.forEach(b=>{
    if(n >= SKY_MAX || b === s.b || b.kind === 'sun' || b.kind === 'craft' || b.hidden || b.discPx > 2.5) return;
    if(b.kind === 'moon' && b.parent !== loc) return;
    if(!b.dotCol){ const hex = b.data ? b.data.color : b.md.color; b.dotCol = [(hex>>16&255)/255*0.6+0.4, (hex>>8&255)/255*0.6+0.4, (hex&255)/255*0.6+0.4]; }
    pa.setXYZ(n, b.wp.x-cp.x, b.wp.y-cp.y, b.wp.z-cp.z); ca.setXYZ(n, b.dotCol[0], b.dotCol[1], b.dotCol[2]); n++;
  });
  skyGeo.setDrawRange(0, n); pa.needsUpdate = ca.needsUpdate = true;
}

// ---- binocular HUD ----
function layoutBino(){
  const w = window.innerWidth, h = window.innerHeight, cx = w/2, cy = h/2, twin = w > h*1.15;
  const R = twin ? Math.min(h*0.47, w*0.29) : Math.min(w*0.47, h*0.40), gap = twin ? R*0.66 : 0;
  const lenses = twin ? [[cx-gap,cy],[cx+gap,cy]] : [[cx,cy]];
  let s = '<defs><mask id="bm"><rect width="'+w+'" height="'+h+'" fill="#fff"/>' + lenses.map(l=>'<circle cx="'+l[0]+'" cy="'+l[1]+'" r="'+R+'" fill="#000"/>').join('') + '</mask>' +
    '<radialGradient id="bv"><stop offset=".66" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".8"/></radialGradient></defs>' +
    '<rect width="'+w+'" height="'+h+'" fill="#000" mask="url(#bm)"/>';
  lenses.forEach(l=>{ s += '<circle cx="'+l[0]+'" cy="'+l[1]+'" r="'+R+'" fill="url(#bv)"/><circle cx="'+l[0]+'" cy="'+l[1]+'" r="'+R+'" fill="none" stroke="#ff2b2b" stroke-opacity=".55" stroke-width="2"/>'; });
  // reticle: crosshair with a gap in the middle, tick marks like a range scale, and a slowly turning dashed ring
  const L = R*0.55, g = 14; let d = '';
  d += 'M'+(cx-L)+' '+cy+'H'+(cx-g)+'M'+(cx+g)+' '+cy+'H'+(cx+L)+'M'+cx+' '+(cy-L)+'V'+(cy-g)+'M'+cx+' '+(cy+g)+'V'+(cy+L);
  for(let i=1;i<=10;i++){
    const o = i*L/10, t = (i%5===0) ? 9 : 5;
    d += 'M'+(cx+o)+' '+(cy-t)+'V'+(cy+t)+'M'+(cx-o)+' '+(cy-t)+'V'+(cy+t)+'M'+(cx-t)+' '+(cy+o)+'H'+(cx+t)+'M'+(cx-t)+' '+(cy-o)+'H'+(cx+t);
  }
  s += '<path d="'+d+'" stroke="#ff2b2b" stroke-opacity=".85" stroke-width="1.2" fill="none"/>' +
       '<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="none" stroke="#ff2b2b" stroke-width="1.2"/>' +
       '<circle class="bi-spin" cx="'+cx+'" cy="'+cy+'" r="'+(R*0.6)+'" fill="none" stroke="#ff2b2b" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2 12"/>' +
       '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*0.3)+'" fill="none" stroke="#ff2b2b" stroke-opacity=".35" stroke-width="1"/>';
  $('bino-svg').innerHTML = s;
}
window.addEventListener('resize', ()=>{ if(surf && surf.bino) layoutBino(); });
const biTL = $('bi-tl'), biTR = $('bi-tr'), biBL = $('bi-bl'), biBR = $('bi-br'), biLock = $('bino-lock');
const setTxt = (el, t)=>{ if(el._t !== t){ el._t = t; el.textContent = t; } };
const fmtSigned = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1);
function fmtAng(rad){ const d = rad/DEG; return d >= 1 ? d.toFixed(2) + '°' : d >= 1/60 ? (d*60).toFixed(1) + '′' : (d*3600).toFixed(1) + '″'; }
function updateBinoHud(){

  if(best){

    setTxt(biBR, 'TARGET · ' + best.name + '\n' + kind + '\nRANGE ' + fmtDist(au) + '\nLIGHT ' + fmtLight(au*LIGHT_SEC_PER_AU) + '\nSIZE ' + fmtAng(2*Math.atan(best.rad/best.dist)) + '\nFILLS ' + Math.min(100, Math.round(2*Math.atan(best.rad/best.dist)/(s.fov*DEG)*100)) + '% OF VIEW');

// ---------- ORBIT LINES THAT STAY SMOOTH WHEN ZOOMED IN ----------
// The full orbit is stored as 32-bit points far from the origin, so up close it looks jagged (and at Pluto's distance the rounding is bigger than the planet).
// When the camera is near an orbit, a second line is drawn around the camera's spot only, with its points measured from that spot — dense and exact.
const LOCAL_N = 1600;
const lodP = new THREE.Vector3(), lodC = new THREE.Vector3();
planets.forEach(pm=>{
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(LOCAL_N*3), 3));
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({color:0xff2b2b, transparent:true, opacity:pm.data.dwarf ? 0.28 : 0.22, depthWrite:false}));
  l.frustumCulled = false; l.visible = false; scene.add(l); pm.localLine = l;
});
function lodDist2(el, E){ orbitPoint(el, E, lodP); return lodP.distanceToSquared(camFocus); }
function updateOrbitLOD(){
  const on = orbitsVisible && !intro && !surf;
  planets.forEach(pm=>{
    const l = pm.localLine, el = pm.el;
    if(!on){ l.visible = false; return; }
    if(camRadius > el.a*AU_U*0.05){ l.visible = false; pm.line.visible = true; return; }
    const S = 720; let bestE = 0, best = Infinity;
    for(let k=0;k<S;k++){ const d = lodDist2(el, k/S*TWO_PI); if(d < best){ best = d; bestE = k/S*TWO_PI; } }
    let lo = bestE - TWO_PI/S, hi = bestE + TWO_PI/S;
    for(let it=0;it<40;it++){ const m1 = lo+(hi-lo)/3, m2 = hi-(hi-lo)/3; if(lodDist2(el,m1) < lodDist2(el,m2)) hi = m2; else lo = m1; }
    const E0 = (lo+hi)/2;
    if(Math.sqrt(lodDist2(el, E0)) > camRadius*30){ l.visible = false; pm.line.visible = true; return; }
    orbitPoint(el, E0, lodC); orbitPoint(el, E0+1e-4, lodP);
    const speed = lodP.distanceTo(lodC)/1e-4;
    const dE = Math.min(Math.PI, camRadius*30/Math.max(speed, 1e-9));
    const arr = l.geometry.attributes.position.array;
    for(let j=0;j<LOCAL_N;j++){
      orbitPoint(el, E0 - dE + 2*dE*j/(LOCAL_N-1), lodP);
      arr[j*3] = lodP.x - lodC.x; arr[j*3+1] = lodP.y - lodC.y; arr[j*3+2] = lodP.z - lodC.z;
    }
    l.geometry.attributes.position.needsUpdate = true;
    l.position.copy(lodC); l.visible = true; pm.line.visible = false;
  });
}

window.addEventListener('keydown', e=>{
  if(intro){ skipIntro(); return; }
  const el = e.target, tag = el && el.tagName;
  const typing = tag==='TEXTAREA' || tag==='SELECT' || (tag==='INPUT' && el.type!=='range' && el.type!=='checkbox');
  if(e.key==='Escape'){
    if(tour.active){ closeTour(); return; }
    if(flight){ endFlight(false); return; }
    if(surf){ exitSurface(); return; }
    if(locked) deselect();
    return;
  }
  if(typing) return;
  if(surf){                                              // standing on a world: arrows look around, +/- zoom, V = binoculars
    const st=surf.fov*DEG*0.06, k0=e.key;
    if(k0==='ArrowLeft'){ e.preventDefault(); surf.yaw+=st; surf.tyaw=surf.yaw; surf.track=null; return; }
    if(k0==='ArrowRight'){ e.preventDefault(); surf.yaw-=st; surf.tyaw=surf.yaw; surf.track=null; return; }
    if(k0==='ArrowUp'){ e.preventDefault(); surf.pitch=Math.min(1.5,surf.pitch+st); surf.tpitch=surf.pitch; surf.track=null; return; }
    if(k0==='ArrowDown'){ e.preventDefault(); surf.pitch=Math.max(-0.6,surf.pitch-st); surf.tpitch=surf.pitch; surf.track=null; return; }
    if(k0==='+'||k0==='='){ e.preventDefault(); surfZoom(0.85); return; }
    if(k0==='-'||k0==='_'){ e.preventDefault(); surfZoom(1.18); return; }
    if((k0==='v'||k0==='V') && !e.repeat){ setBino(!surf.bino); return; }
  }                                     // never while typing in the date field
  if(e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  const k = e.key;
  if(surf && !(k===' ' || k==='Spacebar' || k==='h' || k==='H' || k==='r' || k==='R')) return;
  if(k===' ' || k==='Spacebar'){
    e.preventDefault();                       // no page scroll, and no re-press of the button that was clicked last
    if(tag==='BUTTON') el.blur();
    togglePause();
  }
  else if(k==='o' || k==='O') $('btn-orbits').click();
  else if(k==='b' || k==='B') $('btn-belts').click();
  else if(k==='h' || k==='H') toggleHud();
  else if(k==='r' || k==='R') setReverse(timeDir > 0);
  else if(k==='ArrowRight'){ e.preventDefault(); stepSelection(1); }
  else if(k==='ArrowLeft'){ e.preventDefault(); stepSelection(-1); }
  else if((k==='f' || k==='F') && locked && locked.kind!=='sun') startFlight(locked);
});

// ---------- ANIMATE ----------
const clock = new THREE.Clock();
const tmpVec = new THREE.Vector3();
const tmpVec2 = new THREE.Vector3();
const tmpInv = new THREE.Quaternion();
let frame = 0;
const labelRects = [];
const labelOrder = bodies.slice().sort((a,b)=>a.prio-b.prio);
const VMAX_SPIN = TWO_PI*3;     // fastest on-screen spin, rad/s: real rotation rates at slow speeds, a smooth blur at extreme time warp
function spinStep(dSim, hours, dt){
  if(!(dt > 0) || !hours) return 0;
  const trueRate = (dSim*24/hours)*TWO_PI/dt;                 // rad per real second at the current time warp
  return VMAX_SPIN*Math.tanh(trueRate/VMAX_SPIN)*dt;
}

function updatePositions(dt){
  // planets: refresh the orbital elements every ~20 simulated years so positions stay accurate while time runs
  if(Math.abs(simJD - planets[0].el.jd0) > 7305) rebaseElements(simJD);
  const dSim = simJD - prevSimJD; prevSimJD = simJD;
  planets.forEach(pm=>{
    orbitPos(pm.el, simJD, pm.mesh.position);
    const d = pm.data;
    if(!(surf && surf.b === pm)) pm.spin += spinStep(dSim, d.dayLenH, dt) * (d.retro ? -1 : 1);   // (held still while you stand on it)   // real day length (Venus, Uranus and Pluto spin backwards)
    pm.mesh.quaternion.copy(pm.qAlign).multiply(tmpQ.setFromAxisAngle(Y_AXIS, pm.spin));
    pm.group.position.copy(pm.mesh.position);
    if(pm.ringMesh) pm.ringMesh.position.copy(pm.mesh.position);
  });
  const dJ = simJD - J2000;
  moons.forEach(m=>{
    const th = m.th0 + m.rate*dJ;
    m.mesh.position.set(0,0,0)
      .addScaledVector(m.basis.u, Math.cos(th)*m.aU)
      .addScaledVector(m.basis.v, Math.sin(th)*m.aU);
  });
  craft.forEach(cb=>craftPos(cb, simJD));
  if(!(surf && surf.b === sunBody)) sunMesh.rotation.y += spinStep(dSim, 25.38*24, dt);                // the Sun turns once in ~25 days at its equator
  asteroidBelt.rotation.y = asteroidRate*(simJD-J2000);
  kuiperBelt.rotation.y = kuiperRate*(simJD-J2000);
}

function updateScreenSpace(){
  const W = window.innerWidth, H = window.innerHeight, ppuK = (H/2)/Math.tan(camera.fov/2*DEG);   // px per unit = ppuK / distance

  bodies.forEach(b=>{
    b.worldPos(b.wp);
    b.dist = camera.position.distanceTo(b.wp);
    b.ppu = ppuK/Math.max(b.dist,1e-12);
    b.discPx = b.rad*2*b.ppu;
    if((b.kind === 'planet' || b.kind === 'moon') && !b.texDone && !b.texUrgent && b.discPx > 14) queueTex(b, true);   // paint its surface now: it is close enough to see
    // A body much smaller than one pixel cannot be seen (its name label marks the spot), so skip drawing
    // its finely detailed sphere. In the wide views this is nearly every planet and moon.
    if(b.kind !== 'sun') b.mesh.visible = (b.discPx > 0.2 || b === locked) && !b.hidden;
  });

  planets.forEach(pm=>{
    pm.inRange = pm.moonRange > 0 && pm.dist < pm.moonRange;
    if(pm.ringMesh){
      // ring shader inputs: direction to the Sun and the camera, both in ring space
      tmpInv.copy(pm.ringMesh.quaternion).invert();
      const u = pm.ringMesh.material.uniforms;
      u.uSun.value.copy(pm.wp).multiplyScalar(-1).normalize().applyQuaternion(tmpInv);
      u.uCam.value.copy(camera.position).sub(pm.wp).applyQuaternion(tmpInv);
    }
  });
  moons.forEach(m=>{ m.orbitLine.visible = m.parent.inRange && orbitsVisible && !surf; });

  // bodies big enough on screen to hide something that sits behind them (the Sun, planets, moons)
  const occ = bodies.filter(o=>o.kind!=='craft' && o.discPx > 1.5 && !(o.kind==='moon' && !o.parent.inRange));
  const cp = camera.position;
  function hiddenBehind(b){
    const L = b.dist; if(!(L > 0)) return false;
    const ux = (b.wp.x-cp.x)/L, uy = (b.wp.y-cp.y)/L, uz = (b.wp.z-cp.z)/L;
    for(let k=0;k<occ.length;k++){
      const o = occ[k]; if(o === b) continue;
      const cx = o.wp.x-cp.x, cy = o.wp.y-cp.y, cz = o.wp.z-cp.z;
      const t = cx*ux + cy*uy + cz*uz; if(t <= 0) continue;
      const d2 = cx*cx + cy*cy + cz*cz - t*t, r2 = o.rad*o.rad;
      if(d2 >= r2) continue;
      const entry = t - Math.sqrt(r2 - d2);           // where the line of sight first meets the sphere
      if(entry > 0 && entry < L) return true;
    }
    return false;
  }

  // labels: highest priority first; skip any that would overlap one already placed
  labelRects.length = 0;
  const order = locked ? [locked].concat(labelOrder) : labelOrder;
  const seen = new Set();
  order.forEach(b=>{
    if(seen.has(b)) return; seen.add(b);
    let ok = !b.hidden && !(surf && b === surf.b);
    if(b.kind==='moon' && !b.parent.inRange) ok = false;
    if(ok && hiddenBehind(b)) ok = false;            // behind the Sun or a planet: no name
    let sx=0, sy=0, x=0, y=0;
    if(ok){
      tmpVec.copy(b.wp).project(camera);
      sx = (tmpVec.x*0.5+0.5)*W; sy = (-tmpVec.y*0.5+0.5)*H;
      if(tmpVec.z >= 1 || sx < -60 || sx > W+60 || sy < -20 || sy > H+20) ok = false;
      else if(b.discPx > H*0.7 && b !== locked) ok = false;
      else if(b.discPx > H*1.3) ok = false;
    }
    if(ok){
      const off = Math.min(b.discPx/2, 4000) + 9;       // the label sits beside the body
      x = sx + off; y = sy - 7;
      const w = b.labelW, h = 14;
      for(let k=0;k<labelRects.length;k++){
        const r = labelRects[k];
        if(x < r[0]+r[2]+2 && x+w+2 > r[0] && y < r[1]+r[3]+2 && y+h+2 > r[1]){ ok = false; break; }
      }
      if(ok) labelRects.push([x,y,w,h]);
    }
    if(ok){
      b.label.style.transform = 'translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';
      if(!b.labelShown){ b.label.style.display = 'block'; b.labelShown = true; }
      b.label.classList.toggle('sel', b === locked);
    } else if(b.labelShown){
      b.label.style.display = 'none'; b.labelShown = false;
    }
  });
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const rate = intro ? 0.15 : simDaysPerSec;                 // the opening fly-through runs the clock gently
  if(!paused && !flight) simJD += dt*rate*timeDir;

  updatePositions(dt);
  sunMat.uniforms.uTime.value = performance.now()/1000;
  // the glow squares sit a little behind the Sun's sphere, so the depth buffer never has to choose between the two
  const sdc = Math.max(camera.position.length(), 1e-6), shift = sunRadius*1.2, kk = (sdc+shift)/sdc;
  sunCorona.position.copy(camera.position).multiplyScalar(-shift/sdc);
  sunHalo.position.copy(sunCorona.position);
  sunCorona.quaternion.copy(camera.quaternion);
  sunCorona.material.uniforms.uTime.value = performance.now()/1000;
  sunCorona.scale.setScalar(sunRadius*CORONA_HALF*sunGlare*(surf ? 1 : 1 + 0.012*Math.sin(performance.now()/1300))*kk);
  sunHalo.scale.setScalar(sunRadius*20*sunGlare*kk);

  if(intro) stepIntro(dt);
  else if(flight) stepFlight(dt);
  else if(surf){ /* the camera is placed on the surface below */ }
  else if(follow){
    // camera follows the followed body exactly (it moves thousands of units per second here); lockOffset decays so a change of target is a smooth glide
    lockOffset.multiplyScalar(Math.pow(0.85, dt*60));
    if(lockOffset.lengthSq() < 1e-16) lockOffset.set(0,0,0);
    follow.worldPos(tmpVec2);
    camFocus.copy(tmpVec2).add(lockOffset);
    if(glideRelease && lockOffset.lengthSq() === 0){ follow = null; glideRelease = false; }
  }

  if(surf) surfaceCamera(dt); else { updateCamera(); updateOrbitLOD(); }
  starPoints.position.copy(camera.position);
  starPoints.scale.setScalar(Math.max(1, camera.near*3/2800)); updateConLabels(); updateStarMark();   // keep the star shell beyond the near plane when zoomed far out
  updateScreenSpace();
  if(surf){ updateSkyDots(); updateBinoHud(); }
  runTex(texJobs.length && texJobs[0] && (surf || texUrgentNow()) ? 12 : 4);

  if((++frame % 8) === 0){ updateHud(); updateLive(); }

  // reticle on the selected body
  if(locked){
    tmpVec.copy(locked.wp).project(camera);
    if(tmpVec.z < 1){
      reticle.style.display = 'block';
      reticle.style.left = ((tmpVec.x*0.5+0.5)*window.innerWidth - 26)+'px';
      reticle.style.top = ((-tmpVec.y*0.5+0.5)*window.innerHeight - 26)+'px';
    } else reticle.style.display = 'none';
  }

  renderer.render(scene, camera);
}

// ---------- RESIZE ----------
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- START ----------
camRadius = targetRadius = 250000;
applyOrbitVisibility(); applyBeltVisibility();
updatePositions(0);
updateCamera();
updateHud();
if(isMobile()) $('hint').firstChild.textContent = 'DRAG TO ROTATE · PINCH TO ZOOM · TAP A BODY';
const sharedView = applyHash();
if(sharedView) setTimeout(startTextures, 1500);       // a shared link opens straight at that view; otherwise the intro plays
animate();
setTimeout(()=>{
  const ld = $('loading');
  ld.style.transition = 'opacity .4s'; ld.style.opacity = '0';
  setTimeout(()=>ld.remove(), 450);
  if(!sharedView){ camFocus.set(0,0,0); lockOffset.set(0,0,0); camRadius = targetRadius = 250000; camTheta = targetTheta = 0.9; camPhi = targetPhi = 1.309; startTextures(); maybeStartTour(); }
}, 500);

})();

</script>
