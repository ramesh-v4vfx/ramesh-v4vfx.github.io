<style>
  :root{
    --red:#ff2b2b;
    --red-dim:#ff2b2b55;
    --bg:#050608;
    --panel:#0a0c10;
    --text:#d8dde3;
    --dim:#5a6270;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Mono',monospace;
    overflow:hidden;
    height:100%;
    width:100%;
  }
  #canvas-wrap{position:fixed;inset:0;touch-action:none;cursor:grab;}
  #canvas-wrap.dragging{cursor:grabbing;}
  canvas{display:block;touch-action:none;}

  /* scanlines */
  #scanlines{
    position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:overlay;
  }
  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:49;
    box-shadow: inset 0 0 180px rgba(0,0,0,0.85);
  }

  /* corner brackets */
  .corner{
    position:fixed;width:26px;height:26px;border:2px solid var(--red);
    z-index:60;pointer-events:none;opacity:.85;
  }
  .corner.tl{top:14px;left:14px;border-right:none;border-bottom:none;}
  .corner.tr{top:14px;right:14px;border-left:none;border-bottom:none;}
  .corner.bl{bottom:14px;left:14px;border-right:none;border-top:none;}
  .corner.br{bottom:14px;right:14px;border-left:none;border-top:none;}

  /* top hud bar */
  #topbar{
    position:fixed;top:0;left:0;right:0;z-index:55;
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 40px;
    pointer-events:none;
  }
  #logo{
    font-weight:700;font-size:13px;letter-spacing:2px;color:var(--red);
    text-shadow:0 0 8px var(--red-dim);
    text-decoration:none;pointer-events:auto;cursor:pointer;
    transition:.15s;
  }
  #logo:hover{text-shadow:0 0 14px var(--red-dim);}
  #clock{
    font-size:12px;color:var(--dim);letter-spacing:2px;
  }

  /* top HUD body-select bar — no panel background, just floating buttons */
  #top-controls{
    position:fixed;top:52px;left:0;right:0;z-index:56;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    pointer-events:none;
    padding:0 14px;
  }
  .body-row{
    display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;align-items:center;
    max-width:100%;
    pointer-events:auto;
    padding-bottom:2px;
    scrollbar-width:thin;
  }
  .body-row::-webkit-scrollbar{height:3px;}
  .body-row::-webkit-scrollbar-thumb{background:var(--red-dim);}
  .body-row .btn{padding:5px 8px;font-size:9px;}
  .body-row .row-tag{font-size:8px;letter-spacing:2px;color:var(--dim);opacity:.7;padding-right:2px;white-space:nowrap;flex:none;}
  #moons-row .btn,#small-row .btn{font-size:8.5px;padding:4px 7px;}
  .btn.moon{border-color:rgba(255,255,255,.18);}
  #planet-buttons{display:contents;}
  #sim-row{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;
    pointer-events:auto;
    max-width:100%;
  }
  .btn{
    background:transparent;
    border:1px solid var(--dim);
    color:var(--text);
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:1px;
    padding:7px 11px;
    cursor:pointer;
    transition:.15s;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--red);color:var(--red);box-shadow:0 0 8px var(--red-dim);}
  .btn.active{border-color:var(--red);color:var(--red);background:rgba(255,43,43,0.08);}
  .btn.dwarf{border-style:dashed;color:var(--dim);opacity:.85;}
  .btn.dwarf:hover{color:var(--red);}
  .btn.dwarf.active{color:var(--red);}
  #btn-reset{border-color:var(--red);color:var(--red);}
  #btn-reset:hover{box-shadow:0 0 10px var(--red-dim);}

  #speedwrap{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--dim);letter-spacing:1px;}
  #speed{-webkit-appearance:none;width:110px;height:2px;background:var(--dim);outline:none;}
  #speed::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;background:var(--red);cursor:pointer;box-shadow:0 0 6px var(--red);}

  /* info panel */
  #panel{
    position:fixed;top:184px;right:20px;width:280px;max-height:calc(100vh - 200px);overflow-y:auto;
    background:rgba(8,9,12,0.88);
    border:1px solid var(--red-dim);
    padding:0;
    z-index:58;
    opacity:0;
    transform:translateX(20px);
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    backdrop-filter:blur(8px);
  }
  #panel.show{opacity:1;transform:translateX(0);pointer-events:auto;}
  #panel-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 14px;border-bottom:1px solid var(--red-dim);
  }
  #panel-name{color:var(--red);font-weight:700;font-size:14px;letter-spacing:2px;}
  #panel-close{cursor:pointer;color:var(--dim);font-size:14px;}
  #panel-close:hover{color:var(--red);}
  #panel-body{padding:12px 14px;font-size:11px;line-height:1.9;}
  .row{display:flex;justify-content:space-between;border-bottom:1px dashed #ffffff12;padding:3px 0;}
  .row .k{color:var(--dim);letter-spacing:1px;}
  .row .v{color:var(--text);text-align:right;}
  #panel-desc{margin-top:10px;font-size:10.5px;color:var(--dim);line-height:1.7;}

  /* target reticle for locked planet - drawn via canvas overlay div */
  #reticle{
    position:fixed;width:52px;height:52px;z-index:57;pointer-events:none;
    display:none;
  }
  #reticle::before,#reticle::after{
    content:'';position:absolute;border:1px solid var(--red);
  }
  #reticle::before{inset:0;border-radius:50%;opacity:.6;}
  #reticle::after{inset:12px;border-radius:50%;opacity:.9;}
  #reticle .tick{position:absolute;background:var(--red);}
  #reticle .tick.top{top:-10px;left:50%;width:1px;height:8px;transform:translateX(-50%);}
  #reticle .tick.bot{bottom:-10px;left:50%;width:1px;height:8px;transform:translateX(-50%);}
  #reticle .tick.l{left:-10px;top:50%;height:1px;width:8px;transform:translateY(-50%);}
  #reticle .tick.r{right:-10px;top:50%;height:1px;width:8px;transform:translateY(-50%);}

  #hint{
    position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
    font-size:10px;color:var(--dim);letter-spacing:1px;z-index:56;
    text-align:center;
  }
  #scale-note{
    position:fixed;bottom:20px;left:20px;
    font-size:9px;color:var(--dim);letter-spacing:1px;z-index:56;
    opacity:.7;pointer-events:none;max-width:300px;
  }
  #watermark{
    position:fixed;bottom:8px;left:50%;transform:translateX(-50%);
    font-size:9px;color:var(--dim);letter-spacing:2px;z-index:56;
    opacity:.5;pointer-events:none;
  }
  #loading{
    position:fixed;inset:0;z-index:100;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;
  }
  #loading .bar{width:220px;height:2px;background:#222;position:relative;overflow:hidden;}
  #loading .fill{position:absolute;left:0;top:0;height:100%;width:30%;background:var(--red);
    animation:load 1.1s ease-in-out infinite;}
  @keyframes load{
    0%{left:-30%;}
    100%{left:100%;}
  }
  #loading .txt{font-size:11px;letter-spacing:3px;color:var(--dim);}

  /* name labels (HTML overlay) */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:54;overflow:hidden;}
  .lbl{
    position:absolute;left:0;top:0;display:none;
    font-size:9px;letter-spacing:1.2px;color:#cfd5dc;opacity:.92;
    padding:1px 3px;white-space:nowrap;cursor:pointer;pointer-events:auto;
    text-shadow:0 0 4px #000,0 0 2px #000,0 0 8px #000;will-change:transform;
  }
  .lbl:hover{color:var(--red);}
  .lbl.dwarf{color:#8d95a1;}
  .lbl.moon{color:#9aa3ae;font-size:8px;letter-spacing:1px;}
  .lbl.sel{color:var(--red);}
  #speed-val{min-width:64px;color:var(--text);letter-spacing:1px;}
  #scalebar{
    position:fixed;right:40px;bottom:22px;z-index:56;text-align:center;
    font-size:9px;letter-spacing:1px;color:var(--dim);pointer-events:none;
  }
  #scalebar .bar{height:6px;border:1px solid var(--dim);border-top:none;margin:4px auto 0;}

  @media(max-width:640px){
    #panel{width:calc(100vw - 40px);right:20px;top:64px;}
    #topbar{padding:14px 18px;}
    #logo{font-size:10px;letter-spacing:1px;}
    #clock{display:none;}
    #hint{display:none;}
    #scale-note{bottom:16px;left:18px;max-width:200px;}
    #scalebar{right:18px;bottom:16px;}
    #speed-val{display:none;}
  }
</style>
</head>

// ---------- ORBITAL MECHANICS ----------
function makeElements(o){
  const i=o.i*DEG, om=o.om*DEG, w=o.w*DEG;
  const cw=Math.cos(w), sw=Math.sin(w), co=Math.cos(om), so=Math.sin(om), ci=Math.cos(i), si=Math.sin(i);
  return {
    jd0:o.jd0, a:o.a, e:o.e, i, om, w, M0:o.M0*DEG,
    n: (o.n !== undefined) ? o.n : TWO_PI/(365.25636*Math.pow(o.a,1.5)),   // mean motion, rad/day
    P11: cw*co - sw*so*ci,  P12: -sw*co - cw*so*ci,
    P21: cw*so + sw*co*ci,  P22: -sw*so + cw*co*ci,
    P31: sw*si,             P32: cw*si
  };
}
// planets: elements and rates evaluated for the date the page was opened, then frozen
function standishElements(r, jd){
  const T=(jd-J2000)/36525;
  const a=r[0]+r[1]*T, e=r[2]+r[3]*T, I=r[4]+r[5]*T, L=r[6]+r[7]*T, vp=r[8]+r[9]*T, Om=r[10]+r[11]*T;
  return makeElements({jd0:jd, a, e, i:I, om:Om, w:vp-Om, M0:L-vp, n:(r[7]-r[9])/36525*DEG});
}
function solveE(M, e){
  M = ((M % TWO_PI) + TWO_PI) % TWO_PI;
  let E = e < 0.8 ? M : Math.PI;
  for(let k=0;k<10;k++){ E -= (E - e*Math.sin(E) - M)/(1 - e*Math.cos(E)); }
  return E;
}
// heliocentric position in scene units. Ecliptic (X,Y,Z) -> scene (X, Z, -Y): y is "north", motion is counter-clockwise from above.
function orbitPoint(el, E, out){
  const xp = el.a*(Math.cos(E)-el.e), yp = el.a*Math.sqrt(1-el.e*el.e)*Math.sin(E);
  const X = el.P11*xp + el.P12*yp, Y = el.P21*xp + el.P22*yp, Z = el.P31*xp + el.P32*yp;
  return out.set(X*AU_U, Z*AU_U, -Y*AU_U);
}
function orbitPos(el, jd, out){
  return orbitPoint(el, solveE(el.M0 + el.n*(jd-el.jd0), el.e), out);
}
function poleVec(ra, dec){
  ra*=DEG; dec*=DEG;
  const x=Math.cos(dec)*Math.cos(ra), y=Math.cos(dec)*Math.sin(ra), z=Math.sin(dec);
  const Xe=x, Ye=y*Math.cos(OBLIQ)+z*Math.sin(OBLIQ), Ze=-y*Math.sin(OBLIQ)+z*Math.cos(OBLIQ);
  return new THREE.Vector3(Xe, Ze, -Ye).normalize();
}
// two unit vectors spanning the plane perpendicular to a pole (u points roughly along the ecliptic x axis)
function planeBasis(p){
  let u = new THREE.Vector3(0,1,0).cross(p);
  if(u.lengthSq() < 1e-6) u.set(1,0,0);
  u.normalize();
  const v = new THREE.Vector3().crossVectors(p, u).normalize();
  return {u, v};
}

function fmt(n){ return n.toLocaleString(); }
function fmtMass(kg){
  const exp = Math.floor(Math.log10(kg));
  const mant = (kg/Math.pow(10,exp)).toFixed(2);
  const supMap = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
  const supExp = String(exp).split('').map(c=>supMap[c]||c).join('');
  return mant + ' × 10' + supExp + ' kg';
}
function fmtSpan(au){
  if(au >= 0.1) return (au<10 ? au.toFixed(2) : Math.round(au).toLocaleString()) + ' AU';
  const km = au*AU_KM;
  return (km >= 1000 ? Math.round(km).toLocaleString() : km.toFixed(1)) + ' km';
}
function fmtLight(s){
  if(s < 60) return s.toFixed(s < 10 ? 2 : 1) + ' s';
  if(s < 3600) return Math.floor(s/60) + ' min ' + Math.round(s%60) + ' s';
  if(s < 172800) return Math.floor(s/3600) + ' h ' + Math.round((s%3600)/60) + ' min';
  return (s/86400).toFixed(1) + ' days';
}
function fmtPeriod(d){
  d = Math.abs(d);
  if(d >= 365250) return fmt(Math.round(d/365.25)) + ' yr';
  return d >= 730 ? fmt(Math.round(d)) + ' d (' + (d/365.25).toFixed(d/365.25 < 10 ? 2 : 1) + ' yr)' : (d < 10 ? d.toFixed(2) : fmt(Math.round(d))) + ' days';
}
function nice125(x){
  const ex = Math.pow(10, Math.floor(Math.log10(x))), f = x/ex;
  return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * ex;
}

const ringVert = `
varying vec3 vL;
void main(){ vL = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
// Ring shading: banded transparency (Saturn: C, B, Cassini division, A, Encke gap; Uranus: thin rings),
// the lit/unlit face, and the planet's own shadow falling across the rings.
const ringFrag = `
varying vec3 vL;
uniform vec3 uSun;      // direction to the Sun, in ring space
uniform vec3 uCam;      // camera position, in ring space
uniform float uR;       // planet radius
uniform float uIn;
uniform float uOut;
uniform vec3 uColor;
uniform float uMode;
float band(float t, float a, float b, float s){ return smoothstep(a-s,a+s,t)*(1.0-smoothstep(b-s,b+s,t)); }
float line(float t, float c, float w){ float d=(t-c)/w; return exp(-d*d); }
void main(){
  float r = length(vL.xy);
  float t = (r-uIn)/(uOut-uIn);
  float alpha;
  vec3 col = uColor;
  if(uMode < 0.5){
    alpha = 0.22*band(t,0.0,0.28,0.02) + 0.95*band(t,0.28,0.69,0.015) + 0.05*band(t,0.69,0.76,0.01) + 0.62*band(t,0.76,1.0,0.01);
    alpha *= 1.0 - 0.9*band(t,0.935,0.95,0.004);
    alpha *= 0.84 + 0.16*sin(t*150.0);
    col *= 0.78 + 0.22*sin(t*40.0+1.0);
  } else {
    alpha = max(max(max(line(t,0.0,0.01),line(t,0.043,0.01)),max(line(t,0.079,0.01),line(t,0.30,0.01))),
                max(max(line(t,0.40,0.01),line(t,0.573,0.01)),max(max(line(t,0.623,0.01),line(t,0.696,0.01)),max(line(t,0.878,0.01),line(t,1.0,0.016)))));
    alpha *= 0.55;
  }
  float t0 = -dot(vL, uSun);
  float shadow = 1.0;
  if(t0 > 0.0){
    float d = length(vL + uSun*t0);
    shadow = smoothstep(uR*0.985, uR*1.015, d);
  }
  shadow = mix(0.05, 1.0, shadow);
  float lit = (uCam.z*uSun.z >= 0.0) ? 1.0 : 0.3;
  gl_FragColor = vec4(col*lit*shadow, alpha*(lit > 0.9 ? 1.0 : 0.85));
}`;

    }));

  // group that rides on the planet and carries its moons

  const pm = {kind:'planet', name:p.name, data:p, el, mesh, ringMesh, group, rad, pole, qAlign, spin:Math.random()*TWO_PI,

    group.add(mmesh);
    const pts=[]; for(let k=0;k<=128;k++){ const th=k/128*TWO_PI; pts.push(basis.u.clone().multiplyScalar(Math.cos(th)*aU).addScaledVector(basis.v, Math.sin(th)*aU)); }
    const oline = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:0x8a93a1, transparent:true, opacity:0.28, depthWrite:false}));
    oline.visible = false;
    group.add(oline);
    // phase: the Moon uses its real mean longitude; other moons start at an arbitrary phase (their true phase is not modelled)
    let th0, rate;
    if(md.moon){ th0 = 218.316*DEG; rate = 13.176396*DEG; }
    else { let h=0; for(const ch of md.n) h = (h*31 + ch.charCodeAt(0)) % 360; th0 = h*DEG; rate = TWO_PI/md.P; }
    const mb = {kind:'moon', name:md.n, md, parent:pm, mesh:mmesh, orbitLine:oline, basis, aU, rad:mrad,
                th0, rate, wp:new THREE.Vector3(), prio:3,
                worldPos(out){ return out.copy(this.parent.mesh.position).add(this.mesh.position); }};
    mmesh.userData.body = mb;
    pm.moons.push(mb); moons.push(mb); bodies.push(mb);
    pm.moonRange = Math.max(pm.moonRange, aU*40);
  });
});

function makeBelt(count, aMin, aMax, eMax, incSigmaDeg, color, size, opacity){

}

let camTheta = 0.9, camPhi = 1.2, camRadius = 250000;
let targetTheta = camTheta, targetPhi = camPhi, targetRadius = camRadius;
const camFocus = new THREE.Vector3(0,0,0);

function clampRadius(r){
  let minR = 0.02;
  if(follow) minR = follow.kind==='sun' ? sunRadius*3 : Math.max(1e-5, follow.rad*1.4);
  else if(camFocus.length() < sunRadius*3) minR = sunRadius*3.2;    // free view centred on the Sun: stop before it fills the screen
  return Math.max(minR, Math.min(3e7, r));   // out to ~15,000 AU, enough for 2014 FE72's whole orbit
}
function updateCamera(){
  camTheta += (targetTheta-camTheta)*0.08;
  camPhi += (targetPhi-camPhi)*0.08;
  camRadius = Math.exp(Math.log(camRadius) + (Math.log(targetRadius)-Math.log(camRadius))*0.1);   // log-space easing: smooth across 10 orders of magnitude
  camPhi = Math.max(0.15, Math.min(Math.PI-0.15, camPhi));
  camera.position.set(
    camFocus.x + camRadius*Math.sin(camPhi)*Math.cos(camTheta),
    camFocus.y + camRadius*Math.cos(camPhi),
    camFocus.z + camRadius*Math.sin(camPhi)*Math.sin(camTheta));
  // never let the camera enter the Sun (everything would turn yellow)
  const minD = sunRadius*1.25, dd = camera.position.length();
  if(dd < minD){ if(dd < 1e-6) camera.position.set(0,0,minD); else camera.position.multiplyScalar(minD/dd); }
  camera.lookAt(camFocus);
  // clipping planes follow the zoom so a whole system and a single moon both stay sharp
  const nearP = Math.max(1e-7, camRadius*0.002), farP = 5e6 + camRadius*4;
  if(Math.abs(camera.near-nearP) > nearP*0.02 || camera.far !== farP){ camera.near = nearP; camera.far = farP; camera.updateProjectionMatrix(); }
  camera.updateMatrixWorld();
}

  camFocus.addScaledVector(up, dy*panSpeed);
}

renderer.domElement.addEventListener('pointerdown', e=>{
  if(e.button===2){
    panning=true; panLastX=e.clientX; panLastY=e.clientY;
    if(follow) deselect(true);          // panning frees the camera from the body
  } else {
    dragging=true; dragMoved=false; lastX=e.clientX; lastY=e.clientY;
  }
  wrap.classList.add('dragging');
});
window.addEventListener('pointerup', ()=>{dragging=false; panning=false; wrap.classList.remove('dragging');});
window.addEventListener('pointermove', e=>{
  if(panning){
    const dx = e.clientX-panLastX, dy = e.clientY-panLastY;
    panLastX=e.clientX; panLastY=e.clientY;
    panCamera(dx, dy);
    return;
  }
  if(!dragging) return;
  if(!dragMoved){
    if(Math.hypot(e.clientX-lastX, e.clientY-lastY) < 4) return;   // still within the click dead zone
    dragMoved = true;
  }
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  targetTheta -= dx*0.005;
  targetPhi -= dy*0.005;
});
function onWheel(e){
  e.preventDefault();
  targetRadius *= (1 + e.deltaY*0.003);
  targetRadius = clampRadius(targetRadius);
}
renderer.domElement.addEventListener('wheel', onWheel, {passive:false});
const labelLayer = document.getElementById('labels');
labelLayer.addEventListener('wheel', onWheel, {passive:false});   // wheel keeps zooming while the pointer is over a name

// touch: 1-finger rotate (pointer events above), 2-finger pinch-zoom + pan
let pinchStart=null, touchPanX=null, touchPanY=null;
renderer.domElement.addEventListener('touchmove', e=>{
  if(e.touches.length===2){
    const t0=e.touches[0], t1=e.touches[1];
    const d=Math.hypot(t0.clientX-t1.clientX, t0.clientY-t1.clientY);
    const midX=(t0.clientX+t1.clientX)/2, midY=(t0.clientY+t1.clientY)/2;
    if(pinchStart!=null){
      targetRadius *= (pinchStart/d);
      targetRadius = clampRadius(targetRadius);
    }
    if(touchPanX!=null){
      if(follow) deselect(true);        // panning frees the camera from the body
      panCamera(midX-touchPanX, midY-touchPanY);
    }
    pinchStart=d; touchPanX=midX; touchPanY=midY;
  }
},{passive:true});
renderer.domElement.addEventListener('touchend', e=>{
  if(e.touches.length<2){ pinchStart=null; touchPanX=null; touchPanY=null; }
});

// ---------- RAYCAST CLICK ----------
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
function onClick(e){
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const targets = [sunMesh];
  planets.forEach(p=>{ targets.push(p.mesh); });
  moons.forEach(m=>{ if(m.parent.inRange) targets.push(m.mesh); });
  const hits = raycaster.intersectObjects(targets).filter(h=>h.object.visible);
  if(hits.length) selectBody(hits[0].object.userData.body);
  else if(locked) deselect();           // click on empty space: clear the selection, the camera stays exactly where it is
}
let clickStartX=0, clickStartY=0;
renderer.domElement.addEventListener('pointerdown', e=>{clickStartX=e.clientX;clickStartY=e.clientY;});
renderer.domElement.addEventListener('click', e=>{
  if(Math.abs(e.clientX-clickStartX)<4 && Math.abs(e.clientY-clickStartY)<4) onClick(e);   // only a click, not a drag
});
window.addEventListener('keydown', e=>{ if(e.key==='Escape' && locked) deselect(); });

// ---------- PANEL / SELECTION ----------
const panel = document.getElementById('panel');
const panelName = document.getElementById('panel-name');
const panelBody = document.getElementById('panel-body');
const panelClose = document.getElementById('panel-close');
const reticle = document.getElementById('reticle');

function flyTo(body, closeRadius){
  const p = body.worldPos(new THREE.Vector3());
  lockOffset.copy(camFocus).sub(p);     // glide: the offset decays while the camera tracks the body exactly
  targetRadius = closeRadius;
}
const row = (k, v, id) => `<div class="row"><span class="k">${k}</span><span class="v"${id?` id="${id}"`:''}>${v}</span></div>`;

function selectBody(b){
  locked = b;
  follow = b;
  flyTo(b, b.kind==='sun' ? sunRadius*5 : Math.max(b.rad*5, 1e-4));
  if(b.kind === 'sun'){
    panelName.textContent = 'SUN';
    panelBody.innerHTML =
      row('TYPE','G-TYPE STAR') + row('RADIUS', fmt(SUN.radiusKm)+' km') + row('MASS', fmtMass(SUN.massKg)) + row('MASS SHARE','99.8%') +
      row('LIGHT TIME TO EARTH','—','lv-light') + `<div id="panel-desc">${SUN.desc}</div>`;
  } else if(b.kind === 'planet'){
    const p = b.data;
    panelName.textContent = p.name;
    panelBody.innerHTML =
      row('TYPE', p.kind || (p.dwarf ? 'DWARF PLANET' : 'PLANET')) +
      (p.desig ? row('DESIGNATION', p.desig) : '') +
      row('MEAN DISTANCE', b.el.a.toFixed(3)+' AU') +
      row('DISTANCE NOW','—','lv-dist') +
      row('LIGHT TIME FROM SUN','—','lv-light') +
      row('ECCENTRICITY', b.el.e.toFixed(4)) +
      row('ORBIT TILT', Math.abs(b.el.i/DEG).toFixed(2)+'°') +
      row('AXIAL TILT', p.tilt==null ? '—' : p.tilt.toFixed(2)+'°') +
      row('RADIUS', (p.radiusKm<100 ? p.radiusKm.toFixed(1) : fmt(Math.round(p.radiusKm)))+' km') +
      row('MASS', p.massKg ? fmtMass(p.massKg) : 'UNKNOWN') +
      row('ORBITAL PERIOD', fmtPeriod(p.periodDays || 365.25636*Math.pow(b.el.a,1.5))) +
      row('DAY LENGTH', p.dayLenH ? fmt(Math.round(p.dayLenH*10)/10)+' hrs' : 'UNKNOWN') +
      row('MOONS', p.moons + (b.moons.length ? ' ('+b.moons.length+' shown)' : '')) +
      `<div id="panel-desc">${p.desc}</div>`;
  } else {
    panelName.textContent = b.name;
    panelBody.innerHTML =
      row('TYPE','MOON OF '+b.parent.name) +
      row('ORBIT RADIUS', fmt(b.md.a)+' km') +
      row('RADIUS', (b.md.r<100 ? b.md.r.toFixed(1) : fmt(Math.round(b.md.r)))+' km') +
      row('ORBITAL PERIOD', fmtPeriod(b.md.P) + (b.md.P<0 ? ' · RETROGRADE' : '')) +
      row('LIGHT TIME FROM SUN','—','lv-light') +
      `<div id="panel-desc">Orbits ${b.parent.name} at a true distance of ${fmt(b.md.a)} km — about ${(b.md.a/b.parent.data.radiusKm).toFixed(1)} planet radii from its centre.${b.md.moon ? ' Position is its real position for the simulated date.' : ' Starting position along its orbit is illustrative.'}</div>`;
  }
  panel.classList.add('show');
  highlightButtons(b.kind==='moon' ? null : b.name);
  updateLive();
}

// Clears the selection (panel, reticle, highlight). The camera keeps following the body it was on,
// so nothing moves — unless releaseCamera is true (panning, Reset), which frees the camera too.
function deselect(releaseCamera){
  locked = null;
  if(releaseCamera === true) follow = null;
  panel.classList.remove('show');
  reticle.style.display = 'none';
  highlightButtons(null);
}
panelClose.addEventListener('click', ()=>deselect());   // wrapper: the click event must not be passed in as the argument

function highlightButtons(name){
  document.querySelectorAll('#top-controls .body-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.name===name);
  });
}

// live rows: distance from the Sun and light travel time
function updateLive(){
  if(!locked) return;
  const lt = document.getElementById('lv-light'), ld = document.getElementById('lv-dist');
  let au = null;
  if(locked.kind === 'planet') au = locked.mesh.position.length()/AU_U;
  else if(locked.kind === 'moon') au = locked.parent.mesh.position.length()/AU_U;
  else if(locked.kind === 'sun') au = planets[2].mesh.position.length()/AU_U;   // Earth
  if(ld && au!=null) ld.textContent = au.toFixed(au<10?3:2)+' AU · '+fmt(Math.round(au*AU_KM/1e6))+' M km';
  if(lt && au!=null) lt.textContent = fmtLight(au*LIGHT_SEC_PER_AU);
}

// buttons
document.getElementById('btn-sun').dataset.name = 'SUN';
document.getElementById('btn-sun').classList.add('body-btn');
document.getElementById('btn-sun').addEventListener('click', ()=>selectBody(sunBody));
function addBodyButton(container, b, cls, title){
  const el = document.createElement('button');
  el.className = 'btn body-btn ' + cls;
  el.textContent = b.name; el.dataset.name = b.name;
  if(title) el.title = title;
  el.addEventListener('click', ()=>selectBody(b));
  container.appendChild(el);
}
const pbWrap = document.getElementById('planet-buttons'), smallWrap = document.getElementById('small-row'), moonWrap = document.getElementById('moons-row');
planets.forEach(pm=>{
  if(pm.data.small) addBodyButton(smallWrap, pm, 'dwarf', pm.data.kind + ' · ' + pm.data.desig);
  else addBodyButton(pbWrap, pm, pm.data.dwarf ? 'dwarf' : '', null);
});
moons.forEach(m=>addBodyButton(moonWrap, m, 'moon', 'MOON OF '+m.parent.name));

// ---------- NAME LABELS (HTML overlay, constant on-screen size, click to fly) ----------
bodies.forEach(b=>{
  const el = document.createElement('div');
  el.className = 'lbl ' + (b.kind==='moon' ? 'moon' : (b.kind==='planet' && b.data.dwarf) ? 'dwarf' : '');
  el.textContent = b.name;
  el.addEventListener('click', ev=>{ ev.stopPropagation(); selectBody(b); });
  labelLayer.appendChild(el);
  b.label = el; b.labelShown = false; b.labelW = b.name.length*6.8 + 10;
});

// ---------- SIM CONTROLS ----------
const speedEl = document.getElementById('speed');
const speedVal = document.getElementById('speed-val');
const DEFAULT_SPEED = 26;
let simDaysPerSec = 2;
let paused = false;
// slider 0..100 -> 0.1 day/s .. 10,000 day/s (logarithmic)
function setSpeedFromSlider(v){
  simDaysPerSec = 0.1*Math.pow(10, v*0.05);
  const d = simDaysPerSec;
  speedVal.textContent = d < 1 ? (d*24).toFixed(1)+' hr/s' : d < 365 ? (d < 10 ? d.toFixed(1) : Math.round(d))+' days/s' : (d/365.25).toFixed(1)+' yr/s';
}
speedEl.addEventListener('input', e=>setSpeedFromSlider(+e.target.value));
setSpeedFromSlider(DEFAULT_SPEED);

document.getElementById('btn-pause').addEventListener('click', function(){
  paused = !paused;
  this.textContent = paused ? 'RESUME' : 'PAUSE';
  this.classList.toggle('active', paused);
});
function applyOrbitVisibility(){
  orbitLines.forEach(l=>l.visible=orbitsVisible);
  document.getElementById('btn-orbits').textContent = 'ORBITS: ' + (orbitsVisible?'ON':'OFF');
}
document.getElementById('btn-orbits').addEventListener('click', function(){
  orbitsVisible = !orbitsVisible;
  applyOrbitVisibility();
});
function applyBeltVisibility(){
  asteroidBelt.visible = kuiperBelt.visible = beltsVisible;
  document.getElementById('btn-belts').textContent = 'BELTS: ' + (beltsVisible?'ON':'OFF');
}
document.getElementById('btn-belts').addEventListener('click', function(){
  beltsVisible = !beltsVisible;
  applyBeltVisibility();
});
function openingView(){
  targetTheta = 0.9; targetPhi = 1.2; targetRadius = 250000;   // the whole system at true scale
  camFocus.set(0,0,0);
  lockOffset.set(0,0,0);
}
document.getElementById('btn-reset').addEventListener('click', function(){
  openingView();
  deselect(true);                       // Reset also releases the camera
  // simulation back to today, default speed, running
  simJD = jdNow();
  speedEl.value = DEFAULT_SPEED; setSpeedFromSlider(DEFAULT_SPEED);
  paused = false;
  document.getElementById('btn-pause').textContent = 'PAUSE';
  document.getElementById('btn-pause').classList.remove('active');
  orbitsVisible = true; applyOrbitVisibility();
  beltsVisible = true; applyBeltVisibility();
});

// ---------- HUD: scale note, scale bar, date ----------
const scaleNote = document.getElementById('scale-note');
const scaleBarEl = document.getElementById('scalebar');
const scaleBarLine = scaleBarEl.querySelector('.bar');
const scaleBarTxt = scaleBarEl.querySelector('.txt');
const clockEl = document.getElementById('clock');

function updateHud(){
  // how much real distance the screen spans at the focus point
  const ppu = (window.innerHeight/2)/(camRadius*TAN_HALF_FOV);          // pixels per scene unit at the focus
  const spanAU = window.innerWidth/ppu/AU_U;
  scaleNote.textContent = 'TO SCALE — TRUE DISTANCES & SIZES · VIEW ≈ ' + fmtSpan(spanAU) + ' ACROSS';
  // scale bar: a round length (1, 2, 5 × 10ⁿ) about 120 px wide
  const targetKm = 130/ppu/KM_U;
  let km, label;
  if(targetKm >= 0.1*AU_KM){ const au = nice125(targetKm/AU_KM); km = au*AU_KM; label = (au>=1 ? fmt(au) : String(au)) + ' AU'; }
  else { km = nice125(targetKm); label = fmt(km) + ' km'; }
  scaleBarLine.style.width = (km*KM_U*ppu).toFixed(0) + 'px';
  scaleBarTxt.textContent = label + '  ·  ' + fmtLight(km/C_KM_S) + ' of light';
  // simulated date
  const ms = (simJD-2440587.5)*86400000;
  const dte = new Date(ms);
  clockEl.textContent = isFinite(dte.getTime()) ? 'SIM DATE ' + dte.toISOString().replace('T',' ').slice(0,16) + ' UTC' : 'SIM DATE —';
}

// ---------- ANIMATE ----------
const clock = new THREE.Clock();
const tmpVec = new THREE.Vector3();
const tmpVec2 = new THREE.Vector3();
const tmpInv = new THREE.Quaternion();
let frame = 0;
const labelRects = [];
const labelOrder = bodies.slice().sort((a,b)=>a.prio-b.prio);

function updatePositions(dt){
  planets.forEach(pm=>{
    orbitPos(pm.el, simJD, pm.mesh.position);
    if(!paused) pm.spin += dt*0.2;
    pm.mesh.quaternion.copy(pm.qAlign).multiply(tmpQ.setFromAxisAngle(Y_AXIS, pm.spin));
    pm.group.position.copy(pm.mesh.position);
    if(pm.ringMesh) pm.ringMesh.position.copy(pm.mesh.position);
  });
  const dJ = simJD - J2000;
  moons.forEach(m=>{
    const th = m.th0 + m.rate*dJ;
    m.mesh.position.set(0,0,0)
      .addScaledVector(m.basis.u, Math.cos(th)*m.aU)
      .addScaledVector(m.basis.v, Math.sin(th)*m.aU);
  });
  asteroidBelt.rotation.y = asteroidRate*(simJD-J2000);
  kuiperBelt.rotation.y = kuiperRate*(simJD-J2000);
}

function updateScreenSpace(){
  const W = window.innerWidth, H = window.innerHeight, ppuK = (H/2)/TAN_HALF_FOV;   // px per unit = ppuK / distance

  bodies.forEach(b=>{
    b.worldPos(b.wp);
    b.dist = camera.position.distanceTo(b.wp);
    b.ppu = ppuK/Math.max(b.dist,1e-12);
    b.discPx = b.rad*2*b.ppu;
  });

  planets.forEach(pm=>{
    pm.inRange = pm.moonRange > 0 && pm.dist < pm.moonRange;
    if(pm.ringMesh){
      // ring shader inputs: direction to the Sun and the camera, both in ring space
      tmpInv.copy(pm.ringMesh.quaternion).invert();
      const u = pm.ringMesh.material.uniforms;
      u.uSun.value.copy(pm.wp).multiplyScalar(-1).normalize().applyQuaternion(tmpInv);
      u.uCam.value.copy(camera.position).sub(pm.wp).applyQuaternion(tmpInv);
    }
  });
  moons.forEach(m=>{ m.orbitLine.visible = m.parent.inRange && orbitsVisible; });

  // labels: highest priority first; skip any that would overlap one already placed
  labelRects.length = 0;
  const order = locked ? [locked].concat(labelOrder) : labelOrder;
  const seen = new Set();
  order.forEach(b=>{
    if(seen.has(b)) return; seen.add(b);
    let ok = true;
    if(b.kind==='moon' && !b.parent.inRange) ok = false;
    let sx=0, sy=0, x=0, y=0;
    if(ok){
      tmpVec.copy(b.wp).project(camera);
      sx = (tmpVec.x*0.5+0.5)*W; sy = (-tmpVec.y*0.5+0.5)*H;
      if(tmpVec.z >= 1 || sx < -60 || sx > W+60 || sy < -20 || sy > H+20) ok = false;
      else if(b.discPx > H*0.7 && b !== locked) ok = false;
      else if(b.discPx > H*1.3) ok = false;
    }
    if(ok){
      const off = b.discPx/2 + 9;       // the label sits beside the body; a short leader line points back to it
      x = sx + off; y = sy - 7;
      const w = b.labelW, h = 14;
      for(let k=0;k<labelRects.length;k++){
        const r = labelRects[k];
        if(x < r[0]+r[2]+2 && x+w+2 > r[0] && y < r[1]+r[3]+2 && y+h+2 > r[1]){ ok = false; break; }
      }
      if(ok) labelRects.push([x,y,w,h]);
    }
    if(ok){
      b.label.style.transform = 'translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';
      if(!b.labelShown){ b.label.style.display = 'block'; b.labelShown = true; }
      b.label.classList.toggle('sel', b === locked);
    } else if(b.labelShown){
      b.label.style.display = 'none'; b.labelShown = false;
    }
  });
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if(!paused) simJD += dt*simDaysPerSec;

  updatePositions(dt);

  // camera follows the followed body exactly (it moves thousands of units per second here); lockOffset decays so a change of target is a smooth glide
  if(follow){
    lockOffset.multiplyScalar(Math.pow(0.85, dt*60));
    if(lockOffset.lengthSq() < 1e-16) lockOffset.set(0,0,0);
    follow.worldPos(tmpVec2);
    camFocus.copy(tmpVec2).add(lockOffset);
  }

  updateCamera();
  starPoints.position.copy(camera.position);
  starPoints.scale.setScalar(Math.max(1, camera.near*3/2200));   // keep the star shell beyond the near plane when zoomed far out
  updateScreenSpace();

  if((++frame % 8) === 0){ updateHud(); updateLive(); }

  // reticle on the selected body
  if(locked){
    tmpVec.copy(locked.wp).project(camera);
    if(tmpVec.z < 1){
      reticle.style.display = 'block';
      reticle.style.left = ((tmpVec.x*0.5+0.5)*window.innerWidth - 26)+'px';
      reticle.style.top = ((-tmpVec.y*0.5+0.5)*window.innerHeight - 26)+'px';
    } else reticle.style.display = 'none';
  }

  renderer.render(scene, camera);
}

// ---------- RESIZE ----------
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- LOADING ----------
setTimeout(()=>{
  document.getElementById('loading').style.opacity='0';
  document.getElementById('loading').style.transition='opacity .4s';
  setTimeout(()=>document.getElementById('loading').remove(), 450);
}, 500);

camRadius = targetRadius = 250000;
applyOrbitVisibility(); applyBeltVisibility();
updatePositions(0);
updateCamera();
updateHud();
animate();

})();
</script>

<script src="/tools-data.js"></script>
