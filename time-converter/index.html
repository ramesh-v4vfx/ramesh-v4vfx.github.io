<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0f0101;
    font-family: system-ui, sans-serif;
    color: #fff;
  }

  .card {
    background: #161a35;
    padding: 22px;
    width: 100%;
    max-width: 430px;
    border-radius: 14px;
    box-shadow: 0 20px 40px rgba(0,0,0,.45);
  }

  h2 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 1.3rem;
  }

  input, select, button {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: none;
    font-size: 1rem;
  }

  input, select {
    background: #0f1220;
    color: #fff;
  }

  .row {
    display: flex;
    gap: 10px;
  }

  .result {
    background: #0f1220;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-size: 1.2rem;
    min-height: 46px;
    margin-bottom: 8px;
  }

  .decimals {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .decimals button {
    flex: 1;
    background: #2b2f55;
  }

  .decimals button.active {
    background: #4f7cff;
  }

  button {
    background: #ff4f58;
    color: #fff;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.1s ease;
  }

  button.secondary {
    background: #2b2f55;
  }

  button:active {
    transform: scale(0.95);
  }

  button:hover {
    opacity: 0.9;
  }

  .history {
    margin-top: 10px;
    font-size: 0.85rem;
    display: none;
  }

  .history h3 {
    margin: 6px 0;
    font-size: 0.9rem;
    opacity: 0.85;
  }

  .history-item {
    opacity: 0.75;
    margin-bottom: 4px;
  }

  .note {
    text-align: center;
    font-size: 0.75rem;
    opacity: 0.6;
    margin-top: 8px;
  }

  #clearHistoryBtn {
    margin-top: 10px;
    background: #3a1c1c;
    color: #ffb4b4;
  }

  #clearHistoryBtn:hover {
    background: #4a2222;
  }

  input, select, button {
    font-size: 16px;
    padding: 12px;
  }

  .history {
    max-height: 180px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* SHARE PANEL */
  .share-panel {
    display: none;
    background: #0f1220;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .share-panel p {
    margin: 0 0 10px;
    font-size: 13px;
    opacity: 0.7;
    text-align: center;
  }
  .share-icons {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .share-icon-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    background: #2b2f55;
    border: none;
    border-radius: 10px;
    padding: 10px 4px;
    cursor: pointer;
    font-size: 10px;
    color: #d1d5db;
    flex: 1;
    min-width: 50px;
    transition: background 0.2s;
    margin-bottom: 0;
    width: auto;
  }
  .share-icon-btn svg { width: 22px; height: 22px; }
  .share-icon-btn:hover { background: #3a3f70; opacity: 1; }
  .share-icon-btn.copied { background: #14532d; }

  @media (max-width: 600px) {
    .row { flex-direction: column; }
    h2 { margin-bottom: 18px; }
  }

<div class="card">
  <h2>Time Converter</h2>

  <input type="number" id="value" placeholder="Enter value" step="any">

  <div class="row">
    <select id="from">
      <option value="ns">Nanoseconds (ns)</option>

    <button onclick="revertDecimals()" class="secondary">Raw</button>

  <button onclick="resetAll()" class="secondary">Reset</button>

  <button onclick="toggleHistory()" class="secondary" id="historyToggle">Show history</button>

  <div class="history" id="historyPanel">
    <h3>Last 10 calculations</h3>
    <div id="history"></div>
    <button id="clearHistoryBtn" class="secondary" onclick="clearHistory()">Clear history</button>

  <!-- Share This App button + panel -->

  <div class="share-panel" id="sharePanel">
    <p>Share this tool with friends:</p>

      <button class="share-icon-btn" id="shareTwitter">
        <svg viewBox="0 0 24 24" fill="#e5e7eb"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.748l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>

        <svg viewBox="0 0 24 24" fill="#229ED9"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>

      <!-- Copy Link -->

        <svg viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>

  <div class="note">
    1 s = 1,000 ms = 1,000,000 µs = 1,000,000,000 ns

<script>
  const resultBox = document.getElementById("result");
  const historyBox = document.getElementById("history");
  const historyPanel = document.getElementById("historyPanel");
  const historyToggle = document.getElementById("historyToggle");
  const copyBtn = document.getElementById("copyBtn");
  const decimalButtons = document.querySelectorAll(".decimals button");

  const factors = {
    ns: 1e-9, us: 1e-6, ms: 1e-3, sec: 1,
    min: 60, hr: 3600, day: 86400, yr: 31556952
  };

  let rawResult = null;
  let decimals = null;
  let lastValue = 0;
  let history = [];

  function convert() {
    const value = parseFloat(document.getElementById("value").value);
    if (isNaN(value)) return;
    const from = document.getElementById("from").value;
    const to = document.getElementById("to").value;
    rawResult = (value * factors[from]) / factors[to];
    decimals = null;
    updateDecimalButtons();
    animateCounter(lastValue, rawResult);
    saveHistory(value, from, rawResult, to);
    lastValue = rawResult;
  }

  function animateCounter(start, end) {
    const duration = 500;
    const startTime = performance.now();
    function step(now) {
      const p = Math.min((now - startTime) / duration, 1);
      resultBox.textContent = format(start + (end - start) * p);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function format(num) {
    if (decimals !== null) return roundSafe(num, decimals).toFixed(decimals);
    return num.toLocaleString("en-US", { maximumFractionDigits: 8 });
  }

  function clearHistory() {
    history = [];
    historyBox.innerHTML = "<div class='history-item'>History cleared</div>";
    setTimeout(() => {
      historyPanel.style.display = "none";
      historyToggle.textContent = "Show history";
    }, 600);
  }

  function setDecimals(n) {
    if (rawResult === null) return;
    decimals = n;
    updateDecimalButtons();
    resultBox.textContent = roundSafe(rawResult, n).toFixed(n);
  }

  function revertDecimals() {
    if (rawResult === null) return;
    decimals = null;
    updateDecimalButtons();
    resultBox.textContent = format(rawResult);
  }

  function updateDecimalButtons() {
    decimalButtons.forEach(btn => btn.classList.remove("active"));
    if (decimals !== null) {
      decimalButtons.forEach(btn => {
        if (btn.textContent.startsWith(decimals)) btn.classList.add("active");
      });
    }
  }

  function copyResult() {
    if (resultBox.textContent === "—") return;
    navigator.clipboard.writeText(resultBox.textContent);
    copyBtn.textContent = "Copied!";
    setTimeout(() => copyBtn.textContent = "Copy", 800);
  }

  function saveHistory(input, from, output, to) {
    history.unshift(`${input} ${from} → ${format(output)} ${to}`);
    history = history.slice(0, 10);
    renderHistory();
  }

  function renderHistory() {
    historyBox.innerHTML = "";
    history.forEach(h => {
      const div = document.createElement("div");
      div.className = "history-item";
      div.textContent = h;
      historyBox.appendChild(div);
    });
  }

  function toggleHistory() {
    const visible = historyPanel.style.display === "block";
    historyPanel.style.display = visible ? "none" : "block";
    historyToggle.textContent = visible ? "Show history" : "Hide history";
  }

  function resetAll() {
    document.getElementById("value").value = "";
    resultBox.textContent = "—";
    rawResult = null; decimals = null; lastValue = 0; history = [];
    updateDecimalButtons();
    renderHistory();
  }

  function roundSafe(num, decimals) {
    const factor = 10 ** decimals;
    return Math.round((num + Number.EPSILON) * factor) / factor;
  }

  // SHARE LOGIC
  const APP_URL = window.location.href;
  const APP_TITLE = 'Time Converter – a free online tool!';

  function toggleShare() {
    const panel = document.getElementById('sharePanel');
    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
  }

  document.getElementById('shareWhatsapp').onclick = () =>
    window.open(`https://wa.me/?text=${encodeURIComponent(APP_TITLE + '\n' + APP_URL)}`, '_blank');

  document.getElementById('shareFacebook').onclick = () =>
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(APP_URL)}`, '_blank');

  document.getElementById('shareInstagram').onclick = () => {
    const btn = document.getElementById('shareInstagram');
    navigator.clipboard.writeText(APP_URL).then(() => {
      btn.classList.add('copied');
      btn.lastChild.textContent = 'Link copied!';
      window.open('https://www.instagram.com/', '_blank');
      setTimeout(() => { btn.classList.remove('copied'); btn.lastChild.textContent = 'Instagram'; }, 3000);
    });
  };

  document.getElementById('shareTwitter').onclick = () =>
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(APP_TITLE)}&url=${encodeURIComponent(APP_URL)}`, '_blank');

  document.getElementById('shareTelegram').onclick = () =>
    window.open(`https://t.me/share/url?url=${encodeURIComponent(APP_URL)}&text=${encodeURIComponent(APP_TITLE)}`, '_blank');

  document.getElementById('shareCopy').onclick = () => {
    const btn = document.getElementById('shareCopy');
    navigator.clipboard.writeText(APP_URL).then(() => {
      btn.classList.add('copied');
      btn.lastChild.textContent = 'Copied!';
      setTimeout(() => { btn.classList.remove('copied'); btn.lastChild.textContent = 'Copy Link'; }, 2000);
    });
  };
</script>
