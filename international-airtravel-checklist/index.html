<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Free international travel checklist. Track passports, visas, flight bookings, packing, and money essentials before you fly, organized by category with progress tracking.">

<title>International Travel Checklist | rameshverse</title>

<link rel="canonical" href="https://rameshverse.com/international-air-travel-checklist">

<style>
  :root {
    --bg: #070c14;
    --card-1: #101c2e;
    --card-2: #0a1420;
    --border: rgba(255,179,71,0.16);
    --text: #eef3f8;
    --text-dim: rgba(238,243,248,0.6);
    --accent: #ffb347;
    --accent-soft: rgba(255,179,71,0.12);
    --green: #34d399;
    --danger: #ef4444;
    --danger-bright: #f87171;
  }

  * { box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,179,71,0.06), transparent 55%),
      var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
  }

  html, body { height: 100%; }

  .app {
    position: relative;
    max-width: 520px;
    width: 100%;
    margin: auto;
    max-height: calc(100vh - 40px);
    background: linear-gradient(160deg, var(--card-1), var(--card-2));
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 24px 55px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .app-header {
    flex: none;
    padding: 22px 20px 0;
  }

  .app-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 0 20px 22px;
    scrollbar-width: none;      /* Firefox */
    -ms-overflow-style: none;   /* old Edge/IE */
  }

  .app-scroll::-webkit-scrollbar {
    display: none;              /* Chrome, Safari, new Edge */
  }

  h1 {
    text-align: center;
    margin: 0 0 3px;
    font-size: 21px;
    letter-spacing: 0.2px;
  }

  .subtitle {
    text-align: center;
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  /* ---------- PROGRESS ---------- */
  .progress-wrap { margin-bottom: 4px; }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .progress-label strong { color: var(--accent); }

  .progress-track {
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.07);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #ffd08a);
    border-radius: 999px;
    transition: width 0.3s ease;
  }

  /* ---------- TICKET PERFORATION DIVIDER ---------- */
  .ticket-divider {
    position: relative;
    height: 2px;
    margin: 18px -20px;
    background-image: repeating-linear-gradient(to right, rgba(255,255,255,0.2) 0 8px, transparent 8px 16px);
  }

  .ticket-divider::before,
  .ticket-divider::after {
    content: "";
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--bg);
  }

  .ticket-divider::before { left: -10px; }
  .ticket-divider::after { right: -10px; }

  /* ---------- CATEGORIES / LIST ---------- */
  .category { margin-top: 16px; }
  .category:first-child { margin-top: 0; }

  .category-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .category-header .count {
    color: var(--text-dim);
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 2px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    gap: 8px;
  }

  li:last-child { border-bottom: none; }

  li.completed span.task-text {
    text-decoration: line-through;
    color: var(--text-dim);
  }

  .left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }

  .left span.task-text {
    line-height: 1.4;
    word-break: break-word;
  }

  .task-link {
    font-size: 12px;
    font-weight: 700;
    color: #1a1006;
    text-decoration: none;
    background: linear-gradient(135deg, var(--accent), #ffd08a);
    padding: 6px 12px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(255,179,71,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .task-link:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(255,179,71,0.5);
  }

  button.delete {
    background: none;
    border: none;
    color: var(--danger-bright);
    font-size: 18px;
    padding: 6px;
    cursor: pointer;
    flex-shrink: 0;
  }

  button.delete:hover { opacity: 0.75; }

  /* Bigger touch targets, accent-colored checkbox */
  input[type="checkbox"] {
    width: 20px;
    height: 20px;
    min-width: 20px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .empty-note {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 10px 4px;
  }

  /* ---------- ADD TASK ---------- */
  .add-task {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .add-task input {
    flex: 1;
    padding: 11px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    font-size: 16px;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .add-task input::placeholder { color: var(--text-dim); }
  .add-task input:focus { border-color: var(--accent); background: rgba(255,255,255,0.08); }

  button {
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
    transition: filter 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }

  button:active { transform: translateY(1px); }

  .add-task button {
    padding: 10px 16px;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: #1a1006;
    font-weight: 700;
  }

  .add-task button:hover { filter: brightness(1.08); }

  /* ---------- EXPORT / RESET ---------- */
  .btn-export,
  .btn-share-checklist,
  .btn-reset {
    margin-top: 10px;
    width: 100%;
    padding: 11px;
    border-radius: 9px;
    font-weight: 600;
    font-size: 14px;
  }

  .export-row {
    display: flex;
    gap: 10px;
  }

  .export-row button {
    margin-top: 10px;
    flex: 1;
  }

  .btn-export {
    background: rgba(52,211,153,0.12);
    color: var(--green);
    border: 1px solid rgba(52,211,153,0.4);
  }

  .btn-export:hover { background: rgba(52,211,153,0.2); }

  .btn-share-checklist {
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid rgba(255,179,71,0.4);
  }

  .btn-share-checklist:hover { background: rgba(255,179,71,0.2); }

  .btn-reset {
    background: rgba(239,68,68,0.1);
    color: var(--danger-bright);
    border: 1px solid rgba(239,68,68,0.35);
  }

  .btn-reset:hover { background: rgba(239,68,68,0.18); }

  .hint {
    margin-top: 18px;
    font-size: 13px;
    color: var(--text-dim);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    padding: 11px 12px;
    border-radius: 9px;
  }

  /* ---------- Small screens ---------- */
  @media (max-width: 480px) {
    body { padding: 12px; }
    .app { max-height: calc(100vh - 24px); }
    .app-header { padding: 18px 16px 0; }
    .app-scroll { padding: 0 16px 18px; }
    h1 { font-size: 19px; }

    .add-task { flex-direction: column; gap: 8px; }
    .add-task input,
    .add-task button { width: 100%; font-size: 16px; }

    .export-row { flex-direction: column; }

    li { padding: 12px 2px; }
    .hint { font-size: 12.5px; }
    .ticket-divider { margin: 14px -16px; }
  }
</style>
</head>
<body>

  <div class="app">
    <div class="app-header">
      <h1>✈ International Travel Checklist</h1>
      <div class="subtitle">Everything to sort before you fly</div>

      <div class="progress-wrap">
        <div class="progress-label">
          <span>Trip readiness</span>
          <span><strong id="progressCount">0/0</strong> done</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
      </div>

      <div class="ticket-divider"></div>
    </div>

    <div class="app-scroll">
      <div id="taskListWrap"></div>

      <div class="add-task">
        <input id="newTaskInput" type="text" placeholder="Add your own item…" />
        <button id="addBtn">Add</button>
      </div>

      <div class="export-row">
        <button id="downloadBtn" class="btn-export">⬇ Download checklist</button>
        <button id="shareBtn" class="btn-share-checklist">📤 Share checklist</button>
      </div>
      <button id="resetBtn" class="btn-reset">🔄 Reset to default checklist</button>

      <div class="hint">
        💡 Some countries require 6 months passport validity and proof of onward travel.
      </div>
    </div>
  </div>

  <script>
    const taskListWrap = document.getElementById("taskListWrap");
    const newTaskInput = document.getElementById("newTaskInput");
    const addBtn = document.getElementById("addBtn");
    const progressCount = document.getElementById("progressCount");
    const progressFill = document.getElementById("progressFill");

    const STORAGE_KEY = "travelChecklist";
    const CURRENCY_CONVERTER_URL = "https://rameshverse.com/currency-converter/";

    const CATEGORY_ORDER = [
      "Documents & Entry",
      "Flights & Stay",
      "Packing",
      "Money & Cards",
      "Connectivity",
      "Insurance",
      "Other"
    ];

    const CATEGORY_ICONS = {
      "Documents & Entry": "📄",
      "Flights & Stay": "✈️",
      "Packing": "🧳",
      "Money & Cards": "💳",
      "Connectivity": "📶",
      "Insurance": "🛡️",
      "Other": "📝"
    };

    const defaultTasks = [
      { text: "Passport validity check", category: "Documents & Entry" },
      { text: "Visa check", category: "Documents & Entry" },
      { text: "Check the destination country's immigration rules for tourists", category: "Documents & Entry" },
      { text: "International Driving Permit (if you plan to drive)", category: "Documents & Entry" },
      { text: "Printout and digital backup of essential documents", category: "Documents & Entry" },
      { text: "Departure flight tickets", category: "Flights & Stay" },
      { text: "Return flight tickets", category: "Flights & Stay" },
      { text: "Hotel bookings", category: "Flights & Stay" },
      { text: "Weigh check-in bags", category: "Packing" },
      { text: "Weigh carry-on bags", category: "Packing" },
      { text: "Activate debit card for international use", category: "Money & Cards" },
      { text: "Activate credit card for international use", category: "Money & Cards" },
      { text: "Set international transaction limits", category: "Money & Cards" },
      {
        text: "Minimum required cash in local currency",
        category: "Money & Cards",
        link: CURRENCY_CONVERTER_URL,
        linkLabel: "Convert"
      },
      { text: "Enable international roaming on primary SIM (emergency use)", category: "Connectivity" },
      { text: "Travel insurance", category: "Insurance" },
      { text: "Health insurance (international coverage)", category: "Insurance" }
    ];

    function buildDefaultTasks() {
      return defaultTasks.map(t => ({
        id: Date.now() + Math.random(),
        text: t.text,
        category: t.category,
        link: t.link || null,
        linkLabel: t.linkLabel || null,
        completed: false
      }));
    }

    function loadTasks() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        // Backward-compatible: older saved tasks may not have a category field
        return JSON.parse(saved).map(t => ({ category: "Other", link: null, linkLabel: null, ...t }));
      }

      const initial = buildDefaultTasks();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
      return initial;
    }

    let tasks = loadTasks();

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function updateProgress() {
      const total = tasks.length;
      const done = tasks.filter(t => t.completed).length;
      progressCount.textContent = `${done}/${total}`;
      progressFill.style.width = total === 0 ? "0%" : `${Math.round((done / total) * 100)}%`;
    }

    function renderTasks() {
      taskListWrap.innerHTML = "";
      updateProgress();

      if (tasks.length === 0) {
        taskListWrap.innerHTML = `<div class="empty-note">No items yet — add your first one below.</div>`;
        return;
      }

      CATEGORY_ORDER.forEach(category => {
        const items = tasks.filter(t => (t.category || "Other") === category);
        if (items.length === 0) return;

        const section = document.createElement("div");
        section.className = "category";

        const doneCount = items.filter(t => t.completed).length;

        const header = document.createElement("div");
        header.className = "category-header";
        header.innerHTML = `
          <span>${CATEGORY_ICONS[category] || "📝"} ${category}</span>
          <span class="count">${doneCount}/${items.length}</span>
        `;
        section.appendChild(header);

        const ul = document.createElement("ul");

        items.forEach(task => {
          const li = document.createElement("li");
          if (task.completed) li.classList.add("completed");

          const left = document.createElement("div");
          left.className = "left";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = task.completed;
          checkbox.addEventListener("change", () => {
            task.completed = checkbox.checked;
            saveTasks();
            renderTasks();
          });

          const span = document.createElement("span");
          span.className = "task-text";
          span.textContent = task.text;

          left.appendChild(checkbox);
          left.appendChild(span);

          if (task.link) {
            const link = document.createElement("a");
            link.className = "task-link";
            link.href = task.link;
            link.target = "_blank";
            link.rel = "noopener";
            link.textContent = (task.linkLabel || "Open") + " →";
            left.appendChild(link);
          }

          const delBtn = document.createElement("button");
          delBtn.textContent = "✕";
          delBtn.className = "delete";
          delBtn.addEventListener("click", () => {
            const confirmDelete = confirm("Are you sure you want to remove this checklist item?");
            if (!confirmDelete) return;

            tasks = tasks.filter(t => t.id !== task.id);
            saveTasks();
            renderTasks();
          });

          li.appendChild(left);
          li.appendChild(delBtn);
          ul.appendChild(li);
        });

        section.appendChild(ul);
        taskListWrap.appendChild(section);
      });
    }

    function addTask() {
      const text = newTaskInput.value.trim();
      if (!text) return;

      tasks.push({
        id: Date.now() + Math.random(),
        text,
        category: "Other",
        link: null,
        linkLabel: null,
        completed: false
      });

      newTaskInput.value = "";
      saveTasks();
      renderTasks();
      newTaskInput.focus();
    }

    addBtn.addEventListener("click", addTask);

    newTaskInput.addEventListener("keydown", e => {
      if (e.key === "Enter") addTask();
    });

    function buildChecklistText() {
      let content = "International Air Travel Checklist\n\n";

      CATEGORY_ORDER.forEach(category => {
        const items = tasks.filter(t => (t.category || "Other") === category);
        if (items.length === 0) return;

        content += `${category}\n`;
        items.forEach(task => {
          const mark = task.completed ? "✔" : "⬜";
          content += `  ${mark} ${task.text}\n`;
        });
        content += "\n";
      });

      return content;
    }

    const downloadBtn = document.getElementById("downloadBtn");
    const shareBtn = document.getElementById("shareBtn");

    downloadBtn.addEventListener("click", () => {
      if (tasks.length === 0) {
        alert("Checklist is empty.");
        return;
      }

      const blob = new Blob([buildChecklistText()], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "international-air-travel-checklist.txt";
      a.click();

      URL.revokeObjectURL(url);
    });

    shareBtn.addEventListener("click", async () => {
      if (tasks.length === 0) {
        alert("Checklist is empty.");
        return;
      }

      const text = buildChecklistText();
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });

      // Best: native share sheet with the checklist as a file
      if (navigator.share) {
        const file = new File([blob], "international-air-travel-checklist.txt", { type: "text/plain" });

        try {
          if (navigator.canShare && !navigator.canShare({ files: [file] })) {
            throw new Error("file sharing unsupported");
          }
          await navigator.share({
            title: "International Travel Checklist",
            text: "My international travel checklist",
            files: [file]
          });
          return;
        } catch (err) {
          // fall through to a text-only share, then to clipboard below
          try {
            await navigator.share({ title: "International Travel Checklist", text });
            return;
          } catch (err2) {
            // user cancelled, or sharing text also failed — fall through
          }
        }
      }

      // Fallback: copy to clipboard for devices/browsers without the Web Share API
      try {
        await navigator.clipboard.writeText(text);
        alert("Sharing isn't supported on this device/browser — the checklist was copied to your clipboard instead.");
      } catch (err) {
        alert("Sharing isn't supported here. Use Download checklist instead.");
      }
    });

    const resetBtn = document.getElementById("resetBtn");

    resetBtn.addEventListener("click", () => {
      const confirmReset = confirm(
        "Are you sure you want to reset the checklist?\n\nThis will remove all your changes and restore the default list."
      );

      if (!confirmReset) return;

      tasks = buildDefaultTasks();
      saveTasks();
      renderTasks();
    });

    renderTasks();
  </script>

  <script src="/libraries/config.js"></script>
  <script src="/libraries/view-counter.js"></script>
  <script src="/libraries/hud-home-button.js"></script>

  <script src="/tools-data.js"></script>
  <script src="/related-modules.js"></script>

</body>
</html>
