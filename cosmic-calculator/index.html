<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cosmic Calculator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>

  :root {
    --bg-panel: #0a0e1a;
    --bg-panel-2: #0d1322;
    --bg-well: #060911;
    --accent-cyan: #4fd8ff;
    --accent-cyan-dim: rgba(79, 216, 255, 0.35);
    --accent-green: #39ff88;
    --accent-red: #ff5f5f;
    --border-line: rgba(79, 216, 255, 0.22);
    --text-primary: #dbe6f5;
    --text-dim: #6b84a3;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Orbitron', sans-serif;
    --ui: 'Rajdhani', sans-serif;
  }

  * {
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: var(--ui);
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(79,120,216,0.10), transparent 55%),
      radial-gradient(ellipse at 85% 80%, rgba(150,79,216,0.08), transparent 55%),
      linear-gradient(180deg, #03040a 0%, #070b16 55%, #04060d 100%);
  }

  /* Twinkling starfield — populated by JS, sits behind everything */
  .starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .star {
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
    animation-name: twinkle;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .star { animation: none; opacity: 0.6; }
    .eyebrow .dot { animation: none; }
  }

  .converter {
    background: linear-gradient(155deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
    border: 1px solid var(--border-line);
    padding: 28px;
    border-radius: 6px;
    width: 470px;
    position: relative;
    z-index: 1;
    box-shadow:
      0 0 0 1px rgba(79,216,255,0.04),
      0 0 40px rgba(79,216,255,0.08),
      0 25px 60px rgba(0,0,0,0.65);
  }

  /* HUD corner brackets — signature element */
  .converter::before,
  .converter::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    border-color: var(--accent-cyan);
    border-style: solid;
    opacity: 0.85;
  }
  .converter::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .converter::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  .eyebrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 10px;
  }

  .eyebrow .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-cyan);
    box-shadow: 0 0 8px var(--accent-cyan);
    animation: pulse 2.2s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  h2 {
    font-family: var(--display);
    text-align: center;
    margin: 0 0 4px;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text-primary);
    text-shadow: 0 0 18px rgba(79,216,255,0.25);
  }

  .version-tag {
    display: block;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent-cyan);
    opacity: 0.75;
    margin: 0 0 26px;
  }

  /* Vertical stack spacing */
  .converter > * { margin-bottom: 12px; }

  .value-input { margin-bottom: 8px; }
  select { margin-bottom: 14px; }

  .round-buttons button {
    padding: 12px;
    font-size: 14px;
    opacity: 0.95;
  }
  .round-buttons button:hover { opacity: 1; }

  input, select, button {
    width: 100%;
    padding: 10px;
    margin-top: 0px;
    border-radius: 4px;
    border: none;
    font-size: 14px;
    font-family: var(--ui);
    box-sizing: border-box;
  }

  input, select {
    background: var(--bg-well);
    color: var(--text-primary);
    border: 1px solid var(--border-line);
  }

  .value-input {
    font-family: var(--mono);
    letter-spacing: 0.5px;
    border: 1px solid var(--accent-cyan-dim);
    box-shadow: 0 0 6px rgba(56, 189, 248, 0.15);
    background: var(--bg-well);
    transition: border 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .value-input:focus {
    outline: none;
    border: 1px solid var(--accent-cyan);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    background: #020617;
  }

  .value-input::-webkit-inner-spin-button,
  .value-input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .value-input, select {
    height: 52px;
    padding: 0 18px;
    font-size: 17px;
    line-height: 52px;
  }

  select {
    font-family: var(--ui);
    font-weight: 500;
  }

  button {
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  button:active { transform: scale(0.97); }

  button:focus-visible,
  input:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--accent-cyan);
    outline-offset: 2px;
  }

  /* Primary action — hero button */
  .convert-btn {
    background: linear-gradient(135deg, var(--accent-cyan), #1fa9d6);
    color: #01131a;
    font-size: 20px;
    padding: 18px 24px;
    border-radius: 6px;
    box-shadow: 0 0 22px rgba(79,216,255,0.4), inset 0 0 0 1px rgba(255,255,255,0.15);
  }
  .convert-btn:hover {
    box-shadow: 0 0 32px rgba(79,216,255,0.6), inset 0 0 0 1px rgba(255,255,255,0.2);
  }

  .secondary-btn {
    background: transparent;
    border: 1px solid var(--border-line);
    color: var(--text-primary);
  }
  .secondary-btn:hover {
    background: rgba(79, 216, 255, 0.08);
    border-color: var(--accent-cyan);
  }

  .round-buttons { display: flex; gap: 10px; margin-top: 10px; margin-bottom: 12px; }

  /* Result readout */
  .result {
    margin-top: 4px;
    padding: 16px;
    background: linear-gradient(180deg, var(--bg-well), #0a0f1c);
    border: 1px solid var(--border-line);
    border-radius: 4px;
    text-align: center;
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--accent-cyan);
    text-shadow: 0 0 10px rgba(79,216,255,0.45);
    position: relative;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
  }

  .result::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }

  .result.flash {
    transform: scale(1.08);
    box-shadow: 0 0 18px rgba(56,189,248,0.9);
    opacity: 0.85;
  }

  .result.stale {
    color: var(--text-dim);
    text-shadow: none;
  }

  .copy-btn {
    margin-bottom: 16px;
    background: linear-gradient(135deg, var(--accent-green), #1fcf68);
    color: #02150a;
    box-shadow: 0 0 16px rgba(57,255,136,0.3);
  }
  .copy-btn:hover { box-shadow: 0 0 24px rgba(57,255,136,0.5); }
  .copy-btn.copied { background: #16a34a; box-shadow: none; }
  .copy-btn.copy-failed { background: var(--accent-red); box-shadow: none; color: #1a0505; }

  .action-row { display: flex; gap: 10px; margin-top: 8px; }

  .history {
    margin-top: 15px;
    display: none;
    border-top: 1px solid var(--border-line);
    padding-top: 10px;
  }

  .history-list {
    max-height: 220px;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 4px;
  }

  /* Themed scrollbar (Firefox + WebKit) */
  .history-list {
    scrollbar-width: thin;
    scrollbar-color: var(--accent-cyan-dim) var(--bg-well);
  }
  .history-list::-webkit-scrollbar { width: 6px; }
  .history-list::-webkit-scrollbar-track { background: var(--bg-well); border-radius: 3px; }
  .history-list::-webkit-scrollbar-thumb { background: var(--accent-cyan-dim); border-radius: 3px; }
  .history-list::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

  .history-item {
    font-family: var(--mono);
    padding: 8px 10px;
    background: var(--bg-well);
    border: 1px solid var(--border-line);
    border-left: 2px solid var(--accent-cyan);
    border-radius: 3px;
    margin-bottom: 6px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text-primary);
    overflow-wrap: anywhere;
    word-break: break-word;
    white-space: normal;
  }
  .history-item:hover { background: rgba(79, 216, 255, 0.08); }

  .history-empty {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    padding: 10px 0;
  }

  .clear-history-btn {
    margin-top: 10px;
    margin-bottom: 0;
    background: transparent;
    border: 1px solid rgba(255, 95, 95, 0.35);
    color: var(--accent-red);
    font-size: 12.5px;
    padding: 9px;
  }
  .clear-history-btn:hover {
    background: rgba(255, 95, 95, 0.08);
    border-color: var(--accent-red);
  }

  /* ===== Mobile-friendly (no layout change) ===== */
  @media (max-width: 480px) {
    body { padding: 12px; align-items: flex-start; }
    .converter { width: 100%; max-width: 100%; }
    .round-buttons, .action-row { flex-direction: column; }
    input, select, button { font-size: 16px; } /* prevents iOS zoom */
  }

</style>
</head>

<body>

<div class="starfield" id="starfield"></div>

<div class="converter">

  <div class="eyebrow"><span class="dot"></span>Rameshverse Systems &middot; MK&middot;02</div>

  <h2>🪐 Cosmic Calculator</h2>
  <span class="version-tag">UNIT CONVERSION MODULE</span>

  <button class="secondary-btn" onclick="pasteValue()">Paste Value</button>

  <input type="number" id="value" class="value-input" placeholder="Enter value" aria-label="Value to convert">

  <!-- ✅ ORDER UPDATED EXACTLY AS REQUESTED -->
  <select id="conversion" aria-label="Conversion type">
    <option value="m-km">meters → km</option>
    <option value="km-m">km → meters</option>

    <option value="km-mi">km → miles</option>
    <option value="mi-km">miles → km</option>

    <option value="er-km">Earth Radius → km</option>
    <option value="km-er">km → Earth Radius</option>

    <option value="sr-km">Solar Radius → km</option>
    <option value="km-sr">km → Solar Radius</option>

    <option value="au-km">AU → km</option>
    <option value="km-au">km → AU</option>

    <option value="ly-km">light-year → km</option>
    <option value="km-ly">km → light-year</option>

    <option value="ly-pc">light-year → parsec</option>
    <option value="pc-ly">parsec → light-year</option>
  </select>

  <button class="convert-btn" onclick="convert()">Convert</button>

  <div class="round-buttons">
    <button class="secondary-btn" onclick="roundResult(2)">Round: 2 digits</button>
    <button class="secondary-btn" onclick="roundResult(3)">Round: 3 digits</button>
  </div>

  <div class="result" id="result" role="status" aria-live="polite">Result waiting...</div>

  <button class="copy-btn" id="copyBtn" onclick="copyMainResult()">Copy Result</button>

  <div class="action-row">
    <button class="secondary-btn" onclick="resetAll()">Reset</button>
    <button class="secondary-btn" id="historyToggle" onclick="toggleHistory()">Show History</button>
  </div>

  <div class="history" id="historyBox">
    <div class="history-list" id="historyList"></div>
    <button class="secondary-btn clear-history-btn" onclick="clearHistory()">Clear History</button>
  </div>
</div>

<script>
  // ---- Twinkling starfield ----
  (function buildStarfield() {
    const field = document.getElementById("starfield");
    const STAR_COUNT = 70;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < STAR_COUNT; i++) {
      const star = document.createElement("span");
      star.className = "star";
      const size = (Math.random() * 1.6 + 0.6).toFixed(2);
      star.style.width = size + "px";
      star.style.height = size + "px";
      star.style.top = (Math.random() * 100).toFixed(2) + "%";
      star.style.left = (Math.random() * 100).toFixed(2) + "%";
      star.style.animationDuration = (Math.random() * 3 + 2).toFixed(2) + "s";
      star.style.animationDelay = (Math.random() * 5).toFixed(2) + "s";
      frag.appendChild(star);
    }
    field.appendChild(frag);
  })();

  function pasteValue() {
    navigator.clipboard.readText().then(text => {
      if (isNaN(text.trim())) return alert("Clipboard does not contain a valid number");
      document.getElementById("value").value = text.trim();
      invalidateResult();
      flashResult();
    }).catch(() => {
      alert("Couldn't read the clipboard. Check that this page has clipboard permission.");
    });
  }

  const AU_IN_KM = 149597870.7;
  const SOLAR_RADIUS_KM = 695700;
  const EARTH_RADIUS_KM = 6371;

  let lastResult = null;
  let history = [];

  function roundSafe(num, decimals) {
    const factor = 10 ** decimals;
    return Math.round((num + Number.EPSILON) * factor) / factor;
  }

  function flashResult() {
    const r = document.getElementById("result");
    r.classList.add("flash");
    setTimeout(() => r.classList.remove("flash"), 250);
  }

  // Marks the current result as no longer trustworthy once the input
  // changes, so "Round" can't silently operate on an outdated value.
  function invalidateResult() {
    lastResult = null;
    const r = document.getElementById("result");
    r.classList.remove("stale");
  }

  document.getElementById("value").addEventListener("input", () => {
    const r = document.getElementById("result");
    if (r.innerText !== "Result waiting...") {
      lastResult = null;
      r.classList.add("stale");
    }
  });

  document.getElementById("conversion").addEventListener("change", () => {
    const r = document.getElementById("result");
    if (r.innerText !== "Result waiting...") {
      lastResult = null;
      r.classList.add("stale");
    }
  });

  function convert() {
    const value = parseFloat(document.getElementById("value").value);
    if (isNaN(value)) return;

    const type = document.getElementById("conversion").value;
    let result;

    switch (type) {
      case "km-m": result = value * 1000; break;
      case "m-km": result = value / 1000; break;
      case "km-mi": result = value * 0.621371; break;
      case "mi-km": result = value / 0.621371; break;
      case "ly-km": result = value * 9.4607e12; break;
      case "km-ly": result = value / 9.4607e12; break;
      case "ly-pc": result = value / 3.26156; break;
      case "pc-ly": result = value * 3.26156; break;
      case "au-km": result = value * AU_IN_KM; break;
      case "km-au": result = value / AU_IN_KM; break;
      case "km-sr": result = value / SOLAR_RADIUS_KM; break;
      case "sr-km": result = value * SOLAR_RADIUS_KM; break;
      case "km-er": result = value / EARTH_RADIUS_KM; break;
      case "er-km": result = value * EARTH_RADIUS_KM; break;
    }

    lastResult = result;
    const r = document.getElementById("result");
    r.classList.remove("stale");
    r.innerText = cleanFloat(result);
    flashResult();
    addToHistory(value, type, result);
  }

  function roundResult(d) {
    if (lastResult === null) return;
    const rounded = roundSafe(lastResult, d);
    const r = document.getElementById("result");
    r.classList.remove("stale");
    r.innerText = rounded.toFixed(d);
    flashResult();
  }

  function cleanFloat(num) {
    // 15 significant digits is safe for IEEE-754 doubles
    return Number(num.toPrecision(15));
  }

  function copyMainResult() {
    const btn = document.getElementById("copyBtn");
    const text = document.getElementById("result").innerText;
    navigator.clipboard.writeText(text).then(() => {
      btn.innerText = "Copied!";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.innerText = "Copy Result";
        btn.classList.remove("copied");
      }, 500);
    }).catch(() => {
      btn.innerText = "Copy Failed";
      btn.classList.add("copy-failed");
      setTimeout(() => {
        btn.innerText = "Copy Result";
        btn.classList.remove("copy-failed");
      }, 1200);
    });
  }

  function addToHistory(input, type, result) {
    history.unshift({ input, type, result });
    history = history.slice(0, 10);
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById("historyList");
    list.innerHTML = "";

    if (history.length === 0) {
      const empty = document.createElement("div");
      empty.className = "history-empty";
      empty.innerText = "No conversions yet";
      list.appendChild(empty);
      return;
    }

    history.forEach(item => {
      const div = document.createElement("div");
      div.className = "history-item";
      div.innerText = `${item.input} (${item.type}) = ${item.result}`;
      div.onclick = () => navigator.clipboard.writeText(item.result);
      list.appendChild(div);
    });
  }

  function toggleHistory() {
    const box = document.getElementById("historyBox");
    const btn = document.getElementById("historyToggle");
    box.style.display = box.style.display === "block" ? "none" : "block";
    btn.innerText = box.style.display === "block" ? "Hide History" : "Show History";
  }

  // Clears saved conversions only — separate from Reset, which just
  // clears the current input/result.
  function clearHistory() {
    history = [];
    renderHistory();
  }

  function resetAll() {
    document.getElementById("value").value = "";
    const r = document.getElementById("result");
    r.innerText = "Result waiting...";
    r.classList.remove("stale");
    lastResult = null;
  }
</script>

<script src="/libraries/config.js"></script>
<script src="/libraries/view-counter.js"></script>

</body>
</html>
