<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Google tag (gtag.js) -->

<meta charset="UTF-8">
<title>Daily Diary</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: system-ui, sans-serif;
  max-width: 720px;
  margin: auto;
  padding: 1rem;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}


h1 {
  text-align: center;
}

.top-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

select, input[type="date"] {
  padding: 8px;
  font-size: 16px;
}


textarea {
  width: 100%;
  min-height: 40vh;
  padding: 14px;
  font-size: 16px;
  line-height: 1.6;
  resize: vertical;
}


.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
  font-size: 14px;
  opacity: 0.8;
}

button {
  padding: 8px 12px;
  cursor: pointer;
}

body.dark {
  background: #121212;
  color: #eaeaea;
}

body.dark #diaryText {
  background: #1e1e1e;
  color: #eaeaea;
  border-color: #333;
}

body.dark button,
body.dark select,
body.dark input[type="date"] {
  background: #1e1e1e;
  color: #eaeaea;
  border: 1px solid #333;
}

body.dark button:hover {
  opacity: 0.85;
}

/* Voice bar layout */
.voice-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}

/* Voice dropdown */
#voiceSelect {
  flex: 1;
  min-width: 0;
  padding: 8px;
}

/* Play / Stop buttons */
.voice-actions {
  display: flex;
  gap: 8px;
}

  button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  pointer-events: none;
}

@media (max-width: 600px) {

 body {
  padding-left: 12px;
  padding-right: 12px;
  padding-top: 0.75rem;
  padding-bottom: 0.75rem;
  margin: 0;
}

textarea {
    width: 100%;
    margin-left: 0;
    margin-right: 0;
    display: block;
  }


  .top-bar {
    gap: 8px;
  }

  button {
    padding: 10px 14px;
    font-size: 16px;
  }

  #themeToggle {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 10;
  }

  .footer {
    font-size: 13px;
  }

  .voice-bar {
    flex-direction: column;
  }

  #voiceSelect {
    width: 100%;
  }

  .voice-actions {
    width: 100%;
  }

  .voice-actions button {
    flex: 1;
  }


}


</style>
</head>



<body>

 <button id="themeToggle" title="Toggle dark mode">🌙</button>

<h1>📔 My Calm Daily Diary 🌸</h1>

<div class="top-bar">
  <input type="date" id="datePicker">

  <select id="mood">
    <option value="😊">😊 Happy</option>
    <option value="😐">😐 Neutral</option>
    <option value="😞">😞 Sad</option>
    <option value="🤯">🤯 Stressed</option>
  </select>

  <button id="prevBtn">⬅ Previous</button>
  <button id="nextBtn">Next ➡</button>

  <button id="downloadBtn">⬇️📄Entry</button>

  <button id="downloadDiaryBtn">⬇️📚 Diary</button>

  <button id="backupBtn">💾 Backup</button>

  <button id="restoreBtn">📂 Restore</button>

  <button id="deleteAllBtn">🗑 Delete All</button>

  <input
    type="file"
    id="restoreFile"
    accept=".json"
    hidden
  >


  <div class="voice-bar">
    <select id="voiceSelect"></select>

    <div class="voice-actions">
      <button id="playBtn">🔊 Play</button>
      <button id="stopBtn">⏹ Stop</button>
    </div>
  </div>
</div>


</div>

<textarea
  id="diaryText"
  placeholder="Write your thoughts here..."
  spellcheck="false"
  autocomplete="off"
  autocorrect="off"
  autocapitalize="sentences">
</textarea>



<div class="footer">
  <span id="wordCount">0 words</span>
  <span id="status">Auto-saved</span>
</div>


<script src="../libraries/pdf/jspdf.umd.min.js"></script>

<script>


const datePicker = document.getElementById("datePicker");
const diaryText = document.getElementById("diaryText");
const moodSelect = document.getElementById("mood");
const wordCount = document.getElementById("wordCount");
const status = document.getElementById("status");
const downloadBtn = document.getElementById("downloadBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const downloadDiaryBtn = document.getElementById("downloadDiaryBtn");
const backupBtn = document.getElementById("backupBtn");
const restoreBtn = document.getElementById("restoreBtn");
const restoreFile = document.getElementById("restoreFile");
const deleteAllBtn = document.getElementById("deleteAllBtn");

// Set today (viewer's local date)
const today = new Date().toLocaleDateString("en-CA");
datePicker.value = today;

// Load entry
loadEntry(today);

function getDiaryDates() {
  return Object.keys(localStorage)
    .filter(key => /^diary-\d{4}-\d{2}-\d{2}$/.test(key))
    .map(key => key.substring(6))
    .sort();
}

function updateNavigationButtons() {
  const dates = getDiaryDates();
  deleteAllBtn.disabled = dates.length === 0;

  if (dates.length === 0) {
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }

  const index = dates.indexOf(datePicker.value);

  // If current date isn't in the diary list
  if (index === -1) {
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }

  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === dates.length - 1;
}


// Load entry
function loadEntry(date) {
  const data = JSON.parse(localStorage.getItem("diary-" + date)) || {
    text: "",
    mood: "😊"
  };

  diaryText.value = data.text;
  moodSelect.value = data.mood;
  updateWordCount();
  updateNavigationButtons();
}


// Auto-save
let saveTimer;
function autoSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const entry = {
      text: diaryText.value,
      mood: moodSelect.value
    };
    localStorage.setItem(
      "diary-" + datePicker.value,
      JSON.stringify(entry)
    );
    status.textContent = "Auto-saved ✔";
    updateNavigationButtons();
  }, 400);
}

// Word count
function updateWordCount() {
  const words = diaryText.value.trim().split(/\s+/).filter(Boolean);
  wordCount.textContent = `${words.length} words`;
}

// Events
diaryText.addEventListener("input", () => {
  updateWordCount();
  autoSave();
});

diaryText.addEventListener("keydown", (e) => {

    if (e.key === "Tab") {

        e.preventDefault();

        const start = diaryText.selectionStart;
        const end = diaryText.selectionEnd;

        diaryText.value =
            diaryText.value.substring(0, start) +
            "    " +
            diaryText.value.substring(end);

        diaryText.selectionStart = diaryText.selectionEnd = start + 4;

        updateWordCount();
        autoSave();
    }

});

moodSelect.addEventListener("change", autoSave);

datePicker.addEventListener("change", () => {
  loadEntry(datePicker.value);
  updateNavigationButtons();
  status.textContent = "Loaded";
});

const moodNames = {
    "😊": "Happy",
    "😐": "Neutral",
    "😞": "Sad",
    "🤯": "Stressed"
};

downloadDiaryBtn.addEventListener("click", () => {

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    const dates = getDiaryDates();

    doc.setFontSize(16);
    doc.setFont(undefined, "bold");
    doc.text("My Calm Daily Diary", 105, 20, { align: "center" });

    doc.setFontSize(12);
    doc.setFont(undefined, "normal");

    let y = 40;

    let textY = y + 20;

for (const date of dates) {

    if (y > 240) {
    doc.addPage();
    y = 20;
    }

    const entry = JSON.parse(localStorage.getItem("diary-" + date));

    const formattedDate = new Date(date).toLocaleDateString("en-GB", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    doc.setFont(undefined, "bold");
    doc.text("Date :", 20, y);

    doc.setFont(undefined, "normal");
    doc.text(formattedDate, 40, y);

      doc.setFont(undefined, "bold");
      doc.text("Mood :", 20, y + 10);

      doc.setFont(undefined, "normal");
      doc.text(moodNames[entry.mood], 40, y + 10);

      // Separator
      doc.line(20, y + 15, 190, y + 15);

      // Diary text
      const paragraphs = entry.text.split("\n");

      let textY = y + 25;

      paragraphs.forEach(paragraph => {

          const lines = doc.splitTextToSize(paragraph, 170);

          // If the paragraph won't fit on this page,
          // start a new page.
          if (textY + (lines.length * 7) > 277) {
              doc.addPage();
              textY = 20;
          }

          doc.text(lines, 20, textY);

          textY += lines.length * 7;

      });

      // Position for the next diary entry
      y = textY + 25;

    }

    doc.save("My-Diary.pdf");

});
// Download
downloadBtn.addEventListener("click", () => {

    const date = datePicker.value;

    const data = JSON.parse(localStorage.getItem("diary-" + date)) || {
        text: "",
        mood: ""
    };

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    // Title
    doc.setFontSize(16);
    doc.text("My Calm Daily Diary", 105, 20, { align: "center" });

    // Date & Mood
    doc.setFontSize(12);
    const formattedDate = new Date(date).toLocaleDateString("en-GB", {
    day: "numeric",
    month: "long",
    year: "numeric"
});

        // Date
      doc.setFont(undefined, "bold");
      doc.text("Date :", 20, 35);

      doc.setFont(undefined, "normal");
      doc.text(formattedDate, 40, 35);

      // Mood
      doc.setFont(undefined, "bold");
      doc.text("Mood :", 20, 45);

      doc.setFont(undefined, "normal");
      doc.text(moodNames[data.mood], 40, 45);

    // Horizontal separator
    doc.line(20, 50, 190, 50);

    // Diary text
        const paragraphs = data.text.split("\n");

        let textY = 65;

        paragraphs.forEach(paragraph => {

          const lines = doc.splitTextToSize(paragraph, 170);

          if (textY + (lines.length * 7) > 277) {
              doc.addPage();
              textY = 20;
          }

          doc.text(lines, 20, textY);

          textY += lines.length * 7;

          // Add a small gap between paragraphs
          if (paragraph.trim() !== "") {
              textY += 3;
          }

      });

    doc.save(`Diary-${date}.pdf`);

});

const themeToggle = document.getElementById("themeToggle");

// Load saved theme
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
  themeToggle.textContent = "☀️";
}

// Toggle theme
themeToggle.addEventListener("click", () => {
  document.body.classList.toggle("dark");

  const isDark = document.body.classList.contains("dark");
  localStorage.setItem("theme", isDark ? "dark" : "light");
  themeToggle.textContent = isDark ? "☀️" : "🌙";
});

prevBtn.addEventListener("click", () => {
  const dates = getDiaryDates();
  const index = dates.indexOf(datePicker.value);

  if (index > 0) {
    const newDate = dates[index - 1];
    datePicker.value = newDate;
    loadEntry(newDate);
    status.textContent = "Loaded";
  }
});

nextBtn.addEventListener("click", () => {
  if (nextBtn.disabled) return;

  const dates = getDiaryDates();
  const index = dates.indexOf(datePicker.value);

  if (index === -1 || index >= dates.length - 1) return;

  const newDate = dates[index + 1];
  datePicker.value = newDate;
  loadEntry(newDate);
  status.textContent = "Loaded";
});

const synth = window.speechSynthesis;
const voiceSelect = document.getElementById("voiceSelect");
const playBtn = document.getElementById("playBtn");
const stopBtn = document.getElementById("stopBtn");

let voices = [];
const savedVoiceName = localStorage.getItem("diary-voice");

// Load voices
function loadVoices() {
  voices = synth.getVoices();
  voiceSelect.innerHTML = "";

  let selectedIndex = 0;

  voices.forEach((voice, index) => {
    if (voice.lang.startsWith("en")) {
      const option = document.createElement("option");
      option.value = index;
      option.textContent = voice.name;
      voiceSelect.appendChild(option);

      // Restore last used voice
      if (voice.name === savedVoiceName) {
        selectedIndex = voiceSelect.options.length - 1;
      }
    }
  });

  voiceSelect.selectedIndex = selectedIndex;
}

// Required for Chrome
synth.onvoiceschanged = loadVoices;
loadVoices();

// Save voice when changed
voiceSelect.addEventListener("change", () => {
  const selectedVoice = voices[voiceSelect.value];
  if (selectedVoice) {
    localStorage.setItem("diary-voice", selectedVoice.name);
  }
});

// Play diary
playBtn.addEventListener("click", () => {
  if (!diaryText.value.trim()) return;

  synth.cancel();

  const utterance = new SpeechSynthesisUtterance(diaryText.value);
  const selectedVoice = voices[voiceSelect.value];

  if (selectedVoice) {
    utterance.voice = selectedVoice;
  }

  utterance.rate = 1;
  utterance.pitch = 1;
  utterance.volume = 1;

  synth.speak(utterance);
});

// Stop
stopBtn.addEventListener("click", () => {
  synth.cancel();
});

backupBtn.addEventListener("click", () => {

    const backup = {};
    const now = new Date();
    const date = now.toLocaleDateString("en-CA");
    const time = now.toLocaleTimeString("en-GB", {
    hour: "2-digit",
    minute: "2-digit"
    }).replace(":", "-");
    const entryCount = getDiaryDates().length;
    const fileName =
    `My-Calm-Diary-Backup-${date}-${time}-${entryCount}-Entries.json`;

    for (let i = 0; i < localStorage.length; i++) {

        const key = localStorage.key(i);

        if (/^diary-\d{4}-\d{2}-\d{2}$/.test(key)) {

            backup[key] = JSON.parse(localStorage.getItem(key));

        }

    }

    const json = JSON.stringify(backup, null, 2);

      const blob = new Blob([json], {
          type: "application/json"
      });

      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");

      a.href = url;
      a.download = fileName;
      a.click();

      URL.revokeObjectURL(url);

});

restoreBtn.addEventListener("click", () => {

    restoreFile.value = "";

    restoreFile.click();

});

deleteAllBtn.addEventListener("click", () => {

    const confirmed = confirm(
`Delete All Diary Entries?

This will permanently delete ALL diary entries stored in this browser.

This action cannot be undone.

Create a backup first if you may need these entries later.

Delete all diary entries?`
    );

    if (!confirmed) return;

const dates = getDiaryDates();

for (const date of dates) {

    localStorage.removeItem("diary-" + date);

}

loadEntry(datePicker.value);

updateNavigationButtons();

alert("All diary entries have been deleted.");

});

restoreFile.addEventListener("change", () => {

    const file = restoreFile.files[0];

    if (!file) return;

    const confirmed = confirm(
      `Restore Backup?

      Existing diary entries will be preserved.

      If the backup contains an entry for the same date as an existing diary entry, the backup version will replace the current one.

      Do you want to continue?`
          );

          if (!confirmed) return;

    const reader = new FileReader();

    reader.onload = function () {

        const backup = JSON.parse(reader.result);

        for (const key in backup) {

        localStorage.setItem(
        key,
        JSON.stringify(backup[key])
        );
      }

        loadEntry(datePicker.value);

        updateNavigationButtons();

        alert(
        `Diary restored successfully!
        ${Object.keys(backup).length} entries imported.`
      );

    };

    reader.readAsText(file);

});


</script>

</body>
</html>
