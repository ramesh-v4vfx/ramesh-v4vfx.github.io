<meta charset="UTF-8">
<title>My Calm Daily Diary</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root {
  --paper:      #f7f1e3;
  --paper-2:    #efe6cf;
  --paper-3:    #fbf7ec;
  --ink:        #332c22;
  --ink-soft:   #7a6f5c;
  --ink-faint:  #a89b83;
  --accent:     #bd6b47;
  --accent-2:   #7c8c63;
  --line:       #ddceac;
  --line-soft:  #e8dcbe;
  --shadow:     rgba(93, 72, 42, 0.14);
  --entry-mark: #2f6fb0;
}

* , *::before, *::after { box-sizing: border-box; }

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  max-width: 720px;
  margin: auto;
  padding: 1rem;
  background: var(--paper);
  color: var(--ink);
  transition: background 0.35s ease, color 0.35s ease;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, rgba(93,72,42,0.05) 1px, transparent 1px);
  background-size: 22px 22px;
  pointer-events: none;
  z-index: -1;
}

h1 {
  text-align: center;
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 30px;
  letter-spacing: 0.3px;
  color: var(--ink);
  margin: 6px 0 4px;
}

.subtitle {
  text-align: center;
  font-size: 13px;
  color: var(--ink-soft);
  margin: 0 0 4px;
  letter-spacing: 0.3px;
}

.stats-line {
  text-align: center;
  font-size: 11.5px;
  color: var(--ink-faint);
  margin: 0 0 22px;
  letter-spacing: 0.4px;
  font-variant-numeric: tabular-nums;
}

.stats-line b { color: var(--accent); font-weight: 600; }

/* ---------- TOP UTILITY BAR ---------- */

.masthead {
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

#themeToggle {
  background: var(--paper-3);
  border: 1px solid var(--line);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  font-size: 17px;
  padding: 0;
  box-shadow: 0 2px 6px var(--shadow);
}

/* ---------- GROUPED PANELS ---------- */

.panel {
  background: var(--paper-3);
  border: 1px solid var(--line-soft);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 14px;
  box-shadow: 0 4px 14px var(--shadow);
  position: relative;
}

.panel-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 10px;
}

.top-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

select {
  padding: 9px 12px;
  font-size: 15px;
  font-family: 'DM Sans', sans-serif;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
}

/* ---------- CUSTOM DATE PICKER ---------- */

.date-picker-wrap { position: relative; }

.date-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  font-size: 14.5px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
}

.date-btn .cal-icon { font-size: 14px; opacity: 0.7; }

.calendar-popup {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  z-index: 30;
  width: 272px;
  max-width: calc(100vw - 48px);
  background: var(--paper-3);
  border: 1px solid var(--line-soft);
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 12px 28px var(--shadow);
}

.calendar-popup[hidden] { display: none; }

.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.cal-month-label {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 14.5px;
  letter-spacing: 0.2px;
}

.cal-nav-btn {
  width: 26px;
  height: 26px;
  padding: 0;
  font-size: 12px;
  border-radius: 8px;
  line-height: 1;
}

.cal-dow-row, .cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.cal-dow-row {
  margin-bottom: 4px;
}

.cal-dow {
  font-size: 10px;
  text-align: center;
  color: var(--ink-faint);
  letter-spacing: 0.4px;
  padding-bottom: 2px;
}

.cal-grid { gap: 3px; }

.cal-day {
  position: relative;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12.5px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--ink);
  user-select: none;
}

.cal-day:hover { background: var(--paper-2); }

.cal-day.other-month { color: var(--ink-faint); opacity: 0.4; }

.cal-day.today { box-shadow: inset 0 0 0 1px var(--accent); }

.cal-day.selected {
  background: var(--accent);
  color: var(--paper-3);
  font-weight: 600;
}

.cal-day.has-entry {
  color: var(--entry-mark);
  font-weight: 700;
}

.cal-day.has-entry::after {
  content: "";
  position: absolute;
  bottom: 3px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--entry-mark);
}

.cal-day.selected.has-entry {
  color: var(--paper-3);
}

.cal-day.selected.has-entry::after { background: var(--paper-3); }

.cal-footer {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--line-soft);
  text-align: center;
}

.cal-today-link {
  border: none;
  background: none;
  font-size: 11.5px;
  color: var(--accent);
  font-weight: 600;
  letter-spacing: 0.3px;
  cursor: pointer;
  padding: 2px 6px;
}

textarea {
  width: 100%;
  min-height: 42vh;
  padding: 22px 24px 22px 26px;
  font-size: 16.5px;
  font-family: 'Fraunces', serif;
  font-weight: 500;
  line-height: 2;
  color: var(--ink);
  background:
    linear-gradient(90deg, transparent 0px, transparent 3px, var(--accent) 3px, var(--accent) 4px, transparent 4px),
    repeating-linear-gradient(var(--paper-3) 0px, var(--paper-3) 43px, var(--line-soft) 44px);
  background-attachment: local;
  border: 1px solid var(--line-soft);
  border-radius: 16px;
  resize: vertical;
  box-shadow: 0 4px 14px var(--shadow);
}

textarea:focus {
  outline: none;
  border-color: var(--accent);
}

textarea::placeholder {
  color: var(--ink-faint);
  font-style: italic;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  font-size: 13px;
  color: var(--ink-soft);
  padding: 0 4px;
}

#status::before {
  content: "●";
  color: var(--accent-2);
  margin-right: 5px;
  font-size: 9px;
}

button {
  padding: 9px 14px;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  cursor: pointer;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease;
}

button:hover {
  border-color: var(--accent);
  background: var(--paper-2);
}

button:active { transform: scale(0.96); }

.btn-accent {
  background: var(--accent);
  color: var(--paper-3);
  border-color: var(--accent);
}
.btn-accent:hover { background: #a85c3b; border-color: #a85c3b; }

.btn-danger {
  color: #a63b2e;
  border-color: #e3c3ba;
}
.btn-danger:hover { background: #f7e6e1; border-color: #a63b2e; }

/* Voice bar layout */
.voice-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

#voiceSelect {
  flex: 1;
  min-width: 0;
}

.voice-actions {
  display: flex;
  gap: 8px;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

/* ---------- DARK MODE ---------- */

body.dark {
  --paper:      #1c1812;
  --paper-2:    #241f17;
  --paper-3:    #211c15;
  --ink:        #ece3d1;
  --ink-soft:   #a99c83;
  --ink-faint:  #7c705c;
  --accent:     #e0a377;
  --accent-2:   #9db07f;
  --line:       #3a3223;
  --line-soft:  #322b1f;
  --shadow:     rgba(0, 0, 0, 0.35);
  --entry-mark: #6fa8dc;
}

body.dark::before {
  background-image: radial-gradient(circle, rgba(255,255,255,0.035) 1px, transparent 1px);
}

body.dark textarea {
  background:
    linear-gradient(90deg, transparent 0px, transparent 3px, var(--accent) 3px, var(--accent) 4px, transparent 4px),
    repeating-linear-gradient(var(--paper-3) 0px, var(--paper-3) 43px, var(--line-soft) 44px);
}

/* ---------- MOBILE ---------- */

@media (max-width: 600px) {

  body {
    padding-left: 12px;
    padding-right: 12px;
    padding-top: 0.75rem;
    padding-bottom: 0.75rem;
    margin: 0;
  }

  h1 { font-size: 25px; }

  textarea {
    width: 100%;
    margin-left: 0;
    margin-right: 0;
    display: block;
    min-height: 38vh;
  }

  .top-bar { gap: 8px; }

  button {
    padding: 11px 14px;
    font-size: 15px;
  }

  #themeToggle {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 10;
  }

  .masthead { justify-content: flex-start; height: 0; }

  .footer { font-size: 12.5px; }

  .voice-bar { flex-direction: column; }

  #voiceSelect { width: 100%; }

  .voice-actions { width: 100%; }

  .voice-actions button { flex: 1; }

  .calendar-popup { left: 50%; transform: translateX(-50%); }

}

</style>
</head>



<body>

<div class="masthead">
  <button id="themeToggle" title="Toggle dark mode">🌙</button>
</div>

<h1>My Calm Daily Diary</h1>
<p class="subtitle">A quiet page for today's thoughts</p>
<p class="stats-line" id="statsLine"></p>

<div class="panel">
  <p class="panel-title">Today</p>
  <div class="top-bar">

    <div class="date-picker-wrap">
      <button type="button" class="date-btn" id="dateBtn">
        <span class="cal-icon">📅</span>
        <span id="dateBtnLabel">Select date</span>
      </button>

      <div class="calendar-popup" id="calendarPopup" hidden>
        <div class="cal-header">
          <button type="button" class="cal-nav-btn" id="calPrevMonth">◀</button>
          <span class="cal-month-label" id="calMonthLabel"></span>
          <button type="button" class="cal-nav-btn" id="calNextMonth">▶</button>
        </div>
        <div class="cal-dow-row">
          <span class="cal-dow">S</span><span class="cal-dow">M</span><span class="cal-dow">T</span>
          <span class="cal-dow">W</span><span class="cal-dow">T</span><span class="cal-dow">F</span><span class="cal-dow">S</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-footer">
          <button type="button" class="cal-today-link" id="calTodayLink">Jump to today</button>
        </div>
      </div>
    </div>

    <select id="mood">
      <option value="😊">😊 Happy</option>
      <option value="😐">😐 Neutral</option>
      <option value="😞">😞 Sad</option>
      <option value="🤯">🤯 Stressed</option>
    </select>

    <button id="prevBtn" title="Previous entry">⬅ Previous</button>
    <button id="nextBtn" title="Next entry">Next ➡</button>
  </div>
</div>

<div class="panel">
  <p class="panel-title">Export &amp; Backup</p>
  <div class="top-bar">
    <button class="btn-accent" id="downloadBtn">⬇️ Entry PDF</button>
    <button class="btn-accent" id="downloadDiaryBtn">⬇️ Full Diary PDF</button>
    <button id="backupBtn">💾 Backup</button>
    <button id="restoreBtn">📂 Restore</button>
    <button class="btn-danger" id="deleteAllBtn">🗑 Delete All</button>

    <input
      type="file"
      id="restoreFile"
      accept=".json"
      hidden
    >
  </div>
</div>

<div class="panel">
  <p class="panel-title">Read Aloud</p>
  <div class="voice-bar">
    <select id="voiceSelect"></select>

    <div class="voice-actions">
      <button id="playBtn">🔊 Play</button>
      <button id="stopBtn">⏹ Stop</button>
    </div>
  </div>
</div>

<textarea
  id="diaryText"
  placeholder="Write your thoughts here..."
  spellcheck="false"
  autocomplete="off"
  autocorrect="off"
  autocapitalize="sentences">
</textarea>



<div class="footer">
  <span id="wordCount">0 words</span>
  <span id="status">Auto-saved</span>
</div>


<script src="../libraries/pdf/jspdf.umd.min.js"></script>

<script>


const diaryText = document.getElementById("diaryText");
const moodSelect = document.getElementById("mood");
const wordCount = document.getElementById("wordCount");
const status = document.getElementById("status");
const downloadBtn = document.getElementById("downloadBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const downloadDiaryBtn = document.getElementById("downloadDiaryBtn");
const backupBtn = document.getElementById("backupBtn");
const restoreBtn = document.getElementById("restoreBtn");
const restoreFile = document.getElementById("restoreFile");
const deleteAllBtn = document.getElementById("deleteAllBtn");
const statsLine = document.getElementById("statsLine");

// ---------- Date helpers (all local-time-safe, no UTC round-trip) ----------

function pad2(n) { return String(n).padStart(2, "0"); }

function toKey(dateObj) {
  return `${dateObj.getFullYear()}-${pad2(dateObj.getMonth() + 1)}-${pad2(dateObj.getDate())}`;
}

function parseKey(key) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function formatLong(key) {
  return parseKey(key).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
}

function formatShort(key) {
  return parseKey(key).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}

// currentDate is the single source of truth for "which day is open"
let currentDate = toKey(new Date());

// Load entry
loadEntry(currentDate);

function getDiaryDates() {
  return Object.keys(localStorage)
    .filter(key => /^diary-\d{4}-\d{2}-\d{2}$/.test(key))
    .map(key => key.substring(6))
    .sort();
}

function updateStatsLine() {
  const dates = getDiaryDates();
  if (dates.length === 0) {
    statsLine.textContent = "No entries yet — today is a good day to start";
    return;
  }

  // current streak: consecutive days ending at the most recent entry (or today)
  const set = new Set(dates);
  let streak = 0;
  let cursor = set.has(toKey(new Date())) ? new Date() : parseKey(dates[dates.length - 1]);
  while (set.has(toKey(cursor))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }

  statsLine.innerHTML = `<b>${dates.length}</b> ${dates.length === 1 ? "entry" : "entries"} written · <b>${streak}</b> day streak`;
}

// BUG FIX: previously this only enabled Prev/Next when the *currently open*
// date had an exact match in the saved entries. Opening any date without a
// saved entry (e.g. today, before you've written anything) disabled both
// buttons entirely, even if older/newer entries existed. Now it looks for
// the nearest entry before/after the open date instead of requiring an
// exact match.
function findAdjacent(dates, date, direction) {
  if (direction === "prev") {
    const candidates = dates.filter(d => d < date);
    return candidates.length ? candidates[candidates.length - 1] : null;
  }
  const candidates = dates.filter(d => d > date);
  return candidates.length ? candidates[0] : null;
}

function updateNavigationButtons() {
  const dates = getDiaryDates();
  deleteAllBtn.disabled = dates.length === 0;

  const prevDate = findAdjacent(dates, currentDate, "prev");
  const nextDate = findAdjacent(dates, currentDate, "next");

  prevBtn.disabled = !prevDate;
  nextBtn.disabled = !nextDate;

  prevBtn.title = prevDate ? `Go to ${formatShort(prevDate)}` : "No earlier entries";
  nextBtn.title = nextDate ? `Go to ${formatShort(nextDate)}` : "No later entries";
}

// Load entry
function loadEntry(date) {
  currentDate = date;

  const data = JSON.parse(localStorage.getItem("diary-" + date)) || {
    text: "",
    mood: "😊"
  };

  diaryText.value = data.text;
  moodSelect.value = data.mood;
  document.getElementById("dateBtnLabel").textContent = formatLong(date);
  updateWordCount();
  updateNavigationButtons();
  updateStatsLine();
}


// Auto-save
let saveTimer;
function autoSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const entry = {
      text: diaryText.value,
      mood: moodSelect.value
    };
    localStorage.setItem(
      "diary-" + currentDate,
      JSON.stringify(entry)
    );
    status.textContent = "Auto-saved ✔";
    updateNavigationButtons();
    updateStatsLine();
    if (!calendarPopup.hidden) renderCalendar();
  }, 400);
}

// Word count
function updateWordCount() {
  const words = diaryText.value.trim().split(/\s+/).filter(Boolean);
  wordCount.textContent = `${words.length} words`;
}

// Events
diaryText.addEventListener("input", () => {
  updateWordCount();
  autoSave();
});

diaryText.addEventListener("keydown", (e) => {

    if (e.key === "Tab") {

        e.preventDefault();

        const start = diaryText.selectionStart;
        const end = diaryText.selectionEnd;

        diaryText.value =
            diaryText.value.substring(0, start) +
            "    " +
            diaryText.value.substring(end);

        diaryText.selectionStart = diaryText.selectionEnd = start + 4;

        updateWordCount();
        autoSave();
    }

});

moodSelect.addEventListener("change", autoSave);

const moodNames = {
    "😊": "Happy",
    "😐": "Neutral",
    "😞": "Sad",
    "🤯": "Stressed"
};

downloadDiaryBtn.addEventListener("click", () => {

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    const dates = getDiaryDates();

    doc.setFontSize(16);
    doc.setFont(undefined, "bold");
    doc.text("My Calm Daily Diary", 105, 20, { align: "center" });

    doc.setFontSize(12);
    doc.setFont(undefined, "normal");

    let y = 40;

for (const date of dates) {

    if (y > 240) {
    doc.addPage();
    y = 20;
    }

    const entry = JSON.parse(localStorage.getItem("diary-" + date));

    const formattedDate = formatLong(date);

    doc.setFont(undefined, "bold");
    doc.text("Date :", 20, y);

    doc.setFont(undefined, "normal");
    doc.text(formattedDate, 40, y);

      doc.setFont(undefined, "bold");
      doc.text("Mood :", 20, y + 10);

      doc.setFont(undefined, "normal");
      doc.text(moodNames[entry.mood], 40, y + 10);

      // Separator
      doc.line(20, y + 15, 190, y + 15);

      // Diary text
      const paragraphs = entry.text.split("\n");

      let textY = y + 25;

      paragraphs.forEach(paragraph => {

          const lines = doc.splitTextToSize(paragraph, 170);

          // If the paragraph won't fit on this page,
          // start a new page.
          if (textY + (lines.length * 7) > 277) {
              doc.addPage();
              textY = 20;
          }

          doc.text(lines, 20, textY);

          textY += lines.length * 7;

      });

      // Position for the next diary entry
      y = textY + 25;

    }

    doc.save("My-Diary.pdf");

});
// Download
downloadBtn.addEventListener("click", () => {

    const date = currentDate;

    const data = JSON.parse(localStorage.getItem("diary-" + date)) || {
        text: "",
        mood: ""
    };

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    // Title
    doc.setFontSize(16);
    doc.text("My Calm Daily Diary", 105, 20, { align: "center" });

    // Date & Mood
    doc.setFontSize(12);
    const formattedDate = formatLong(date);

        // Date
      doc.setFont(undefined, "bold");
      doc.text("Date :", 20, 35);

      doc.setFont(undefined, "normal");
      doc.text(formattedDate, 40, 35);

      // Mood
      doc.setFont(undefined, "bold");
      doc.text("Mood :", 20, 45);

      doc.setFont(undefined, "normal");
      doc.text(moodNames[data.mood] || "—", 40, 45);

    // Horizontal separator
    doc.line(20, 50, 190, 50);

    // Diary text
        const paragraphs = data.text.split("\n");

        let textY = 65;

        paragraphs.forEach(paragraph => {

          const lines = doc.splitTextToSize(paragraph, 170);

          if (textY + (lines.length * 7) > 277) {
              doc.addPage();
              textY = 20;
          }

          doc.text(lines, 20, textY);

          textY += lines.length * 7;

          // Add a small gap between paragraphs
          if (paragraph.trim() !== "") {
              textY += 3;
          }

      });

    doc.save(`Diary-${date}.pdf`);

});

const themeToggle = document.getElementById("themeToggle");

// Load saved theme
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
  themeToggle.textContent = "☀️";
}

// Toggle theme
themeToggle.addEventListener("click", () => {
  document.body.classList.toggle("dark");

  const isDark = document.body.classList.contains("dark");
  localStorage.setItem("theme", isDark ? "dark" : "light");
  themeToggle.textContent = isDark ? "☀️" : "🌙";
});

prevBtn.addEventListener("click", () => {
  const target = findAdjacent(getDiaryDates(), currentDate, "prev");

const synth = window.speechSynthesis;
const voiceSelect = document.getElementById("voiceSelect");
const playBtn = document.getElementById("playBtn");
const stopBtn = document.getElementById("stopBtn");

let voices = [];
const savedVoiceName = localStorage.getItem("diary-voice");

// Load voices
function loadVoices() {
  voices = synth.getVoices();
  voiceSelect.innerHTML = "";

  let selectedIndex = 0;

  voices.forEach((voice, index) => {
    if (voice.lang.startsWith("en")) {
      const option = document.createElement("option");
      option.value = index;
      option.textContent = voice.name;
      voiceSelect.appendChild(option);

      // Restore last used voice
      if (voice.name === savedVoiceName) {
        selectedIndex = voiceSelect.options.length - 1;
      }
    }
  });

  voiceSelect.selectedIndex = selectedIndex;
}

// Required for Chrome
synth.onvoiceschanged = loadVoices;
loadVoices();

// Save voice when changed
voiceSelect.addEventListener("change", () => {
  const selectedVoice = voices[voiceSelect.value];
  if (selectedVoice) {
    localStorage.setItem("diary-voice", selectedVoice.name);
  }
});

// Play diary
playBtn.addEventListener("click", () => {
  if (!diaryText.value.trim()) return;

  synth.cancel();

  const utterance = new SpeechSynthesisUtterance(diaryText.value);
  const selectedVoice = voices[voiceSelect.value];

  if (selectedVoice) {
    utterance.voice = selectedVoice;
  }

  utterance.rate = 1;
  utterance.pitch = 1;
  utterance.volume = 1;

  synth.speak(utterance);
});

// Stop
stopBtn.addEventListener("click", () => {
  synth.cancel();
});

backupBtn.addEventListener("click", () => {

    const backup = {};
    const now = new Date();
    const date = toKey(now);
    const time = now.toLocaleTimeString("en-GB", {
    hour: "2-digit",
    minute: "2-digit"
    }).replace(":", "-");
    const entryCount = getDiaryDates().length;
    const fileName =
    `My-Calm-Diary-Backup-${date}-${time}-${entryCount}-Entries.json`;

    for (let i = 0; i < localStorage.length; i++) {

        const key = localStorage.key(i);

        if (/^diary-\d{4}-\d{2}-\d{2}$/.test(key)) {

            backup[key] = JSON.parse(localStorage.getItem(key));

        }

    }

    const json = JSON.stringify(backup, null, 2);

      const blob = new Blob([json], {
          type: "application/json"
      });

      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");

      a.href = url;
      a.download = fileName;
      a.click();

      URL.revokeObjectURL(url);

});

restoreFile.addEventListener("change", () => {

    const file = restoreFile.files[0];

    if (!file) return;

    const confirmed = confirm(
      `Restore Backup?

      Existing diary entries will be preserved.

      If the backup contains an entry for the same date as an existing diary entry, the backup version will replace the current one.

      Do you want to continue?`
          );

          if (!confirmed) return;

    const reader = new FileReader();

    reader.onload = function () {

        let backup;
        try {
          backup = JSON.parse(reader.result);
        } catch (err) {
          alert("This file doesn't look like a valid diary backup.");
          return;
        }

        for (const key in backup) {
          if (!/^diary-\d{4}-\d{2}-\d{2}$/.test(key)) continue;
          localStorage.setItem(
          key,
          JSON.stringify(backup[key])
          );
        }

        loadEntry(currentDate);

        updateNavigationButtons();

        alert(
        `Diary restored successfully!
        ${Object.keys(backup).length} entries imported.`
      );

    };

    reader.readAsText(file);

});

// ---------- Custom calendar ----------

const dateBtn = document.getElementById("dateBtn");
const calendarPopup = document.getElementById("calendarPopup");
const calGrid = document.getElementById("calGrid");
const calMonthLabel = document.getElementById("calMonthLabel");
const calPrevMonth = document.getElementById("calPrevMonth");
const calNextMonth = document.getElementById("calNextMonth");
const calTodayLink = document.getElementById("calTodayLink");

let calendarViewDate = parseKey(currentDate); // month currently shown

function openCalendar() {
  calendarViewDate = parseKey(currentDate);
  renderCalendar();
  calendarPopup.hidden = false;
}

function closeCalendar() {
  calendarPopup.hidden = true;
}

dateBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  if (calendarPopup.hidden) openCalendar();
  else closeCalendar();
});

document.addEventListener("click", (e) => {
  if (!calendarPopup.hidden && !calendarPopup.contains(e.target) && e.target !== dateBtn) {
    closeCalendar();
  }
});

calPrevMonth.addEventListener("click", () => {
  calendarViewDate.setMonth(calendarViewDate.getMonth() - 1);
  renderCalendar();
});

calNextMonth.addEventListener("click", () => {
  calendarViewDate.setMonth(calendarViewDate.getMonth() + 1);
  renderCalendar();
});

calTodayLink.addEventListener("click", () => {
  const t = toKey(new Date());
  loadEntry(t);
  closeCalendar();
  status.textContent = "Loaded";
});

function renderCalendar() {
  const year = calendarViewDate.getFullYear();
  const month = calendarViewDate.getMonth();

  calMonthLabel.textContent = calendarViewDate.toLocaleDateString("en-GB", { month: "long", year: "numeric" });

  const entryDates = new Set(getDiaryDates());
  const todayKey = toKey(new Date());

  const firstOfMonth = new Date(year, month, 1);
  const startOffset = firstOfMonth.getDay(); // 0 = Sunday
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();

  const cells = [];

  // leading days from previous month
  for (let i = startOffset - 1; i >= 0; i--) {
    const d = daysInPrevMonth - i;
    cells.push({ y: year, m: month - 1, d, otherMonth: true });
  }
  // days in current month
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ y: year, m: month, d, otherMonth: false });
  }
  // trailing days to complete the final week
  let trailing = 1;
  while (cells.length % 7 !== 0) {
    cells.push({ y: year, m: month + 1, d: trailing++, otherMonth: true });
  }

  calGrid.innerHTML = "";

  cells.forEach(cell => {
    const dObj = new Date(cell.y, cell.m, cell.d);
    const key = toKey(dObj);

    const el = document.createElement("div");
    el.className = "cal-day";
    el.textContent = cell.d;

    if (cell.otherMonth) el.classList.add("other-month");
    if (key === todayKey) el.classList.add("today");
    if (key === currentDate) el.classList.add("selected");
    if (entryDates.has(key)) el.classList.add("has-entry");

    el.addEventListener("click", () => {
      loadEntry(key);
      closeCalendar();
      status.textContent = "Loaded";
    });

    calGrid.appendChild(el);
  });
}
