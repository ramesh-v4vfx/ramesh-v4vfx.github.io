<html lang="en">

<meta charset="UTF-8">
<title>My Calm Daily Diary</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root {
  --paper:      #f7f1e3;
  --paper-2:    #efe6cf;
  --paper-3:    #fbf7ec;
  --ink:        #332c22;
  --ink-soft:   #7a6f5c;
  --ink-faint:  #a89b83;
  --accent:     #bd6b47;
  --accent-2:   #7c8c63;
  --line:       #ddceac;
  --line-soft:  #e8dcbe;
  --shadow:     rgba(93, 72, 42, 0.14);
}

* , *::before, *::after { box-sizing: border-box; }

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  max-width: 720px;
  margin: auto;
  padding: 1rem;
  background: var(--paper);
  color: var(--ink);
  transition: background 0.35s ease, color 0.35s ease;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, rgba(93,72,42,0.05) 1px, transparent 1px);
  background-size: 22px 22px;
  pointer-events: none;
  z-index: -1;
}

h1 {
  text-align: center;
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 30px;
  letter-spacing: 0.3px;
  color: var(--ink);
  margin: 6px 0 4px;
}

.subtitle {
  text-align: center;
  font-size: 13px;
  color: var(--ink-soft);
  margin: 0 0 22px;
  letter-spacing: 0.3px;
}

/* ---------- TOP UTILITY BAR ---------- */

.masthead {
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

#themeToggle {
  background: var(--paper-3);
  border: 1px solid var(--line);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  font-size: 17px;
  padding: 0;
  box-shadow: 0 2px 6px var(--shadow);
}

/* ---------- GROUPED PANELS ---------- */

.panel {
  background: var(--paper-3);
  border: 1px solid var(--line-soft);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 14px;
  box-shadow: 0 4px 14px var(--shadow);
}

.panel-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 10px;
}

.top-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

select, input[type="date"] {
  padding: 9px 12px;
  font-size: 15px;
  font-family: 'DM Sans', sans-serif;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
}

textarea {
  width: 100%;
  min-height: 42vh;
  padding: 22px 24px 22px 26px;
  font-size: 16.5px;
  font-family: 'Fraunces', serif;
  font-weight: 500;
  line-height: 2;
  color: var(--ink);
  background:
    linear-gradient(90deg, transparent 0px, transparent 3px, var(--accent) 3px, var(--accent) 4px, transparent 4px),
    repeating-linear-gradient(var(--paper-3) 0px, var(--paper-3) 43px, var(--line-soft) 44px);
  background-attachment: local;
  border: 1px solid var(--line-soft);
  border-radius: 16px;
  resize: vertical;
  box-shadow: 0 4px 14px var(--shadow);
}

textarea:focus {
  outline: none;
  border-color: var(--accent);
}

textarea::placeholder {
  color: var(--ink-faint);
  font-style: italic;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  font-size: 13px;
  color: var(--ink-soft);
  padding: 0 4px;
}

#status::before {
  content: "●";
  color: var(--accent-2);
  margin-right: 5px;
  font-size: 9px;
}

button {
  padding: 9px 14px;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  cursor: pointer;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease;
}

button:hover {
  border-color: var(--accent);
  background: var(--paper-2);
}

button:active { transform: scale(0.96); }

.btn-accent {
  background: var(--accent);
  color: var(--paper-3);
  border-color: var(--accent);
}
.btn-accent:hover { background: #a85c3b; border-color: #a85c3b; }

.btn-danger {
  color: #a63b2e;
  border-color: #e3c3ba;
}
.btn-danger:hover { background: #f7e6e1; border-color: #a63b2e; }

/* Voice bar layout */
.voice-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

#voiceSelect {
  flex: 1;
  min-width: 0;
}

.voice-actions {
  display: flex;
  gap: 8px;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

/* ---------- DARK MODE ---------- */

body.dark {
  --paper:      #1c1812;
  --paper-2:    #241f17;
  --paper-3:    #211c15;
  --ink:        #ece3d1;
  --ink-soft:   #a99c83;
  --ink-faint:  #7c705c;
  --accent:     #e0a377;
  --accent-2:   #9db07f;
  --line:       #3a3223;
  --line-soft:  #322b1f;
  --shadow:     rgba(0, 0, 0, 0.35);
}

body.dark::before {
  background-image: radial-gradient(circle, rgba(255,255,255,0.035) 1px, transparent 1px);
}

body.dark textarea {
  background:
    linear-gradient(90deg, transparent 0px, transparent 3px, var(--accent) 3px, var(--accent) 4px, transparent 4px),
    repeating-linear-gradient(var(--paper-3) 0px, var(--paper-3) 43px, var(--line-soft) 44px);
}

/* ---------- MOBILE ---------- */

@media (max-width: 600px) {

  body {
    padding-left: 12px;
    padding-right: 12px;
    padding-top: 0.75rem;
    padding-bottom: 0.75rem;
    margin: 0;
  }

  h1 { font-size: 25px; }

  textarea {
    width: 100%;
    margin-left: 0;
    margin-right: 0;
    display: block;
    min-height: 38vh;
  }

  .top-bar { gap: 8px; }

  button {
    padding: 11px 14px;
    font-size: 15px;
  }

  #themeToggle {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 10;
  }

  .masthead { justify-content: flex-start; height: 0; }

  .footer { font-size: 12.5px; }

  .voice-bar { flex-direction: column; }

  #voiceSelect { width: 100%; }

  .voice-actions { width: 100%; }

  .voice-actions button { flex: 1; }

}

</style>
</head>



<body>

<div class="masthead">
  <button id="themeToggle" title="Toggle dark mode">🌙</button>
</div>

<h1>My Calm Daily Diary</h1>
<p class="subtitle">A quiet page for today's thoughts</p>

<div class="panel">
  <p class="panel-title">Today</p>
  <div class="top-bar">
    <input type="date" id="datePicker">

    <select id="mood">
      <option value="😊">😊 Happy</option>
      <option value="😐">😐 Neutral</option>
      <option value="😞">😞 Sad</option>
      <option value="🤯">🤯 Stressed</option>
    </select>

    <button id="prevBtn">⬅ Previous</button>
    <button id="nextBtn">Next ➡</button>
  </div>
</div>

<div class="panel">
  <p class="panel-title">Export &amp; Backup</p>
  <div class="top-bar">
    <button class="btn-accent" id="downloadBtn">⬇️ Entry PDF</button>
    <button class="btn-accent" id="downloadDiaryBtn">⬇️ Full Diary PDF</button>
    <button id="backupBtn">💾 Backup</button>
    <button id="restoreBtn">📂 Restore</button>
    <button class="btn-danger" id="deleteAllBtn">🗑 Delete All</button>

    <input
      type="file"
      id="restoreFile"
      accept=".json"
      hidden
    >
  </div>
</div>

<div class="panel">
  <p class="panel-title">Read Aloud</p>
  <div class="voice-bar">
    <select id="voiceSelect"></select>

    <div class="voice-actions">
      <button id="playBtn">🔊 Play</button>
      <button id="stopBtn">⏹ Stop</button>
    </div>
  </div>
</div>

<textarea
  id="diaryText"
  placeholder="Write your thoughts here..."
  spellcheck="false"
  autocomplete="off"
  autocorrect="off"
  autocapitalize="sentences">
</textarea>



<div class="footer">
  <span id="wordCount">0 words</span>
  <span id="status">Auto-saved</span>
</div>


<script src="../libraries/pdf/jspdf.umd.min.js"></script>

<script>


const datePicker = document.getElementById("datePicker");
const diaryText = document.getElementById("diaryText");
const moodSelect = document.getElementById("mood");
const wordCount = document.getElementById("wordCount");
const status = document.getElementById("status");
const downloadBtn = document.getElementById("downloadBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const downloadDiaryBtn = document.getElementById("downloadDiaryBtn");
const backupBtn = document.getElementById("backupBtn");
const restoreBtn = document.getElementById("restoreBtn");
const restoreFile = document.getElementById("restoreFile");
const deleteAllBtn = document.getElementById("deleteAllBtn");

// Set today (viewer's local date)
const today = new Date().toLocaleDateString("en-CA");
datePicker.value = today;

// Load entry
loadEntry(today);

function getDiaryDates() {
  return Object.keys(localStorage)
    .filter(key => /^diary-\d{4}-\d{2}-\d{2}$/.test(key))
    .map(key => key.substring(6))
    .sort();
}

function updateNavigationButtons() {
  const dates = getDiaryDates();
  deleteAllBtn.disabled = dates.length === 0;

  if (dates.length === 0) {
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }

  const index = dates.indexOf(datePicker.value);

  // If current date isn't in the diary list
  if (index === -1) {
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }

  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === dates.length - 1;
}


// Load entry
function loadEntry(date) {
  const data = JSON.parse(localStorage.getItem("diary-" + date)) || {
    text: "",
    mood: "😊"
  };

  diaryText.value = data.text;
  moodSelect.value = data.mood;
  updateWordCount();
  updateNavigationButtons();
}


// Auto-save
let saveTimer;
function autoSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const entry = {
      text: diaryText.value,
      mood: moodSelect.value
    };
    localStorage.setItem(
      "diary-" + datePicker.value,
      JSON.stringify(entry)
    );
    status.textContent = "Auto-saved ✔";
    updateNavigationButtons();
  }, 400);
}

// Word count
function updateWordCount() {
  const words = diaryText.value.trim().split(/\s+/).filter(Boolean);
  wordCount.textContent = `${words.length} words`;
}

// Events
diaryText.addEventListener("input", () => {
  updateWordCount();
  autoSave();
});

diaryText.addEventListener("keydown", (e) => {

    if (e.key === "Tab") {

        e.preventDefault();

        const start = diaryText.selectionStart;
        const end = diaryText.selectionEnd;

        diaryText.value =
            diaryText.value.substring(0, start) +
            "    " +
            diaryText.value.substring(end);

        diaryText.selectionStart = diaryText.selectionEnd = start + 4;

        updateWordCount();
        autoSave();
    }

});

moodSelect.addEventListener("change", autoSave);

datePicker.addEventListener("change", () => {
  loadEntry(datePicker.value);
  updateNavigationButtons();
  status.textContent = "Loaded";
});

const moodNames = {
    "😊": "Happy",
    "😐": "Neutral",
    "😞": "Sad",
    "🤯": "Stressed"
};

downloadDiaryBtn.addEventListener("click", () => {

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    const dates = getDiaryDates();

    doc.setFontSize(16);
    doc.setFont(undefined, "bold");
    doc.text("My Calm Daily Diary", 105, 20, { align: "center" });

    doc.setFontSize(12);
    doc.setFont(undefined, "normal");

    let y = 40;

    let textY = y + 20;

for (const date of dates) {

    if (y > 240) {
    doc.addPage();
    y = 20;
    }

    const entry = JSON.parse(localStorage.getItem("diary-" + date));

    const formattedDate = new Date(date).toLocaleDateString("en-GB", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    doc.setFont(undefined, "bold");
    doc.text("Date :", 20, y);

    doc.setFont(undefined, "normal");
    doc.text(formattedDate, 40, y);

      doc.setFont(undefined, "bold");
      doc.text("Mood :", 20, y + 10);

      doc.setFont(undefined, "normal");
      doc.text(moodNames[entry.mood], 40, y + 10);

      // Separator
      doc.line(20, y + 15, 190, y + 15);

      // Diary text
      const paragraphs = entry.text.split("\n");

      let textY = y + 25;

      paragraphs.forEach(paragraph => {

          const lines = doc.splitTextToSize(paragraph, 170);

          // If the paragraph won't fit on this page,
          // start a new page.
          if (textY + (lines.length * 7) > 277) {
              doc.addPage();
              textY = 20;
          }

          doc.text(lines, 20, textY);

          textY += lines.length * 7;

      });

      // Position for the next diary entry
      y = textY + 25;

    }

    doc.save("My-Diary.pdf");

});
// Download
downloadBtn.addEventListener("click", () => {

    const date = datePicker.value;

    const data = JSON.parse(localStorage.getItem("diary-" + date)) || {
        text: "",
        mood: ""
    };

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    // Title
    doc.setFontSize(16);
    doc.text("My Calm Daily Diary", 105, 20, { align: "center" });

    // Date & Mood
    doc.setFontSize(12);
    const formattedDate = new Date(date).toLocaleDateString("en-GB", {
    day: "numeric",
    month: "long",
    year: "numeric"
});

        // Date
      doc.setFont(undefined, "bold");
      doc.text("Date :", 20, 35);

      doc.setFont(undefined, "normal");
      doc.text(formattedDate, 40, 35);

      // Mood
      doc.setFont(undefined, "bold");
      doc.text("Mood :", 20, 45);

      doc.setFont(undefined, "normal");
      doc.text(moodNames[data.mood], 40, 45);

    // Horizontal separator
    doc.line(20, 50, 190, 50);

    // Diary text
        const paragraphs = data.text.split("\n");

        let textY = 65;

        paragraphs.forEach(paragraph => {

          const lines = doc.splitTextToSize(paragraph, 170);

          if (textY + (lines.length * 7) > 277) {
              doc.addPage();
              textY = 20;
          }

          doc.text(lines, 20, textY);

          textY += lines.length * 7;

          // Add a small gap between paragraphs
          if (paragraph.trim() !== "") {
              textY += 3;
          }

      });

    doc.save(`Diary-${date}.pdf`);

});

const themeToggle = document.getElementById("themeToggle");

// Load saved theme
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
  themeToggle.textContent = "☀️";
}

// Toggle theme
themeToggle.addEventListener("click", () => {
  document.body.classList.toggle("dark");

  const isDark = document.body.classList.contains("dark");
  localStorage.setItem("theme", isDark ? "dark" : "light");
  themeToggle.textContent = isDark ? "☀️" : "🌙";
});

prevBtn.addEventListener("click", () => {
  const dates = getDiaryDates();
  const index = dates.indexOf(datePicker.value);

  if (index > 0) {
    const newDate = dates[index - 1];
    datePicker.value = newDate;
    loadEntry(newDate);
    status.textContent = "Loaded";
  }
});

nextBtn.addEventListener("click", () => {
  if (nextBtn.disabled) return;

  const dates = getDiaryDates();
  const index = dates.indexOf(datePicker.value);

  if (index === -1 || index >= dates.length - 1) return;

  const newDate = dates[index + 1];
  datePicker.value = newDate;
  loadEntry(newDate);
  status.textContent = "Loaded";
});

const synth = window.speechSynthesis;
const voiceSelect = document.getElementById("voiceSelect");
const playBtn = document.getElementById("playBtn");
const stopBtn = document.getElementById("stopBtn");

let voices = [];
const savedVoiceName = localStorage.getItem("diary-voice");

// Load voices
function loadVoices() {
  voices = synth.getVoices();
  voiceSelect.innerHTML = "";

  let selectedIndex = 0;

  voices.forEach((voice, index) => {
    if (voice.lang.startsWith("en")) {
      const option = document.createElement("option");
      option.value = index;
      option.textContent = voice.name;
      voiceSelect.appendChild(option);

      // Restore last used voice
      if (voice.name === savedVoiceName) {
        selectedIndex = voiceSelect.options.length - 1;
      }
    }
  });

  voiceSelect.selectedIndex = selectedIndex;
}

// Required for Chrome
synth.onvoiceschanged = loadVoices;
loadVoices();

// Save voice when changed
voiceSelect.addEventListener("change", () => {
  const selectedVoice = voices[voiceSelect.value];
  if (selectedVoice) {
    localStorage.setItem("diary-voice", selectedVoice.name);
  }
});

// Play diary
playBtn.addEventListener("click", () => {
  if (!diaryText.value.trim()) return;

  synth.cancel();

  const utterance = new SpeechSynthesisUtterance(diaryText.value);
  const selectedVoice = voices[voiceSelect.value];

  if (selectedVoice) {
    utterance.voice = selectedVoice;
  }

  utterance.rate = 1;
  utterance.pitch = 1;
  utterance.volume = 1;

  synth.speak(utterance);
});

// Stop
stopBtn.addEventListener("click", () => {
  synth.cancel();
});

backupBtn.addEventListener("click", () => {

    const backup = {};
    const now = new Date();
    const date = now.toLocaleDateString("en-CA");
    const time = now.toLocaleTimeString("en-GB", {
    hour: "2-digit",
    minute: "2-digit"
    }).replace(":", "-");
    const entryCount = getDiaryDates().length;
    const fileName =
    `My-Calm-Diary-Backup-${date}-${time}-${entryCount}-Entries.json`;

    for (let i = 0; i < localStorage.length; i++) {

        const key = localStorage.key(i);

        if (/^diary-\d{4}-\d{2}-\d{2}$/.test(key)) {

            backup[key] = JSON.parse(localStorage.getItem(key));

        }

    }

    const json = JSON.stringify(backup, null, 2);

      const blob = new Blob([json], {
          type: "application/json"
      });

      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");

      a.href = url;
      a.download = fileName;
      a.click();

      URL.revokeObjectURL(url);

});

restoreBtn.addEventListener("click", () => {

    restoreFile.value = "";

    restoreFile.click();

});

deleteAllBtn.addEventListener("click", () => {

    const confirmed = confirm(
`Delete All Diary Entries?

This will permanently delete ALL diary entries stored in this browser.

This action cannot be undone.

Create a backup first if you may need these entries later.

Delete all diary entries?`
    );

    if (!confirmed) return;

const dates = getDiaryDates();

for (const date of dates) {

    localStorage.removeItem("diary-" + date);

}

loadEntry(datePicker.value);

updateNavigationButtons();

alert("All diary entries have been deleted.");

});

restoreFile.addEventListener("change", () => {

    const file = restoreFile.files[0];

    if (!file) return;

    const confirmed = confirm(
      `Restore Backup?

      Existing diary entries will be preserved.

      If the backup contains an entry for the same date as an existing diary entry, the backup version will replace the current one.

      Do you want to continue?`
          );

          if (!confirmed) return;

    const reader = new FileReader();

    reader.onload = function () {

        const backup = JSON.parse(reader.result);

        for (const key in backup) {

        localStorage.setItem(
        key,
        JSON.stringify(backup[key])
        );
      }

        loadEntry(datePicker.value);

        updateNavigationButtons();

        alert(
        `Diary restored successfully!
        ${Object.keys(backup).length} entries imported.`
      );

    };

    reader.readAsText(file);

});


</script>

<script src="/libraries/config.js"></script>
<script src="/libraries/view-counter.js"></script>

</body>
</html>
