<!DOCTYPE html>
<html lang="en">
<head>

<!-- Analytics consent: loads the Google tag only after the visitor accepts -->
<script src="/libraries/rv-analytics.js"></script>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A free, private daily journaling app with mood tracking, calendar navigation, PDF export, backup/restore, and read-aloud — all saved locally in your browser.">

<title>My Calm Daily Diary | rameshverse</title>

<link rel="canonical" href="https://rameshverse.com/my-diary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root {
  --paper:      #f7f1e3;
  --paper-2:    #efe6cf;
  --paper-3:    #fbf7ec;
  --ink:        #332c22;
  --ink-soft:   #7a6f5c;
  --ink-faint:  #a89b83;
  --accent:     #bd6b47;
  --accent-2:   #7c8c63;
  --line:       #ddceac;
  --line-soft:  #e8dcbe;
  --shadow:     rgba(93, 72, 42, 0.14);
  --entry-mark: #2f6fb0;
}

* , *::before, *::after { box-sizing: border-box; }

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  max-width: 720px;
  margin: auto;
  padding: 1rem;
  background: var(--paper);
  color: var(--ink);
  transition: background 0.35s ease, color 0.35s ease;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, rgba(93,72,42,0.05) 1px, transparent 1px);
  background-size: 22px 22px;
  pointer-events: none;
  z-index: -1;
}

h1 {
  text-align: center;
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 30px;
  letter-spacing: 0.3px;
  color: var(--ink);
  margin: 6px 0 4px;
}

.subtitle {
  text-align: center;
  font-size: 13px;
  color: var(--ink-soft);
  margin: 0 0 4px;
  letter-spacing: 0.3px;
}

.stats-line {
  text-align: center;
  font-size: 11.5px;
  color: var(--ink-faint);
  margin: 0 0 22px;
  letter-spacing: 0.4px;
  font-variant-numeric: tabular-nums;
}

.stats-line b { color: var(--accent); font-weight: 600; }

/* ---------- TOP UTILITY BAR ---------- */

.masthead {
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

.masthead { gap: 8px; }

#themeToggle, #focusToggle {
  background: var(--paper-3);
  border: 1px solid var(--line);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  font-size: 17px;
  padding: 0;
  box-shadow: 0 2px 6px var(--shadow);
}

/* ---------- GROUPED PANELS ---------- */

.panel {
  background: var(--paper-3);
  border: 1px solid var(--line-soft);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 14px;
  box-shadow: 0 4px 14px var(--shadow);
  position: relative;
}

.panel-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 10px;
}

.top-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

select {
  padding: 9px 12px;
  font-size: 15px;
  font-family: 'DM Sans', sans-serif;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
}

/* ---------- CUSTOM DATE PICKER ---------- */

.date-picker-wrap { position: relative; }

.date-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  font-size: 14.5px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
}

.date-btn .cal-icon { font-size: 14px; opacity: 0.7; }

.calendar-popup {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  z-index: 30;
  width: 272px;
  max-width: calc(100vw - 48px);
  background: var(--paper-3);
  border: 1px solid var(--line-soft);
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 12px 28px var(--shadow);
}

.calendar-popup[hidden] { display: none; }

.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.cal-month-label {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 14.5px;
  letter-spacing: 0.2px;
}

.cal-nav-btn {
  width: 26px;
  height: 26px;
  padding: 0;
  font-size: 12px;
  border-radius: 8px;
  line-height: 1;
}

.cal-dow-row, .cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.cal-dow-row {
  margin-bottom: 4px;
}

.cal-dow {
  font-size: 10px;
  text-align: center;
  color: var(--ink-faint);
  letter-spacing: 0.4px;
  padding-bottom: 2px;
}

.cal-grid { gap: 3px; }

.cal-day {
  position: relative;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12.5px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--ink);
  user-select: none;
}

.cal-day:hover { background: var(--paper-2); }

.cal-day.other-month { color: var(--ink-faint); opacity: 0.4; }

.cal-day.today { box-shadow: inset 0 0 0 1px var(--accent); }

.cal-day.selected {
  background: var(--accent);
  color: var(--paper-3);
  font-weight: 600;
}

.cal-day.has-entry {
  color: var(--entry-mark);
  font-weight: 700;
}

.cal-day.has-entry::after {
  content: "";
  position: absolute;
  bottom: 3px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--entry-mark);
}

.cal-day.selected.has-entry {
  color: var(--paper-3);
}

.cal-day.selected.has-entry::after { background: var(--paper-3); }

.cal-footer {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--line-soft);
  text-align: center;
}

.cal-today-link {
  border: none;
  background: none;
  font-size: 11.5px;
  color: var(--accent);
  font-weight: 600;
  letter-spacing: 0.3px;
  cursor: pointer;
  padding: 2px 6px;
}

textarea {
  width: 100%;
  min-height: 42vh;
  padding: 22px 24px 22px 26px;
  font-size: 16.5px;
  font-family: 'Fraunces', serif;
  font-weight: 500;
  line-height: 2;
  color: var(--ink);
  background:
    linear-gradient(90deg, transparent 0px, transparent 3px, var(--accent) 3px, var(--accent) 4px, transparent 4px),
    repeating-linear-gradient(var(--paper-3) 0px, var(--paper-3) 43px, var(--line-soft) 44px);
  background-attachment: local;
  border: 1px solid var(--line-soft);
  border-radius: 16px;
  resize: vertical;
  box-shadow: 0 4px 14px var(--shadow);
}

textarea:focus {
  outline: none;
  border-color: var(--accent);
}

textarea::placeholder {
  color: var(--ink-faint);
  font-style: italic;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  font-size: 13px;
  color: var(--ink-soft);
  padding: 0 4px;
}

#status::before {
  content: "●";
  color: var(--accent-2);
  margin-right: 5px;
  font-size: 9px;
}

button {
  padding: 9px 14px;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  cursor: pointer;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease;
}

button:hover {
  border-color: var(--accent);
  background: var(--paper-2);
}

button:active { transform: scale(0.96); }

.btn-accent {
  background: var(--accent);
  color: var(--paper-3);
  border-color: var(--accent);
}
.btn-accent:hover { background: #a85c3b; border-color: #a85c3b; }

.btn-danger {
  color: #a63b2e;
  border-color: #e3c3ba;
}
.btn-danger:hover { background: #f7e6e1; border-color: #a63b2e; }

.voice-note { margin: 10px 0 0; font-size: 11.5px; line-height: 1.5; color: var(--ink-faint); }
.voice-note[hidden] { display: none; }

/* Voice bar layout */
.voice-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

#voiceSelect {
  flex: 1;
  min-width: 0;
}

.voice-actions {
  display: flex;
  gap: 8px;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

/* ---------- NEW: mood strip, chips, folds, search, prompts, toast ---------- */

.stats-line .backup-note { transition: color .2s; }
.stats-line.warn .backup-note { color: #a63b2e; font-weight: 600; }
body.dark .stats-line.warn .backup-note { color: #e58b78; }

.mood-strip {
  display: flex; align-items: center; justify-content: center;
  gap: 4px; flex-wrap: wrap; margin: -12px 0 20px;
}
.ms-label { font-size: 10.5px; color: var(--ink-faint); letter-spacing: 0.4px; margin-right: 6px; }
.ms {
  width: 26px; height: 26px; padding: 0; border-radius: 8px;
  font-size: 14px; line-height: 1; background: var(--paper-3);
  border: 1px dashed var(--line); color: var(--ink-faint);
}
.ms.has { border-style: solid; background: var(--paper-2); }
.ms.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

.mood-chips { order: 5; width: 100%; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.mood-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 11px; border-radius: 999px; font-size: 13px;
}
.mood-chip .me { font-size: 15px; line-height: 1; }
.mood-chip.on { background: var(--accent); color: var(--paper-3); border-color: var(--accent); }
.mood-chip.on:hover { background: var(--accent); }

.otd { border-left: 3px solid var(--accent-2); }
.otd .otd-text {
  font-family: 'Fraunces', serif; font-style: italic; font-size: 14.5px;
  line-height: 1.6; color: var(--ink-soft); margin: 0 0 10px; white-space: pre-wrap;
}
.otd[hidden] { display: none; }

details.fold { padding: 0; }
details.fold > summary {
  list-style: none; cursor: pointer; padding: 14px 16px; margin: 0;
  display: flex; justify-content: space-between; align-items: center;
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; font-size: 18px; color: var(--ink-faint); line-height: 1; }
details.fold[open] > summary::after { content: "\2212"; }
details.fold > summary:hover { color: var(--accent); }
.fold-body { padding: 0 16px 16px; }

#searchInput {
  width: 100%; padding: 10px 12px; font-size: 15px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  font-family: 'DM Sans', sans-serif;
}
#searchInput:focus { outline: none; border-color: var(--accent); }
.search-note { font-size: 11.5px; color: var(--ink-faint); margin: 8px 2px 0; }
.sr {
  display: block; width: 100%; text-align: left; margin-top: 6px;
  padding: 9px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5;
}
.sr .sr-head { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-soft); margin-bottom: 2px; font-weight: 600; }
.sr mark { background: rgba(189,107,71,0.28); color: inherit; border-radius: 3px; padding: 0 1px; }

.prompt-line {
  display: flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 0 4px;
  font-family: 'Fraunces', serif; font-style: italic; font-size: 14.5px; color: var(--ink-soft);
}
.prompt-line #promptText { flex: 1; min-width: 0; line-height: 1.45; }
.mini { padding: 5px 10px; font-size: 12.5px; flex-shrink: 0; }

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
  background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px;
  font-size: 13.5px; box-shadow: 0 8px 24px var(--shadow); opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease; z-index: 60; max-width: calc(100vw - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Export and Search sit under the page */
.bottom-panels { margin-top: 18px; }

/* Focus mode: only the page itself */
body.focus .subtitle, body.focus .stats-line, body.focus .mood-strip,
body.focus .panel, body.focus .prompt-line { display: none; }
body.focus textarea { min-height: 70vh; }
body.focus #focusToggle { background: var(--accent); color: var(--paper-3); border-color: var(--accent); }

/* ---------- DARK MODE ---------- */

body.dark {
  --paper:      #1c1812;
  --paper-2:    #241f17;
  --paper-3:    #211c15;
  --ink:        #ece3d1;
  --ink-soft:   #a99c83;
  --ink-faint:  #7c705c;
  --accent:     #e0a377;
  --accent-2:   #9db07f;
  --line:       #3a3223;
  --line-soft:  #322b1f;
  --shadow:     rgba(0, 0, 0, 0.35);
  --entry-mark: #6fa8dc;
}

body.dark::before {
  background-image: radial-gradient(circle, rgba(255,255,255,0.035) 1px, transparent 1px);
}

body.dark textarea {
  background:
    linear-gradient(90deg, transparent 0px, transparent 3px, var(--accent) 3px, var(--accent) 4px, transparent 4px),
    repeating-linear-gradient(var(--paper-3) 0px, var(--paper-3) 43px, var(--line-soft) 44px);
}

/* ---------- MOBILE ---------- */

@media (max-width: 600px) {

  body {
    padding-left: 12px;
    padding-right: 12px;
    padding-top: 60px;   /* room for the fixed focus + theme buttons */
    padding-bottom: 0.75rem;
    margin: 0;
  }

  h1 { font-size: 25px; }

  textarea {
    width: 100%;
    margin-left: 0;
    margin-right: 0;
    display: block;
    min-height: 38vh;
  }

  .top-bar { gap: 8px; }

  button {
    padding: 11px 14px;
    font-size: 15px;
  }

  #themeToggle, #focusToggle {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 10;
  }

  #focusToggle { right: 60px; }

  .ms-label { flex-basis: 100%; text-align: center; margin: 0 0 4px; }
  .mood-chip .mn { display: none; }
  .mood-chip { padding: 8px 11px; }

  .masthead { justify-content: flex-start; height: 0; }

  .footer { font-size: 12.5px; }

  .voice-bar { flex-direction: column; }

  #voiceSelect { width: 100%; }

  .voice-actions { width: 100%; }

  .voice-actions button { flex: 1; }

  .calendar-popup { left: 50%; transform: translateX(-50%); }

}

</style>
</head>



<body>

<div class="masthead">
  <button id="focusToggle" title="Focus mode: hide everything except the page (Esc to leave)">🧘</button>
  <button id="themeToggle" title="Toggle dark mode">🌙</button>
</div>

<h1>My Calm Daily Diary</h1>
<p class="subtitle">A quiet page for today's thoughts</p>
<p class="stats-line" id="statsLine"></p>
<div class="mood-strip" id="moodStrip" aria-label="Your last 14 days"></div>

<div class="panel otd" id="onThisDay" hidden></div>

<div class="panel">
  <p class="panel-title">Today</p>
  <div class="top-bar">

    <div class="date-picker-wrap">
      <button type="button" class="date-btn" id="dateBtn">
        <span class="cal-icon">📅</span>
        <span id="dateBtnLabel">Select date</span>
      </button>

      <div class="calendar-popup" id="calendarPopup" hidden>
        <div class="cal-header">
          <button type="button" class="cal-nav-btn" id="calPrevMonth">◀</button>
          <span class="cal-month-label" id="calMonthLabel"></span>
          <button type="button" class="cal-nav-btn" id="calNextMonth">▶</button>
        </div>
        <div class="cal-dow-row">
          <span class="cal-dow">S</span><span class="cal-dow">M</span><span class="cal-dow">T</span>
          <span class="cal-dow">W</span><span class="cal-dow">T</span><span class="cal-dow">F</span><span class="cal-dow">S</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-footer">
          <button type="button" class="cal-today-link" id="calTodayLink">Jump to today</button>
        </div>
      </div>
    </div>

    <select id="mood" aria-label="Mood"></select>

    <button id="prevBtn" title="Previous entry">⬅ Previous</button>
    <button id="nextBtn" title="Next entry">Next ➡</button>
    <button id="todayBtn" type="button" title="Go to today">Today</button>

  </div>
</div>

<details class="panel fold" id="voicePanel">
  <summary class="panel-title">Read Aloud</summary>
  <div class="fold-body"><div class="voice-bar">
    <select id="voiceSelect"></select>

    <div class="voice-actions">
      <button id="playBtn">🔊 Play</button>
      <button id="stopBtn">⏹ Stop</button>
    </div>
  </div>
  <p class="voice-note" id="voiceNote" hidden>No built-in voice was found on this device, so Read Aloud is not available here.</p></div>
</details>

<div class="prompt-line">
  <span id="promptText"></span>
  <button type="button" class="mini" id="promptBtn" title="Another prompt">🎲</button>
  <button type="button" class="mini" id="promptUse" title="Add this prompt to the page">Use</button>
</div>

<textarea
  id="diaryText"
  placeholder="Write your thoughts here..."
  spellcheck="false"
  autocomplete="off"
  autocorrect="off"
  autocapitalize="sentences">
</textarea>



<div class="footer">
  <span id="wordCount">0 words</span>
  <span id="status">Auto-saved</span>
</div>

<div class="bottom-panels">
<details class="panel fold" id="exportPanel">
  <summary class="panel-title">Export &amp; Backup</summary>
  <div class="fold-body"><div class="top-bar">
    <button class="btn-accent" id="downloadBtn">⬇️ Entry PDF</button>
    <button class="btn-accent" id="downloadDiaryBtn">⬇️ Full Diary PDF</button>
    <button id="backupBtn">💾 Backup</button>
    <button id="restoreBtn">📂 Restore</button>
    <button class="btn-danger" id="deleteAllBtn">🗑 Delete All</button>

    <input
      type="file"
      id="restoreFile"
      accept=".json"
      hidden
    >
  </div></div>
</details>

<details class="panel fold" id="searchPanel">
  <summary class="panel-title">Search entries</summary>
  <div class="fold-body">
    <input id="searchInput" type="search" placeholder="Search words, or a mood like “happy”…" autocomplete="off">
    <p class="search-note" id="searchNote">Type at least 2 letters</p>
    <div id="searchResults"></div>
  </div>
</details>
</div>


<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../libraries/pdf/jspdf.umd.min.js"></script>

<script>


const diaryText = document.getElementById("diaryText");
const moodSelect = document.getElementById("mood");
const wordCount = document.getElementById("wordCount");
const status = document.getElementById("status");
const downloadBtn = document.getElementById("downloadBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const downloadDiaryBtn = document.getElementById("downloadDiaryBtn");
const backupBtn = document.getElementById("backupBtn");
const restoreBtn = document.getElementById("restoreBtn");
const restoreFile = document.getElementById("restoreFile");
const deleteAllBtn = document.getElementById("deleteAllBtn");
const statsLine = document.getElementById("statsLine");

// ---------- Date helpers (all local-time-safe, no UTC round-trip) ----------

function pad2(n) { return String(n).padStart(2, "0"); }

function toKey(dateObj) {
  return `${dateObj.getFullYear()}-${pad2(dateObj.getMonth() + 1)}-${pad2(dateObj.getDate())}`;
}

function parseKey(key) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function formatLong(key) {
  return parseKey(key).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
}

function formatShort(key) {
  return parseKey(key).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}

// currentDate is the single source of truth for "which day is open"
let currentDate = toKey(new Date());

// A save is waiting on the 400 ms timer (declared here, before the first loadEntry call below)
let saveTimer = null;

const MOOD_NAMES = {
  "😊": "Happy",
  "😌": "Calm",
  "🥰": "Grateful",
  "😐": "Neutral",
  "😴": "Tired",
  "😞": "Sad",
  "😰": "Anxious",
  "🤯": "Stressed",
  "😠": "Angry"
};

// Reads one saved day. Returns { text, mood } or null if missing or damaged,
// so one bad entry can never break the whole page.
function readEntry(date) {
  try {
    const e = JSON.parse(localStorage.getItem("diary-" + date));
    if (e && typeof e.text === "string") {
      return { text: e.text, mood: MOOD_NAMES[e.mood] ? e.mood : "😊" };
    }
  } catch (err) { /* damaged entry: treated as empty */ }
  return null;
}

// ---------- Moods, prompts, toast, search (set up before the first entry loads) ----------

const moodStripEl = document.getElementById("moodStrip");
const onThisDayEl = document.getElementById("onThisDay");
const toastEl = document.getElementById("toast");
const promptTextEl = document.getElementById("promptText");

Object.keys(MOOD_NAMES).forEach(m => {
  const opt = document.createElement("option");
  opt.value = m;
  opt.textContent = m + " " + MOOD_NAMES[m];
  moodSelect.appendChild(opt);

});

// Search across all entries
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");
const searchNote = document.getElementById("searchNote");

function runSearch() {
  const q = searchInput.value.trim().toLowerCase();
  searchResults.textContent = "";
  if (q.length < 2) { searchNote.textContent = "Type at least 2 letters"; return; }

  const hits = [];
  getDiaryDates().reverse().forEach(d => {
    const e = readEntry(d);
    if (!e) return;
    const inText = e.text.toLowerCase().indexOf(q);
    const inMood = MOOD_NAMES[e.mood].toLowerCase().includes(q);
    if (inText >= 0 || inMood) hits.push({ d, e, at: inText });
  });

  searchNote.textContent = hits.length
    ? hits.length + (hits.length === 1 ? " entry found" : " entries found") + (hits.length > 40 ? " (showing 40)" : "")
    : "No entries found";

  hits.slice(0, 40).forEach(h => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "sr";
    const head = document.createElement("div");
    head.className = "sr-head";
    const l = document.createElement("span"); l.textContent = formatLong(h.d);
    const r = document.createElement("span"); r.textContent = h.e.mood + " " + MOOD_NAMES[h.e.mood];
    head.append(l, r);
    const body = document.createElement("div");
    if (h.at >= 0) {
      const flat = h.e.text.replace(/\s+/g, " ");
      const idx = flat.toLowerCase().indexOf(q);
      const start = Math.max(0, idx - 40);
      const end = Math.min(flat.length, idx + q.length + 90);
      body.append(
        document.createTextNode((start > 0 ? "…" : "") + flat.slice(start, idx)),
        Object.assign(document.createElement("mark"), { textContent: flat.slice(idx, idx + q.length) }),
        document.createTextNode(flat.slice(idx + q.length, end) + (end < flat.length ? "…" : ""))
      );
    } else {
      body.textContent = snippetOf(h.e.text, 120);
    }
    b.append(head, body);
    b.addEventListener("click", () => { loadEntry(h.d); status.textContent = "Loaded"; window.scrollTo({ top: 0, behavior: "smooth" }); });
    searchResults.appendChild(b);
  });
}

function getDiaryDates() {
  return Object.keys(localStorage)
    .filter(key => /^diary-\d{4}-\d{2}-\d{2}$/.test(key))
    .map(key => key.substring(6))
    .sort();
}

function updateStatsLine() {
  const dates = getDiaryDates();
  renderMoodStrip();
  if (dates.length === 0) {
    statsLine.textContent = "No entries yet — today is a good day to start";
    statsLine.classList.remove("warn");
    return;
  }

  // current streak: consecutive days ending at the most recent entry (or today)
  const set = new Set(dates);
  let streak = 0;
  let cursor = set.has(toKey(new Date())) ? new Date() : parseKey(dates[dates.length - 1]);
  while (set.has(toKey(cursor))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }

  // Entries live only in this browser, so say when they were last backed up
  let backupNote = "";
  let needsBackup = false;
  try {
    const t = parseInt(localStorage.getItem("diary-last-backup"), 10);
    if (Number.isFinite(t)) {
      const days = Math.floor((Date.now() - t) / 864e5);
      backupNote = days < 1 ? " · backed up today" : ` · last backup ${days} day${days === 1 ? "" : "s"} ago`;
      needsBackup = days >= 7;
    } else {
      backupNote = " · stored only on this device, back up to keep a copy";
      needsBackup = true;
    }
  } catch (e) { /* storage unavailable */ }
  statsLine.classList.toggle("warn", needsBackup);

  statsLine.innerHTML = `<b>${dates.length}</b> ${dates.length === 1 ? "entry" : "entries"} written · <b>${streak}</b> day streak<span class="backup-note">${backupNote}</span>`;
}

// BUG FIX: previously this only enabled Prev/Next when the *currently open*
// date had an exact match in the saved entries. Opening any date without a
// saved entry (e.g. today, before you've written anything) disabled both
// buttons entirely, even if older/newer entries existed. Now it looks for
// the nearest entry before/after the open date instead of requiring an
// exact match.
function findAdjacent(dates, date, direction) {
  if (direction === "prev") {
    const candidates = dates.filter(d => d < date);
    return candidates.length ? candidates[candidates.length - 1] : null;
  }
  const candidates = dates.filter(d => d > date);
  return candidates.length ? candidates[0] : null;
}

function updateNavigationButtons() {
  const dates = getDiaryDates();
  deleteAllBtn.disabled = dates.length === 0;

  const prevDate = findAdjacent(dates, currentDate, "prev");
  const nextDate = findAdjacent(dates, currentDate, "next");

  prevBtn.disabled = !prevDate;
  nextBtn.disabled = !nextDate;

  prevBtn.title = prevDate ? `Go to ${formatShort(prevDate)}` : "No earlier entries";

}

// An empty page is not kept as an entry, and the status only says "saved" when it really was.
function saveNow() {
  clearTimeout(saveTimer);
  saveTimer = null;
  try {
    if (diaryText.value.trim() === "") {
      localStorage.removeItem("diary-" + currentDate);
    } else {
      localStorage.setItem(
        "diary-" + currentDate,
        JSON.stringify({ text: diaryText.value, mood: moodSelect.value })
      );
    }
  } catch (err) {
    status.textContent = "Could not save: browser storage is full or blocked. Use Backup now.";
    return false;
  }
  status.textContent = "Auto-saved ✔";
  updateNavigationButtons();
  updateStatsLine();
  renderOnThisDay();
  if (!calendarPopup.hidden) renderCalendar();
  return true;
}

// Load voices
function loadVoices() {
  voices = synth.getVoices();
  voiceSelect.innerHTML = "";

  let selectedIndex = 0;

  // Only voices built into this device are listed, so the diary text is never
  // sent to a browser maker's server to be turned into speech.
  voices.forEach((voice, index) => {
    if (voice.lang.startsWith("en") && voice.localService) {
      const option = document.createElement("option");
      option.value = index;
      option.textContent = voice.name;
      voiceSelect.appendChild(option);

      // Restore last used voice
      if (voice.name === savedVoiceName) selectedIndex = voiceSelect.options.length - 1;
    }
  });

  const none = voiceSelect.options.length === 0;
  voiceSelect.selectedIndex = none ? -1 : selectedIndex;
  playBtn.disabled = none;
  // Only say "no voice" once the browser has actually reported its voices
  document.getElementById("voiceNote").hidden = !(none && voices.length > 0);
}

restoreFile.addEventListener("change", () => {

`Restore Backup?

Existing diary entries will be kept.

If the backup has an entry for the same date as an existing one, the backup version replaces it.

Do you want to continue?`
    );

          if (!confirmed) return;

    const reader = new FileReader();

    reader.onload = function () {

        let backup;
        try {
          backup = JSON.parse(reader.result);
        } catch (err) {
          alert("This file doesn't look like a valid diary backup.");
          return;
        }

        if (!backup || typeof backup !== "object" || Array.isArray(backup)) {
          alert("This file doesn't look like a valid diary backup.");
          return;
        }

        // Only well-formed entries are imported, so a bad file can't break the diary
        let imported = 0, skipped = 0;
        for (const key in backup) {
          if (!/^diary-\d{4}-\d{2}-\d{2}$/.test(key)) continue;
          const e = backup[key];
          if (!e || typeof e.text !== "string") { skipped++; continue; }
          try {
            localStorage.setItem(key, JSON.stringify({ text: e.text, mood: MOOD_NAMES[e.mood] ? e.mood : "😊" }));
            imported++;
          } catch (err) { skipped++; }

        loadEntry(currentDate);

        updateNavigationButtons();

        toast(`Diary restored · ${imported} ${imported === 1 ? "entry" : "entries"} imported` + (skipped ? ` · ${skipped} could not be imported` : ""));

    };

});

function renderCalendar() {
  const year = calendarViewDate.getFullYear();
  const month = calendarViewDate.getMonth();

  calMonthLabel.textContent = calendarViewDate.toLocaleDateString("en-GB", { month: "long", year: "numeric" });

  const entryDates = new Set(getDiaryDates());
  const todayKey = toKey(new Date());

  const firstOfMonth = new Date(year, month, 1);
  const startOffset = firstOfMonth.getDay(); // 0 = Sunday
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();

  const cells = [];

  // leading days from previous month
  for (let i = startOffset - 1; i >= 0; i--) {
    const d = daysInPrevMonth - i;
    cells.push({ y: year, m: month - 1, d, otherMonth: true });
  }
  // days in current month
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ y: year, m: month, d, otherMonth: false });
  }
  // trailing days to complete the final week
  let trailing = 1;
  while (cells.length % 7 !== 0) {
    cells.push({ y: year, m: month + 1, d: trailing++, otherMonth: true });
  }

  calGrid.innerHTML = "";

  cells.forEach(cell => {
    const dObj = new Date(cell.y, cell.m, cell.d);
    const key = toKey(dObj);

    const el = document.createElement("div");
    el.className = "cal-day";
    el.textContent = cell.d;
    el.tabIndex = 0;
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", formatLong(key) + (entryDates.has(key) ? ", has an entry" : ""));
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); }
    });

    if (cell.otherMonth) el.classList.add("other-month");
    if (key === todayKey) el.classList.add("today");
    if (key === currentDate) el.classList.add("selected");
    if (entryDates.has(key)) el.classList.add("has-entry");

    el.addEventListener("click", () => {
      loadEntry(key);
      closeCalendar();
      status.textContent = "Loaded";
    });

    calGrid.appendChild(el);
  });
}

</script>
