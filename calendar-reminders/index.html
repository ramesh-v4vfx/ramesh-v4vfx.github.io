<style>

<body>
<div class="app" id="app">
  <i class="hud-corner tl"></i><i class="hud-corner bl"></i><i class="hud-corner br"></i>
  <span class="badge">Event Horizon</span>
  <div class="brand"><span class="dot"></span> Rameshverse Systems · Chrono Grid</div>
  <h1>Calendar</h1>
  <div class="subtitle">Events · repeats · reminders</div>

  <div class="nav">
    <button type="button" class="btn icon" id="prevBtn" aria-label="Previous month">‹</button>
    <div class="month" id="monthLabel" aria-live="polite"></div>
    <button type="button" class="btn icon" id="nextBtn" aria-label="Next month">›</button>
    <button type="button" class="btn today-btn" id="todayBtn">Today</button>
  </div>

  <div class="weekdays" aria-hidden="true"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
  <div class="grid" id="grid"></div>

  <div class="section-head">
    <span id="dayTitle">Today</span>
    <button type="button" class="btn primary add-btn" id="addBtn">+ Add event</button>
  </div>
  <div id="dayList"></div>

  <div class="section-head"><span>Coming up</span><span class="count" id="upCount"></span></div>
  <div id="upList"></div>

  <div class="notify-row" id="notifyRow">
    <button type="button" class="notify-btn" id="notifyBtn">ENABLE ALERTS</button>
    <span class="notify-hint" id="notifyHint"></span>
  </div>
</div>

<!-- Add / edit event -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <form class="sheet-card" id="form" novalidate>
    <h2 id="sheetTitle">New event</h2>

    <label class="lbl" for="fTitle">Title</label>
    <input class="inp" id="fTitle" type="text" maxlength="80" autocomplete="off" placeholder="e.g. Dentist, Mom's birthday">

    <div class="row2" id="whenRow">
      <div>
        <label class="lbl" for="fDate">Date</label>
        <input class="inp" id="fDate" type="date">
      </div>
      <div id="timeBox">
        <label class="lbl" for="fTime">Time</label>
        <input class="inp" id="fTime" type="time">
      </div>
    </div>

    <div class="chips" style="margin-top:10px"><button type="button" class="chip" id="allDayChip" aria-pressed="false">All day</button></div>

    <span class="lbl">Repeat</span>
    <div class="chips" id="repeatChips"></div>
    <div class="form-hint" id="repeatHint"></div>

    <span class="lbl">Remind me · tick as many as you like</span>
    <div class="chips" id="remindChips"></div>
    <div class="form-hint" id="remindHint"></div>

    <label class="lbl" for="fNote">Note (optional)</label>
    <textarea class="inp" id="fNote" maxlength="300" placeholder="Where, who, what to bring…"></textarea>

    <div class="form-error" id="formError" role="alert"></div>

    <div class="actions">
      <button type="submit" class="btn primary save" id="saveBtn">Save event</button>
      <button type="button" class="btn" id="cancelBtn">Cancel</button>
      <button type="button" class="btn danger" id="deleteBtn" hidden>Delete</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><b></b><span></span></div>

<script>
/* =====================================================================
   HOW THIS CALENDAR WORKS
   localStorage key "rvCalendarEvents" holds every event:

     { id, title, date:"YYYY-MM-DD", time:"HH:MM" | "" (all day),
       repeat:"none|daily|weekly|monthly|yearly", remind:[minutes before], note }

   Repeating events are stored once; each day is checked against the rule.
   The rameshverse homepage reads the same key and lists what is coming up
   in the next 7 days.

   Reminders: every reminder inside the next PUSH_HORIZON_DAYS days is queued
   on the shared Cloudflare Worker (RVNotify), so it arrives even with this
   page closed. The queue is rebuilt whenever events change and each time the
   page is opened, so the window keeps moving forward. If push is not
   available, reminders fire from this page while it is open.
   ===================================================================== */
(function () {
  "use strict";

  /* ---------------- CONFIG ---------------- */
  var EVENTS_KEY = "rvCalendarEvents";
  var NOTIFY_KEY = "rv_calendar_notify";        // "0" once alerts were switched off
  var PUSHED_KEY = "rvCalendarPushed";          // [{t:tag, at:ms}] queued on the worker
  var FIRED_KEY = "rvCalendarFired";            // {tag: ms} reminders already shown by this page
  var ALL_DAY_HOUR = 9;                         // all-day reminders count from 09:00
  var PUSH_HORIZON_DAYS = 7;                    // how far ahead reminders are queued
  var MAX_PUSHES = 40;
  var MIN = 60000;

  var REMIND_OPTIONS = [
    { m: 0,    label: "At start",       short: "at start" },
    { m: 10,   label: "10 min before",  short: "10 min before" },
    { m: 30,   label: "30 min before",  short: "30 min before" },
    { m: 60,   label: "1 hour before",  short: "1 hour before" },

  var REMIND_VALUES = REMIND_OPTIONS.map(function (o) { return o.m; });
  var REPEATS = [["none", "Once"], ["daily", "Daily"], ["weekly", "Weekly"], ["monthly", "Monthly"], ["yearly", "Yearly"]];

  /* ---------------- SMALL HELPERS ---------------- */

  function pad(n) { return String(n).padStart(2, "0"); }

  /* ---------------- DATES (all local time) ---------------- */
  function dkey(y, m, d) { return y + "-" + pad(m + 1) + "-" + pad(d); }
  function parseKey(s) {
    var r = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    if (!r) return null;
    var y = +r[1], m = +r[2] - 1, d = +r[3], t = new Date(y, m, d);

  function parseTime(s) {

  /* Does this event happen on y-m-d?  (month is 0-based) */
  function occursOn(ev, y, m, d) {
    var k = dkey(y, m, d);
    if (k < ev.date) return false;
    var s = parseKey(ev.date);
    switch (ev.repeat) {
      case "daily":   return true;
      case "weekly":  return (dayNum(k) - dayNum(ev.date)) % 7 === 0;
      case "monthly": return d === Math.min(s.d, dim(y, m));                   // the 31st becomes the last day of short months
      case "yearly":  return m === s.m && d === Math.min(s.d, dim(y, m));      // Feb 29 becomes Feb 28 in other years
      default:        return k === ev.date;

  /* ---------------- STORAGE ---------------- */
  function cleanEvent(e) {
    if (!e || typeof e !== "object") return null;
    var title = String(e.title || "").trim().slice(0, 80);
    if (!title || !parseKey(e.date)) return null;
    var remind = Array.isArray(e.remind) ? e.remind.map(Number).filter(function (n) { return REMIND_VALUES.indexOf(n) !== -1; }) : [];
    remind = remind.filter(function (n, i) { return remind.indexOf(n) === i; }).sort(function (a, b) { return a - b; });
    return {
      id: String(e.id || uid()),
      title: title,
      date: e.date,
      time: parseTime(e.time) ? e.time : "",
      repeat: REPEAT_LABEL.hasOwnProperty(e.repeat) ? e.repeat : "none",
      remind: remind,
      note: String(e.note || "").slice(0, 300)

  }

  function loadEvents() {
    var raw = lsJSON(EVENTS_KEY, []);

  var events = loadEvents();
  function saveEvents() { return lsSet(EVENTS_KEY, JSON.stringify(events)); }

  /* ---------------- OCCURRENCES ---------------- */
  // Every occurrence from the start of `from`'s day, for `days` days, in time order
  function occurrencesInRange(from, days) {
    var out = [];
    for (var i = 0; i < days; i++) {
      var dt = new Date(from.getFullYear(), from.getMonth(), from.getDate() + i);
      var y = dt.getFullYear(), m = dt.getMonth(), d = dt.getDate();
      events.forEach(function (ev) {
        if (occursOn(ev, y, m, d)) out.push({ ev: ev, y: y, m: m, d: d, start: startOf(ev, y, m, d) });
      });
    }
    return out.sort(function (a, b) { return a.start - b.start || a.ev.title.localeCompare(b.ev.title); });
  }

  function eventsOnDay(y, m, d) {
    return events.filter(function (ev) { return occursOn(ev, y, m, d); }).sort(function (a, b) {
      if (!a.time && b.time) return -1;
      if (a.time && !b.time) return 1;
      return a.time < b.time ? -1 : a.time > b.time ? 1 : a.title.localeCompare(b.title);
    });
  }

  function dayLabel(y, m, d) {
    var t = todayParts();
    var diff = dayNum(dkey(y, m, d)) - dayNum(dkey(t.y, t.m, t.d));
    if (diff === 0) return "Today";
    if (diff === 1) return "Tomorrow";
    return new Date(y, m, d).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  }

  function remindSummary(ev) {
    if (!ev.remind.length) return "🔕 No reminder";
    return "🔔 " + ev.remind.map(function (m) {
      return REMIND_OPTIONS.filter(function (o) { return o.m === m; })[0].short;
    }).join(" · ");
  }

  /* ---------------- STATE ---------------- */
  var tp = todayParts();
  var view = { y: tp.y, m: tp.m };
  var sel = { y: tp.y, m: tp.m, d: tp.d };
  var form = null;               // the open add/edit form's state
  var lastDay = dkey(tp.y, tp.m, tp.d);

  /* ---------------- RENDER: MONTH GRID ---------------- */
  function renderMonth() {
    $("monthLabel").textContent = new Date(view.y, view.m, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
    var grid = $("grid");
    grid.textContent = "";
    var first = new Date(view.y, view.m, 1).getDay();      // 0 = Sunday
    var t = todayParts();

    for (var i = 0; i < 42; i++) {
      var dt = new Date(view.y, view.m, 1 - first + i);
      var y = dt.getFullYear(), m = dt.getMonth(), d = dt.getDate();
      var list = eventsOnDay(y, m, d);

      var cell = h("button", "cell");
      cell.type = "button";
      if (m !== view.m) cell.classList.add("other");
      if (y === t.y && m === t.m && d === t.d) cell.classList.add("today");
      if (y === sel.y && m === sel.m && d === sel.d) cell.classList.add("sel");
      cell.dataset.date = dkey(y, m, d);

        cell.appendChild(dots);
      }
      grid.appendChild(cell);
    }
  }

  /* ---------------- RENDER: SELECTED DAY ---------------- */
  function evRow(ev, y, m, d, showDay) {
    var row = h("button", "ev");
    row.type = "button";
    var start = startOf(ev, y, m, d);
    if (ev.time && start < Date.now()) row.classList.add("past");

    row.appendChild(h("span", ev.time ? "t" : "t allday", ev.time || "ALL DAY"));
    var body = h("span");
    body.appendChild(h("span", "ti", ev.title));
    body.appendChild(document.createElement("br"));
    var meta = [];
    if (showDay) meta.push(dayLabel(y, m, d));
    if (REPEAT_LABEL[ev.repeat]) meta.push("↻ " + REPEAT_LABEL[ev.repeat]);
    meta.push(remindSummary(ev));
    var line = h("span", "meta", meta.join(" · "));
    body.appendChild(line);
    if (ev.note) { body.appendChild(document.createElement("br")); body.appendChild(h("span", "meta", ev.note)); }
    row.appendChild(body);
    return row;
  }

  function renderDay() {
    var list = eventsOnDay(sel.y, sel.m, sel.d);
    var title = dayLabel(sel.y, sel.m, sel.d);
    var full = new Date(sel.y, sel.m, sel.d).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
    $("dayTitle").textContent = title === "Today" || title === "Tomorrow" ? title + " · " + full : full;

    var box = $("dayList");
    box.textContent = "";
    if (!list.length) {
      box.appendChild(h("div", "empty", "Nothing planned. Tap “+ Add event” to schedule something."));
      return;
    }
    list.forEach(function (ev) {
      var row = evRow(ev, sel.y, sel.m, sel.d, false);
      row.addEventListener("click", function () { openSheet(ev); });
      box.appendChild(row);
    });
  }

  /* ---------------- RENDER: COMING UP ---------------- */
  function renderUp() {
    var now = Date.now(), t = todayParts(), todayStart = new Date(t.y, t.m, t.d).getTime();
    var seen = {};

      if (seen[o.ev.id]) return false;                              // a repeating event is listed once, at its next date
      var ahead = o.ev.time ? o.start > now : o.start >= todayStart;   // all-day events stay until the day ends
      if (ahead) seen[o.ev.id] = 1;
      return ahead;
    }).slice(0, 5);

    var box = $("upList");
    box.textContent = "";
    $("upCount").textContent = items.length ? "next " + items.length : "";
    if (!items.length) {
      box.appendChild(h("div", "empty", "No upcoming events in the next 60 days."));
      return;
    }
    items.forEach(function (o) {
      var row = evRow(o.ev, o.y, o.m, o.d, true);
      row.classList.remove("past");
      row.addEventListener("click", function () {
        sel = { y: o.y, m: o.m, d: o.d };
        view = { y: o.y, m: o.m };
        renderAll();

      });

    });

  /* ---------------- ALERTS: PERMISSION + TOGGLE ---------------- */
  var canNotify = "Notification" in window;

  function alertsWanted() { return lsGet(NOTIFY_KEY) !== "0"; }
  function notifyReady() { return canNotify && Notification.permission === "granted" && alertsWanted(); }

  function nextReminderText() {
    var plan = buildPlan(Date.now());
    if (!plan.length) return "";
    var p = plan[0];
    var at = new Date(Date.now() + p.delayMs);
    var t = todayParts();
    var label = dayLabel(at.getFullYear(), at.getMonth(), at.getDate());
    return "Next reminder: " + p.title + " · " + label + " " + pad(at.getHours()) + ":" + pad(at.getMinutes()) + ".";
  }

  function renderNotify() {
    var btn = $("notifyBtn"), hint = $("notifyHint");
    if (!canNotify) {
      btn.style.display = "none";
      hint.textContent = "This browser can't show notifications here. Add rameshverse to your Home Screen on iPhone, or reminders only appear while this page is open.";
      return;
    }
    var perm = Notification.permission, on = notifyReady();
    btn.style.display = "";
    btn.classList.toggle("on", on);
    btn.disabled = perm === "denied";
    btn.textContent = perm === "denied" ? "ALERTS BLOCKED" : on ? "ALERTS ON" : "ENABLE ALERTS";
    if (perm === "denied") hint.textContent = "Notifications are blocked for this site. Allow them in your browser settings to get reminders.";
    else if (on) hint.textContent = (nextReminderText() || "Reminders are sent to this device, even if the page is closed.");
    else hint.textContent = "Get a reminder before your events, even with this page closed.";

  // Ask once, from a tap, and only if there is something to be reminded about

    if (Notification.permission === "granted") { lsSet(NOTIFY_KEY, "1"); alertsChanged(); return; }

  }

  /* ---------------- PUSH REMINDERS (Cloudflare Worker via RVNotify) ---------------- */
  var pushToken = 0;

  function tagFor(ev, start, lead) { return "cal-" + ev.id + "-" + start + "-" + lead + "-" + hash(ev.title + "|" + ev.note); }

  function bodyFor(ev, start, lead, now) {
    var d = new Date(start);
    var hm = ev.time ? pad(d.getHours()) + ":" + pad(d.getMinutes()) : "all day";
    var b;
    if (now && lead > 0 && ev.time && start > now && start - now < lead * MIN) {   // shown late: say what is true now
      var left = Math.max(1, Math.round((start - now) / MIN));
      b = "In " + left + (left === 1 ? " minute" : " minutes") + " · " + hm;
    }
    else if (lead === 0) b = ev.time ? "Starting now · " + hm : "Today · all day";
    else if (lead === 1440) b = "Tomorrow · " + (ev.time ? "at " + hm : "all day");
    else b = "In " + (lead === 60 ? "1 hour" : lead + " minutes") + " · " + hm;
    return ev.note ? b + " — " + ev.note.slice(0, 80) : b;
  }

  // Every reminder due within the push window, soonest first
  function buildPlan(now) {
    var plan = [];
    occurrencesInRange(new Date(now), PUSH_HORIZON_DAYS + 2).forEach(function (o) {
      o.ev.remind.forEach(function (lead) {
        var at = o.start - lead * MIN;
        var delay = at - now;
        if (delay > 1000 && delay <= PUSH_HORIZON_DAYS * 864e5) {
          plan.push({ delayMs: delay, title: o.ev.title, body: bodyFor(o.ev, o.start, lead), tag: tagFor(o.ev, o.start, lead), at: at });
        }

    });

    return plan.slice(0, MAX_PUSHES);
  }

  function pushedList() {
    var l = lsJSON(PUSHED_KEY, []);
    return Array.isArray(l) ? l : [];
  }

  // Is the queue on the worker already what it should be? (avoids needless cancel + re-send)
  function queueIsCurrent(plan) {
    var now = Date.now();
    var queued = {}, wanted = {}, k;
    pushedList().forEach(function (x) { if (x.at > now) queued[x.t] = 1; });
    plan.forEach(function (p) { wanted[p.tag] = 1; });
    for (k in wanted) if (!queued[k]) return false;
    for (k in queued) if (!wanted[k]) return false;
    return true;
  }

  function clearPushes() {
    pushToken++;
    var had = pushedList().length > 0;
    lsSet(PUSHED_KEY, "[]");
    if (!had || !window.RVNotify) return Promise.resolve();
    return Promise.resolve(RVNotify.cancelNotifications()).catch(function () {});
  }

  function syncPushes() {
    if (!window.RVNotify) { rvLog("RVNotify not loaded"); renderNotify(); return Promise.resolve(); }
    if (!alertsWanted()) { return clearPushes().then(renderNotify); }
    if (canNotify && Notification.permission !== "granted") { renderNotify(); return Promise.resolve(); }

    var plan = buildPlan(Date.now());
    if (!plan.length) { return clearPushes().then(renderNotify); }
    if (queueIsCurrent(plan)) { renderNotify(); return Promise.resolve(); }

    var token = ++pushToken;
    return Promise.resolve(RVNotify.ensurePushSubscription())
      .then(function (sub) {
        if (!sub) { rvLog("push denied/unsupported"); return; }
        if (token !== pushToken) return;
        // Replace what this page queued before (if anything) with the current list
        var hadQueue = pushedList().some(function (x) { return x.at > Date.now(); });
        var cleared = hadQueue ? Promise.resolve(RVNotify.cancelNotifications()).catch(function () {}) : Promise.resolve();
        return cleared.then(function () {
          if (token !== pushToken) return;
          var send = plan.map(function (p) { return { delayMs: p.delayMs, title: p.title, body: p.body, tag: p.tag }; });
          return RVNotify.scheduleNotifications(send).then(function () {
            if (token !== pushToken) return;
            lsSet(PUSHED_KEY, JSON.stringify(plan.map(function (p) { return { t: p.tag, at: p.at }; })));
          });

      .catch(function (err) { rvLog("ERROR: " + (err && err.message ? err.message : String(err))); })
      .then(renderNotify);
  }

  /* ---------------- FALLBACK: reminders while the page is open ---------------- */
  var toastTimer = null;
  function showToast(title, body) {
    var t = $("toast");
    t.querySelector("b").textContent = "🔔 " + title;
    t.querySelector("span").textContent = body;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 9000);
  }

  function showSystemAlert(title, body, tag) {
    if (!notifyReady()) return;
    var opts = { body: body, tag: tag, icon: "/icons/apple-touch-icon.png" };
    try {
      var n = new Notification(title, opts);
      n.onclick = function () { try { window.focus(); } catch (e) {} n.close(); };
    } catch (e) {

        }).catch(function () {});
      }
    }
  }

  function checkDue() {
    if (!notifyReady() && !alertsWanted()) return;  // alerts switched off: no in-page reminders either
    var now = Date.now();
    var queued = {};
    if (window.RVNotify && notifyReady()) pushedList().forEach(function (x) { queued[x.t] = 1; });   // the worker delivers these
    var fired = lsJSON(FIRED_KEY, {});
    var changed = false;
    occurrencesInRange(new Date(), 2).forEach(function (o) {
      o.ev.remind.forEach(function (lead) {
        var at = o.start - lead * MIN;
        var tag = tagFor(o.ev, o.start, lead);
        if (at <= now && at > now - 5 * MIN && !fired[tag] && !queued[tag]) {
          fired[tag] = now;
          changed = true;
          var body = bodyFor(o.ev, o.start, lead, now);
          showToast(o.ev.title, body);
          showSystemAlert(o.ev.title, body, tag);
        }
      });
    });
    Object.keys(fired).forEach(function (k) { if (now - fired[k] > 2 * 864e5) { delete fired[k]; changed = true; } });
    if (changed) lsSet(FIRED_KEY, JSON.stringify(fired));
  }

  /* ---------------- ADD / EDIT SHEET ---------------- */
  function buildChips() {
    var rc = $("repeatChips");
    REPEATS.forEach(function (r) {
      var b = h("button", "chip", r[1]);
      b.type = "button"; b.dataset.v = r[0];
      b.addEventListener("click", function () { form.repeat = r[0]; paintChips(); });
      rc.appendChild(b);
    });
    var mc = $("remindChips");
    REMIND_OPTIONS.forEach(function (o) {
      var b = h("button", "chip", o.label);
      b.type = "button"; b.dataset.v = String(o.m);
      b.addEventListener("click", function () {
        var i = form.remind.indexOf(o.m);
        if (i === -1) form.remind.push(o.m); else form.remind.splice(i, 1);
        paintChips();
      });
      mc.appendChild(b);
    });
  }

  function paintChips() {
    Array.prototype.forEach.call($("repeatChips").children, function (b) { b.classList.toggle("on", b.dataset.v === form.repeat); });
    Array.prototype.forEach.call($("remindChips").children, function (b) { b.classList.toggle("on", form.remind.indexOf(+b.dataset.v) !== -1); });
    $("allDayChip").classList.toggle("on", form.allDay);
    $("allDayChip").setAttribute("aria-pressed", form.allDay ? "true" : "false");
    $("timeBox").hidden = form.allDay;
    $("whenRow").classList.toggle("single", form.allDay);
    paintHints();
  }

  /* Plain-words summary of what the form will do, so nothing has to be guessed */
  function longDate(p) { return new Date(p.y, p.m, p.d).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" }); }
  function ordinal(n) { var v = n % 100; return n + (v >= 11 && v <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th"); }

  function paintHints() {
    if (!form) return;
    var p = parseKey($("fDate").value);
    var time = form.allDay ? "" : $("fTime").value;
    var tm = parseTime(time);
    var rh = $("repeatHint"), mh = $("remindHint");

    if (!p) { rh.textContent = "Pick a date first."; mh.textContent = ""; return; }
    var at = form.allDay ? "all day" : tm ? "at " + time : "";
    var from = longDate(p);
    var wd = new Date(p.y, p.m, p.d).toLocaleDateString(undefined, { weekday: "long" });
    var mon = new Date(p.y, p.m, p.d).toLocaleDateString(undefined, { day: "numeric", month: "long" });
    var text;
    switch (form.repeat) {
      case "daily":   text = "Every day, starting " + from; break;
      case "weekly":  text = "Every " + wd + ", starting " + from; break;
      case "monthly": text = "On the " + ordinal(p.d) + " of every month, starting " + from; break;
      case "yearly":  text = "Every year on " + mon + ", starting " + from; break;
      default:        text = "Happens once, on " + from;
    }
    var note = form.repeat === "monthly" && p.d > 28 ? " Shorter months use their last day."
             : form.repeat === "yearly" && p.m === 1 && p.d === 29 ? " In other years it falls on 28 Feb." : "";
    rh.textContent = text + (at ? ", " + at : "") + "." + note;

    if (!form.remind.length) { mh.textContent = "No reminder. It will only show on the calendar."; return; }
    var start = startOf({ time: time }, p.y, p.m, p.d), now = Date.now();
    if (!form.allDay && !tm) { mh.textContent = ""; return; }
    var lines = form.remind.slice().sort(function (a, b) { return b - a; }).map(function (lead) {
      var when = new Date(start - lead * MIN);
      var label = when.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) + " " + pad(when.getHours()) + ":" + pad(when.getMinutes());
      var opt = REMIND_OPTIONS.filter(function (o) { return o.m === lead; })[0];
      return "🔔 " + label + " (" + opt.short + ")" + (when.getTime() <= now ? (form.repeat === "none" ? " · already passed, won't ring" : " · this first one has passed") : "");
    });
    if (form.repeat !== "none") lines.push("Same reminders before every repeat.");
    if (form.allDay) lines.push("All-day events count from 09:00.");
    mh.textContent = lines.join("\n");
  }

  var delTimer = null;
  function disarmDelete() {
    clearTimeout(delTimer);
    var b = $("deleteBtn");
    b.classList.remove("armed");
    b.textContent = "Delete";
  }

  function openSheet(ev) {
    var day = dkey(sel.y, sel.m, sel.d);
    form = ev
      ? { id: ev.id, repeat: ev.repeat, remind: ev.remind.slice(), allDay: !ev.time }
      : { id: null, repeat: "none", remind: [10], allDay: false };      // new event: one reminder, 10 min before

    $("sheetTitle").textContent = ev ? "Edit event" : "New event";
    $("fTitle").value = ev ? ev.title : "";
    $("fDate").value = ev ? ev.date : day;
    $("fTime").value = ev && ev.time ? ev.time : (function () {
      // new event on today: the next full hour; on another day: 09:00
      var n = new Date();
      var isToday = day === dkey(n.getFullYear(), n.getMonth(), n.getDate());
      return isToday ? pad(Math.min(23, n.getHours() + 1)) + ":00" : "09:00";
    })();
    $("fNote").value = ev ? ev.note : "";
    $("formError").textContent = "";
    $("deleteBtn").hidden = !ev;
    document.querySelector(".actions").classList.toggle("no-delete", !ev);
    disarmDelete();
    paintChips();

    $("sheet").classList.add("open");
    document.body.style.overflow = "hidden";
    if (!ev && window.matchMedia && window.matchMedia("(hover: hover)").matches) setTimeout(function () { $("fTitle").focus(); }, 0);
  }

  function closeSheet() {
    $("sheet").classList.remove("open");
    document.body.style.overflow = "";
    form = null;
    disarmDelete();
  }

  function formError(msg) { $("formError").textContent = msg; }

  function saveForm(e) {
    e.preventDefault();
    if (!form) return;
    var title = $("fTitle").value.trim();
    var date = $("fDate").value;
    var time = form.allDay ? "" : $("fTime").value;
    if (!title) { formError("Give the event a title."); $("fTitle").focus(); return; }
    if (!parseKey(date)) { formError("Choose a date."); return; }
    if (!form.allDay && !parseTime(time)) { formError("Choose a time, or switch on All day."); return; }

    var ev = cleanEvent({
      id: form.id || uid(), title: title, date: date, time: time,
      repeat: form.repeat, remind: form.remind, note: $("fNote").value.trim()
    });
    var i = events.findIndex(function (x) { return x.id === ev.id; });
    if (i === -1) events.push(ev); else events[i] = ev;
    saveEvents();

    var p = parseKey(date);
    sel = { y: p.y, m: p.m, d: p.d };
    view = { y: p.y, m: p.m };
    closeSheet();
    renderAll();
    askPermission(ev.remind.length > 0).then(syncPushes).then(checkDue);   // permission is requested inside this tap
  }

  function deleteForm() {
    if (!form || !form.id) return;
    var b = $("deleteBtn");
    if (!b.classList.contains("armed")) {                   // first tap arms it, second tap deletes
      b.classList.add("armed");
      b.textContent = form.repeat === "none" ? "Tap again to delete" : "Delete all repeats?";
      clearTimeout(delTimer);
      delTimer = setTimeout(disarmDelete, 3500);
      return;
    }
    var id = form.id;
    events = events.filter(function (x) { return x.id !== id; });
    saveEvents();
    closeSheet();
    renderAll();
    syncPushes();
  }

  /* ---------------- WIRING ---------------- */
  function renderAll() {
    renderMonth();
    renderDay();
    renderUp();
    renderNotify();
  }

  function shiftMonth(by) {
    var d = new Date(view.y, view.m + by, 1);
    view = { y: d.getFullYear(), m: d.getMonth() };
    renderMonth();
  }

  $("prevBtn").addEventListener("click", function () { shiftMonth(-1); });
  $("nextBtn").addEventListener("click", function () { shiftMonth(1); });
  $("todayBtn").addEventListener("click", function () {
    var t = todayParts();
    sel = { y: t.y, m: t.m, d: t.d };
    view = { y: t.y, m: t.m };
    renderAll();
  });

  $("grid").addEventListener("click", function (e) {
    var cell = e.target.closest && e.target.closest(".cell");
    if (!cell) return;
    var p = parseKey(cell.dataset.date);
    sel = { y: p.y, m: p.m, d: p.d };
    if (p.m !== view.m || p.y !== view.y) view = { y: p.y, m: p.m };
    renderMonth();
    renderDay();
  });

  $("addBtn").addEventListener("click", function () { openSheet(null); });
  $("form").addEventListener("submit", saveForm);
  $("cancelBtn").addEventListener("click", closeSheet);
  $("deleteBtn").addEventListener("click", deleteForm);
  $("fDate").addEventListener("input", paintHints);
  $("fDate").addEventListener("change", paintHints);
  $("fTime").addEventListener("input", paintHints);
  $("fTime").addEventListener("change", paintHints);
  $("allDayChip").addEventListener("click", function () {
    if (!form) return;
    form.allDay = !form.allDay;
    // the usual default ("10 min before") makes little sense for an all-day event, and the other way round
    if (form.allDay && form.remind.length === 1 && form.remind[0] === 10) form.remind = [0];
    else if (!form.allDay && form.remind.length === 1 && form.remind[0] === 0) form.remind = [10];
    paintChips();
  });
  $("sheet").addEventListener("click", function (e) { if (e.target === $("sheet")) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && form) closeSheet(); });
  $("notifyBtn").addEventListener("click", toggleNotify);

  // Other tabs: events changed elsewhere
  window.addEventListener("storage", function (e) {
    if (e.key === null || e.key === EVENTS_KEY) { events = loadEvents(); renderAll(); }
  });

  // Coming back to the page: new day? new reminders now inside the window?
  function refresh() {
    var t = todayParts(), k = dkey(t.y, t.m, t.d);
    if (k !== lastDay) {                              // midnight passed while the page was open
      if (dkey(sel.y, sel.m, sel.d) === lastDay) { sel = { y: t.y, m: t.m, d: t.d }; view = { y: t.y, m: t.m }; }
      lastDay = k;
    }
    renderAll();
    syncPushes();
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
  window.addEventListener("pageshow", function (e) { if (e.persisted) refresh(); });
  window.addEventListener("focus", function () { checkDue(); });

  // Every 20 s: fallback reminders, and keep "past" styling and the midnight rollover current
  setInterval(function () {
    if (document.hidden) return;
    checkDue();
    var t = todayParts();
    if (dkey(t.y, t.m, t.d) !== lastDay) refresh();
  }, 20000);

  /* ---------------- START ---------------- */
  buildChips();
  renderAll();
  checkDue();
  syncPushes();         // rebuilds the queue only if something changed since last time
})();
</script>

<script src="/libraries/config.js"></script>
<script src="/libraries/view-counter.js"></script>
<script src="/libraries/hud-home-button.js"></script>
<script src="/libraries/rv-notify-client.js"></script>

</body>
