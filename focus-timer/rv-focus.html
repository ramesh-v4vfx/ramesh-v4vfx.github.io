<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Timer & Deep Work Tracker – RV·FOCUS | RameshVerse</title>
<meta name="description" content="Free focus timer and deep work session tracker. Log sessions, track interruptions, and monitor your daily focus streak — no signup required.">

<style>
  :root{
    --bg: #0a0a0c;
    --bg-panel: #111114;
    --line: #232327;
    --red: #ff2b2b;
    --red-dim: #7a1414;
    --green: #23e07a;
    --gray: #3a3a40;
    --text: #e8e8ea;
    --text-dim: #7a7a82;
    --amber: #ffb020;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Mono', 'Courier New', monospace;
    min-height:100vh;
    background-image:
      linear-gradient(rgba(255,43,43,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,43,43,0.02) 1px, transparent 1px);
    background-size: 24px 24px;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.012) 0px,
      rgba(255,255,255,0.012) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
    z-index:999;
  }

  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 80px;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;
    margin-bottom:24px;
    flex-wrap:wrap;
    gap:12px;
  }
  h1{font-size:22px; letter-spacing:2px; margin:0; font-weight:700;}
  h1 span{color:var(--red);}
  .subtitle{color:var(--text-dim); font-size:11px; margin-top:4px; letter-spacing:1px;}
  .back-link{
    font-size:11px; color:var(--text-dim); text-decoration:none;
    border:1px solid var(--line); padding:6px 10px;
    transition:border-color .15s, color .15s;
  }
  .back-link:hover{color:var(--red); border-color:var(--red);}

  /* MAIN MISSION PANEL */
  .mission-panel{
    border:1px solid var(--line);
    background:var(--bg-panel);
    padding:32px 24px;
    text-align:center;
    margin-bottom:20px;
    position:relative;
    overflow:hidden;
  }
  .mission-panel.active{border-color:var(--red);}
  .mission-panel::after{
    content:"";
    position:absolute; top:0; left:0; right:0; height:2px;
    background:var(--red);
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .3s linear;
  }
  .mission-panel.active::after{
    animation:scanbar 2.5s linear infinite;
  }
  @keyframes scanbar{
    0%{transform:scaleX(0); transform-origin:left;}
    50%{transform:scaleX(1); transform-origin:left;}
    50.01%{transform-origin:right;}
    100%{transform:scaleX(0); transform-origin:right;}
  }

  .status-line{
    font-size:10px;
    letter-spacing:2px;
    color:var(--text-dim);
    margin-bottom:14px;
  }
  .status-line .dot{
    display:inline-block;
    width:6px; height:6px;
    background:var(--gray);
    border-radius:50%;
    margin-right:6px;
  }
  .status-line.live .dot{
    background:var(--red);
    animation:blink 1s infinite;
  }
  @keyframes blink{ 50%{opacity:0.3;} }

  .timer-display{
    font-size:56px;
    font-weight:700;
    letter-spacing:3px;
    margin-bottom:6px;
    font-variant-numeric:tabular-nums;
  }
  .timer-target{
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:1px;
    margin-bottom:24px;
  }

  .duration-select{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .dur-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    font-family:inherit;
    font-size:11px;
    padding:8px 14px;
    cursor:pointer;
    letter-spacing:1px;
    transition:all .15s;
  }
  .dur-btn:hover{border-color:var(--text-dim); color:var(--text);}
  .dur-btn.selected{border-color:var(--red); color:var(--red);}
  .dur-btn:disabled{opacity:0.35; cursor:not-allowed;}

  .control-row{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
  }
  button.primary{
    background:var(--red);
    border:1px solid var(--red);
    color:#0a0a0c;
    font-family:inherit;
    font-weight:700;
    font-size:12px;
    letter-spacing:1.5px;
    padding:12px 28px;
    cursor:pointer;
    transition:opacity .15s;
  }
  button.primary:hover{opacity:0.85;}
  button.secondary{
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    font-family:inherit;
    font-size:12px;
    letter-spacing:1px;
    padding:12px 20px;
    cursor:pointer;
    transition:all .15s;
  }
  button.secondary:hover{color:var(--text); border-color:var(--text-dim);}

  .interrupt-note{
    margin-top:16px;
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:0.5px;
  }
  .interrupt-note b{color:var(--amber);}

  /* TELEMETRY */
  .telemetry{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:24px;
  }
  .tele-cell{background:var(--bg-panel); padding:14px 16px;}
  .tele-label{font-size:9px; color:var(--text-dim); letter-spacing:1.5px; margin-bottom:6px;}
  .tele-value{font-size:20px; font-weight:700; color:var(--text);}
  .tele-value.ok{color:var(--green);}
  .tele-value.warn{color:var(--red);}

  /* CHART */
  .panel{border:1px solid var(--line); background:var(--bg-panel); padding:16px; margin-bottom:16px;}
  .panel-title{font-size:11px; letter-spacing:1.5px; color:var(--text-dim); margin-bottom:14px;}
  .chart-wrap{overflow-x:auto;}
  .bars{display:flex; align-items:flex-end; gap:6px; height:120px; min-width:100%;}
  .bar-col{display:flex; flex-direction:column; align-items:center; flex-shrink:0; width:26px;}
  .bar{
    width:100%;
    background:var(--red-dim);
    border-top:2px solid var(--red);
    transition:height .3s ease;
  }
  .bar-label{font-size:8px; color:var(--text-dim); margin-top:6px; letter-spacing:0.5px;}
  .bar-val{font-size:8px; color:var(--text); margin-bottom:4px;}

  /* SESSION LOG */
  .log-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:11px;
  }
  .log-row:last-child{border-bottom:none;}
  .log-left{color:var(--text-dim);}
  .log-left b{color:var(--text); font-weight:700;}
  .log-right{display:flex; gap:14px; align-items:center; color:var(--text-dim);}
  .log-complete{color:var(--green);}
  .log-abandoned{color:var(--red);}

  .empty-state{
    text-align:center;
    padding:30px 20px;
    color:var(--text-dim);
    font-size:11px;
    letter-spacing:0.5px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>RV<span>·</span>FOCUS</h1>
      <div class="subtitle">DEEP WORK SESSION TRACKER</div>
    </div>
    <a class="back-link" href="#" id="backLink">← RAMESHVERSE</a>
  </header>

  <div class="mission-panel" id="missionPanel">
    <div class="status-line" id="statusLine"><span class="dot"></span>SYSTEM STANDBY</div>
    <div class="timer-display" id="timerDisplay">25:00</div>
    <div class="timer-target" id="timerTarget">TARGET: 25 MIN SESSION</div>

    <div class="duration-select" id="durationSelect">
      <button class="dur-btn" data-min="1">1 MIN</button>
      <button class="dur-btn" data-min="5">5 MIN</button>
      <button class="dur-btn" data-min="10">10 MIN</button>
      <button class="dur-btn selected" data-min="25">25 MIN</button>
      <button class="dur-btn" data-min="45">45 MIN</button>
      <button class="dur-btn" data-min="60">60 MIN</button>
      <button class="dur-btn" data-min="90">90 MIN</button>
    </div>

    <div class="control-row" id="controlRow">
      <button class="primary" id="startBtn">BEGIN SESSION</button>
    </div>

    <div class="interrupt-note" id="interruptNote" style="display:none;">
      INTERRUPTIONS THIS SESSION: <b id="interruptCount">0</b>
    </div>
  </div>

  <div class="telemetry" id="telemetry"></div>

  <div class="panel">
    <div class="panel-title">FOCUS OUTPUT — LAST 14 CYCLES</div>
    <div class="chart-wrap"><div class="bars" id="chartBars"></div></div>
  </div>

  <div class="panel">
    <div class="panel-title">SESSION LOG</div>
    <div id="sessionLog"></div>
  </div>

</div>

<script>
(function(){
  const STORAGE_KEY = 'rv_focus_data_v1';
  const DAYS_SHOWN = 14;

  function todayStr(d){
    d = d || new Date();
    return d.toISOString().slice(0,10);
  }

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : { sessions: [] };
    }catch(e){
      return { sessions: [] };
    }
  }
  function saveData(data){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(e){ console.error('RV·FOCUS: storage write failed', e); }
  }

  let data = loadData();

  // ---- timer state ----
  let state = 'idle'; // idle | running | paused
  let selectedMin = 25;
  let totalSeconds = selectedMin * 60;
  let remainingSeconds = totalSeconds;
  let interruptions = 0;
  let tickHandle = null;
  let sessionStartTs = null;

  const els = {
    missionPanel: document.getElementById('missionPanel'),
    statusLine: document.getElementById('statusLine'),
    timerDisplay: document.getElementById('timerDisplay'),
    timerTarget: document.getElementById('timerTarget'),
    durationSelect: document.getElementById('durationSelect'),
    controlRow: document.getElementById('controlRow'),
    interruptNote: document.getElementById('interruptNote'),
    interruptCount: document.getElementById('interruptCount'),
  };

  function fmt(sec){
    const m = Math.floor(sec/60);
    const s = sec%60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function renderDurationButtons(){
    els.durationSelect.querySelectorAll('.dur-btn').forEach(function(btn){
      btn.classList.toggle('selected', parseInt(btn.dataset.min,10) === selectedMin);
      btn.disabled = state !== 'idle';
    });
  }

  function renderTimer(){
    els.timerDisplay.textContent = fmt(remainingSeconds);
    els.timerTarget.textContent = 'TARGET: ' + selectedMin + ' MIN SESSION';

    if(state === 'running'){
      els.statusLine.className = 'status-line live';
      els.statusLine.innerHTML = '<span class="dot"></span>SESSION ACTIVE';
      els.missionPanel.classList.add('active');
    } else if(state === 'paused'){
      els.statusLine.className = 'status-line';
      els.statusLine.innerHTML = '<span class="dot"></span>SESSION PAUSED';
      els.missionPanel.classList.remove('active');
    } else {
      els.statusLine.className = 'status-line';
      els.statusLine.innerHTML = '<span class="dot"></span>SYSTEM STANDBY';
      els.missionPanel.classList.remove('active');
    }

    els.interruptNote.style.display = (state === 'idle') ? 'none' : 'block';
    els.interruptCount.textContent = interruptions;

    renderControls();
    renderDurationButtons();
  }

  function renderControls(){
    if(state === 'idle'){
      els.controlRow.innerHTML = '<button class="primary" id="startBtn">BEGIN SESSION</button>';
      document.getElementById('startBtn').addEventListener('click', startSession);
    } else if(state === 'running'){
      els.controlRow.innerHTML =
        '<button class="secondary" id="pauseBtn">PAUSE</button>' +
        '<button class="secondary" id="interruptBtn">LOG INTERRUPTION</button>' +
        '<button class="secondary" id="abandonBtn">ABANDON</button>' +
        '<button class="primary" id="completeBtn" style="display:none;">COMPLETE</button>';
      document.getElementById('pauseBtn').addEventListener('click', pauseSession);
      document.getElementById('interruptBtn').addEventListener('click', logInterruption);
      document.getElementById('abandonBtn').addEventListener('click', abandonSession);
    } else if(state === 'paused'){
      els.controlRow.innerHTML =
        '<button class="primary" id="resumeBtn">RESUME</button>' +
        '<button class="secondary" id="abandonBtn">ABANDON</button>';
      document.getElementById('resumeBtn').addEventListener('click', resumeSession);
      document.getElementById('abandonBtn').addEventListener('click', abandonSession);
    }
  }

  function startSession(){
    state = 'running';
    totalSeconds = selectedMin * 60;
    remainingSeconds = totalSeconds;
    interruptions = 0;
    sessionStartTs = Date.now();
    tick();
    renderTimer();
  }

  function pauseSession(){
    state = 'paused';
    clearTimeout(tickHandle);
    renderTimer();
  }

  function resumeSession(){
    state = 'running';
    tick();
    renderTimer();
  }

  function logInterruption(){
    interruptions++;
    els.interruptCount.textContent = interruptions;
  }

  function abandonSession(){
    const elapsedMin = Math.round((totalSeconds - remainingSeconds) / 60);
    recordSession({
      date: todayStr(),
      targetMin: selectedMin,
      actualMin: elapsedMin,
      interruptions: interruptions,
      completed: false
    });
    resetTimer();
  }

  function completeSession(){
    recordSession({
      date: todayStr(),
      targetMin: selectedMin,
      actualMin: selectedMin,
      interruptions: interruptions,
      completed: true
    });
    resetTimer();
  }

  function resetTimer(){
    clearTimeout(tickHandle);
    state = 'idle';
    remainingSeconds = selectedMin * 60;
    interruptions = 0;
    renderTimer();
    renderAll();
  }

  function tick(){
    tickHandle = setTimeout(function(){
      if(state !== 'running') return;
      remainingSeconds--;
      if(remainingSeconds <= 0){
        remainingSeconds = 0;
        renderTimer();
        completeSession();
        return;
      }
      renderTimer();
      tick();
    }, 1000);
  }

  function recordSession(session){
    data.sessions.push(session);
    saveData(data);
  }

  els.durationSelect.querySelectorAll('.dur-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      if(state !== 'idle') return;
      selectedMin = parseInt(btn.dataset.min, 10);
      remainingSeconds = selectedMin * 60;
      renderTimer();
    });
  });

  // ---- telemetry / chart / log ----

  function getDateRange(n){
    const dates = [];
    const now = new Date();
    for(let i = n - 1; i >= 0; i--){
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      dates.push(todayStr(d));
    }
    return dates;
  }

  function dayLabel(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    return ['S','M','T','W','T','F','S'][d.getDay()];
  }

  function renderTelemetry(){
    const el = document.getElementById('telemetry');
    const dates = getDateRange(DAYS_SHOWN);
    const dateSet = new Set(dates);
    const recent = data.sessions.filter(function(s){ return dateSet.has(s.date); });

    const totalMin = recent.reduce(function(sum,s){ return sum + s.actualMin; }, 0);
    const completed = recent.filter(function(s){ return s.completed; }).length;
    const totalCount = recent.length;
    const completionRate = totalCount > 0 ? Math.round((completed/totalCount)*100) : null;
    const totalInterrupts = recent.reduce(function(sum,s){ return sum + s.interruptions; }, 0);

    // today streak: consecutive days with at least one completed session
    let streak = 0;
    const revDates = dates.slice().reverse();
    for(const ds of revDates){
      const hasCompleted = data.sessions.some(function(s){ return s.date === ds && s.completed; });
      if(hasCompleted) streak++;
      else break;
    }

    el.innerHTML =
      '<div class="tele-cell"><div class="tele-label">FOCUS TIME (14D)</div>' +
        '<div class="tele-value">' + Math.round(totalMin/60*10)/10 + 'H</div></div>' +
      '<div class="tele-cell"><div class="tele-label">COMPLETION RATE</div>' +
        '<div class="tele-value ' + (completionRate !== null && completionRate < 60 ? 'warn' : 'ok') + '">' +
          (completionRate !== null ? completionRate + '%' : '—') + '</div></div>' +
      '<div class="tele-cell"><div class="tele-label">ACTIVE STREAK</div>' +
        '<div class="tele-value ok">' + streak + ' DAY' + (streak === 1 ? '' : 'S') + '</div></div>' +
      '<div class="tele-cell"><div class="tele-label">INTERRUPTIONS (14D)</div>' +
        '<div class="tele-value ' + (totalInterrupts > 10 ? 'warn' : '') + '">' + totalInterrupts + '</div></div>';
  }

  function renderChart(){
    const el = document.getElementById('chartBars');
    const dates = getDateRange(DAYS_SHOWN);
    let maxMin = 1;
    const perDay = dates.map(function(ds){
      const mins = data.sessions
        .filter(function(s){ return s.date === ds; })
        .reduce(function(sum,s){ return sum + s.actualMin; }, 0);
      if(mins > maxMin) maxMin = mins;
      return mins;
    });

    let html = '';
    dates.forEach(function(ds, i){
      const mins = perDay[i];
      const h = Math.round((mins / maxMin) * 100);
      html += '<div class="bar-col">' +
        '<div class="bar-val">' + (mins > 0 ? mins : '') + '</div>' +
        '<div class="bar" style="height:' + Math.max(h,2) + '%"></div>' +
        '<div class="bar-label">' + dayLabel(ds) + '</div>' +
      '</div>';
    });
    el.innerHTML = html;
  }

  function renderLog(){
    const el = document.getElementById('sessionLog');
    const recent = data.sessions.slice(-10).reverse();

    if(recent.length === 0){
      el.innerHTML = '<div class="empty-state">NO SESSIONS LOGGED YET. BEGIN A SESSION ABOVE.</div>';
      return;
    }

    let html = '';
    recent.forEach(function(s){
      html += '<div class="log-row">' +
        '<div class="log-left"><b>' + s.date + '</b> — ' + s.actualMin + ' / ' + s.targetMin + ' MIN</div>' +
        '<div class="log-right">' +
          '<span>' + s.interruptions + ' INT</span>' +
          '<span class="' + (s.completed ? 'log-complete' : 'log-abandoned') + '">' +
            (s.completed ? 'COMPLETE' : 'ABANDONED') +
          '</span>' +
        '</div>' +
      '</div>';
    });
    el.innerHTML = html;
  }

  function renderAll(){
    renderTelemetry();
    renderChart();
    renderLog();
  }

  document.getElementById('backLink').addEventListener('click', function(e){
    e.preventDefault();
    window.location.href = 'https://rameshverse.com';
  });

  renderTimer();
  renderAll();
})();
</script>

<script src="/libraries/config.js"></script>
<script src="/libraries/view-counter.js"></script>
<script src="/libraries/hud-home-button.js"></script>

</body>
</html>
