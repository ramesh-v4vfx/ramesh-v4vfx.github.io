<style>
:root {
  color-scheme: dark;
  --void: #000000;
  --bg: #030208;
  --panel: rgba(9,6,16,0.86);
  --line: rgba(255,178,110,0.16);
  --line-soft: rgba(255,178,110,0.08);
  --ember: #ff6b35;
  --crimson: #ff3860;
  --gold: #ffb703;
  --photon: #ffe9c7;
  --violet: #7c3aed;
  --violet-2: #9333ea;
  --hazard: #ffcc00;
  --blood: #7a0303;
  --danger-glow: rgba(255,20,40,0.5);
  --t-red: #ff2b2b;
  --t-red-dim: rgba(255,43,43,0.18);
  --gunmetal: #1b1b1d;
  --gunmetal-2: #0c0c0d;
  --text: #f3f0fb;
  --text-dim: #948da8;
  --sans: 'Sora', system-ui, -apple-system, sans-serif;
  --mono: 'Space Mono', 'SFMono-Regular', Menlo, monospace;
  --display: 'Orbitron', var(--sans);
}

* , *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  font-family: var(--sans);
  color: var(--text);
  overflow-x: hidden;
}

body {
  position: relative;
  display: flex;
  justify-content: center;
  padding: 44px 16px;
  min-height: 100vh;
}

/* ---------- Starfield ---------- */
.starfield {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(ellipse 900px 620px at 50% 0%, rgba(124,58,237,0.10), transparent 60%);
}

/* pulsing alarm vignette — this thing is not safe to be near */
.alarm-vignette {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(ellipse 120% 100% at 50% 50%, transparent 55%, rgba(255,20,40,0.16) 100%);
  animation: alarmPulse 2.8s ease-in-out infinite;
}

@keyframes alarmPulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .alarm-vignette { animation: none; opacity: 0.7; }
}

.star {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  opacity: 0.5;
}

.star.twinkle { animation: twinkle 3.4s ease-in-out infinite; }

@keyframes twinkle {
  0%, 100% { opacity: 0.15; }
  50% { opacity: 0.9; }
}

@media (prefers-reduced-motion: reduce) {
  .star.twinkle { animation: none; }
}

.page { position: relative; z-index: 1; width: 100%; max-width: 420px; }

/* ---------- Header ---------- */
.brand-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}

.warning-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #ff2b2b;
  border: 1px solid rgba(255,43,43,0.45);
  background: rgba(255,43,43,0.08);
  padding: 5px 12px;
  border-radius: 999px;
  text-shadow: 0 0 8px rgba(255,43,43,0.6);
  animation: warnFlicker 2.6s infinite;
}

@keyframes warnFlicker {
  0%, 89%, 100% { opacity: 1; }
  90% { opacity: 0.35; }
  92% { opacity: 1; }
  94% { opacity: 0.5; }
  96% { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .warning-badge { animation: none; }
}

.hazard-stripe {
  height: 6px;
  border-radius: 4px;
  margin: 0 0 16px;
  background: repeating-linear-gradient(
    135deg,
    var(--hazard) 0 10px,
    #100c16 10px 20px
  );
  box-shadow: 0 0 10px rgba(255,204,0,0.35);
}

/* ---------- Black hole hero mark ---------- */
.bh-mark {
  position: relative;
  width: 128px;
  height: 128px;
  margin: 0 auto 8px;
  perspective: 560px;
}

.bh-glow {
  position: absolute;
  inset: -30px;
  background: radial-gradient(circle, rgba(255,107,53,0.22), rgba(255,56,96,0.08) 45%, transparent 70%);
  filter: blur(4px);
  z-index: 0;
  animation: glowThreat 2.8s ease-in-out infinite;
}

@keyframes glowThreat {
  0%, 100% { opacity: 0.75; }
  50% { opacity: 1; }
}

.bh-ripple {
  position: absolute;
  top: 50%; left: 50%;
  width: 60px; height: 60px;
  margin: -30px 0 0 -30px;
  border-radius: 50%;
  border: 1px solid rgba(255,56,96,0.5);
  z-index: 0;
  animation: ripple 3.2s ease-out infinite;
}

.bh-ripple.r2 { animation-delay: 1.6s; }

@keyframes ripple {
  0%   { transform: scale(1); opacity: 0.65; }
  100% { transform: scale(2.4); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .bh-ripple { animation: none; opacity: 0; }
}

.bh-disk {
  position: absolute;
  inset: 6px;
  border-radius: 50%;
  background: conic-gradient(from 0deg,
    var(--photon), var(--gold), var(--ember), var(--crimson),
    #4a0f24, #0a0410, #4a0f24,
    var(--crimson), var(--ember), var(--gold), var(--photon));
  transform: rotateX(75deg);
  animation: diskspin 9s linear infinite;
  box-shadow: 0 0 44px 6px rgba(255,140,60,0.35);
  -webkit-mask: radial-gradient(circle, transparent 40%, black 44%, black 100%);
          mask: radial-gradient(circle, transparent 40%, black 44%, black 100%);
  z-index: 1;
}

@keyframes diskspin {
  from { transform: rotateX(75deg) rotateZ(0deg); }
  to   { transform: rotateX(75deg) rotateZ(360deg); }
}

.bh-photon-ring {
  position: absolute;
  top: 50%; left: 50%;
  width: 62px; height: 62px;
  margin: -31px 0 0 -31px;
  border-radius: 50%;
  border: 1px solid rgba(255,233,199,0.65);
  box-shadow: 0 0 10px 2px rgba(255,233,199,0.55);
  z-index: 2;
  animation: photonPulse 3.2s ease-in-out infinite;
}

@keyframes photonPulse {
  0%, 100% { opacity: 0.55; }
  50% { opacity: 1; }
}

.bh-core {
  position: absolute;
  top: 50%; left: 50%;
  width: 56px; height: 56px;
  margin: -28px 0 0 -28px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, #000 55%, #000 100%);
  box-shadow: inset 0 0 22px 6px rgba(0,0,0,0.95), 0 0 0 1px rgba(0,0,0,0.6);
  z-index: 3;
}

@media (prefers-reduced-motion: reduce) {
  .bh-disk, .bh-photon-ring, .bh-glow { animation: none; }
}

h1 {
  font-family: var(--display);
  font-weight: 800;
  font-size: 1.28rem;
  letter-spacing: 0.02em;
  line-height: 1.4;
  text-align: center;
  margin: 6px 0 26px;
  position: relative;
  text-shadow: 0 0 22px rgba(255,56,96,0.35), 0 0 46px rgba(255,140,60,0.18);
  animation: titleGlitch 7s infinite;
}

@keyframes titleGlitch {
  0%, 96%, 100% {
    text-shadow: 0 0 22px rgba(255,56,96,0.35), 0 0 46px rgba(255,140,60,0.18);
    transform: translate(0, 0);
  }
  96.5% {
    text-shadow: -2px 0 rgba(255,20,60,0.8), 2px 0 rgba(80,220,255,0.6), 0 0 22px rgba(255,56,96,0.35);
    transform: translate(-1px, 0);
  }
  97.5% {
    text-shadow: 2px 0 rgba(255,20,60,0.8), -2px 0 rgba(80,220,255,0.6), 0 0 22px rgba(255,56,96,0.35);
    transform: translate(1px, 0);
  }
  98.5% {
    text-shadow: 0 0 22px rgba(255,56,96,0.35), 0 0 46px rgba(255,140,60,0.18);
    transform: translate(0, 0);
  }
}

@media (prefers-reduced-motion: reduce) {
  h1 { animation: none; }
}

/* ---------- Card: Terminator HUD terminal ---------- */
.calculator-container {
  position: relative;
  width: 100%;
  padding: 32px 28px;
  border-radius: 12px;
  text-align: center;
  background: linear-gradient(180deg, var(--gunmetal), var(--gunmetal-2));
  box-shadow:
    inset 0 0 0 1px rgba(255,43,43,0.22),
    0 0 40px rgba(255,43,43,0.08),
    0 30px 70px rgba(0,0,0,0.7);
  overflow: hidden;
}

/* CRT scanline texture across the whole terminal */
.calculator-container::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(255,43,43,0.035) 0px,
    rgba(255,43,43,0.035) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
  z-index: 0;
}

.calculator-container > * { position: relative; z-index: 1; }

.calculator-container::before {
  content: '';
  position: absolute;
  top: 0; left: -40%;
  width: 40%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--t-red), transparent);
  animation: scan 6s linear infinite;
  opacity: 0.9;
  z-index: 2;
}

@keyframes scan {
  0% { left: -40%; }
  100% { left: 100%; }
}

/* targeting-reticle corner marks */
.hud-corner {
  position: absolute;
  width: 16px; height: 16px;
  border-color: var(--t-red);
  opacity: 0.7;
  z-index: 2;
  pointer-events: none;
}
.hud-corner.tl { top: 10px; left: 10px; border-top: 2px solid var(--t-red); border-left: 2px solid var(--t-red); }
.hud-corner.tr { top: 10px; right: 10px; border-top: 2px solid var(--t-red); border-right: 2px solid var(--t-red); }
.hud-corner.bl { bottom: 10px; left: 10px; border-bottom: 2px solid var(--t-red); border-left: 2px solid var(--t-red); }
.hud-corner.br { bottom: 10px; right: 10px; border-bottom: 2px solid var(--t-red); border-right: 2px solid var(--t-red); }

select option { color: #000; background: #fff; }

select, input, button {
  border: none;
  outline: none;
  font-size: 1rem;
  border-radius: 8px;
  font-family: var(--mono);
}

select {
  font-weight: 600;
  background: linear-gradient(180deg, #1e1e20, #0e0e0f);
  color: var(--t-red);
  box-shadow: inset 0 0 0 1px rgba(255,43,43,0.28), 0 6px 14px rgba(0,0,0,0.5);
  text-shadow: 0 0 6px rgba(255,43,43,0.5);
}

.input-group {
  margin-top: 4px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

select, input {
  width: 100%;
  height: 56px;
  padding: 0 18px;
  border-radius: 8px;
  font-size: 1.02rem;
  color: var(--t-red);
  letter-spacing: 0.02em;
}

input {
  font-family: var(--mono);
  background: linear-gradient(180deg, #19181a, #0b0a0b);
  box-shadow: inset 0 0 0 1px rgba(255,43,43,0.22), 0 6px 14px rgba(0,0,0,0.5);
  text-shadow: 0 0 6px rgba(255,43,43,0.5);
}

input::placeholder { color: rgba(255,43,43,0.32); }

input:focus {
  box-shadow:
    inset 0 0 0 1px rgba(255,43,43,0.8),
    0 0 0 6px rgba(255,43,43,0.18),
    0 0 20px rgba(255,43,43,0.35),
    0 10px 22px rgba(0,0,0,0.6);
}

.dec-toggle {
  display: inline-flex;
  gap: 8px;
  padding: 10px 14px;
  margin: 6px auto 0;
  border-radius: 8px;
  background: rgba(255,43,43,0.04);
  box-shadow: inset 0 0 0 1px rgba(255,43,43,0.16);
}

.btn-small {
  padding: 10px 16px;
  border-radius: 6px;
  background: rgba(255,255,255,0.03);
  color: #9a9599;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 0.8rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  box-shadow: inset 0 0 0 1px rgba(255,43,43,0.14);
}

.btn-small:hover { background: rgba(255,43,43,0.08); color: var(--t-red); }

.btn-small.active {
  background: rgba(255,43,43,0.16);
  color: var(--t-red);
  outline: 2px solid var(--t-red);
  text-shadow: 0 0 6px rgba(255,43,43,0.6);
}

/* ---------- Calculate button ---------- */
.calc-wrap {
  position: relative;
  margin-top: 26px;
  padding: 3px;
  border-radius: 10px;
  background: linear-gradient(135deg, #ff5050, var(--t-red), var(--blood));
  background-size: 220% 220%;
  animation: borderflow 6s ease infinite, pulseGlow 2.5s infinite;
}

@keyframes borderflow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes pulseGlow {
  0% { box-shadow: 0 0 0 0 rgba(255,43,43,0.55); }
  70% { box-shadow: 0 0 0 16px rgba(255,43,43,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,43,43,0); }
}

@media (prefers-reduced-motion: reduce) {
  .calc-wrap { animation: none; }
}

.btn-red {
  position: relative;
  width: 100%;
  padding: 16px 20px;
  font-size: 1.05rem;
  font-family: var(--mono);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border-radius: 8px;
  background: linear-gradient(180deg, #161617, #0a0a0b);
  color: var(--t-red);
  text-shadow: 0 0 10px rgba(255,43,43,0.7);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  overflow: hidden;
}

.btn-red .icon { color: var(--t-red); text-shadow: 0 0 10px rgba(255,43,43,0.85); }

.btn-red::after {
  content: '';
  position: absolute;
  top: 0; left: -60%;
  width: 40%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  transform: skewX(-20deg);
  transition: left 0.5s ease;
}

.calc-wrap:hover .btn-red::after { left: 130%; }
.btn-red:active { transform: scale(0.97); }

.result {
  display: none;
  margin-top: 26px;
  padding: 18px 20px;
  border-radius: 10px;
  background: rgba(255,43,43,0.03);
  box-shadow: inset 0 0 0 1px rgba(255,43,43,0.18), 0 10px 24px rgba(0,0,0,0.5);
  animation: resultPop 0.35s ease-out;
  text-align: left;
}

@keyframes resultPop {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.line {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  margin-top: 10px;
}

.line:first-child { margin-top: 0; }

.unit-tag {
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  color: var(--t-red);
  border: 1px solid rgba(255,43,43,0.4);
  background: rgba(255,43,43,0.07);
  padding: 4px 6px;
  border-radius: 4px;
  clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
  text-align: center;
}

.line span.value {
  font-family: var(--mono);
  color: #f5e6e6;
  word-break: break-all;
  overflow-wrap: anywhere;
}

.copy-btn {
  padding: 8px 14px;
  border-radius: 6px;
  background: rgba(255,43,43,0.08);
  color: var(--t-red);
  cursor: pointer;
  font-family: var(--mono);
  font-size: 0.78rem;
  letter-spacing: 0.03em;
  box-shadow: inset 0 0 0 1px rgba(255,43,43,0.22);
  transition: transform 0.15s ease, background 0.15s ease;
}

.copy-btn:hover { background: rgba(255,43,43,0.16); }

.copy-btn.copied {
  background: #1faa59;
  color: #fff;
  box-shadow: none;
  transform: scale(1.08);
}

.small {
  margin-top: 16px;
  font-size: 0.78rem;
  font-family: var(--mono);
  color: rgba(255,43,43,0.55);
  letter-spacing: 0.02em;
}

.btn-reset {
  padding: 15px 26px;
  font-size: 0.85rem;
  font-weight: 700;
  font-family: var(--mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-radius: 8px;
  background: linear-gradient(180deg, #1a1a1b, #0c0c0d);
  color: #b3aeb1;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(255,43,43,0.3);
  transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease, color 0.2s ease;
}

.btn-reset:hover { color: var(--t-red); box-shadow: inset 0 0 0 1px rgba(255,43,43,0.6), 0 0 16px rgba(255,43,43,0.2); }
.btn-reset:active { transform: scale(0.96); }

/* ── SHARE BUTTON ── */
.btn-share {
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  font-size: 0.88rem;
  font-weight: 700;
  font-family: var(--mono);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  border-radius: 8px;
  background: linear-gradient(180deg, #1e1e1f, #0e0e0f);
  color: var(--t-red);
  text-shadow: 0 0 8px rgba(255,43,43,0.6);
  cursor: pointer;
  border: none;
  box-shadow: inset 0 0 0 1px rgba(255,43,43,0.32);
  transition: box-shadow 0.2s ease, transform 0.15s ease;
}

.btn-share:hover { box-shadow: inset 0 0 0 1px rgba(255,43,43,0.6), 0 0 16px rgba(255,43,43,0.2); }
.btn-share:active { transform: scale(0.97); }

/* ── SHARE PANEL ── */
.share-panel {
  display: none;
  background: var(--gunmetal-2);
  border-radius: 10px;
  padding: 14px;
  margin-top: 14px;
  box-shadow: inset 0 0 0 1px rgba(255,43,43,0.18);
}

.share-panel p {
  margin: 0 0 12px;
  font-size: 13px;
  opacity: 0.65;
  text-align: center;
  color: #fff;
}

.share-icons { display: flex; gap: 6px; flex-wrap: wrap; }

.share-icon-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  background: #1a1517;
  border: none;
  border-radius: 8px;
  padding: 10px 4px;
  cursor: pointer;
  font-size: 10px;
  color: #d1d5db;
  flex: 1;
  min-width: 50px;
  transition: background 0.2s;
  height: auto;
  font-weight: 400;
  box-shadow: inset 0 0 0 1px rgba(255,43,43,0.12);
}

.share-icon-btn svg { width: 22px; height: 22px; }
.share-icon-btn:hover { background: #241a1c; box-shadow: inset 0 0 0 1px rgba(255,43,43,0.3); }
.share-icon-btn.copied { background: #14532d; box-shadow: none; }

@media (max-width: 480px) {
  body { padding: 26px 12px; }

  .bh-mark { width: 104px; height: 104px; }
  .bh-photon-ring { width: 52px; height: 52px; margin: -26px 0 0 -26px; }
  .bh-core { width: 46px; height: 46px; margin: -23px 0 0 -23px; }

  h1 { font-size: 1.12rem; margin-bottom: 22px; }

  .calculator-container { padding: 24px 18px; border-radius: 18px; }

  select, input { height: 52px; font-size: 1rem; }

  .dec-toggle { flex-wrap: wrap; gap: 10px; padding: 10px; }

  .btn-small { flex: 1; min-width: 90px; padding: 12px 0; font-size: 0.85rem; }

  .btn-red { font-size: 1rem; padding: 15px 0; }

  .result { padding: 16px 14px; }

  .line { grid-template-columns: auto 1fr; }
  .copy-btn { grid-column: 1 / -1; justify-self: end; padding: 10px 16px; }

  .btn-reset { width: 100%; padding: 14px 0; }

  .small { font-size: 0.72rem; line-height: 1.5; }
}
</style>

<body>

<div class="starfield" id="starfield"></div>
<div class="alarm-vignette"></div>

<div class="page">

  <div class="brand-row">
    <div class="warning-badge">⚠ Extreme Gravity — Do Not Approach</div>
  </div>

  <div class="bh-mark">
    <div class="bh-ripple"></div>
    <div class="bh-ripple r2"></div>

<script>
let decimals = 3;
let lastResult = null;

const G = 6.67430e-11;
const c = 299792458;
const solarMass = 1.988416e30;
const earthMass = 5.9722e24;
const solarRadius = 6.957e8;

const massInput = document.getElementById('massInput');

massInput.addEventListener('input', function () {
  const cursorPos = this.selectionStart;
  let raw = this.value.replace(/,/g, '');
  if (!raw) return;
  const parts = raw.split('.');
  parts[0] = parts[0].replace(/\D/g, '');
  if (parts[1]) parts[1] = parts[1].replace(/\D/g, '');
  parts[0] = Number(parts[0]).toLocaleString('en-US');
  const formatted = parts.join('.');
  const diff = formatted.length - this.value.length;
  this.value = formatted;
  this.setSelectionRange(cursorPos + diff, cursorPos + diff);
});

// Fixed: previously relied on the global `event` object (non-standard,
// unreliable outside inline-handler context). Now the clicked button is
// passed explicitly.
function setDecimals(d, btn) {
  decimals = d;
  document.querySelectorAll('.btn-small').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (lastResult) renderResult(lastResult);
}

function format(n) {
  if (decimals === null) {
    return Number(n).toLocaleString('en-US', { maximumFractionDigits: 30 });
  }
  const rounded = roundSafe(n, decimals);
  return rounded.toLocaleString('en-US', {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals
  });
}

function calculate() {
  const val = parseFloat(document.getElementById('massInput').value.replace(/,/g,''));
  if (!val || val <= 0) return;
  const type = document.getElementById('massType').value;
  const M =
    type === 'solar' ? val * solarMass :
    type === 'earth' ? val * earthMass : val;
  const rs = (2 * G * M) / (c * c);
  lastResult = { m: rs, km: rs / 1000, rsolar: rs / solarRadius };
  renderResult(lastResult);
}

function renderResult(r) {
  const output = document.getElementById('output');
  const resetWrap = document.getElementById('resetWrap');
  output.style.display = 'block';
  resetWrap.style.display = 'block';
  output.innerHTML = `
    <div class="line">
      <span class="unit-tag">M</span>
      <span class="value">${format(r.m)} m</span>
      <button class="copy-btn" onclick="copyValue(this,'${format(r.m)} m')">Copy</button>
    </div>
    <div class="line">
      <span class="unit-tag">KM</span>
      <span class="value">${format(r.km)} km</span>
      <button class="copy-btn" onclick="copyValue(this,'${format(r.km)} km')">Copy</button>
    </div>
    <div class="line">
      <span class="unit-tag">R☉</span>
      <span class="value">${format(r.rsolar)} R☉</span>
      <button class="copy-btn" onclick="copyValue(this,'${format(r.rsolar)} R☉')">Copy</button>
    </div>
  `;
}

function copyValue(btn, text) {
  navigator.clipboard.writeText(text);
  const original = btn.innerText;
  btn.innerText = 'Copied!';
  btn.classList.add('copied');
  setTimeout(() => { btn.innerText = original; btn.classList.remove('copied'); }, 600);
}

function roundSafe(num, decimals) {
  const factor = 10 ** decimals;
  return Math.round((num + Number.EPSILON) * factor) / factor;
}

function resetCalc() {
  massInput.value = '';
  document.getElementById('massType').value = 'solar';

  decimals = 3;
  document.querySelectorAll('.btn-small').forEach(b => b.classList.remove('active'));
  document.querySelector('.btn-small[data-decimals="3"]').classList.add('active');

  const output = document.getElementById('output');
  const resetWrap = document.getElementById('resetWrap');
  output.style.display = 'none';
  output.innerHTML = '';
  resetWrap.style.display = 'none';
  lastResult = null;
  massInput.focus();
}

// ── SHARE LOGIC ──
const APP_URL = 'https://rameshverse.com/black-hole-radius-calculator';
const APP_TITLE = 'Black Hole Radius Calculator – a free tool for space enthusiasts!';

function toggleShare() {
  const panel = document.getElementById('sharePanel');
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
}

document.getElementById('shareWhatsapp').onclick = () =>
  window.open(`https://wa.me/?text=${encodeURIComponent(APP_TITLE + '\n' + APP_URL)}`, '_blank');

document.getElementById('shareFacebook').onclick = () =>
  window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(APP_URL)}`, '_blank');

document.getElementById('shareMessenger').onclick = () => {
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (isMobile) {
    window.open(`fb-messenger://share?link=${encodeURIComponent(APP_URL)}`, '_blank');
  } else {
    window.open(`https://www.facebook.com/dialog/send?link=${encodeURIComponent(APP_URL)}&app_id=291494419107518&redirect_uri=${encodeURIComponent(APP_URL)}`, '_blank');
  }
};

document.getElementById('shareInstagram').onclick = () => {
  const btn = document.getElementById('shareInstagram');
  const label = btn.querySelector('.label');
  navigator.clipboard.writeText(APP_URL).then(() => {
    btn.classList.add('copied');
    label.textContent = 'Link copied!';
    window.open('https://www.instagram.com/', '_blank');
    setTimeout(() => { btn.classList.remove('copied'); label.textContent = 'Instagram'; }, 3000);
  });
};

document.getElementById('shareTwitter').onclick = () =>
  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(APP_TITLE)}&url=${encodeURIComponent(APP_URL)}`, '_blank');

document.getElementById('shareTelegram').onclick = () =>
  window.open(`https://t.me/share/url?url=${encodeURIComponent(APP_URL)}&text=${encodeURIComponent(APP_TITLE)}`, '_blank');

document.getElementById('shareCopy').onclick = () => {
  const btn = document.getElementById('shareCopy');
  const label = btn.querySelector('.label');
  navigator.clipboard.writeText(APP_URL).then(() => {
    btn.classList.add('copied');
    label.textContent = 'Copied!';
    setTimeout(() => { btn.classList.remove('copied'); label.textContent = 'Copy Link'; }, 2000);
  });
};

// ── STARFIELD ──
(function generateStars() {
  const field = document.getElementById('starfield');
  const count = 90;
  const frag = document.createDocumentFragment();

  for (let i = 0; i < count; i++) {
    const star = document.createElement('div');
    star.className = 'star' + (Math.random() < 0.2 ? ' twinkle' : '');
    const size = (Math.random() * 1.6 + 0.6).toFixed(2);
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.top = (Math.random() * 100) + '%';
    star.style.left = (Math.random() * 100) + '%';
    star.style.opacity = (Math.random() * 0.5 + 0.2).toFixed(2);
    if (star.classList.contains('twinkle')) {
      star.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
    }
    frag.appendChild(star);
  }
  field.appendChild(frag);
})();
</script>
