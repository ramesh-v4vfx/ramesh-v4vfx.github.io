<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DZMEQ7NQCD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-DZMEQ7NQCD');

  <meta charset="UTF-8">
  <title>Percentage Difference Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;     /* fallback */
      min-height: 100svh;    /* modern mobile-safe */
      margin: 0;
      padding: 16px;
    }

    .calculator {
      background: #020617;
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h2 {
      text-align: center;
      margin-bottom: 16px;
      font-size: 22px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    label {
      font-size: 14px;
      color: #cbd5f5;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      height: 54px;
      font-size: 18px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: #6366f1;
      color: white;
      margin-top: 6px;
    }

    button:active {
      transform: scale(0.98);
    }

    .result {
      margin-top: 18px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      word-break: break-word;
    }

    .error {
      color: #f87171;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="calculator">
    <h2>📊 Percentage Difference Calculator</h2>

    <div class="field">
      <label for="valueA">Value A</label>
      <input
        type="number"
        id="valueA"
        inputmode="decimal"
        placeholder="Enter first value"
      >
    </div>

    <div class="field">
      <label for="valueB">Value B</label>
      <input
        type="number"
        id="valueB"
        inputmode="decimal"
        placeholder="Enter second value"
      >
    </div>

    <button onclick="calculateDifference()">Calculate</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function round(num, decimals = 10) {
      return Number(Math.round(num + "e" + decimals) + "e-" + decimals);
    }

    function calculateDifference() {
      const a = Number(document.getElementById("valueA").value);
      const b = Number(document.getElementById("valueB").value);
      const resultDiv = document.getElementById("result");

      if (Number.isNaN(a) || Number.isNaN(b)) {
        resultDiv.innerHTML =
          "<span class='error'>Please enter both values</span>";
        return;
      }

      if (a === 0 && b === 0) {
        resultDiv.textContent = "0% difference";
        return;
      }

      const difference = Math.abs(round(a - b));
      const average = round((a + b) / 2);

      if (average === 0) {
        resultDiv.textContent = "Undefined";
        return;
      }

      const percentageDifference =
        round((difference / average) * 100, 6);

      resultDiv.textContent =
        `${percentageDifference.toFixed(2)}% difference`;
    }
  </script>

  <script src="/libraries/config.js"></script>
  <script src="/libraries/view-counter.js"></script>

</body>
</html>
