<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE ASTEROID WATCH // RV·NEOWATCH</title>
<style>
  :root{
    --bg:#050505; --panel:#0b0b0b; --line:#241414;
    --red:#ff2b2b; --red-dim:#7a1414;
    --text:#f5f5f5; --text-dim:#ca5656;
    --go:#2bff88; --warn:#ffb62b;
    --font:'IBM Plex Mono', monospace;
  }
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--text); font-family:var(--font);}
  body{min-height:100vh; padding:20px 16px 50px; position:relative;}
  body::before{
    content:""; position:fixed; inset:0;
    background:repeating-linear-gradient(to bottom, rgba(255,43,43,0.02) 0px, rgba(255,43,43,0.02) 1px, transparent 1px, transparent 3px);
    pointer-events:none; z-index:50;
  }
  .wrap{max-width:800px; margin:0 auto; position:relative;}
  header{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:16px;}
  .back-link{display:inline-block; font-size:10px; letter-spacing:2px; color:var(--text-dim); text-decoration:none; margin-bottom:8px; transition:color .15s;}
  .back-link:hover{color:var(--red);}
  .brand{font-size:11px; letter-spacing:3px; color:var(--red-dim);}
  h1{font-size:20px; letter-spacing:4px; font-weight:700;}
  h1 span{color:var(--red);}
  .clock{font-size:11px; color:var(--text-dim); text-align:right; letter-spacing:1px;}

  .panel{position:relative; background:var(--panel); border:1px solid var(--line); padding:18px; margin-bottom:14px;}
  .panel .tl,.panel .tr,.panel .bl,.panel .br{content:""; position:absolute; width:10px; height:10px; border-color:var(--red-dim); border-style:solid;}
  .panel .tl{top:-1px; left:-1px; border-width:1px 0 0 1px;}
  .panel .tr{top:-1px; right:-1px; border-width:1px 1px 0 0;}
  .panel .bl{bottom:-1px; left:-1px; border-width:0 0 1px 1px;}
  .panel .br{bottom:-1px; right:-1px; border-width:0 1px 1px 0;}
  .label{font-size:11px; letter-spacing:1px; color:var(--text-dim); margin-bottom:8px;}

  .apikey-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  input{background:#0f0a0a; border:1px solid var(--line); color:var(--text); font-family:var(--font); font-size:12px; padding:9px 10px; flex:1; min-width:140px;}
  input:focus{outline:1px solid var(--red-dim);}
  button{background:transparent; border:1px solid var(--red-dim); color:var(--red); font-family:var(--font); font-size:11px; letter-spacing:1.5px; padding:9px 16px; cursor:pointer; transition:all .15s;}
  button:hover{background:var(--red-dim); color:var(--text);}
  button:disabled{opacity:.4; cursor:default;}
  .apikey-note{font-size:9px; color:var(--text-dim); margin-top:8px; line-height:1.6;}
  .apikey-note a{color:var(--red-dim);}

  .summary-strip{display:flex; gap:14px; flex-wrap:wrap; justify-content:space-around; text-align:center;}
  .summary-item .n{font-size:24px; font-weight:700;}
  .summary-item .l{font-size:10px; color:var(--text-dim); letter-spacing:1px; margin-top:4px;}
  .summary-item.hazard .n{color:var(--red);}

  .filter-row{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .filter-row button{flex:1; min-width:100px; font-size:10px;}
  .filter-row button.active{background:var(--red); color:#000; border-color:var(--red);}

  .neo-card{position:relative; background:var(--panel); border:1px solid var(--line); padding:16px; margin-bottom:10px;}
  .neo-card.hazard{border-color:var(--red-dim);}
  .neo-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .neo-name{font-size:14px; font-weight:700; letter-spacing:.5px; color:#4ad4ff;}
  .neo-badge{font-size:9px; letter-spacing:1.5px; padding:4px 8px; border:1px solid var(--red-dim); color:var(--red); white-space:nowrap;}
  .neo-badge.safe{border-color:#1a3a2a; color:var(--go);}
  .neo-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 16px;}
  @media(max-width:480px){.neo-grid{grid-template-columns:1fr;}}
  .neo-item .k{font-size:10px; color:var(--text-dim); letter-spacing:0.5px; margin-bottom:3px;}
  .neo-item .v{font-size:13px; font-weight:700;}
  .neo-compare{font-size:12px; color:var(--text-dim); margin-top:10px; padding-top:10px; border-top:1px solid var(--line); line-height:1.7;}
  .neo-compare b{color:var(--text);}

  .loader{font-size:12px; color:var(--red-dim); letter-spacing:2px; padding:30px 0; text-align:center;}
  .errbox{font-size:11px; color:var(--warn); padding:14px; line-height:1.7;}
  .hidden{display:none;}
  footer{text-align:center; font-size:11px; color:var(--text-dim); letter-spacing:1px; margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">RAMESHVERSE // RV·NEOWATCH</div>
      <h1>LIVE ASTEROID <span>WATCH</span></h1>
    </div>
    <div class="clock" id="clockDisplay">--:--:--</div>
  </header>

  <div class="panel" style="text-align:center;">
    <div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div>
    <button id="loadBtn" style="width:100%;">SCAN NEXT 7 DAYS</button>
  </div>

  <div id="loader" class="loader hidden">▸ QUERYING NASA NEAR-EARTH OBJECT DATABASE...</div>
  <div id="errbox" class="panel errbox hidden"></div>

  <div id="results" class="hidden">
    <div class="panel summary-strip" id="summaryStrip"></div>

    <div class="filter-row">
      <button class="active" data-filter="all">ALL OBJECTS</button>
      <button data-filter="hazard">POTENTIALLY HAZARDOUS</button>
      <button data-filter="close">CLOSEST APPROACHES</button>
    </div>

    <div id="neoList"></div>
  </div>

  <footer>DATA: NASA NEOWs API (LIVE) &nbsp;|&nbsp; RAMESHVERSE.COM</footer>
</div>

<script>
setInterval(()=>{
  document.getElementById('clockDisplay').textContent = new Date().toLocaleTimeString('en-US',{hour12:false});
},1000);

const LUNAR_DIST_KM = 384400;
const landmarks = [
  {name:'a double-decker bus', m:11},
  {name:'a football field', m:105},
  {name:'the Statue of Liberty', m:93},
  {name:'the Great Pyramid of Giza', m:139},
  {name:'the Eiffel Tower', m:330},
  {name:'the Burj Khalifa', m:828},
];
function nearestLandmark(m){
  let best = landmarks[0], bestDiff = Infinity;
  landmarks.forEach(l=>{
    const diff = Math.abs(Math.log(l.m) - Math.log(m));
    if(diff < bestDiff){ bestDiff = diff; best = l; }
  });
  return best;
}

function fmtDate(d){
  const dt = new Date(d);
  return dt.toISOString().slice(0,10);
}

let allNeos = [];

document.getElementById('loadBtn').addEventListener('click', loadAsteroids);

async function loadAsteroids(){
  const loader = document.getElementById('loader');
  const errbox = document.getElementById('errbox');
  const results = document.getElementById('results');
  loader.classList.remove('hidden');
  errbox.classList.add('hidden');
  results.classList.add('hidden');
  document.getElementById('loadBtn').disabled = true;

  try{
    // calls your own Cloudflare Worker — replace with your actual deployed URL
    const url = `https://rameshverse-api.ramesh-rkvfx.workers.dev/api/asteroids`;
    const res = await fetch(url);
    if(!res.ok){
      const body = await res.json().catch(()=>({}));
      throw new Error(body?.error_message || body?.error?.message || `HTTP ${res.status}`);
    }
    const data = await res.json();

    allNeos = [];
    Object.keys(data.near_earth_objects).forEach(date=>{
      data.near_earth_objects[date].forEach(neo=>{
        const approach = neo.close_approach_data[0];
        if(!approach) return;
        const missKm = parseFloat(approach.miss_distance.kilometers);
        const diamMin = neo.estimated_diameter.meters.estimated_diameter_min;
        const diamMax = neo.estimated_diameter.meters.estimated_diameter_max;
        allNeos.push({
          name: neo.name.replace(/[()]/g,''),
          hazardous: neo.is_potentially_hazardous_asteroid,
          date: approach.close_approach_date,
          missKm,
          missLD: missKm / LUNAR_DIST_KM,
          velocityKph: parseFloat(approach.relative_velocity.kilometers_per_hour),
          diamMin, diamMax,
          diamAvg: (diamMin+diamMax)/2,
          nasaUrl: neo.nasa_jpl_url,
        });
      });
    });
    allNeos.sort((a,b)=> a.missKm - b.missKm);

    renderSummary();
    renderList('all');
    results.classList.remove('hidden');
  }catch(e){
    errbox.textContent = 'Could not load asteroid data: ' + e.message;
    errbox.classList.remove('hidden');
    console.error(e);
  }finally{
    loader.classList.add('hidden');
    document.getElementById('loadBtn').disabled = false;
  }
}

function renderSummary(){
  const hazardCount = allNeos.filter(n=>n.hazardous).length;
  const closest = allNeos[0];
  const strip = document.getElementById('summaryStrip');
  strip.innerHTML = `
    <div class="summary-item"><div class="n">${allNeos.length}</div><div class="l">OBJECTS TRACKED</div></div>
    <div class="summary-item hazard"><div class="n">${hazardCount}</div><div class="l">POTENTIALLY HAZARDOUS</div></div>
    <div class="summary-item"><div class="n">${closest ? closest.missLD.toFixed(1) : '—'}</div><div class="l">CLOSEST (LUNAR DIST.)</div></div>
  `;
}

document.querySelectorAll('.filter-row button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-row button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderList(btn.dataset.filter);
  });
});

function renderList(filter){
  let list = allNeos;
  if(filter === 'hazard') list = allNeos.filter(n=>n.hazardous);
  if(filter === 'close') list = [...allNeos].sort((a,b)=>a.missKm-b.missKm).slice(0,10);

  const container = document.getElementById('neoList');
  if(list.length === 0){
    container.innerHTML = '<div class="panel" style="text-align:center; color:var(--text-dim); font-size:12px;">No objects match this filter in the next 7 days.</div>';
    return;
  }

  container.innerHTML = list.map(n=>{
    const landmark = nearestLandmark(n.diamAvg);
    return `
    <div class="neo-card ${n.hazardous ? 'hazard' : ''}">
      <div class="neo-top">
        <div class="neo-name">${n.name}</div>
        <div class="neo-badge ${n.hazardous ? '' : 'safe'}">${n.hazardous ? '⚠ HAZARDOUS' : 'NON-HAZARDOUS'}</div>
      </div>
      <div class="neo-grid">
        <div class="neo-item"><div class="k">CLOSE APPROACH</div><div class="v">${n.date}</div></div>
        <div class="neo-item"><div class="k">MISS DISTANCE</div><div class="v">${n.missLD.toFixed(2)} lunar distances</div></div>
        <div class="neo-item"><div class="k">DIAMETER (EST.)</div><div class="v">${Math.round(n.diamMin)}–${Math.round(n.diamMax)} m</div></div>
        <div class="neo-item"><div class="k">RELATIVE VELOCITY</div><div class="v">${Math.round(n.velocityKph).toLocaleString()} km/h</div></div>
      </div>
      <div class="neo-compare">Roughly the size of <b>${landmark.name}</b> · passing at <b>${Math.round(n.missKm).toLocaleString()} km</b> from Earth</div>
    </div>`;
  }).join('');
}

// auto-load on first visit
loadAsteroids();
</script>

<script src="/libraries/config.js"></script>
<script src="/libraries/view-counter.js"></script>
<script src="/libraries/hud-home-button.js"></script>


<script src="/tools-data.js"></script>
<script src="/related-modules.js"></script>

</body>
</html>
