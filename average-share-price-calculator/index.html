<title>Average Share Price Calculator</title>

<style>
:root {
  --bg: #f4f6f8;
  --card: #ffffff;
  --border: #d9dee5;
  --text: #1f2937;
  --muted: #6b7280;
  --primary: #2563eb;
  --success: #16a34a;
  --danger: #dc2626;
  --result-bg: #eef4ff;
  --avg-bg: #f8fafc;
  --reset-bg: #e5e7eb;
  --shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
  --radius: 12px;
  --gap: 10px;
  --input-height: 42px;
  --delete-width: 50px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: 560px;
  margin: 0 auto;
  padding: 24px;
  background: var(--card);
  border-radius: 16px;
  box-shadow: var(--shadow);
}

h2 {
  margin: 0 0 16px;
  font-size: 24px;
}

.header-row,
.row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr)) var(--delete-width);
  gap: var(--gap);
  align-items: center;
}

.header-row {
  margin-bottom: 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}

.row {
  margin-bottom: 10px;
}

input,
.row-avg,
button {
  height: var(--input-height);
  border-radius: var(--radius);
  font-size: 14px;
}

input,
.row-avg {
  border: 1px solid var(--border);
}

input {
  width: 100%;
  padding: 0 12px;
  background: #fff;
}

input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

.row-avg {
  display: flex;
  align-items: center;
  padding: 0 12px;
  background: var(--avg-bg);
  color: var(--text);
  white-space: nowrap;
}

button {
  border: none;
  cursor: pointer;
  font-weight: 700;
}

.delete {
  width: var(--delete-width);
  background: var(--danger);
  color: #fff;
  font-size: 16px;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 8px;
}

.add {
  width: 100%;
  padding: 12px;
  height: auto;
  background: var(--success);
  color: #fff;
}

.reset {
  width: 100%;
  padding: 12px;
  height: auto;
  background: var(--reset-bg);
  color: var(--text);
}

.result-box {
  margin-top: 20px;
  padding: 18px;
  background: var(--result-bg);
  border-radius: 14px;
  line-height: 1.7;
  font-size: 17px;
}

.result-box .avg {
  font-size: 24px;
  font-weight: 700;
  color: var(--primary);
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input[type="number"] {
  appearance: textfield;
  -moz-appearance: textfield;
}

/* ── SHARE PANEL (identical to Time Converter) ── */
.share-panel {
  display: none;
  background: #0f1220;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
}
.share-panel p {
  margin: 0 0 10px;
  font-size: 13px;
  opacity: 0.7;
  text-align: center;
  color: #fff;
}
.share-icons {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.share-icon-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  background: #2b2f55;
  border: none;
  border-radius: 10px;
  padding: 10px 4px;
  cursor: pointer;
  font-size: 10px;
  color: #d1d5db;
  flex: 1;
  min-width: 50px;
  transition: background 0.2s;
  margin-bottom: 0;
  width: auto;
  height: auto;
  font-weight: 400;
}
.share-icon-btn svg { width: 22px; height: 22px; }
.share-icon-btn:hover { background: #3a3f70; opacity: 1; }
.share-icon-btn.copied { background: #14532d; }

@media (max-width: 640px) {
  .container {
    padding: 18px;
  }

  .header-row,
  .row {
    grid-template-columns: 1fr 1fr;
  }

  .header-row div:nth-child(3),
  .header-row div:nth-child(4) {
    display: none;
  }

  .row-avg {
    grid-column: 1 / 2;
  }

  .delete {
    width: 100%;
  }

  .actions {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div class="container">
  <h2>Average Share Price Calculator</h2>

  <div class="header-row" aria-hidden="true">
    <div>No. of Shares</div>
    <div>Price</div>
    <div>After Buy Avg</div>
    <div></div>
  </div>

  <div id="rows"></div>

  <div class="actions">
    <button id="addRowBtn" class="add" type="button">+ Add Buy</button>
    <button id="resetBtn" class="reset" type="button">Reset to Default</button>
  </div>

  <div id="result" class="result-box">
    <div>Total Shares: 0</div>
    <div>Total Invested: 0</div>
    <div class="avg">Final Avg: 0</div>
  </div>

  <!-- Share This App button + panel -->
  <button onclick="toggleShare()" style="width:100%;padding:12px;height:auto;background:#4c1d95;color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font-weight:700;font-size:14px;margin-top:10px;">📤 Share This App</button>

  <div class="share-panel" id="sharePanel">
    <p>Share this tool with friends:</p>
    <div class="share-icons">

        WhatsApp
      </button>

      <!-- Facebook -->
      <button class="share-icon-btn" id="shareFacebook">
        <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.313 0 2.686.236 2.686.236v2.971h-1.513c-1.491 0-1.956.93-1.956 1.874v2.279h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
        Facebook
      </button>

      <!-- Messenger -->
      <button class="share-icon-btn" id="shareMessenger">

          <defs>
            <linearGradient id="msgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:#0099FF"/>
              <stop offset="100%" style="stop-color:#A033FF"/>
            </linearGradient>
          </defs>
          <path fill="url(#msgGrad)" d="M12 0C5.373 0 0 4.974 0 11.111c0 3.498 1.744 6.614 4.469 8.652V24l4.088-2.242c1.092.301 2.246.464 3.443.464 6.627 0 12-4.974 12-11.111S18.627 0 12 0zm1.191 14.963l-3.055-3.26-5.963 3.26L10.732 8.1l3.131 3.26L19.752 8.1l-6.561 6.863z"/>
        </svg>
        Messenger

      <!-- Instagram -->
      <button class="share-icon-btn" id="shareInstagram">
        <svg viewBox="0 0 24 24">
          <defs>
            <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:#f09433"/>

            </linearGradient>
          </defs>
          <path fill="url(#igGrad)" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>

      <!-- X (Twitter) -->

        <svg viewBox="0 0 24 24" fill="#e5e7eb"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.748l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>

      <!-- Copy Link -->

        <svg viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy Link

<script>
const rowsContainer = document.getElementById("rows");
const resultBox = document.getElementById("result");
const addRowBtn = document.getElementById("addRowBtn");
const resetBtn = document.getElementById("resetBtn");

function roundToTwo(num) {
  return Math.round((num + Number.EPSILON) * 100) / 100;
}

function formatNumber(num) {
  return num.toLocaleString(undefined, {
    minimumFractionDigits: 0,
    maximumFractionDigits: 2
  });
}

function calculateAverage() {
  const rows = rowsContainer.querySelectorAll(".row");
  let totalShares = 0;
  let totalValue = 0;

  rows.forEach((row) => {
    const sharesInput = row.querySelector(".shares");
    const priceInput = row.querySelector(".price");
    const avgBox = row.querySelector(".row-avg");

    const shares = parseFloat(sharesInput.value) || 0;
    const price = parseFloat(priceInput.value) || 0;

    totalShares += shares;
    totalValue += shares * price;

    const runningAvg = totalShares > 0 ? roundToTwo(totalValue / totalShares) : 0;
    avgBox.textContent = shares > 0 ? formatNumber(runningAvg) : "—";
  });

  const finalAvg = totalShares > 0 ? roundToTwo(totalValue / totalShares) : 0;

  resultBox.innerHTML = `
    <div>Total Shares: ${formatNumber(totalShares)}</div>
    <div>Total Invested: ${formatNumber(totalValue)}</div>
    <div class="avg">Final Avg: ${formatNumber(finalAvg)}</div>
  `;
}

function createInput(className, placeholder, value = "") {
  const input = document.createElement("input");
  input.type = "number";
  input.className = className;
  input.placeholder = placeholder;
  input.value = value;
  input.min = "0";
  input.step = "any";
  input.addEventListener("input", calculateAverage);
  return input;
}

function addRow(shares = "", price = "") {
  const row = document.createElement("div");
  row.className = "row";

  const sharesInput = createInput("shares", "Enter no. of shares", shares);
  const priceInput = createInput("price", "Enter price", price);

  const avgBox = document.createElement("div");
  avgBox.className = "row-avg";
  avgBox.textContent = "—";

  const deleteBtn = document.createElement("button");
  deleteBtn.className = "delete";
  deleteBtn.type = "button";
  deleteBtn.textContent = "X";
  deleteBtn.setAttribute("aria-label", "Delete row");
  deleteBtn.addEventListener("click", () => {
    row.remove();
    calculateAverage();
  });

  row.append(sharesInput, priceInput, avgBox, deleteBtn);
  rowsContainer.appendChild(row);

  calculateAverage();
}

function resetToDefault() {
  const shouldReset = window.confirm(
    "Reset all rows and restore the default 2 empty rows?"
  );

  if (!shouldReset) {
    return;
  }

  rowsContainer.innerHTML = "";
  addRow();
  addRow();
}

addRowBtn.addEventListener("click", () => addRow());
resetBtn.addEventListener("click", resetToDefault);

addRow();
addRow();

// ── SHARE LOGIC ──
const APP_URL = 'https://rameshverse.com/average-share-price-calculator';
const APP_TITLE = 'Average Share Price Calculator – a free tool for investors!';

function toggleShare() {
  const panel = document.getElementById('sharePanel');
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
}

document.getElementById('shareWhatsapp').onclick = () =>
  window.open(`https://wa.me/?text=${encodeURIComponent(APP_TITLE + '\n' + APP_URL)}`, '_blank');

document.getElementById('shareFacebook').onclick = () =>
  window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(APP_URL)}`, '_blank');

document.getElementById('shareMessenger').onclick = () => {
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (isMobile) {
    window.open(`fb-messenger://share?link=${encodeURIComponent(APP_URL)}`, '_blank');
  } else {
    window.open(`https://www.facebook.com/dialog/send?link=${encodeURIComponent(APP_URL)}&app_id=291494419107518&redirect_uri=${encodeURIComponent(APP_URL)}`, '_blank');
  }
};

document.getElementById('shareInstagram').onclick = () => {
  const btn = document.getElementById('shareInstagram');
  navigator.clipboard.writeText(APP_URL).then(() => {
    btn.classList.add('copied');
    btn.lastChild.textContent = 'Link copied!';
    window.open('https://www.instagram.com/', '_blank');
    setTimeout(() => { btn.classList.remove('copied'); btn.lastChild.textContent = 'Instagram'; }, 3000);
  });
};

document.getElementById('shareTwitter').onclick = () =>
  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(APP_TITLE)}&url=${encodeURIComponent(APP_URL)}`, '_blank');

document.getElementById('shareTelegram').onclick = () =>
  window.open(`https://t.me/share/url?url=${encodeURIComponent(APP_URL)}&text=${encodeURIComponent(APP_TITLE)}`, '_blank');

document.getElementById('shareCopy').onclick = () => {
  const btn = document.getElementById('shareCopy');
  navigator.clipboard.writeText(APP_URL).then(() => {
    btn.classList.add('copied');
    btn.lastChild.textContent = 'Copied!';
    setTimeout(() => { btn.classList.remove('copied'); btn.lastChild.textContent = 'Copy Link'; }, 2000);
  });
};
</script>
